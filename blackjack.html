<script>
'use strict';
typeof mountScene === 'function' && mountScene('casino');   // themed ambient scene along the bottom of the TV

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const PFX = 'BLKJK-';
const MIN_PLAYERS = 1, MAX_PLAYERS = 7;
const START_CHIPS = 500, MIN_BET = 10;
const BET_CHIPS = [10, 25, 50, 100];

// ═══════════════════════════════════════════
// CARD MODEL (pure — no host/guest distinction, single JS scope)
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// HAND VALUE / BUST / BLACKJACK / DEALER RULE / PAYOUT — pure functions, unit-tested
// ═══════════════════════════════════════════
// Ace counts 11 until that would bust the hand, then as many aces as needed drop to 1 one at
// a time. `soft` is true while at least one ace is still being counted as 11 (a "soft" total
// can still take another card without the player choosing to risk it the way a hard total
// nearer 21 would).
function handValue(cards) {
    let total = 0, acesAs11 = 0;
    for (const c of cards) {
        if (c.rank === 1) { total += 11; acesAs11++; }
        else total += Math.min(c.rank, 10);
    }
    while (total > 21 && acesAs11 > 0) { total -= 10; acesAs11--; }
    return { total, soft: acesAs11 > 0, isBust: total > 21 };
}
function isBlackjack(cards) { return cards.length === 2 && handValue(cards).total === 21; }
// Stand on all 17s (hard or soft) — the simplest common house rule, and the only one that
// doesn't need a second "is this dealer 17 soft" branch anywhere else in the game.
function dealerShouldHit(cards) { return handValue(cards).total < 17; }
// The chips actually credited back to a player's stack — their stake is already OUT of
// `chips` by the time a hand resolves (deducted at bet placement, see hostBet), so a loss
// credits nothing, a push returns the stake, a win returns stake+stake, blackjack 2.5x.
function resolveHand(playerCards, dealerCards, bet) {
    const p = handValue(playerCards), d = handValue(dealerCards);
    const pBJ = isBlackjack(playerCards), dBJ = isBlackjack(dealerCards);
    if (p.isBust) return { outcome: 'lose', payout: 0 };
    if (pBJ && dBJ) return { outcome: 'push', payout: bet };
    if (pBJ) return { outcome: 'blackjack', payout: Math.round(bet * 2.5) };
    if (dBJ) return { outcome: 'lose', payout: 0 };
    if (d.isBust) return { outcome: 'win', payout: bet * 2 };
    if (p.total > d.total) return { outcome: 'win', payout: bet * 2 };
    if (p.total === d.total) return { outcome: 'push', payout: bet };
    return { outcome: 'lose', payout: 0 };
}

// ═══════════════════════════════════════════
// BASIC-STRATEGY HINT (pure) — for the optional 🎓 Coach mode, computed CLIENT-SIDE from the
// same `state` payload the screen already renders, so it costs no extra round trip. This is a
// simplified teaching chart (dealer stands on all 17s, single-line hit/stand/double calls),
// not a tournament-precision strategy table — a few close soft-total cases are collapsed to
// keep the advice explainable in one spoken sentence, which is the point for a beginner.
// ═══════════════════════════════════════════
function suggestAction(total, soft, dealerUpRank, canDouble) {
    const d = dealerUpRank === 1 ? 11 : Math.min(dealerUpRank, 10);   // Ace plays as the strongest card
    const dName = dealerUpRank === 1 ? 'Ace' : String(Math.min(dealerUpRank, 10));
    if (soft) {
        if (total >= 19) return { action: 'stand', why: `Soft ${total} is already strong.` };
        if (total === 18) {
            return (d >= 9) ? { action: 'hit', why: `Soft 18 against the dealer's ${dName} needs improving.` }
                             : { action: 'stand', why: `Soft 18 holds against the dealer's ${dName}.` };
        }
        if (canDouble && d >= 4 && d <= 6) return { action: 'double', why: `Soft ${total} against a weak ${dName} is a good double.` };
        return { action: 'hit', why: `Soft ${total} is safe to hit — an ace can't bust it.` };
    }
    if (total >= 17) return { action: 'stand', why: `${total} is strong enough to stand.` };
    if (total >= 13) return (d <= 6) ? { action: 'stand', why: `The dealer's ${dName} is weak — let them risk busting.` }
                                      : { action: 'hit', why: `The dealer's ${dName} is strong — you need to improve.` };
    if (total === 12) return (d >= 4 && d <= 6) ? { action: 'stand', why: `The dealer's ${dName} is weak enough to stand on 12.` }
                                                 : { action: 'hit', why: `12 against a ${dName} is too risky to stand on.` };
    if (total === 11) return (canDouble && d !== 11) ? { action: 'double', why: `11 is the best total to double down on.` }
                                                       : { action: 'hit', why: `11 — hit (or double if you still can).` };
    if (total === 10) return (canDouble && d <= 9) ? { action: 'double', why: `10 against a ${dName} is a good double.` }
                                                     : { action: 'hit', why: `10 — hit (or double if you still can).` };
    if (total === 9) return (canDouble && d >= 3 && d <= 6) ? { action: 'double', why: `9 against a weak ${dName} is worth doubling.` }
                                                              : { action: 'hit', why: `9 is too low to stand on.` };
    return { action: 'hit', why: `${total} is too low to stand on.` };
}

// ═══════════════════════════════════════════
// HOST STATE
// ═══════════════════════════════════════════
// The host is the DEALER — never a seated player, whether it's a phone or a TV running it.
// H.players holds only guests; the dealer's hand lives on H.dealer, which belongs to nobody's
// id. This is closer to Going, Going, GONE!'s auctioneer (host never holds a paddle) than to
// Kings Corner's isTvHost-doubles-as-a-seat split.
let H = {
    phase: 'lobby',              // 'lobby' | 'betting' | 'playing' | 'dealer' | 'round_over' | 'session_over'
    players: [],                 // [{ id, cid, name, chips, bet, hand:[Card], standing, busted, doubled, spectating, lastOutcome, lastDelta }]
    dealer: { cards: [], holeHidden: true },
    turnIdx: 0,                  // INDEX into players[] of whoever is deciding hit/stand/double
    deck: [],
    milestones: [], milestoneSeq: 0,
};


// ═══════════════════════════════════════════
// HOST LOGIC
// ═══════════════════════════════════════════
function hostAddPlayer(id, name, cid) {
    if (H.players.find(p => p.id === id)) return;
    const spectating = H.phase !== 'lobby';
    if (!spectating && H.players.length >= MAX_PLAYERS) return;
    H.players.push({
        id, cid, name, chips: START_CHIPS, bet: 0, hand: [],
        standing: false, busted: false, doubled: false, spectating,
        lastOutcome: null, lastDelta: 0,
    });
}

function canAct(p) { return !!p && !p.spectating && p.bet > 0 && !p.standing && !p.busted; }
// Walks from fromIdx (exclusive) once all the way round; -1 means "nobody left to act" —
// the (fromIdx + k + n) form keeps the very first dealt-in scan (fromIdx = -1) correct
// without relying on how a particular JS engine handles a negative left operand of %.
function nextActingIdx(fromIdx) {
    const n = H.players.length; if (!n) return -1;
    for (let k = 1; k <= n; k++) { const i = (fromIdx + k + n) % n; if (canAct(H.players[i])) return i; }
    return -1;
}
function advanceTurn(fromIdx) {
    const idx = nextActingIdx(fromIdx);
    if (idx < 0) { H.turnIdx = -1; hostPlayDealer(); return; }
    H.turnIdx = idx;
    broadcast();
}

function beginBetting() {
    H.players.forEach(p => {
        p.bet = 0; p.hand = []; p.standing = false; p.busted = false; p.doubled = false;
        p.lastOutcome = null; p.lastDelta = 0;
    });
    H.dealer = { cards: [], holeHidden: true };
    H.turnIdx = 0;
    H.phase = 'betting';
    broadcast();
}
function hostStartTable(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'lobby') return;
    if (H.players.length < MIN_PLAYERS) return;
    H.players.forEach(p => { p.spectating = false; p.chips = START_CHIPS; });
    H.milestones = []; H.milestoneSeq = 0;
    beginBetting();
}
function hostNextHand(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'round_over') return;
    // A player who was benched for going broke is only welcomed back once they can actually
    // afford the table minimum again — "Play again" is what resets chips, not a new hand.
    H.players.forEach(p => { if (p.spectating && p.chips >= MIN_BET) p.spectating = false; });
    beginBetting();
}
function hostPlayAgain(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'session_over') return;
    H.phase = 'lobby';
    H.players.forEach(p => {
        p.spectating = false; p.chips = START_CHIPS; p.bet = 0; p.hand = [];
        p.standing = false; p.busted = false; p.doubled = false; p.lastOutcome = null; p.lastDelta = 0;
    });
    H.dealer = { cards: [], holeHidden: true };
    H.milestones = []; H.milestoneSeq = 0;
    broadcastLobby();
}
function hostEndSession(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (!['lobby', 'betting', 'round_over'].includes(H.phase)) return;
    H.phase = 'session_over';
    broadcast();
}
function hostCtl(fromId, action) {
    if (capPlayer()?.id !== fromId) return;
    if (action === 'start') hostStartTable(fromId);
    else if (action === 'deal') hostDealCards(fromId);
    else if (action === 'next_hand') hostNextHand(fromId);
    else if (action === 'again') hostPlayAgain(fromId);
    else if (action === 'end_session') hostEndSession(fromId);
}

// A bet is deducted the moment it's placed (not at Deal time), so a phone that drops mid-
// betting doesn't lose the table's accounting — re-betting first refunds whatever was there.
function hostBet(fromId, amount) {
    if (H.phase !== 'betting') return;
    const p = H.players.find(x => x.id === fromId);
    if (!p || p.spectating) return;
    if (p.bet > 0) { p.chips += p.bet; p.bet = 0; }
    const n = Math.floor(Number(amount) || 0);
    if (n <= 0) { broadcast(); return; }
    const clamped = Math.max(MIN_BET, Math.min(n, p.chips));
    if (clamped > p.chips) { broadcast(); return; }
    p.chips -= clamped;
    p.bet = clamped;
    broadcast();
}

// Deals everyone who has actually bet so far — nobody stalls the table waiting for a bet
// from a player who's away. Classic one-card-round-robin-twice order, dealer included.
function hostDealCards(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'betting') return;
    const bettors = H.players.filter(p => !p.spectating && p.bet > 0);
    if (!bettors.length) return;
    H.deck = shuffled(makeDeck());
    H.dealer = { cards: [], holeHidden: true };
    bettors.forEach(p => { p.hand = []; p.standing = false; p.busted = false; p.doubled = false; });
    for (let round = 0; round < 2; round++) {
        bettors.forEach(p => p.hand.push(H.deck.pop()));
        H.dealer.cards.push(H.deck.pop());
    }
    bettors.forEach(p => { if (isBlackjack(p.hand)) p.standing = true; });
    H.phase = 'playing';
    advanceTurn(-1);
}
function hostHit(fromId) {
    if (H.phase !== 'playing') return;
    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId || !canAct(p)) return;
    p.hand.push(H.deck.pop());
    const v = handValue(p.hand);
    if (v.isBust) { p.busted = true; addMilestone(p.name + ' hits and busts with ' + v.total); advanceTurn(H.turnIdx); return; }
    if (v.total === 21) { p.standing = true; addMilestone(p.name + ' hits up to 21!'); advanceTurn(H.turnIdx); return; }
    addMilestone(p.name + ' hits — now ' + (v.soft ? 'soft ' : '') + v.total);
    broadcast();
}
function hostStand(fromId) {
    if (H.phase !== 'playing') return;
    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId || !canAct(p)) return;
    p.standing = true;
    const v = handValue(p.hand);
    addMilestone(p.name + ' stands on ' + (v.soft ? 'soft ' : '') + v.total);
    advanceTurn(H.turnIdx);
}
function hostDouble(fromId) {
    if (H.phase !== 'playing') return;
    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId || !canAct(p)) return;
    if (p.hand.length !== 2 || p.chips < p.bet) return;
    p.chips -= p.bet;
    p.doubled = true;
    p.bet *= 2;
    p.hand.push(H.deck.pop());
    const v = handValue(p.hand);
    if (v.isBust) { p.busted = true; addMilestone(p.name + ' doubles down and busts with ' + v.total); }
    else addMilestone(p.name + ' doubles down — one card, now ' + (v.soft ? 'soft ' : '') + v.total);
    p.standing = true;
    advanceTurn(H.turnIdx);
}

let dealerTimer = null;
function clearDealerTimer() { if (dealerTimer) { clearTimeout(dealerTimer); dealerTimer = null; } }
// A table that's entirely bust has nothing left to decide — the dullest outcome is the
// fastest one, the same taste call Going, Going, GONE! makes for a lot nobody wants.
function hostPlayDealer() {
    H.phase = 'dealer';
    const bettors = H.players.filter(p => !p.spectating && p.bet > 0);
    const anyLive = bettors.some(p => !p.busted);
    H.dealer.holeHidden = false;
    if (anyLive) {
        const v = handValue(H.dealer.cards);
        addMilestone('Dealer turns over the hole card — showing ' + (v.soft ? 'soft ' : '') + v.total);
    }
    broadcast();
    if (!anyLive) { hostResolve(); return; }
    dealerTimer = setTimeout(dealerStep, 900);
}
function dealerStep() {
    dealerTimer = null;
    if (dealerShouldHit(H.dealer.cards)) {
        H.dealer.cards.push(H.deck.pop());
        const v = handValue(H.dealer.cards);
        addMilestone('Dealer draws — now ' + (v.soft ? 'soft ' : '') + v.total + (v.total < 17 ? ', must hit again' : ''));
        broadcast();
        dealerTimer = setTimeout(dealerStep, 900);
        return;
    }
    const v = handValue(H.dealer.cards);
    if (!v.isBust) addMilestone('Dealer stands on ' + (v.soft ? 'soft ' : '') + v.total);
    hostResolve();
}
function hostResolve() {
    clearDealerTimer();
    const dv = handValue(H.dealer.cards);
    if (dv.isBust) addMilestone('Dealer busts with ' + dv.total + ' — the table collects');
    H.players.forEach(p => {
        if (p.spectating || p.bet <= 0) return;
        const r = resolveHand(p.hand, H.dealer.cards, p.bet);
        p.chips += r.payout;
        p.lastOutcome = r.outcome;
        p.lastDelta = r.payout - p.bet;
        if (r.outcome === 'blackjack') addMilestone(p.name + ' hits blackjack!');
        else if (r.outcome === 'win') addMilestone(p.name + ' wins!');
        else if (r.outcome === 'push') addMilestone(p.name + ' pushes — bet returned');
        else if (r.outcome === 'lose' && !p.busted) addMilestone(p.name + ' loses to the dealer');
    });
    H.players.forEach(p => { if (!p.spectating && p.chips < MIN_BET) p.spectating = true; });
    H.phase = 'round_over';
    broadcast();
}

// ═══════════════════════════════════════════
// MESSAGES / DISPLAY
// ═══════════════════════════════════════════
function lobbyMsg() {
    return {
        type: 'lobby',
        players: H.players.filter(p => !p.spectating).map(p => ({ name: p.name })),
        roomCode, tvHost: isTvHost, captain: capPlayer()?.name || null,
    };
}
function playerView(p) {
    const v = handValue(p.hand);
    return {
        id: p.id, name: p.name, chips: p.chips, bet: p.bet, hand: p.hand,
        total: v.total, soft: v.soft, isBust: p.busted, isBlackjack: isBlackjack(p.hand),
        standing: p.standing, doubled: p.doubled, spectating: !!p.spectating,
        isTurn: H.phase === 'playing' && H.players[H.turnIdx] === p,
        lastOutcome: p.lastOutcome, lastDelta: p.lastDelta,
    };
}
// The dealer's hole card literally never leaves the host while it's hidden — only the up
// card is ever put into the array that gets sent, the same "withheld on the host" principle
// Going, Going, GONE! uses for purses and mystery lots.
function dealerView() {
    const shown = H.dealer.holeHidden ? H.dealer.cards.slice(0, 1) : H.dealer.cards;
    const v = H.dealer.holeHidden ? null : handValue(H.dealer.cards);
    return {
        cards: shown, holeHidden: H.dealer.holeHidden,
        total: v ? v.total : null, isBust: v ? v.isBust : false,
        isBlackjack: !H.dealer.holeHidden && isBlackjack(H.dealer.cards),
    };
}
function buildDisplay(playerId) {
    const me = H.players.find(p => p.id === playerId);
    const turnP = H.phase === 'playing' ? H.players[H.turnIdx] : null;
    return {
        type: 'state', phase: H.phase, roomCode, isCaptain: capPlayer()?.id === playerId,
        dealer: dealerView(),
        players: H.players.map(playerView),
        turnPlayerName: turnP ? turnP.name : '',
        isMyTurn: !!turnP && turnP.id === playerId,
        myChips: me ? me.chips : 0, myBet: me ? me.bet : 0,
        canDouble: !!(me && turnP === me && me.hand.length === 2 && me.chips >= me.bet),
        milestones: H.milestones.slice(-8),
    };
}
function buildViewerDisplay() { return { ...buildDisplay(null), type: 'viewer_state' }; }
function phaseUi(phase) {
    if (phase === 'betting') return 'betting';
    if (phase === 'playing' || phase === 'dealer') return 'playing';
    if (phase === 'round_over') return 'round_over';
    if (phase === 'session_over') return 'session_over';
    return 'lobby';
}

function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }

function broadcastLobby() {
    const msg = lobbyMsg();
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, msg); });
    Object.values(viewerConns).forEach(c => send(c, { ...msg, type: 'viewer_lobby' }));
    if (hostPlays) { D = msg; ui = 'lobby'; render(); }
    else if (isHost) { vD = { ...msg, type: 'viewer_lobby' }; ui = 'viewer'; render(); }
}
function broadcast() {
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, buildDisplay(p.id)); });
    Object.values(viewerConns).forEach(c => send(c, buildViewerDisplay()));
    if (hostPlays) {
        const d = buildDisplay(myId);
        D = d; ui = phaseUi(H.phase); render();
        toastMilestones(d.milestones, hintSpeechIfChanged());
    } else if (isHost) {
        const nd = buildViewerDisplay();
        const entering = nd.phase === 'session_over' && vD?.phase !== 'session_over';
        vD = nd; ui = 'viewer'; render();
        toastMilestones(nd.milestones);
        if (entering) setTimeout(bjConfetti, 200);
    }
}

// ═══════════════════════════════════════════
// CONNECTION / PRESENCE
// ═══════════════════════════════════════════
let peer = null, myId = '', myName = '', isHost = false, isTvHost = false, isViewer = false, roomCode = '';
let hostConn = null, guestConns = {}, viewerConns = {};
let ui = 'home', uiErr = '';
let fName = (typeof savedName === 'function' ? savedName() : ''), fCode = '', fVCode = '';
let D = null, vD = null;
let _lastKey = '';
// True only for "Host & play" — the one hosting mode where the dealer's device is ALSO a
// seated player (the only way to play genuinely solo on a single device). Never true for
// TV hosting or the dealer-only "Deal on this phone" path.
let hostPlays = false;
// 🎓 Coach — per-device, defaults ON, for players new to basic strategy. Computed entirely
// client-side from the same `state` payload the screen already renders (see suggestAction),
// so turning it on costs no extra round trip. Text always shows when on; SPEAKING the hint
// additionally respects the normal 🗣️ voice toggle, same as every other spoken line.
let coachOn = true;
try { coachOn = localStorage.getItem('bj-coach') !== '0'; } catch (_) {}
function toggleCoach() {
    coachOn = !coachOn;
    try { localStorage.setItem('bj-coach', coachOn ? '1' : '0'); } catch (_) {}
    lastHintKey = null;
    render();
}

// The dealer is never in H.players UNLESS hostPlays — in dealer-only mode (phone or TV),
// connectedPlayers()/capPlayer() only ever look at guests.
function connectedPlayers() {
    if (typeof presentPlayers === 'function') return presentPlayers(H.players, guestConns, myId, hostPlays);
    return H.players.filter(p => (p.id === myId ? hostPlays : !!guestConns[p.id]));
}

function makeRoom(onOpen) {
    forgetRoom();
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message; isHost = false; isTvHost = false; hostPlays = false;
            document.body.classList.remove('viewer-mode'); ui = 'home'; render();
        },
    });
}
// Dealer-only hosting seats no player — the hosting device (phone OR TV) is always just the
// table, so it renders through the same 'viewer' path either way (see render()). Nobody
// types a name to host this way; only joining players (and hostGameAndPlay, below) do.
function hostGame() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { document.body.classList.add('viewer-mode'); vD = { ...lobbyMsg(), type: 'viewer_lobby' }; ui = 'viewer'; render(); });
}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); vD = { ...lobbyMsg(), type: 'viewer_lobby' }; ui = 'viewer'; render(); });
}
// The one hosting mode where the dealer's device is ALSO seated as a player — the only way
// to play genuinely solo on a single device (the dealer logic and your own hand both run
// here). `hostPlays` is what every other branch in this file checks to tell this apart from
// `hostGame()`'s dealer-only path, which is otherwise identical (isHost && !isTvHost).
function hostGameAndPlay(name) {
    myName = name.trim().slice(0, 16) || 'Player';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => {
        hostPlays = true;
        hostAddPlayer(myId, myName, clientId());
        broadcastLobby();
    });
}
function joinGame(code, name) {

    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;

                if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} });
            });

        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table — tap Join to get back in.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });
}
function joinAsViewer(code) {
    isViewer = true;
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });
            hostConn.on('data', msg => applyViewerMsg(msg));
        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function setupGuestConn(conn) {

            if (alive && typeof notePresence === 'function') notePresence(alive);
        }

            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        switch (msg.type) {
            case 'join': {
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;

                const name = String(msg.name || 'Player').slice(0, 16);
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);

                if (!me2 && H.phase === 'lobby') { send(conn, { type: 'full' }); break; }
                if (me2 && msg.cid) me2.cid = msg.cid;

            case 'bet': hostBet(conn.peer, msg.amount); break;
            case 'hit': hostHit(conn.peer); break;

        }
    });

// ═══════════════════════════════════════════
// CLIENT ACTIONS — dealer-only hosting is never also a guest, so those actions round-trip

// ═══════════════════════════════════════════
let actionWatchdog = null;
function armActionWatchdog() {

    }, 4000);
}

function guestCtl(action) {
    if (hostPlays) { hostCtl(myId, action); return; }
    if (hostConn) { send(hostConn, { type: 'ctl', action }); armActionWatchdog(); }
}
function actBet(amount) {
    if (hostPlays) { hostBet(myId, amount); return; }
    if (hostConn) { send(hostConn, { type: 'bet', amount }); armActionWatchdog(); }
}
function actHit() {
    sChip();
    if (hostPlays) { hostHit(myId); return; }
    if (hostConn) { send(hostConn, { type: 'hit' }); armActionWatchdog(); }
}
function actStand() {
    if (hostPlays) { hostStand(myId); return; }
    if (hostConn) { send(hostConn, { type: 'stand' }); armActionWatchdog(); }
}
function actDouble() {
    sChip();
    if (hostPlays) { hostDouble(myId); return; }
    if (hostConn) { send(hostConn, { type: 'double' }); armActionWatchdog(); }
}

// ── toasts (milestones) ──
function showToast(text) {
    let host = document.getElementById('bj-toasts');
    if (!host) { host = document.createElement('div'); host.id = 'bj-toasts'; document.body.appendChild(host); }
    const el = document.createElement('div');
    el.className = 'bj-toast';
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3000);
}
let lastMilestoneSeq = -1, seenFirstMilestones = false;
// `hintSpeech` (from hintSpeechIfChanged(), see the Coach section) rides in the SAME
// utterance as any fresh commentary — speak() cancels whatever's still being read, so calling
// it a second time right after would clip the commentary down to just the hint.
function toastMilestones(list, hintSpeech) {
    if (!list) return;
    if (!seenFirstMilestones) {
        lastMilestoneSeq = list.length ? Math.max(...list.map(m => m.seq)) : -1;
        seenFirstMilestones = true;
        return;
    }
    const fresh = list.filter(m => m.seq > lastMilestoneSeq);
    fresh.forEach(m => {
        showToast(m.text);
        if (/blackjack/i.test(m.text)) sBlackjack();
        else if (/busts/i.test(m.text)) sBust();
    });
    const parts = fresh.map(m => m.speech);
    if (hintSpeech) parts.push(hintSpeech);
    if (parts.length) speak(parts.join(' '));
    if (list.length) lastMilestoneSeq = Math.max(lastMilestoneSeq, ...list.map(m => m.seq));
}

// ── 🎓 Coach: a basic-strategy suggestion for whoever's turn it is, computed purely from the
// same `state` payload the screen already renders — no extra round trip. `currentHint()` is
// read-only (safe to call from render()); `hintSpeechIfChanged()` wraps it with the dedup
// tracking that keeps the SAME suggestion from being re-spoken on every unrelated broadcast
// (another player's move still updates `D`, and would otherwise repeat the line each time).
function currentHint() {
    if (!coachOn || !D || !D.isMyTurn) return null;
    const me = (D.players || []).find(p => p.id === myId);
    if (!me || !D.dealer || !D.dealer.cards || !D.dealer.cards.length) return null;
    return suggestAction(me.total, me.soft, D.dealer.cards[0].rank, !!D.canDouble);
}
let lastHintKey = null;
function hintSpeechIfChanged() {
    const sug = currentHint();
    if (!sug) { lastHintKey = null; return null; }
    const me = D.players.find(p => p.id === myId);
    const key = me.total + '|' + me.soft + '|' + D.dealer.cards[0].rank + '|' + D.canDouble + '|' + me.hand.length;
    if (key === lastHintKey) return null;
    lastHintKey = key;
    const verb = { hit: 'Hit', stand: 'Stand', double: 'Double down' }[sug.action] || sug.action;
    return `Coach says: ${verb}. ${sug.why}`;
}

function applyMsg(msg) {
    if (!msg) return;
    clearActionWatchdog();
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    if (msg.type === 'full') { forgetRoom(); uiErr = `This table is full (${MAX_PLAYERS}/${MAX_PLAYERS}).`; ui = 'home'; D = null; if (hostConn) { try { hostConn.close(); } catch (_) {} } render(); return; }
    if (msg.type === 'lobby') { D = msg; ui = 'lobby'; render(); return; }
    if (msg.type === 'state') { D = msg; ui = phaseUi(msg.phase); toastMilestones(msg.milestones, hintSpeechIfChanged()); render(); }
}
function applyViewerMsg(msg) {
    if (!msg) return;
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    const entering = msg.type === 'viewer_state' && msg.phase === 'session_over' && vD?.phase !== 'session_over';
    vD = msg; ui = 'viewer';
    if (msg.type === 'viewer_state') toastMilestones(msg.milestones);
    render();
    if (entering) setTimeout(bjConfetti, 200);
}

function render() {
    const app = document.getElementById('app');
    if ((isHost && !hostPlays) || isViewer) ui = 'viewer';
    if (typeof syncVoiceBtn === 'function') syncVoiceBtn();
    let html = '';
    switch (ui) {
        case 'home': html = renderHome(); break;
        case 'creating': html = renderSpinner('Setting up the table…'); break;
        case 'connecting': html = renderSpinner('Joining the table…'); break;
        case 'lobby': html = renderLobby(); break;
        case 'betting': html = renderBetting(); break;
        case 'playing': html = renderPlaying(); break;
        case 'round_over': html = renderRoundOver(); break;
        case 'session_over': html = renderSessionOver(); break;
        case 'viewer': html = renderViewer(); break;
        default: html = renderHome();
    }
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    const key = ui + ':' + (ui === 'viewer' ? (vD?.type || '') + ':' + (vD?.phase || '') : '');
    app.classList.toggle('fresh', key !== _lastKey);
    _lastKey = key;
}

function qrSVG(url) {
    try {
        const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        const n = qr.getModuleCount(), m = 2, size = n + m * 2; let rects = '';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) rects += `<rect x="${c + m}" y="${r + m}" width="1.05" height="1.05"/>`;
        return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#f5ecd9"/><g fill="#3d0f17">${rects}</g></svg>`;
    } catch (e) { return ''; }
}

const SIM_NAMES = ['Ace', 'Bea', 'Cy', 'Dot', 'Eli', 'Fay', 'Gus'];

function startSimulation(nPlayers) {
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));

    isHost = true; isTvHost = true; myId = '__sim_host__'; myName = '';
    document.body.classList.add('viewer-mode');
    for (let i = 0; i < n; i++) {
        const id = '__bot_' + i;
        guestConns[id] = { send() {}, _sim: true };
        hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id);
    }
    broadcastLobby();
    simTimer = setTimeout(simBegin, 2000);
}
function simBegin() {
    hostStartTable(capPlayer()?.id);
    simTimer = setTimeout(simStep, 1200);
}
function simRestart() { startSimulation(H.players.length); }
function simStep() {
    simTimer = null;
    if (H.phase === 'session_over') { simTimer = setTimeout(simRestart, 6000); return; }
    if (H.phase === 'round_over') { simTimer = setTimeout(() => { hostNextHand(capPlayer()?.id); simTimer = setTimeout(simStep, 1200); }, 2400); return; }
    if (H.phase === 'betting') { simBotBets(); simTimer = setTimeout(() => { hostDealCards(capPlayer()?.id); simTimer = setTimeout(simStep, 1200); }, 1400); return; }
    if (H.phase === 'playing') { simBotTurn(); simTimer = setTimeout(simStep, 700 + Math.random() * 500); return; }
    simTimer = setTimeout(simStep, 800);
}
function simBotBets() {
    H.players.forEach(p => { if (!p.spectating && p.chips >= MIN_BET) hostBet(p.id, MIN_BET + Math.floor(Math.random() * 4) * MIN_BET); });
}
function simBotTurn() {
    const p = H.players[H.turnIdx];
    if (!p) return;
    const v = handValue(p.hand);
    // Simple basic-strategy-flavoured bot: hit under 17, otherwise stand.
    if (v.total < 17 && Math.random() < 0.85) hostHit(p.id);
    else hostStand(p.id);
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    if (!musicOn) { const b = document.getElementById('tog-music'); if (b) b.classList.add('off'); }
    if (!sfxOn) { const b = document.getElementById('tog-sfx'); if (b) b.classList.add('off'); }
    syncVoiceBtn();
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'tvsimulation' || mode === 'simulation' || mode === 'playersimulation') { startSimulation(simPlayers); return; }
    const viewParam = params.get('view');
    if (viewParam) { joinAsViewer(viewParam); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
