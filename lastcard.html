<script>
'use strict';
typeof mountScene === 'function' && mountScene('prism');   // themed ambient scene along the bottom of the TV

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const PFX = 'LASTCARD-';
const MIN_PLAYERS = 2, MAX_PLAYERS = 8;
const WILD4_CHALLENGE_MS = 6000;
const COLORS = ['red', 'yellow', 'green', 'blue'];
const COLOR_WORDS = { red: 'Red', yellow: 'Yellow', green: 'Green', blue: 'Blue' };
const KIND_WORDS = { skip: 'Skip', reverse: 'Reverse', drawTwo: 'Draw Two', wild: 'Wild', wild4: 'Wild Draw Four' };

// ═══════════════════════════════════════════
// CARD MODEL (pure — no host/guest distinction, single JS scope)
// Not cards.js's standard 52-card/4-suit model — Uno's deck is a different shape
// ({color, kind, value}, duplicates of most cards) that cards.js was never scoped to cover.
// ═══════════════════════════════════════════
let _cardSeq = 0;
function makeCard(color, kind, value) { return { color, kind, value: value == null ? null : value, id: 'c' + (_cardSeq++) }; }
function makeDeck() {
    const deck = [];
    COLORS.forEach(color => {
        deck.push(makeCard(color, 'number', 0));
        for (let v = 1; v <= 9; v++) { deck.push(makeCard(color, 'number', v)); deck.push(makeCard(color, 'number', v)); }
        ['skip', 'reverse', 'drawTwo'].forEach(kind => { deck.push(makeCard(color, kind)); deck.push(makeCard(color, kind)); });
    });
    for (let i = 0; i < 4; i++) deck.push(makeCard(null, 'wild'));
    for (let i = 0; i < 4; i++) deck.push(makeCard(null, 'wild4'));
    return deck;   // 4 × 25 = 100, + 4 + 4 = 108
}
function cardLabel(c) {
    if (c.kind === 'number') return (COLOR_WORDS[c.color] || '') + ' ' + c.value;
    if (c.kind === 'wild' || c.kind === 'wild4') return KIND_WORDS[c.kind];
    return (COLOR_WORDS[c.color] || '') + ' ' + KIND_WORDS[c.kind];
}
function colorClass(c) { return (c.kind === 'wild' || c.kind === 'wild4') ? 'wild' : c.color; }
function cardGlyph(c) {
    if (c.kind === 'number') return String(c.value);
    if (c.kind === 'skip') return '⊘';
    if (c.kind === 'reverse') return '↺';
    if (c.kind === 'drawTwo') return '+2';
    if (c.kind === 'wild') return '★';
    return '+4';
}
// A card matches the top of the pile by colour OR by number/symbol — real Uno's whole rule.
// Wild is always legal; Wild Draw Four's extra "only if you hold nothing of the active
// colour" condition needs the whole hand, so it's checked separately (canPlayWild4 below).
function isLegal(card, topCard, activeColor) {
    if (!topCard) return true;
    if (card.kind === 'wild' || card.kind === 'wild4') return true;
    if (card.color === activeColor) return true;
    if (card.kind === 'number' && topCard.kind === 'number' && card.value === topCard.value) return true;
    if (card.kind !== 'number' && card.kind === topCard.kind) return true;
    return false;
}
function canPlayWild4(hand, activeColor) {
    return !hand.some(c => c.kind !== 'wild' && c.kind !== 'wild4' && c.color === activeColor);
}

// ═══════════════════════════════════════════
// HOST STATE
// ═══════════════════════════════════════════
// Host can also play (same reasoning as Kings Corner / Go Fish / I Doubt It) — no ongoing
// house role once the deal is done.
let H = {
    phase: 'lobby',              // 'lobby' | 'playing' | 'match_over'
    players: [],                 // [{ id, cid, name, hand:[Card], spectating }]
    turnIdx: 0,
    direction: 1,                 // 1 clockwise, -1 counter-clockwise
    matchStartIdx: 0,              // rotates who deals first across successive "Play again"s
    stock: [], discard: [],         // real Card objects — stock and pile both host-only truth
    activeColor: null,               // the colour currently in effect (declared colour when top is a Wild)
    drawnCard: null,                  // { playerId, cardId } — this turn's optional draw, pending play/pass
    pendingWild4: null,                // { playerId, nextPlayerId, hadColorBefore, deadline }
    pendingCallout: null,               // { playerId, called }
    winnerId: null,
    milestones: [], milestoneSeq: 0,
};

// ═══════════════════════════════════════════
// HOST LOGIC
// ═══════════════════════════════════════════
function hostAddPlayer(id, name, cid) {
    if (H.players.find(p => p.id === id)) return;
    const spectating = H.phase !== 'lobby';
    if (!spectating && H.players.length >= MAX_PLAYERS) return;
    H.players.push({ id, cid, name, hand: [], spectating });
}

function activePlayerCount() { return H.players.filter(p => !p.spectating).length; }
function nextIdx(idx, dir) {
    const n = H.players.length; if (!n) return idx;
    let i = idx;
    for (let k = 0; k < n; k++) { i = (i + n + dir) % n; if (!H.players[i].spectating) return i; }
    return idx;
}
function stepTurn(n) {
    for (let s = 0; s < n; s++) H.turnIdx = nextIdx(H.turnIdx, H.direction);
    checkCalloutPenalty();
}
// The "Last Card" penalty fires the instant an uncaught player's OWN next turn begins — the
// real rule's actual boundary, bounded by the game itself rather than an invented timer.
function checkCalloutPenalty() {
    const p = H.players[H.turnIdx];
    if (p && H.pendingCallout && H.pendingCallout.playerId === p.id && !H.pendingCallout.called) {
        H.pendingCallout = null;
        drawCards(p, 2);
        addMilestone(`${p.name} forgot to call "Last Card!" — draws 2.`);
    }
}
function updateCallout(player) {
    if (player.hand.length === 1) H.pendingCallout = { playerId: player.id, called: false };
    else if (H.pendingCallout && H.pendingCallout.playerId === player.id) H.pendingCallout = null;
}
function ensureStock(minNeeded) {
    while (H.stock.length < minNeeded && H.discard.length > 1) {
        const top = H.discard.pop();
        const rest = H.discard;
        H.stock = H.stock.concat(rest);
        shuffle(H.stock);
        H.discard = [top];
    }
}
function drawCards(player, n) {
    for (let i = 0; i < n; i++) {
        ensureStock(1);
        if (!H.stock.length) break;   // truly out of cards — extremely unlikely with 108
        player.hand.push(H.stock.pop());
    }
    updateCallout(player);
}
function checkWin(player) {
    if (player.hand.length === 0) {
        H.phase = 'match_over';
        H.winnerId = player.id;
        addMilestone(`${player.name} wins!`);
    }
}
function applyCardEffect(card) {
    if (card.kind === 'skip') { stepTurn(2); return; }
    if (card.kind === 'drawTwo') {
        const nextP = H.players[nextIdx(H.turnIdx, H.direction)];

function hostStartGame(fromId) {

    const deck = makeDeck(); shuffle(deck);
    for (let i = 0; i < 7; i++) H.players.forEach(p => p.hand.push(deck.pop()));

    // starter-effect edge cases most rule variants disagree on (Mattel's own rules only
    // clearly cover redrawing a Wild Draw Four starter).

let wild4Timer = null;

// Validates fully BEFORE mutating anything — never trust the phone's card id or colour.
function hostPlay(fromId, cardId, declaredColor) {
    if (H.phase !== 'playing' || H.pendingWild4) return;
    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId) return;
    const card = p.hand.find(c => c.id === cardId);
    if (!card) return;
    if (H.drawnCard && H.drawnCard.playerId === fromId && H.drawnCard.cardId !== cardId) return;
    const topCard = H.discard[H.discard.length - 1];
    if (!isLegal(card, topCard, H.activeColor)) return;
    if (card.kind === 'wild4' && !canPlayWild4(p.hand, H.activeColor)) {
        // they DO have a legal alternative — real Uno still lets them try it (that's what
        // makes the challenge meaningful), so this isn't rejected; hadColorBefore below
        // records the truth for when/if it's challenged.
    }
    let color = null;
    if (card.kind === 'wild' || card.kind === 'wild4') {
        color = COLORS.includes(declaredColor) ? declaredColor : COLORS[0];
    }
    const hadColorBefore = card.kind === 'wild4' ? p.hand.some(c => c.id !== cardId && c.color === H.activeColor) : null;

    p.hand = p.hand.filter(c => c.id !== cardId);
    H.discard.push(card);
    H.activeColor = color || card.color;
    H.drawnCard = null;
    updateCallout(p);
    addMilestone(`${p.name} plays ${cardLabel(card)}${color ? ' — declares ' + COLOR_WORDS[color] : ''}`);

    if (card.kind === 'wild4') {
        const nextP = H.players[nextIdx(H.turnIdx, H.direction)];
        H.pendingWild4 = { playerId: p.id, nextPlayerId: nextP.id, hadColorBefore, deadline: Date.now() + WILD4_CHALLENGE_MS };
        broadcast();
        clearWild4Timer();
        wild4Timer = setTimeout(() => resolveWild4(false), WILD4_CHALLENGE_MS);
        return;
    }
    applyCardEffect(card);
    checkWin(p);
    broadcast();
}

function resolveWild4(challenged) {
    if (!H.pendingWild4) return;
    clearWild4Timer();
    const pw = H.pendingWild4;
    H.pendingWild4 = null;
    const player = H.players.find(p => p.id === pw.playerId);
    const nextP = H.players.find(p => p.id === pw.nextPlayerId);
    if (challenged) {
        if (pw.hadColorBefore) {
            drawCards(player, 4);
            addMilestone(`${nextP.name} challenged — ${player.name} really did have a legal card! ${player.name} draws 4.`);
            stepTurn(1);
        } else {
            drawCards(nextP, 6);
            addMilestone(`${nextP.name} challenged — but ${player.name} had no legal alternative. ${nextP.name} draws 6 and is skipped!`);
            stepTurn(2);
        }
    } else {
        drawCards(nextP, 4);
        addMilestone(`${nextP.name} draws 4 and is skipped.`);
        stepTurn(2);
    }
    checkWin(player);

}

}
function hostDraw(fromId) {

    if (H.drawnCard && H.drawnCard.playerId === fromId) return;
    ensureStock(1);
    if (!H.stock.length) { broadcast(); return; }
    const card = H.stock.pop();
    p.hand.push(card);

    broadcast();
}
function hostPass(fromId) {

    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId) return;
    if (!H.drawnCard || H.drawnCard.playerId !== fromId) return;
    H.drawnCard = null;
    addMilestone(`${p.name} passes.`);
    stepTurn(1);
    broadcast();
}

    H.pendingCallout.called = true;
    const p = H.players.find(x => x.id === fromId);
    addMilestone(`${p.name} calls "Last Card!"`);
    broadcast();
}

    if (fromId === H.pendingCallout.playerId) return;
    const target = H.players.find(p => p.id === H.pendingCallout.playerId);
    const catcher = H.players.find(p => p.id === fromId);
    if (!target || !catcher || catcher.spectating) return;

    addMilestone(`${catcher.name} caught ${target.name} without calling "Last Card!" — draws 2.`);

    const msg = lobbyMsg();
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, msg); });
    Object.values(viewerConns).forEach(c => send(c, { ...msg, type: 'viewer_lobby' }));

    Object.values(viewerConns).forEach(c => send(c, buildViewerDisplay()));

// ═══════════════════════════════════════════
let peer = null, myId = '', myName = '', isHost = false, isTvHost = false, isViewer = false, roomCode = '';

let pendingWildCardId = null;
let _lastKey = '';

function connectedPlayers() {
    if (typeof presentPlayers === 'function') {
        return presentPlayers(H.players, guestConns, myId, isHost && !isTvHost);
    }
    return H.players.filter(p => (p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]));
}
// Host-can-also-play captain rule: first CONNECTED player, TV-gate-free (unlike common.js's
// version) — the four card games all keep this exact inline copy, and this game needs the
// same since its deck shape means it can't load cards.js's version either.
function capPlayer() {
    const active = connectedPlayers();
    return active[0] || H.players[0] || null;
}
function capSync(prevId) {
    const cap = capPlayer();
    if (!cap || cap.id === prevId) return;
    [prevId, cap.id].forEach(id => {
        if (!id) return;
        const c = guestConns[id];
        if (c) send(c, H.phase === 'lobby' ? lobbyMsg() : buildDisplay(id));
    });
    if (isTvHost) { vD = H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : buildViewerDisplay(); ui = 'viewer'; render(); }
}

function makeRoom(onOpen) {
    forgetRoom();
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message; isHost = false; isTvHost = false;
            document.body.classList.remove('viewer-mode'); ui = 'home'; render();

    });
}
function hostGame(name) {
    myName = name.trim().slice(0, 16) || 'Host';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { hostAddPlayer(myId, myName, clientId()); ui = 'lobby'; render(); });
}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); vD = { ...lobbyMsg(), type: 'viewer_lobby' }; ui = 'viewer'; render(); });
}
function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Player';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {

        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });

        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });
    conn.on('data', msg => {
        {
            const alive = H.players.find(p => p.id === conn.peer);
            if (alive && typeof notePresence === 'function') notePresence(alive);
        }
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer'; viewerConns[conn.peer] = conn; send(conn, H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : buildViewerDisplay());
            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        switch (msg.type) {
            case 'join': {
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Player').slice(0, 16);
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);

                if (!me2 && H.phase === 'lobby') { send(conn, { type: 'full' }); break; }

            case 'play': hostPlay(conn.peer, msg.cardId, msg.declaredColor); break;
            case 'draw': hostDraw(conn.peer); break;
            case 'pass': hostPass(conn.peer); break;
            case 'challengeWild4': hostChallengeWild4(conn.peer); break;

        }
    });
    conn.on('error', e => console.warn('conn err', e));
}

        seenFirstMilestones = true;

    const fresh = list.filter(m => m.seq > lastMilestoneSeq);
    fresh.forEach(m => {

        else if (/really did have a legal card/.test(m.text)) sBust();
        else if (/forgot to call/.test(m.text) || /caught .* without calling/.test(m.text)) sBust();

// CLIENT APPLY

    if (msg.type === 'lobby') { D = msg; ui = 'lobby'; render(); return; }
    if (msg.type === 'state') {

        D = msg;

// BEGINNER HELP — on-screen + spoken tips for players who don't know the rules yet.
// Deliberately its own on/off (🎓), independent of the 🗣️ milestone-voice toggle (which
// defaults OFF on a phone — gating hints on it would leave the help feature silent for

let helpPref = null;

function syncHelpBtn() { const b = document.getElementById('tog-help'); if (b) b.classList.toggle('off', !helpOn()); }
function toggleHelp() {

    syncHelpBtn();

}
function legalHandSummary(hand, topCard, activeColor) {
    const legal = (hand || []).filter(c => isLegal(c, topCard, activeColor));
    if (!legal.length) return null;
    let s = legal.slice(0, 3).map(cardLabel).join(', ');
    if (legal.length > 3) s += `, +${legal.length - 3} more`;
    return s;
}
function beginnerHint() {
    if (!D || isViewer || isTvHost) return '';
    if (ui === 'lobby') {
        return D.captain === myName
            ? `You're the captain 👑 — tap "Deal the hands" once at least ${MIN_PLAYERS} players have joined.`
            : `Waiting for ${D.captain || 'the captain'} to deal. Share the room code or QR so more players can join.`;
    }
    if (ui === 'match_over') {
        return D.isCaptain
            ? `${D.winnerName} won by emptying their hand first. As captain, tap "Play again" when everyone's ready.`
            : `${D.winnerName} won by emptying their hand first — fewest cards left ranks best.`;
    }
    if (ui !== 'playing') return '';
    if (pendingWildCardId) return `Pick the colour you want everyone to match next.`;
    if (D.pendingWild4Challenge) {
        return `${D.pendingWild4Challenge.playerName} played a Wild Draw Four. If you think they secretly had a card of their own colour, tap Challenge — but guess wrong and you draw extra. It's fine to just let it stand.`;
    }
    if (D.pendingCallout) {
        if (D.pendingCallout.isMe) return `You're down to one card — tap "Last Card!" now, before someone else catches you not calling it.`;
        if (D.pendingCallout.canCatch) return `${D.pendingCallout.playerName} has one card left and hasn't called "Last Card!" — tap Caught! and they draw 2.`;
    }
    if (D.isMyTurn) {
        if (D.drawnCardId) return `You drew a card. Play it now if it matches, or tap Pass if it doesn't.`;
        const summary = legalHandSummary(D.myHand, D.topCard, D.activeColor);
        return summary
            ? `Your turn — match the top card by colour or number (or play a Wild). You can play: ${summary}.`
            : `Your turn — nothing in your hand matches. Tap "Draw a card".`;

}

// Debounced so a milestone announcement (which fires synchronously just before render())

const SIM_NAMES = ['Ace', 'Bea', 'Cy', 'Dot', 'Eli', 'Fay', 'Gus', 'Ivy'];
let simTimer = null, simMode = 'tv';
function startSimulation(nPlayers, mode) {
    simMode = mode === 'player' ? 'player' : 'tv';
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));
    roomCode = 'DEMO';
    H = { phase: 'lobby', players: [], turnIdx: 0, direction: 1, matchStartIdx: 0, stock: [], discard: [],
          activeColor: null, drawnCard: null, pendingWild4: null, pendingCallout: null, winnerId: null, milestones: [], milestoneSeq: 0 };
    guestConns = {}; viewerConns = {};
    isHost = true;
    if (simMode === 'tv') {
        isTvHost = true; myId = '__sim_host__'; myName = '';
        document.body.classList.add('viewer-mode');
        for (let i = 0; i < n; i++) { const id = '__bot_' + i; guestConns[id] = { send() {}, _sim: true }; hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id); }
    } else {
        isTvHost = false; myName = 'You'; myId = '__you__';
        hostAddPlayer(myId, myName, myId);
        for (let i = 1; i < n; i++) { const id = '__bot_' + i; guestConns[id] = { send() {}, _sim: true }; hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id); }
        ui = 'lobby';
    }
    broadcastLobby();
    simTimer = setTimeout(simBegin, 2200);
}
function simBegin() { hostStartGame(capPlayer()?.id); simTimer = setTimeout(simStep, 1200); }
function simRestart() { startSimulation(H.players.length, simMode); }
function simStep() {
    simTimer = null;
    if (H.phase === 'match_over') { simTimer = setTimeout(simRestart, 6000); return; }
    if (H.phase !== 'playing') { simTimer = setTimeout(simStep, 800); return; }
    if (H.pendingWild4) {
        if (Math.random() < 0.4) hostChallengeWild4(H.pendingWild4.nextPlayerId);
        simTimer = setTimeout(simStep, 900);
        return;
    }
    if (H.pendingCallout && !H.pendingCallout.called) {
        const others = H.players.filter(p => !p.spectating && p.id !== H.pendingCallout.playerId);
        if (Math.random() < 0.3 && others.length) hostCatch(others[0].id);
        else if (Math.random() < 0.5) hostCallout(H.pendingCallout.playerId);
    }
    simBotTurn();
    simTimer = setTimeout(simStep, 900);
}
function simBotTurn() {
    const p = H.players[H.turnIdx];
    if (!p) return;
    const topCard = H.discard[H.discard.length - 1];
    if (H.drawnCard && H.drawnCard.playerId === p.id) {
        const card = p.hand.find(c => c.id === H.drawnCard.cardId);
        if (card && isLegal(card, topCard, H.activeColor)) hostPlay(p.id, card.id, COLORS[Math.floor(Math.random() * 4)]);
        else hostPass(p.id);
        return;
    }
    const legalCards = p.hand.filter(c => isLegal(c, topCard, H.activeColor));
    if (legalCards.length) {
        const card = legalCards[Math.floor(Math.random() * legalCards.length)];
        hostPlay(p.id, card.id, COLORS[Math.floor(Math.random() * 4)]);
    } else {
        hostDraw(p.id);
    }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    if (!musicOn) { const b = document.getElementById('tog-music'); if (b) b.classList.add('off'); }
    if (!sfxOn) { const b = document.getElementById('tog-sfx'); if (b) b.classList.add('off'); }
    syncVoiceBtn();
    syncHelpBtn();
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    const viewParam = params.get('view');
    if (viewParam) { joinAsViewer(viewParam); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
