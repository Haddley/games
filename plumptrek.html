<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plump Trek — roll, chaos, trophy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a0f24' width='100' height='100' rx='20'/><text x='50' y='70' font-size='54' text-anchor='middle'>🐇</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="common.js"></script><script src="fx.js"></script><script src="audio.js"></script>
    <script src="p2p.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0f24; --panel: rgba(50,28,68,0.75); --panel2: rgba(66,38,92,0.85);
            --border: rgba(255,210,63,0.28); --border2: rgba(180,130,220,0.30);
            --text: #f5ecff; --muted: #b199cf;
            --gold: #ffd23f; --pink: #ff5d9e; --good: #4ade80; --bad: #f87171;
            --paper: #fbf3e6; --ink: #2a1a3a; --ink-soft: #6a5680;
        }
        body.day {
            --bg: #f4ecf7; --panel: rgba(255,255,255,0.93); --panel2: #ffffff;
            --border: rgba(70,40,90,0.16); --border2: rgba(70,40,90,0.16);
            --text: #241033; --muted: #6b5580;
            --gold: #c78a08; --pink: #e8467d; --good: #2f9e5b; --bad: #d64545;
            --paper: #fffcf6; --ink: #2a1436; --ink-soft: #6b5580;
        }
        body.day::before { opacity: .5; }
        body.day input[type=text] { background: rgba(70,40,90,.05); }
        body.day .av,
        body.day .pav { background: rgba(70,40,90,.05); }
        body.day .btn-g { background: rgba(70,40,90,.06); }
        body.day .timebar-wrap,
        body.day .tv-timebar-wrap { background: rgba(70,40,90,.12); }
        body.day #sound-togs button { background: rgba(255,255,255,.85); }
        body.day .card { box-shadow: 0 10px 26px rgba(70,40,90,.14); }
        body.day .err { color: #b91c1c; }
        body.day .win-banner { color: #15803d; }
        body.day .chip.gd { color: #15803d; }
        body.day .rail-row .rdelta { color: #15803d; text-shadow: none; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
            padding: 26px 16px 48px; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255,93,158,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 8% 100%, rgba(255,210,63,0.11) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 92% 100%, rgba(150,90,230,0.13) 0%, transparent 65%);
        }
        body.viewer-mode { padding: 0; overflow: hidden; display: block; height: 100dvh; width: 100vw; }

        /* drifting comedy-club ambience — masks, cards & laughter behind everything */
        #laf-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        #laf-bg span {
            position: absolute; bottom: -12vh; left: var(--x); font-size: var(--s, 2rem); opacity: 0;
            filter: drop-shadow(0 3px 9px rgba(0,0,0,.35));
            animation: lafFloat var(--d, 27s) linear var(--dl, 0s) infinite;
        }
        @keyframes lafFloat {
            0%   { transform: translateY(0) rotate(-12deg); opacity: 0; }
            12%  { opacity: .075; }
            88%  { opacity: .075; }
            100% { transform: translateY(-124vh) rotate(14deg); opacity: 0; }
        }

        h1.logo {
            font-family: 'Fraunces', serif; font-weight: 900; letter-spacing: 1px;
            font-size: clamp(1.7rem, 7vw, 2.6rem); text-align: center; color: var(--gold);
            text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 34px rgba(255,210,63,.35);
        }
        h1.logo .hh { color: var(--pink); }
        .sub { color: var(--muted); font-size: .7rem; letter-spacing: 2.5px; text-transform: uppercase; margin: 7px 0 22px; text-align: center; }

        #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 13px; }
        body.viewer-mode #app { max-width: none; height: 100dvh; display: block; }

        .card {
            background: var(--panel); border: 1px solid var(--border2); border-radius: 17px;
            padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,.5);
        }
        .card.highlight { border-color: var(--gold); box-shadow: 0 0 26px rgba(255,210,63,.16), 0 12px 34px rgba(0,0,0,.5); }
        .slbl { font-size: .66rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }

        .fg { margin-bottom: 12px; }
        .fg label { display: block; font-size: .66rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
        input[type=text] {
            width: 100%; padding: 12px 14px; font-family: inherit; font-size: 1rem; font-weight: 700;
            border: 2px solid var(--border2); border-radius: 12px; background: rgba(26,15,36,.7); color: var(--text);
            outline: none;
        }
        input[type=text]:focus { border-color: var(--pink); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; font-weight: 900; font-size: .93rem; letter-spacing: .5px;
            padding: 13px 18px; border: none; border-radius: 13px; cursor: pointer;
            transition: filter .12s, opacity .12s; user-select: none; -webkit-user-select: none;
            color: var(--text);
        }
        .btn:active { filter: brightness(1.15); }
        .btn-p { background: linear-gradient(180deg, #ffe07a, #f5b623); color: #3a2600; box-shadow: 0 5px 0 #96661a, 0 10px 22px rgba(255,210,63,.3); }
        .btn-k { background: linear-gradient(180deg, #ff7bb2, #ef3e82); color: #fff; box-shadow: 0 5px 0 #8f1f53, 0 10px 22px rgba(255,93,158,.35); }
        .btn-g { background: rgba(180,130,220,.14); box-shadow: inset 0 0 0 2px var(--border2); }
        .btn-full { width: 100%; }
        .btn-sm { padding: 8px 13px; font-size: .76rem; border-radius: 11px; }
        .btn:disabled { opacity: .4; cursor: default; }

        .err {
            background: rgba(248,113,113,.13); border: 1px solid rgba(248,113,113,.5); color: #fda4af;
            padding: 11px 14px; border-radius: 12px; font-size: .8rem; font-weight: 700; text-align: center;
        }
        hr { border: none; border-top: 1px dashed var(--border2); margin: 13px 0; }

        .connecting { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 46px 0; color: var(--muted); font-weight: 700; }
        .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(255,210,63,.15); border-top-color: var(--gold); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avrow { display: flex; flex-wrap: wrap; gap: 7px; }
        .av {
            width: 42px; height: 42px; border-radius: 12px; font-size: 1.35rem; display: flex; align-items: center; justify-content: center;
            background: rgba(26,15,36,.7); border: 2px solid var(--border2); cursor: pointer;
        }
        .av.sel { border-color: var(--pink); background: rgba(255,93,158,.18); box-shadow: 0 4px 12px rgba(255,93,158,.35); }

        .player-row { display: flex; align-items: center; gap: 11px; padding: 8px 4px; border-bottom: 1px dashed var(--border2); font-weight: 800; font-size: .92rem; }
        .player-row:last-child { border-bottom: none; }
        .pav { width: 38px; height: 38px; border-radius: 11px; background: rgba(26,15,36,.7); border: 2px solid var(--border2); font-size: 1.25rem; display: flex; align-items: center; justify-content: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); margin-left: auto; }
        .qr-wrap { width: min(210px, 58vw); margin: 6px auto 10px; border-radius: 13px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
        .qr-wrap svg { display: block; width: 100%; height: auto; }
        .room-code { font-family: 'Fraunces', serif; font-weight: 900; font-size: 2.3rem; letter-spacing: 12px; text-align: center; color: var(--gold); padding-left: 12px; }
        .share-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
        .seg-row { display: flex; flex-wrap: wrap; gap: 7px; }

        /* prompt + countdown */
        .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .timebar-wrap { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
        .timebar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .2s linear; }
        .q-prompt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.28rem; line-height: 1.45; }
        .q-prompt .blank { color: var(--pink); border-bottom: 3px dotted var(--pink); }
        .q-prompt .hl { color: var(--pink); }

        /* judge / role notes */
        .lie-note { text-align: center; font-weight: 900; color: var(--gold); padding: 6px 0; }
        .win-banner {
            background: rgba(74,222,128,.13); border: 1px solid rgba(74,222,128,.5); color: #86efac;
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }
        .judge-note {
            background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold);
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }

        /* card wall (phone) — hand + judge wall */
        .wall { display: flex; flex-direction: column; gap: 9px; }
        .wall-card {
            border: none; border-radius: 13px; padding: 13px 14px; text-align: left; cursor: pointer;
            background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: .92rem; line-height: 1.35;
            box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.35);
            display: flex; gap: 10px; align-items: center;
            transition: opacity .2s, outline .1s, transform .1s;
        }
        .wall-card .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .72rem; color: var(--ink-soft); letter-spacing: 1px; }
        .wall-card.mine { opacity: .55; cursor: default; }
        .wall-card.mine::after { content: 'your card 😂'; margin-left: auto; font-family: 'Nunito', sans-serif; font-size: .66rem; font-weight: 900; color: var(--pink); white-space: nowrap; }
        .wall-card.pick-sel { outline: 4px solid var(--pink); outline-offset: 2px; transform: translateX(4px); }
        .wall-card.picked { outline: 4px solid var(--pink); outline-offset: 2px; }
        .wall-card.won { outline: 4px solid var(--good); outline-offset: 2px; }
        .wall-card.faded { opacity: .4; }
        .wall-card .ord { margin-left: auto; background: var(--pink); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .78rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

        /* reveal (phone) */
        .verdict { text-align: center; padding: 8px 0 4px; }
        .verdict .vico { font-size: 3rem; }
        .verdict .vt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; margin-top: 4px; }
        .verdict .vpts { font-size: 2rem; font-weight: 900; color: var(--gold); margin-top: 2px; }
        .verdict .vcard { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.02rem; color: var(--text); background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 12px; background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold); font-weight: 900; font-size: .76rem; margin: 3px; }
        .chip.pk { background: rgba(255,93,158,.13); border-color: rgba(255,93,158,.45); color: var(--pink); }
        .chip.gd { background: rgba(74,222,128,.13); border-color: rgba(74,222,128,.45); color: #86efac; }
        .standings .sc { margin-left: auto; font-weight: 900; }
        .standings .delta { color: var(--good); font-size: .75rem; font-weight: 900; margin-left: 7px; }

        /* ═════════ TV ═════════ */
        .tv { height: 100dvh; display: flex; flex-direction: column; padding: 2.8vmin 3.4vmin; gap: 2vmin; }
        .tv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; }
        .tv-logo { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.3vmin; color: var(--gold); text-shadow: 0 0 24px rgba(255,210,63,.4); }
        .tv-meta { font-size: 1.8vmin; font-weight: 900; letter-spacing: .35vmin; text-transform: uppercase; color: var(--muted); }
        .tv-main { flex: 1; display: flex; gap: 2.4vmin; min-height: 0; }
        .tv-stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 1.6vmin; }
        .tv-rail { width: 29vmin; min-width: 230px; display: flex; flex-direction: column; gap: 1.3vmin; overflow: hidden; }
        .rail-title { font-size: 1.6vmin; font-weight: 900; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); }
        .rail-row {
            display: flex; align-items: center; gap: 1.1vmin; background: var(--panel);
            border: 1px solid var(--border2); border-radius: 1.5vmin; padding: 1.1vmin 1.4vmin;
            font-weight: 800; font-size: 1.95vmin; position: relative;
        }
        .rail-row.judge { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,63,.2); }
        .rail-row .rav { font-size: 2.5vmin; }
        .rail-row .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rail-row .rsc { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
        .rail-row .rdelta { position: absolute; right: 1vmin; top: -1.2vmin; font-size: 1.6vmin; font-weight: 900; color: #86efac; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
        .rail-row.done::after { content: '✓'; color: var(--good); font-weight: 900; font-size: 1.9vmin; }
        .rail-row.judge::after { content: '👑'; font-size: 1.9vmin; }

        .tv-qcard {
            background: var(--panel); border: 1px solid var(--border); border-radius: 2.2vmin;
            padding: 3.2vmin 4vmin; box-shadow: 0 16px 50px rgba(0,0,0,.5);
        }
        .tv-qcard .kicker { font-size: 1.6vmin; font-weight: 900; letter-spacing: .4vmin; text-transform: uppercase; color: var(--pink); margin-bottom: 1.2vmin; }
        .tv-qcard .q { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.6vmin; line-height: 1.4; }
        .tv-qcard .q .blank { color: var(--pink); border-bottom: .5vmin dotted var(--pink); }
        .tv-qcard .q .hl { color: var(--pink); }
        .tv-counter { text-align: center; font-size: 2.2vmin; font-weight: 900; color: var(--gold); }
        .tv-timebar-wrap { flex: 0 0 auto; height: 1.5vmin; border-radius: .8vmin; background: rgba(255,255,255,.08); overflow: hidden; }
        .tv-timebar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--pink)); border-radius: .8vmin; transition: width .2s linear; }

        .tv-wall { flex: 1; display: grid; gap: 1.5vmin; grid-template-columns: repeat(auto-fit, minmax(26vmin, 1fr)); align-content: center; overflow: auto; }
        .tv-lie {
            background: var(--paper); color: var(--ink); border-radius: 1.5vmin; padding: 1.8vmin 2vmin;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 2vmin; line-height: 1.35;
            box-shadow: 0 8px 22px rgba(0,0,0,.4); position: relative; min-height: 8vmin;
            display: flex; flex-direction: column; justify-content: center;
        }
        .tv-lie .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.3vmin; letter-spacing: .3vmin; color: var(--ink-soft); display: block; margin-bottom: .6vmin; }
        .tv-lie.deal { animation: flipIn .5s ease both; }
        @keyframes flipIn { from { opacity: 0; transform: rotateX(80deg); } to { opacity: 1; transform: none; } }
        .tv-lie.is-win { outline: .55vmin solid var(--good); outline-offset: .3vmin; box-shadow: 0 0 34px rgba(74,222,128,.4); }
        .tv-lie.dim { opacity: .5; }
        .tv-lie .authors { position: absolute; top: -1.6vmin; right: 1vmin; font-size: 2.4vmin; }
        .tv-lie .tag { font-family: 'Nunito', sans-serif; font-size: 1.2vmin; font-weight: 900; letter-spacing: .2vmin; text-transform: uppercase; color: var(--ink-soft); margin-top: 1vmin; }
        .tv-lie .tag.win { color: #15803d; }

        /* TV lobby handled by common.js tvLobby() */
        .tv-waiting { color: var(--muted); font-weight: 800; font-size: 1.9vmin; }

        /* podium */
        .podium-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2.4vmin; padding-bottom: 1.5vmin; }
        .pod { text-align: center; font-weight: 900; animation: podRise .6s cubic-bezier(.2,.8,.3,1) both; }
        .pod .pav-big { font-size: 4.8vmin; }
        .pod .pname { font-size: 2.3vmin; margin-bottom: .8vmin; }
        .pod .pscore { font-size: 1.9vmin; color: var(--gold); margin-bottom: .8vmin; }
        .pod .block { border-radius: 1.5vmin 1.5vmin 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 1.3vmin; font-size: 3.2vmin; width: 17vmin; }
        .pod.p1 .block { height: 21vmin; position: relative; overflow: hidden; }
        .pod.p1 .block::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 36%, rgba(255,255,255,.55) 50%, transparent 64%);
            transform: translateX(-120%); animation: podShine 2.4s 1s ease-in-out infinite;
        }
        @keyframes podShine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
        .pod.p2 .block { height: 14vmin; }
        .pod.p3 .block { height: 9.5vmin; }
        .pod.mrank-0 .block { background: linear-gradient(180deg, #ffe07a, #96661a); }
        .pod.mrank-1 .block { background: linear-gradient(180deg, #d7d7e0, #8f8fa3); }
        .pod.mrank-2 .block { background: linear-gradient(180deg, #e8a06a, #9c5a33); }
        .awards-row { display: flex; gap: 1.5vmin; justify-content: center; flex-wrap: wrap; padding-bottom: 1.5vmin; }
        .award { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5vmin; padding: 1.3vmin 2vmin; font-weight: 800; font-size: 1.8vmin; text-align: center; }
        .award .aw-t { color: var(--gold); font-weight: 900; }

        #confetti-cv { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

        /* sound toggles */
        #sound-togs { position: fixed; top: 10px; right: 10px; z-index: 80; display: flex; gap: 6px; }
        #sound-togs button {
            width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem;
            background: rgba(50,28,68,.82); box-shadow: inset 0 0 0 1px var(--border2);
            transition: opacity .2s, transform .12s;
        }
        #sound-togs button:active { transform: scale(.88); }
        #sound-togs button.off { opacity: .35; filter: grayscale(1); }
        body.viewer-mode #sound-togs { top: auto; bottom: 12px; right: 12px; }

        /* FX layer — particles + score pops */
        .pt {
            position: fixed; width: 9px; height: 9px; border-radius: 2px;
            z-index: 950; pointer-events: none;
            animation: ptFly .75s cubic-bezier(.15,.65,.4,1) forwards;
        }
        @keyframes ptFly {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(560deg) scale(.3); opacity: 0; }
        }
        .pop {
            position: fixed; z-index: 960; pointer-events: none;
            font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem;
            animation: popUp 1.1s cubic-bezier(.2,.8,.3,1) forwards;
            text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: nowrap;
        }
        .pop.good { color: var(--good); }
        .pop.gold { color: var(--gold); }
        .pop.bad  { color: var(--bad); font-size: 1rem; }
        @keyframes popUp {
            0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
            15%  { transform: translate(-50%, -12px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -78px) scale(1); opacity: 0; }
        }

        /* screen entrances — only on phase changes (#app.fresh) */
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        #app.fresh .card { animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes wallIn { from { opacity: 0; transform: scale(.9) translateY(10px); } to { opacity: 1; transform: none; } }
        #app.fresh .wall-card { animation: wallIn .32s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
        #app.fresh .tv-lie.deal { animation-delay: calc(var(--i, 0) * 70ms); }

        /* ══ PLUMP TREK — the board ══════════════════════════════════════════
           The path is a plain wrap-around grid of squares: reading order IS the

        .sq-start   { background: rgba(74,222,128,.22); border-color: rgba(74,222,128,.6); color: #dcfce7; }
        .sq-gimmick { background: rgba(255,146,60,.22); border-color: rgba(255,146,60,.55); color: #ffd8b0; }

        .sq-boost   { background: rgba(56,189,248,.20); border-color: rgba(56,189,248,.55); color: #cbeeff; }
        .sq-trap    { background: rgba(239,68,68,.20); border-color: rgba(239,68,68,.55); color: #ffd3d3; }

        .stage { text-align: center; }

        /* ── The die ──────────────────────────────────────────────────────────

        .die { width: 16vmin; height: 16vmin; margin: 0 auto; display: flex; align-items: center; justify-content: center;

        @keyframes dieLand { 0% { scale: 1; } 40% { scale: 1.14; } 100% { scale: 1; } }
        .face { position: absolute; inset: 0; border-radius: 1.6vmin; display: grid; padding: 1.1vmin;
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            background: linear-gradient(150deg, #fffdf6, #ffd98a); border: 1px solid rgba(120,80,0,.25);
            box-shadow: inset 0 0 2vmin rgba(160,110,0,.25); backface-visibility: hidden; }
        .face .pip { width: 1.9vmin; height: 1.9vmin; border-radius: 50%; align-self: center; justify-self: center;

        .face .num { grid-column: 1 / -1; grid-row: 1 / -1; align-self: center; justify-self: center;

        .f1 { transform: translateZ(5.5vmin); }
        .f6 { transform: rotateY(180deg) translateZ(5.5vmin); }
        .f3 { transform: rotateY(90deg) translateZ(5.5vmin); }

        @media (prefers-reduced-motion: reduce) { .cube.throwing { transition: none; } .cube.landed { animation: none; } }
        .bigmsg { margin-top: 1.4vmin; font-weight: 900; font-size: 2vmin; color: var(--text); }
        .gcard, .fcard, .bcard { border-radius: 1.6vmin; padding: 14px 16px; text-align: center;

        .gcard.dare { background: linear-gradient(160deg, #ffe9f3, #ffc9de); }
        .gck { margin-top: 8px; font-size: .66rem; font-weight: 900; letter-spacing: .12em; color: #0b5f86; }
        .fcard, .fcard.big { background: linear-gradient(160deg, #2b1055, #7b2ff7); color: #fff; }
        .bcard, .bcard.big { background: linear-gradient(160deg, #0b3d91, #1e6fd9); color: #fff; }
        .buildpin { margin-top: 1.6vmin; font-size: 1.3vmin; font-weight: 800; color: #cfe4ff; opacity: .9; text-align: center; }

        /* phone bits */
        .btn-roll { width: 100%; font-size: 1.5rem; padding: 22px; background: linear-gradient(150deg, #ffd23f, #ff9a3d); color: #2b1a00; border: none; border-radius: 16px; font-weight: 900; }

<body>
    <div id="laf-bg" aria-hidden="true">
        <span style="--x:6%;--d:27s;--dl:0s;--s:2rem">🎭</span>
        <span style="--x:18%;--d:33s;--dl:-12s;--s:1.6rem">🐇</span>
        <span style="--x:30%;--d:24s;--dl:-6s;--s:2.4rem">🎲</span>
        <span style="--x:44%;--d:30s;--dl:-18s;--s:1.7rem">🏆</span>
        <span style="--x:57%;--d:26s;--dl:-9s;--s:2.1rem">😹</span>
        <span style="--x:69%;--d:35s;--dl:-22s;--s:1.6rem">🎭</span>
        <span style="--x:81%;--d:23s;--dl:-4s;--s:2.3rem">🐇</span>
        <span style="--x:93%;--d:31s;--dl:-15s;--s:1.8rem">🎲</span>
    </div>
    <div id="app"></div>
    <canvas id="confetti-cv"></canvas>
    <div id="sound-togs">
        <button id="tog-music" title="Music on/off" onclick="toggleMusic()">🎵</button>
        <button id="tog-sfx" title="Sound effects on/off" onclick="toggleSfx()">🔊</button>
    </div>
<script>
// ICE_CFG + rankByScore + mountScene + tvLobby come from common.js (loaded in <head>).
typeof mountScene === 'function' && mountScene('carnival');   // themed ambient scene along the bottom of the TV

'use strict';

function $id(id) { return document.getElementById(id); }
function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Substitute played noun-phrase card(s) into a blank template, in order; fix the
// opening capital and ensure a trailing full stop.
function qrSVG(url) {
    try {
        const qr = qrcode(0, 'M');
        qr.addData(url); qr.make();
        const n = qr.getModuleCount(), m = 2, size = n + m * 2;
        let rects = '';
        for (let r = 0; r < n; r++)
            for (let c = 0; c < n; c++)
                if (qr.isDark(r, c)) rects += `<rect x="${c + m}" y="${r + m}" width="1.05" height="1.05"/>`;
        return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">` +
            `<rect width="${size}" height="${size}" fill="#fdf8ec"/>` +
            `<g fill="#2a1a3a">${rects}</g></svg>`;
    } catch (e) { return ''; }
}

// ── Confetti palette (read by fx.js startConfetti) ──
const CONFETTI_COLS = ['#ffd23f', '#ff5d9e', '#4ade80', '#a78bfa', '#fbf3e6'];
function burstAt(sel, colors) {
    const el = document.querySelector(sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, colors);
}

// ═══════════════════════════════════════════
// AUDIO — procedural comedy-club swing + SFX (gesture-started).
// ═══════════════════════════════════════════
let AC = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;
let leadBus = null, musicDelay = null;
let musicOn = localStorage.getItem('trek-music') !== '0';
let sfxOn = localStorage.getItem('trek-sfx') !== '0';

function ac() {
    if (!AC) {
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);
        musicGain = AC.createGain(); musicGain.gain.value = musicOn ? 0.33 : 0; musicGain.connect(masterGain);
        sfxGain = AC.createGain(); sfxGain.gain.value = sfxOn ? 0.55 : 0; sfxGain.connect(masterGain);
        leadBus = AC.createGain(); leadBus.gain.value = 1; leadBus.connect(musicGain);
        musicDelay = AC.createDelay(1.5); musicDelay.delayTime.value = 0.3;
        const fb = AC.createGain(); fb.gain.value = 0.2;
        const dlp = AC.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 1900;
        const wet = AC.createGain(); wet.gain.value = 0.18;
        leadBus.connect(musicDelay); musicDelay.connect(dlp); dlp.connect(fb); fb.connect(musicDelay);
        dlp.connect(wet); wet.connect(musicGain);
        const len = AC.sampleRate * 1.2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
}

function noiseHit(dur, { vol = 0.3, when = 0, hp = 6000, dest = null } = {}) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || sfxGain);
    src.start(t); src.stop(t + dur + 0.05);
}

const mf = m => 440 * Math.pow(2, (m - 69) / 12); // midi → freq

// ── SFX ──
function sJoin() {
    if (!sfxOn || !AC) return;
    tone(mf(62), 0.08, { type: 'triangle', vol: 0.22 });
    tone(mf(69), 0.13, { type: 'triangle', vol: 0.22, when: 0.07 });
}
function sStart() {
    if (!sfxOn || !AC) return;
    [50, 53, 55, 57, 62].forEach((m, i) => tone(mf(m), 0.16, { type: 'sawtooth', vol: 0.13, when: i * 0.09, lp: 1700 }));
    tone(mf(66), 0.35, { type: 'triangle', vol: 0.2, when: 0.48 });
}
function sPhase() {
    if (!sfxOn || !AC) return;
    noiseHit(0.14, { vol: 0.1, hp: 2200 });
    tone(mf(57), 0.18, { type: 'triangle', vol: 0.16, slide: mf(62) });
}
// Card slapped down
function sPlay() {
    if (!sfxOn || !AC) return;
    tone(150, 0.1, { type: 'sine', vol: 0.34, slide: 70 });
    noiseHit(0.1, { vol: 0.09, hp: 2800, when: 0.02 });
    tone(mf(69), 0.09, { type: 'triangle', vol: 0.16, when: 0.08 });
}
// Judge locks a pick — ballot stamp
function sPick() {
    if (!sfxOn || !AC) return;
    tone(150, 0.12, { type: 'sine', vol: 0.4, slide: 60 });
    noiseHit(0.05, { vol: 0.14, hp: 3500, when: 0.01 });
    tone(mf(69), 0.08, { type: 'triangle', vol: 0.14, when: 0.09 });
}
function sFlip() {
    if (!sfxOn || !AC) return;
    noiseHit(0.12, { vol: 0.12, hp: 2600 });
    tone(mf(74), 0.1, { type: 'triangle', vol: 0.15, slide: mf(67) });
}
// Round win — a bright rimshot fanfare (ba-dum-tss + shimmer)
function sLaugh() {
    if (!sfxOn || !AC) return;
    duckMusic(0.8);
    tone(mf(60), 0.1, { type: 'triangle', vol: 0.22 });
    tone(mf(60), 0.12, { type: 'triangle', vol: 0.22, when: 0.14 });
    noiseHit(0.4, { vol: 0.16, hp: 6500, when: 0.3 });
    [72, 76, 79, 84].forEach((m, i) => tone(mf(m), 0.14, { type: 'triangle', vol: 0.16, when: 0.32 + i * 0.05 }));
}
function sTick() { if (!sfxOn || !AC) return; tone(1244, 0.045, { type: 'square', vol: 0.09 }); }
// ── the die ──
// A throw is a rattle, not a beep: a scatter of short wooden clicks tumbling over each
// other for the length of the animation, then a clack and a low thud as it lands.
function sDiceRoll(ms) {
    if (!sfxOn || !AC) return;
    const secs = Math.max(0.3, (ms || 1050) / 1000);
    const n = Math.round(secs * 11);                             // the rattle lasts as long as the throw
    for (let i = 0; i < n; i++) {
        const soft = i / n;                                      // clicks thin out as it slows
        const t = soft * secs * 0.92 + Math.random() * 0.03;
        noiseHit(0.032, { vol: 0.13 - soft * 0.06, when: t, hp: 2000 + Math.random() * 2800 });
        tone(150 + Math.random() * 130, 0.05, { type: 'triangle', vol: 0.07 - soft * 0.03, when: t, lp: 1500 });
    }
}
function sDiceLand() {
    if (!sfxOn || !AC) return;
    duckMusic(0.45);
    noiseHit(0.075, { vol: 0.26, hp: 1100 });                    // the clack of it settling
    tone(98, 0.22, { type: 'sine', vol: 0.34, slide: 60 });      // the thud through the table
    tone(330, 0.09, { type: 'triangle', vol: 0.13, when: 0.012, slide: 250 });
}
// Case closed: swing bugle quoting the lobby motif, closing trill + crash
function sWin() {

function duckMusic(dur = 0.5) {
    if (!AC || !musicGain || !musicOn) return;

}

let musicTrack = 'lobby', musicStep = 0, musicBar = 0, musicNext = 0, musicTimer = null, musicUrgent = false;
let musicIntensity = 2, musicKeyShift = 0;

function playMusicStep(i, t, bar) {
    const tr = TRACKS[musicTrack];
    const stepDur = 60 / tr.bpm / 4;
    const w = tr.waves || {};
    const k = musicKeyShift;
    const full = musicIntensity >= 2 || musicUrgent;
    const rel = t - AC.currentTime + (((i >> 1) % 2) ? stepDur * 2 * (tr.swing || 0) : 0);
    if (tr.kick[i]) tone(135, 0.24, { type: 'sine', vol: 0.42, when: rel, slide: 40, dest: musicGain });
    if (tr.hat[i]) {
        const hv = (i % 4 === 0 ? 0.1 : 0.06) * (0.8 + Math.random() * 0.4);
        noiseHit(i % 8 === 4 ? 0.09 : 0.05, { vol: hv, when: rel, hp: 8500, dest: musicGain });
    }
    const bassArr = tr.bassBars ? tr.bassBars[bar % tr.bassBars.length] : tr.bass;
    const b = bassArr[i];
    if (b != null) tone(mf(b + k), stepDur * 1.6, { type: w.bass || 'triangle', vol: 0.3, when: rel, dest: musicGain, lp: 850, attack: 0.006 });
    const pad = tr.pads[bar % tr.pads.length];
    const ch = i < 16 ? pad[0] : pad[16];
    if (tr.stab && tr.stab[i] && ch && full)
        ch.forEach(m => tone(mf(m + 12 + k), stepDur * 1.1, { type: w.stab || 'sine', vol: tr.stabVol || 0.035, when: rel, lp: 2400, dest: musicGain, attack: 0.005 }));
    let l = tr.leads[bar % tr.leads.length][i];
    if (l != null && (musicIntensity >= 1 || musicUrgent)) {
        if (musicUrgent) l += 12;
        tone(mf(l + k), stepDur * 1.5, { type: w.lead || 'triangle', vol: 0.12 * (0.9 + Math.random() * 0.2), when: rel, dest: leadBus, lp: tr.leadLp || 3000, attack: 0.006 });
    }
    if (tr.arp && i % tr.arp === 0 && ch && full)
        tone(mf(ch[(i / tr.arp) % ch.length] + 24 + k), stepDur * tr.arp * 0.9, { type: w.arpW || 'sine', vol: 0.04, when: rel, lp: 5000, dest: musicGain, attack: 0.004 });
    if (musicUrgent && i % 4 === 0) noiseHit(0.035, { vol: 0.1, when: rel + stepDur * 2, hp: 11000, dest: musicGain });
}

function musicScheduler() {
    const tr = TRACKS[musicTrack];
    const stepDur = 60 / tr.bpm / 4;
    while (musicNext < AC.currentTime + 0.18) {
        playMusicStep(musicStep, musicNext, musicBar);
        musicNext += stepDur;
        musicStep++;
        if (musicStep === 32) { musicStep = 0; musicBar++; }
    }
}

function setMusic(track) {
    if (musicTrack === track) return;
    const wasPlaying = !!(AC && musicTimer);
    musicTrack = track;
    musicStep = 0; musicBar = 0;
    musicIntensity = (track === 'game' || track === 'finale') ? 1 : 2;
    if (track === 'lobby' || track === 'over') musicKeyShift = 0;
    if (!TRACKS[track]) { musicTrack = 'lobby'; track = 'lobby'; }
    if (musicDelay) musicDelay.delayTime.value = 60 / TRACKS[track].bpm * 0.5;
    if (track !== 'game' && track !== 'finale') musicUrgent = false;
    if (wasPlaying) {
        const s = 60 / TRACKS[track].bpm / 4;
        for (let f = 0; f < 4; f++) noiseHit(0.06, { vol: 0.1 + f * 0.035, when: f * s, hp: 2800 + f * 900, dest: musicGain });
        musicNext = AC.currentTime + 4 * s;
    }
}
function bumpIntensity(done, total) {
    if (total && done / total >= 0.5) musicIntensity = Math.max(musicIntensity, 2);
}

function toggleMusic() {
    musicOn = !musicOn;
    localStorage.setItem('trek-music', musicOn ? '1' : '0');
    if (!AC && musicOn) { ac(); startMusicLoop(); }
    if (AC && musicGain) musicGain.gain.linearRampToValueAtTime(musicOn ? 0.33 : 0, AC.currentTime + 0.2);
    $id('tog-music').classList.toggle('off', !musicOn);
}
function toggleSfx() {
    sfxOn = !sfxOn;
    localStorage.setItem('trek-sfx', sfxOn ? '1' : '0');
    if (AC && sfxGain) sfxGain.gain.value = sfxOn ? 0.55 : 0;
    $id('tog-sfx').classList.toggle('off', !sfxOn);
}

// Builds — one card, drawn at the start, bending a rule for the WHOLE game.
const BUILDS = [
    { t: 'CHAOS',     x: 'Every Gimmick space gives 2 cards',            b: 'chaos' },
    { t: 'SPEEDRUN',  x: 'Roll a 20-sided die instead of a 6',           b: 'd20' },

// ── The board ──────────────────────────────────────────────────────────────────
// Nodes with explicit links, so the fork's two routes can differ in length and rejoin
// cleanly: board[i] = { t, label, next:[j] } — a fork has two `next` entries and the
// player is asked which way BEFORE they roll.
const BOARD_LENS = { short: 30, normal: 44, epic: 64 };
const SPACE_LABEL = {
    start: 'START', plain: '', gimmick: 'GIMMICK', gimmick2: 'GIMMICK ×2',
    boost: '', trap: '', gate: 'STOP', fork: 'PICK A PATH', finale: 'FINALE', win: 'WIN!',
};
const BOOSTS = [
    { label: 'Leg it!', n: 3 }, { label: 'Bounce pad!', n: 4 }, { label: 'Downhill!', n: 2 },
    { label: 'Big stride!', n: 5 }, { label: 'Found a shortcut!', n: 3 },
];
const TRAPS = [
    { label: 'Tripped over', n: -2 }, { label: 'Wrong turn', n: -3 }, { label: 'Nap time', n: -2, skip: 1 },
    { label: 'Sat down for a bit', n: -4 }, { label: 'Dropped everything', n: -3 },
    { label: 'Chased by a goose', n: -5 },
];

// Deterministic shuffling so ?seed= makes a game reproducible (the e2e leans on this).
let _rngState = 0;
function seedRng(n) { _rngState = (n >>> 0) || 1; }
function rnd() {                                   // xorshift32, plenty for a board game
    if (!_rngState) return Math.random();
    let x = _rngState;
    x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0;
    _rngState = x;
    return x / 4294967296;
}
function rndInt(n) { return Math.floor(rnd() * n); }
function rshuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rndInt(i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; }

function makeBoard(length) {
    const n = BOARD_LENS[length] || BOARD_LENS.short;
    const b = [];
    const push = (t, extra) => { b.push({ t, label: SPACE_LABEL[t] || '', ...(extra || {}) }); return b.length - 1; };
    push('start');
    // main run: mostly Gimmicks, sprinkled with boosts, traps, a couple of gates
    const gateAt = [Math.floor(n * 0.35), Math.floor(n * 0.75)];
    const forkAt = Math.floor(n * 0.55);
    for (let i = 1; i < n - 2; i++) {
        if (gateAt.includes(i)) { push('gate', { need: 4 }); continue; }
        if (i === forkAt) { push('fork'); continue; }
        const r = rnd();
        if (r < 0.40) push('gimmick');
        else if (r < 0.50) push('gimmick2');
        else if (r < 0.63) { const x = BOOSTS[rndInt(BOOSTS.length)]; push('boost', { label: x.label, n: x.n }); }
        else if (r < 0.78) { const x = TRAPS[rndInt(TRAPS.length)]; push('trap', { label: x.label, n: x.n, skip: x.skip || 0 }); }
        else push('plain');
    }
    const finaleIx = push('finale');
    const winIx = push('win');
    b.forEach((s, i) => { s.next = [Math.min(i + 1, winIx)]; });
    b[winIx].next = [winIx];

    // The fork: a short cut that skips 5 spaces but is all gates and double Gimmicks.
    const f = b[forkAt];
    const scStart = b.length;
    push('gate', { need: 5, sc: 1 });
    push('gimmick2', { sc: 1 });
    push('gimmick2', { sc: 1 });
    const rejoin = Math.min(forkAt + 6, finaleIx);
    for (let i = scStart; i < b.length; i++) b[i].next = [i + 1 <= b.length - 1 ? i + 1 : rejoin];
    b[b.length - 1].next = [rejoin];
    f.next = [forkAt + 1, scStart];                       // [the long way, the short cut]
    f.routes = ['The long way round', 'The short cut (rough)'];
    return b;
}

function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }

// ── 👑 captain (TV-host rooms) ──────────────────────────────────────────────
// The captain is the first *CONNECTED* player, not simply H.players[0]: a captain

// Host-authoritative state. `board` is nodes with explicit links; a player is a pawn

// ── Messages ───────────────────────────────────────────────────────────────────

function settingsSummary(s) {

function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });
    conn.on('data', msg => {
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer';
            viewerConns[conn.peer] = conn;
            send(conn, viewerSnapshot());
            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        const player = H.players.find(p => p.id === conn.peer);
        switch (msg.type) {
            case 'join': {
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Player').slice(0, 16);
                const zombie = H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer && !guestConns[p.id])
                    || H.players.find(p => p.name === name && p.id !== conn.peer && !guestConns[p.id]);
                if (zombie) zombie.id = conn.peer;
                else hostAddPlayer(conn.peer, name, msg.avatar);
                const p2 = H.players.find(p => p.id === conn.peer);
                if (p2 && msg.cid) p2.cid = msg.cid;          // this device now owns the slot
                if (!p2) { send(conn, lobbyMsg()); break; }
                if (H.phase === 'lobby') broadcastLobby();
                else {
                    send(conn, phaseSnapshotFor(p2));
                    broadcastViewers(viewerSnapshot());
                    if (isTvHost) tvHostSync();
                }
                break;
            }
            case 'roll':   if (player) hostRoll(player); break;
            case 'done':   if (player) hostDone(player); break;
            case 'choose': if (player) hostChoose(player, msg.value); break;
            case 'play':   if (player) hostPlayCard(player, msg.idx); break;

                break;
            }
        }
    });

        const prevCap = capPlayer()?.id || null;

        delete viewerConns[conn.peer];

            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        } else if (H.turn === conn.peer && ['turn', 'choose'].includes(H.phase)) {

        }

}

// HOST GAME FLOW
// ═══════════════════════════════════════════

// ── ordering helpers (a race, so "place" is how far along you are) ──
function alive() { return H.players.filter(p => !p.done); }

    seedRng(H.settings.seed || (Date.now() & 0xffffffff));
    H.board = makeBoard(H.settings.length);
    H.drawPile = buildGimmickPile();
    H.discard = [];
    H.finale = null; H.finaleState = null; H.order = []; H.round = 0; H.reverse = false;
    H.players.forEach(p => { p.pos = 0; p.hand = []; p.skip = 0; p.mods = []; p.route = 0; p.done = false; p.gates = {}; });
    H.build = H.settings.build ? BUILDS[rndInt(BUILDS.length)] : null;

// The Gimmick pile: commons shuffled, with the rare whammies salted in ~1 in 12.
function buildGimmickPile() {
    const common = GIMMICKS.filter(c => c.w !== 0);
    const rare = GIMMICKS.filter(c => c.w === 0);
    const pile = rshuffle(common);
    const every = Math.max(6, Math.floor(pile.length / Math.max(1, rare.length)));
    rshuffle(rare).forEach((c, i) => pile.splice(Math.min(pile.length, (i + 1) * every - rndInt(3)), 0, c));
    return pile;
}
function drawGimmick() {
    if (!H.drawPile.length) { H.drawPile = rshuffle(H.discard.length ? H.discard : GIMMICKS.filter(c => c.w !== 0)); H.discard = []; }
    return H.drawPile.pop();

// ── the turn engine (skips absent and skipped players, like oddsheep's) ──
function beginTurn() {
    clearHostTimers();
    if (H.players.every(p => p.done)) { showPodium(); return; }
    for (let guard = 0; guard < H.players.length * 4 + 4; guard++) {
        H.turnIdx = H.reverse
            ? (H.turnIdx - 1 + H.turnOrder.length) % H.turnOrder.length
            : (H.turnIdx + 1) % H.turnOrder.length;
        if (H.turnIdx === 0 && !H.reverse) endOfRound();
        const p = turnPlayer();
        if (!p || p.done) continue;
        if (!guestConns[p.id] && p.id !== myId) continue;     // away: their pawn waits
        if (p.skip > 0) { p.skip -= 1; H.msg = p.name + ' misses a turn'; continue; }
        H.turn = p.id; H.roll = null; H.moved = null; H.card = null; H.choice = null;
        // standing on a fork? choose the route before rolling, as the original demands
        H.phase = (H.board[p.pos] && H.board[p.pos].t === 'fork') ? 'choose' : 'turn';
        if (H.phase === 'choose') H.choice = { kind: 'route', who: p.id, opts: H.board[p.pos].routes };

    if (o.allTo === 'start') others.forEach(p => { p.pos = 0; });

    cube.classList.remove('throwing', 'landed');
    cube.style.transform = `rotateX(${-40 + Math.random() * 80}deg) rotateY(${-40 + Math.random() * 80}deg)`;
    sDiceRoll(dur);
    requestAnimationFrame(() => requestAnimationFrame(() => {
        cube.classList.add('throwing');
        cube.style.transitionDuration = dur + 'ms';
        cube.style.transform = `rotateX(${fx + 360 * turns}deg) rotateY(${fy + 360 * (turns + 1)}deg)`;
    }));
    _dieSpin = setTimeout(() => {
        const c = document.getElementById('v-cube');
        if (!c) return;
        c.classList.add('landed');
        sDiceLand();
        try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
    }, dur + 20);
}

// A re-render (someone joined, a card landed) must not leave the die mid-throw.
function settleDie(n) {
    const cube = document.getElementById('v-cube');
    if (!cube) return;
    clearTimeout(_dieSpin);
    const [fx, fy] = FACE_ROT[n > 6 ? 1 : n] || [0, 0];
    cube.classList.remove('throwing');                 // snap, don't animate the correction
    cube.style.transitionDuration = '';
    cube.style.transform = `rotateX(${fx}deg) rotateY(${fy}deg)`;
}

function applyViewerMsg(msg) {
    if (!msg) return;
    const prevPhase = vD && vD.phase;
    vD = msg;
    isViewer = isViewer || !isTvHost;
    ui = 'viewer';
    setMusic(msg.type === 'viewer_lobby' ? 'lobby' : msg.phase === 'podium' ? 'over' : msg.phase === 'finale' ? 'finale' : 'game');
    render();
    if (msg.phase === 'moving' && msg.roll != null && !msg.moved) spinDie(msg.roll);
    else if (msg.roll != null) settleDie(msg.roll);
    if (msg.phase === 'card' && prevPhase !== 'card') sPlay();
    if (msg.phase === 'finale' && prevPhase !== 'finale') sFlip();
    if (msg.phase === 'podium' && prevPhase !== 'podium') { sWin(); startConfetti(3200); }
}

function pawnHTML(pl) { return `<span class="pawn" style="--pc:${pawnColor(pl)}">${esc(pl.avatar)}</span>`; }
function pawnColor(pl) { return PAWN_COLS[(pl.name || '').length % PAWN_COLS.length]; }
const PAWN_COLS = ['#ffd23f', '#ff5d9e', '#4ade80', '#a78bfa', '#38bdf8', '#fb923c', '#f472b6', '#34d399'];

// The board strip: main path, then the short cut as its own row underneath.
const BOARD_RUN = 9;           // squares per horizontal run — short runs double back
                               // sooner, which keeps the whole track readable at a glance
// Where does square k sit, and which way does the trail leave it? The path snakes, but
// each turn gets its OWN square dropped vertically below the last one — so the rows are
// spaced apart and you can see the route bend rather than having to guess it.
//   band = one horizontal run (BOARD_RUN squares) + one vertical connector below its end
function placeSquare(k) {
    const band = Math.floor(k / (BOARD_RUN + 1));
    const at = k % (BOARD_RUN + 1);
    const rtl = band % 2 === 1;                                  // odd bands run right→left
    if (at < BOARD_RUN) {
        return { row: band * 2 + 1, col: rtl ? BOARD_RUN - at : at + 1,
                 dir: at === BOARD_RUN - 1 ? 'd' : (rtl ? 'l' : 'r') };
    }
    return { row: band * 2 + 2, col: rtl ? 1 : BOARD_RUN, dir: 'd' };   // the connector
}
function boardHTML(d, big) {
    const b = d.board || [], ps = d.players || [];
    const main = [], sc = [];
    b.forEach((s, i) => (s.sc ? sc : main).push({ s, i }));
    const last = main.length - 1;
    const cell = ({ s, i }, k, snake) => {
        const on = ps.filter(p => p.pos === i && !p.done);
        const at = snake ? placeSquare(k) : { row: 1, col: k + 1, dir: k === sc.length - 1 ? '' : 'r' };
        const dir = k === last && snake ? '' : at.dir;
        const lab = s.t === 'boost' || s.t === 'trap' ? `${s.n > 0 ? '+' : ''}${s.n}` : (s.label || '');
        const glyph = dir === 'l' ? '❮' : '❯';
        return `<div class="sq sq-${s.t}${on.length ? ' occupied' : ''}" id="sq-${i}"
            style="grid-column:${at.col};grid-row:${at.row}">
            <span class="sqn">${k + 1}</span>
            <span class="sql">${esc(lab)}</span>
            ${dir ? `<span class="sqa ${dir}"${dir === 'd' ? ' style="transform:translateX(-50%) rotate(90deg)"' : ''}>${glyph}</span>` : ''}
            ${on.length ? `<span class="sqp">${on.map(pawnHTML).join('')}</span>` : ''}
        </div>`;
    };
    // Fit the whole track on screen however long it is: the square size shrinks with the
    // number of grid rows rather than letting an epic board run off the bottom.
    const rows = main.length ? placeSquare(last).row : 1;
    const size = `--cols:${BOARD_RUN};` + (big ? `--sqs: min(8.4vmin, ${(72 / Math.max(3, rows)).toFixed(2)}vmin)` : '');
    return `<div class="board${big ? ' big' : ''}" style="${size}">${main.map((c, k) => cell(c, k, true)).join('')}</div>
        ${sc.length ? `<div class="board sc"${big ? ` style="${size}"` : ''}>${sc.map((c, k) => cell(c, k, false)).join('')}</div>` : ''}`;
}
function cardHTML(c, mine) {
    if (!c) return '';
    return `<div class="gcard${mine ? ' mine' : ''}${c.hold ? ' keep' : ''}${c.dare ? ' dare' : ''}">
        <div class="gct">${esc(c.t)}</div><div class="gcx">${esc(c.x)}</div>
        ${c.hold ? '<div class="gck">KEEP THIS</div>' : ''}
    </div>`;
}
function handHTML(hand, playable) {
    if (!hand || !hand.length) return '';
    return `<div class="hand">${hand.map((c, i) =>
        `<button class="hcard" ${playable ? `onclick="doPlayCard(${i})"` : 'disabled'}>
            <span class="hct">${esc(c.t)}</span><span class="hcx">${esc(c.x)}</span>
        </button>`).join('')}</div>`;
}
function whoName(d, id) { const p = (d.players || []).find(x => x.id === id); return p ? p.name : 'Someone'; }

function renderPlay() {

    if (d.phase === 'build') {

            <div class="bcard"><div class="bct">${esc(d.build ? d.build.t : '')}</div><div class="bcx">${esc(d.build ? d.build.x : '')}</div></div></div>`;
    } else if (d.phase === 'card') {

            extra = `<div class="opts">
                <button class="btn btn-g btn-full opt" onclick="doChoose('${esc(st.a)}')">${esc(whoName(d, st.a))}</button>
                <button class="btn btn-g btn-full opt" onclick="doChoose('${esc(st.b)}')">${esc(whoName(d, st.b))}</button></div>`;
        }
        body = `<div class="card highlight"><div class="slbl">🏁 FINALE — ${esc(whoName(d, f.who))} drew it</div>

            ${extra}</div>`;
    } else if (me.myTurn) {
        body = `<div class="card highlight" style="text-align:center">
            <div class="slbl">Your turn — ${ordinal(me.place)} place</div>

        ${miniRailHTML(d)}`;
}
function ordinal(n) { return n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n + 'th'; }
function miniRailHTML(d) {

    const joinCard = `
    <div class="card${fromQR ? ' highlight' : ''}">
        <div class="slbl">Join a Game</div>
        <div class="fg">
            <label>Room Code</label>
            <input type="text" maxlength="4" placeholder="4-letter code" value="${esc(fCode)}"
                oninput="fCode=this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')document.getElementById('btn-join').click()">
        </div>
        <button id="btn-join" class="btn ${fromQR ? 'btn-k' : 'btn-g'} btn-full"
            onclick="if(fName.trim()&&fCode.trim()){joinGame(fCode,fName)}else{uiErr='Enter your name and the room code.';render()}">
            📱 Join with your phone
        </button>
    </div>`;
    const hostCard = `
    <div class="card">
        <div class="slbl">Start a Game</div>
        <button class="btn btn-p btn-full"
            onclick="if(fName.trim()){hostGame(fName)}else{uiErr='Enter your name first.';render()}">
            🐇 Host on this phone
        </button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin-top:8px">
            3–12 players — put a TV up with the room code
        </div>
    </div>`;
    const tvCard = `
    <div class="card">
        <div class="slbl">TV / Big Screen</div>
        <button class="btn btn-p btn-full" onclick="hostOnTV()">📺 Host the party on this screen</button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin:6px 0 10px">
            Shows a big QR code — the first phone to join becomes 👑 Captain
        </div>
        <hr>
        <div class="fg">
            <label>…or show an existing game</label>
            <input type="text" maxlength="4" placeholder="4-letter code" value="${esc(fVCode)}"
                oninput="fVCode=this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')joinAsViewer(fVCode)">
        </div>
        <button class="btn btn-g btn-full"
            onclick="if(fVCode.trim()){joinAsViewer(fVCode)}else{uiErr='Enter a room code.';render()}">
            📺 Open TV screen
        </button>
    </div>`;
    return `
    ${hdrHTML('roll · chaos · trophy')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    ${youCard}${fromQR ? joinCard + hostCard : hostCard + joinCard}${tvCard}`;
}

function renderLobbyH() {
    const pList = H.players.map((p, i) =>
        `<div class="player-row">
            <div class="pav">${esc(p.avatar)}</div>
            <div style="flex:1">${esc(p.name)}${i === 0 ? ' <span style="color:var(--muted)">(you — host)</span>' : ''}</div>
            <div class="dot"></div>
        </div>`).join('');
    return `
    ${hdrHTML('Host Lobby')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    <div class="card highlight">
        <div class="slbl">Scan to join — or share the code</div>
        <div class="qr-wrap">${qrSVG(joinURL())}</div>
        <div class="room-code">${esc(roomCode)}</div>
        <div class="share-row">
            <button class="btn btn-g btn-sm"
                onclick="navigator.clipboard&&navigator.clipboard.writeText(joinURL()).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='📋 Copy link',1500)})">📋 Copy link</button>
            <button class="btn btn-g btn-sm"
                onclick="navigator.share&&navigator.share({title:'Join The Last Laugh',text:'Room code: ${esc(roomCode)}',url:joinURL()})">📤 Share</button>
        </div>
        <div style="font-size:.68rem;color:var(--muted);text-align:center">Put the TV screen up with code <b style="color:var(--gold)">${esc(roomCode)}</b></div>
    </div>
    <div class="card">
        <div class="slbl">Players (${H.players.length}/${MAX_PLAYERS})</div>
        ${pList}
    </div>
    <div class="card">
        <div class="slbl">Settings</div>
        ${settingsSegsHTML(H.settings, patch => `hostSet(${patch})`)}
    </div>
    <button class="btn btn-k btn-full" style="font-size:1.08rem;padding:16px" onclick="hostStartGame()">🎲 Start the trek</button>`;
}

function renderLobbyG() {
    const cap = isCaptain();
    const pList = (D.players || []).map(p =>
        `<div class="player-row">
            <div class="pav">${esc(p.avatar)}</div>
            <div style="flex:1">${esc(p.name)}${p.name === myName ? ' <span style="color:var(--muted)">(you)</span>' : ''}${D.tvHost && p.name === D.captain ? ' 👑' : ''}</div>
            <div class="dot"></div>
        </div>`).join('');
    const s = D.settings || {};
    return `
    ${hdrHTML(cap ? '👑 You are the Captain' : 'Lobby')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    <div class="card">
        <div class="slbl">Room ${esc(D.roomCode || '')} — Players (${(D.players || []).length}/${MAX_PLAYERS})</div>
        ${pList}
    </div>
    ${cap ? `
    <div class="card highlight">
        <div class="slbl">👑 Captain's Settings</div>
        ${settingsSegsHTML(s, patch => `guestCtl('set',${patch})`)}
    </div>
    <button class="btn btn-k btn-full" style="font-size:1.08rem;padding:16px" onclick="guestCtl('start')">🎲 Start the trek</button>`
    : `
    <div class="card">
        <div class="slbl">Settings</div>
        <div style="font-weight:800;font-size:.85rem">${esc(settingsSummary(s))}</div>
        <div style="color:var(--muted);font-size:.74rem;font-weight:700;margin-top:8px">
            Waiting for ${D.tvHost ? `👑 ${esc(D.captain || 'the captain')}` : 'the host'} to start…
        </div>
    </div>`}`;
}

function tvShell(inner, meta) {
    return `<div class="tv">
        <div class="tv-top">
            <div class="tv-logo">🐇 PLUMP TREK</div>
            <div class="tv-meta">${esc(meta || ('Room ' + (vD.roomCode || roomCode || '')))}</div>
        </div>
        ${inner}
    </div>`;
}

// ═══════════════════════════════════════════
// SELF-PLAYING DEMO (?mode=tvsimulation | playersimulation)
// ═══════════════════════════════════════════
let simTimer = null, simMode = 'tv';
const SIM_NAMES = ['Ace', 'Bux', 'Cass', 'Duke', 'Edie', 'Fox', 'Gwen', 'Hank'];

function startSimulation(nPlayers, mode) {
    simMode = mode || 'tv';
    isHost = true; isTvHost = simMode === 'tv';
    roomCode = 'DEMO';
    myId = 'sim-host';
    if (isTvHost) document.body.classList.add('viewer-mode');
    H.players = [];
    for (let i = 0; i < Math.max(2, Math.min(nPlayers || 4, MAX_PLAYERS)); i++) {
        hostAddPlayer('sim-' + i, SIM_NAMES[i % SIM_NAMES.length], AVATARS[i % AVATARS.length]);
        guestConns['sim-' + i] = { peer: 'sim-' + i, send() {} };   // stub: bots count as present
    }
    H.settings.length = 'short';
    hostStartGame();
    if (!isTvHost) { myId = 'sim-0'; applyMsg(stateFor(H.players[0])); }
    simTimer = setInterval(simDrive, 900);
}
// The bots only ever do the thing the game is waiting for — which makes this a decent
// smoke test of the whole loop as well as an attract mode.
function simDrive() {
    if (!H.players.length) return;
    if (H.phase === 'podium') { clearInterval(simTimer); simTimer = setTimeout(() => { hostNewGame(); hostStartGame(); simTimer = setInterval(simDrive, 900); }, 5000); return; }
    const p = turnPlayer();
    if (H.phase === 'turn' && p) { hostRoll(p); return; }
    if (H.phase === 'card' && H.card && H.card.dare !== false) {
        const who = H.players.find(x => x.id === H.card.who);
        if (who && H.card.o && H.card.o.dare) hostDone(who);
        return;
    }
    if (H.phase === 'choose' && H.choice) {
        const who = H.players.find(x => x.id === H.choice.who);
        const opts = H.choice.opts || [];
        const pick = opts.length ? (typeof opts[0] === 'object' ? opts[Math.floor(Math.random() * opts.length)].id : opts[Math.floor(Math.random() * opts.length)]) : 0;
        if (who) hostChoose(who, H.choice.kind === 'route' ? Math.round(Math.random()) : pick);
        return;
    }
    if (H.phase === 'finale' && H.finaleState) {
        const st = H.finaleState;
        if (st.kind === 'rps') { const throwIt = ['rock', 'paper', 'scissors'];
            [st.a, st.b].forEach(id => { const q = H.players.find(x => x.id === id); if (q && !st.picks[id]) finaleRps(q, throwIt[Math.floor(Math.random() * 3)]); }); return; }
        if (st.kind === 'vote') { const v = H.players.find(x => x.id !== st.a && x.id !== st.b && !st.votes[x.id]);
            if (v) finaleVote(v, Math.random() < 0.5 ? st.a : st.b); return; }
    }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    $id('tog-music').classList.toggle('off', !musicOn);
    $id('tog-sfx').classList.toggle('off', !sfxOn);
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    if (!fAvatar) fAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
    // A refresh mid-game shouldn't cost you your seat: if this tab was already in a
    // room, walk straight back in (the host restores the slot by device id/name).
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
