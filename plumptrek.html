<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plump Trek — roll, chaos, trophy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a0f24' width='100' height='100' rx='20'/><text x='50' y='70' font-size='54' text-anchor='middle'>🐇</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="common.js?v=20260726-939098d"></script><script src="fx.js?v=20260726-939098d"></script><script src="audio.js?v=20260726-939098d"></script><script src="dice.js?v=20260726-939098d"></script>
    <script src="p2p.js?v=20260726-939098d"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0f24; --panel: rgba(50,28,68,0.75); --panel2: rgba(66,38,92,0.85);
            --border: rgba(255,210,63,0.28); --border2: rgba(180,130,220,0.30);
            --text: #f5ecff; --muted: #b199cf;
            --gold: #ffd23f; --pink: #ff5d9e; --good: #4ade80; --bad: #f87171;
            --paper: #fbf3e6; --ink: #2a1a3a; --ink-soft: #6a5680;
        }
        body.day {
            --bg: #f4ecf7; --panel: rgba(255,255,255,0.93); --panel2: #ffffff;
            --border: rgba(70,40,90,0.16); --border2: rgba(70,40,90,0.16);
            --text: #241033; --muted: #6b5580;
            --gold: #c78a08; --pink: #e8467d; --good: #2f9e5b; --bad: #d64545;
            --paper: #fffcf6; --ink: #2a1436; --ink-soft: #6b5580;
        }
        body.day::before { opacity: .5; }
        body.day input[type=text] { background: rgba(70,40,90,.05); }
        body.day .av,
        body.day .pav { background: rgba(70,40,90,.05); }
        body.day .btn-g { background: rgba(70,40,90,.06); }
        body.day .timebar-wrap,
        body.day .tv-timebar-wrap { background: rgba(70,40,90,.12); }
        body.day #sound-togs button { background: rgba(255,255,255,.85); }
        body.day .card { box-shadow: 0 10px 26px rgba(70,40,90,.14); }
        body.day .err { color: #b91c1c; }
        body.day .win-banner { color: #15803d; }
        body.day .chip.gd { color: #15803d; }
        body.day .rail-row .rdelta { color: #15803d; text-shadow: none; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
            padding: 26px 16px 48px; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255,93,158,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 8% 100%, rgba(255,210,63,0.11) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 92% 100%, rgba(150,90,230,0.13) 0%, transparent 65%);
        }
        body.viewer-mode { padding: 0; overflow: hidden; display: block; height: 100dvh; width: 100vw; }

        /* drifting comedy-club ambience — masks, cards & laughter behind everything */
        #laf-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        #laf-bg span {
            position: absolute; bottom: -12vh; left: var(--x); font-size: var(--s, 2rem); opacity: 0;
            filter: drop-shadow(0 3px 9px rgba(0,0,0,.35));
            animation: lafFloat var(--d, 27s) linear var(--dl, 0s) infinite;
        }
        @keyframes lafFloat {
            0%   { transform: translateY(0) rotate(-12deg); opacity: 0; }
            12%  { opacity: .075; }
            88%  { opacity: .075; }
            100% { transform: translateY(-124vh) rotate(14deg); opacity: 0; }
        }

        h1.logo {
            font-family: 'Fraunces', serif; font-weight: 900; letter-spacing: 1px;
            font-size: clamp(1.7rem, 7vw, 2.6rem); text-align: center; color: var(--gold);
            text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 34px rgba(255,210,63,.35);
        }
        h1.logo .hh { color: var(--pink); }
        .sub { color: var(--muted); font-size: .7rem; letter-spacing: 2.5px; text-transform: uppercase; margin: 7px 0 22px; text-align: center; }

        #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 13px; }
        body.viewer-mode #app { max-width: none; height: 100dvh; display: block; }

        .card {
            background: var(--panel); border: 1px solid var(--border2); border-radius: 17px;
            padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,.5);
        }
        .card.highlight { border-color: var(--gold); box-shadow: 0 0 26px rgba(255,210,63,.16), 0 12px 34px rgba(0,0,0,.5); }
        .slbl { font-size: .66rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }

        .fg { margin-bottom: 12px; }
        .fg label { display: block; font-size: .66rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
        input[type=text] {
            width: 100%; padding: 12px 14px; font-family: inherit; font-size: 1rem; font-weight: 700;
            border: 2px solid var(--border2); border-radius: 12px; background: rgba(26,15,36,.7); color: var(--text);
            outline: none;
        }
        input[type=text]:focus { border-color: var(--pink); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; font-weight: 900; font-size: .93rem; letter-spacing: .5px;
            padding: 13px 18px; border: none; border-radius: 13px; cursor: pointer;
            transition: filter .12s, opacity .12s; user-select: none; -webkit-user-select: none;
            color: var(--text);
        }
        .btn:active { filter: brightness(1.15); }
        .btn-p { background: linear-gradient(180deg, #ffe07a, #f5b623); color: #3a2600; box-shadow: 0 5px 0 #96661a, 0 10px 22px rgba(255,210,63,.3); }
        .btn-k { background: linear-gradient(180deg, #ff7bb2, #ef3e82); color: #fff; box-shadow: 0 5px 0 #8f1f53, 0 10px 22px rgba(255,93,158,.35); }
        .btn-g { background: rgba(180,130,220,.14); box-shadow: inset 0 0 0 2px var(--border2); }
        .btn-full { width: 100%; }
        .btn-sm { padding: 8px 13px; font-size: .76rem; border-radius: 11px; }
        .btn:disabled { opacity: .4; cursor: default; }

        .err {
            background: rgba(248,113,113,.13); border: 1px solid rgba(248,113,113,.5); color: #fda4af;
            padding: 11px 14px; border-radius: 12px; font-size: .8rem; font-weight: 700; text-align: center;
        }
        hr { border: none; border-top: 1px dashed var(--border2); margin: 13px 0; }

        .connecting { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 46px 0; color: var(--muted); font-weight: 700; }
        .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(255,210,63,.15); border-top-color: var(--gold); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avrow { display: flex; flex-wrap: wrap; gap: 7px; }
        .av {
            width: 42px; height: 42px; border-radius: 12px; font-size: 1.35rem; display: flex; align-items: center; justify-content: center;
            background: rgba(26,15,36,.7); border: 2px solid var(--border2); cursor: pointer;
            position: relative;
        }
        .av.sel { border-color: var(--pink); background: rgba(255,93,158,.18); box-shadow: 0 4px 12px rgba(255,93,158,.35); }
        /* the piece picker: twelve trekkers, tap one. Bigger than an emoji cell was, because
           telling a lilac monster from an orchid one at 20px is not a fair ask. */
        .trekpick { font-size: 2.1rem; padding: 2px; line-height: 1; }
        /* already somebody else's — greyed, crossed and not tappable */
        .trekpick.gone { opacity: .28; cursor: default; }
        .trekpick.gone .trk { filter: grayscale(1) brightness(.7); }
        .trekpick.gone::after { content: '✕'; position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; font-size: .5em; font-weight: 900;
            color: #fff; text-shadow: 0 1px 3px #000; }
        .pickhint { color: var(--muted); font-size: .64rem; margin-top: 6px; line-height: 1.4; }
        .trekpick .trk { animation: none; }        /* they stand still until you're in the room */
        .trekpick .tb { transform: none; }
        .trekpick.sel .trk { animation: iSwayF 2.4s step-end infinite, iSwayM 2.4s ease-in-out infinite; }

        .player-row { display: flex; align-items: center; gap: 11px; padding: 8px 4px; border-bottom: 1px dashed var(--border2); font-weight: 800; font-size: .92rem; }
        .player-row:last-child { border-bottom: none; }
        .pav { width: 38px; height: 38px; border-radius: 11px; background: rgba(26,15,36,.7); border: 2px solid var(--border2); font-size: 1.6rem; display: flex; align-items: center; justify-content: center; }
        .pav .minitrk { margin: 0; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); margin-left: auto; }
        .qr-wrap { width: min(210px, 58vw); margin: 6px auto 10px; border-radius: 13px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
        .qr-wrap svg { display: block; width: 100%; height: auto; }
        .room-code { font-family: 'Fraunces', serif; font-weight: 900; font-size: 2.3rem; letter-spacing: 12px; text-align: center; color: var(--gold); padding-left: 12px; }
        .share-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
        .seg-row { display: flex; flex-wrap: wrap; gap: 7px; }

        /* prompt + countdown */
        .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .timebar-wrap { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
        .timebar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .2s linear; }
        .q-prompt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.28rem; line-height: 1.45; }
        .q-prompt .blank { color: var(--pink); border-bottom: 3px dotted var(--pink); }
        .q-prompt .hl { color: var(--pink); }

        /* judge / role notes */
        .lie-note { text-align: center; font-weight: 900; color: var(--gold); padding: 6px 0; }
        .win-banner {
            background: rgba(74,222,128,.13); border: 1px solid rgba(74,222,128,.5); color: #86efac;
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }
        .judge-note {
            background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold);
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }

        /* card wall (phone) — hand + judge wall */
        .wall { display: flex; flex-direction: column; gap: 9px; }
        .wall-card {
            border: none; border-radius: 13px; padding: 13px 14px; text-align: left; cursor: pointer;
            background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: .92rem; line-height: 1.35;
            box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.35);
            display: flex; gap: 10px; align-items: center;
            transition: opacity .2s, outline .1s, transform .1s;
        }
        .wall-card .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .72rem; color: var(--ink-soft); letter-spacing: 1px; }
        .wall-card.mine { opacity: .55; cursor: default; }
        .wall-card.mine::after { content: 'your card 😂'; margin-left: auto; font-family: 'Nunito', sans-serif; font-size: .66rem; font-weight: 900; color: var(--pink); white-space: nowrap; }
        .wall-card.pick-sel { outline: 4px solid var(--pink); outline-offset: 2px; transform: translateX(4px); }
        .wall-card.picked { outline: 4px solid var(--pink); outline-offset: 2px; }
        .wall-card.won { outline: 4px solid var(--good); outline-offset: 2px; }
        .wall-card.faded { opacity: .4; }
        .wall-card .ord { margin-left: auto; background: var(--pink); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .78rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

        /* reveal (phone) */
        .verdict { text-align: center; padding: 8px 0 4px; }
        .verdict .vico { font-size: 3rem; }
        .verdict .vt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; margin-top: 4px; }
        .verdict .vpts { font-size: 2rem; font-weight: 900; color: var(--gold); margin-top: 2px; }
        .verdict .vcard { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.02rem; color: var(--text); background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 12px; background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold); font-weight: 900; font-size: .76rem; margin: 3px; }
        .chip.pk { background: rgba(255,93,158,.13); border-color: rgba(255,93,158,.45); color: var(--pink); }
        .chip.gd { background: rgba(74,222,128,.13); border-color: rgba(74,222,128,.45); color: #86efac; }
        .standings .sc { margin-left: auto; font-weight: 900; }
        .standings .delta { color: var(--good); font-size: .75rem; font-weight: 900; margin-left: 7px; }

        /* ═════════ TV ═════════ */
        .tv { height: 100dvh; display: flex; flex-direction: column; padding: 2.8vmin 3.4vmin; gap: 2vmin; }
        .tv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; }
        .tv-logo { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.3vmin; color: var(--gold); text-shadow: 0 0 24px rgba(255,210,63,.4); }
        .tv-meta { font-size: 1.8vmin; font-weight: 900; letter-spacing: .35vmin; text-transform: uppercase; color: var(--muted); }
        .tv-main { flex: 1; display: flex; gap: 2.4vmin; min-height: 0; }
        .tv-stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 1.6vmin; }
        .tv-rail { width: 29vmin; min-width: 230px; display: flex; flex-direction: column; gap: 1.3vmin; overflow: hidden; }
        .rail-title { font-size: 1.6vmin; font-weight: 900; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); }
        .rail-row {
            display: flex; align-items: center; gap: 1.1vmin; background: var(--panel);
            border: 1px solid var(--border2); border-radius: 1.5vmin; padding: 1.1vmin 1.4vmin;
            font-weight: 800; font-size: 1.95vmin; position: relative;
        }
        .rail-row.judge { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,63,.2); }
        .rail-row .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rail-row .rsc { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
        .rail-row .rdelta { position: absolute; right: 1vmin; top: -1.2vmin; font-size: 1.6vmin; font-weight: 900; color: #86efac; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
        .rail-row.done::after { content: '✓'; color: var(--good); font-weight: 900; font-size: 1.9vmin; }
        .rail-row.judge::after { content: '👑'; font-size: 1.9vmin; }

        .tv-qcard {
            background: var(--panel); border: 1px solid var(--border); border-radius: 2.2vmin;
            padding: 3.2vmin 4vmin; box-shadow: 0 16px 50px rgba(0,0,0,.5);
        }
        .tv-qcard .kicker { font-size: 1.6vmin; font-weight: 900; letter-spacing: .4vmin; text-transform: uppercase; color: var(--pink); margin-bottom: 1.2vmin; }
        .tv-qcard .q { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.6vmin; line-height: 1.4; }
        .tv-qcard .q .blank { color: var(--pink); border-bottom: .5vmin dotted var(--pink); }
        .tv-qcard .q .hl { color: var(--pink); }
        .tv-counter { text-align: center; font-size: 2.2vmin; font-weight: 900; color: var(--gold); }
        .tv-timebar-wrap { flex: 0 0 auto; height: 1.5vmin; border-radius: .8vmin; background: rgba(255,255,255,.08); overflow: hidden; }
        .tv-timebar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--pink)); border-radius: .8vmin; transition: width .2s linear; }

        .tv-wall { flex: 1; display: grid; gap: 1.5vmin; grid-template-columns: repeat(auto-fit, minmax(26vmin, 1fr)); align-content: center; overflow: auto; }
        .tv-lie {
            background: var(--paper); color: var(--ink); border-radius: 1.5vmin; padding: 1.8vmin 2vmin;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 2vmin; line-height: 1.35;
            box-shadow: 0 8px 22px rgba(0,0,0,.4); position: relative; min-height: 8vmin;
            display: flex; flex-direction: column; justify-content: center;
        }
        .tv-lie .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.3vmin; letter-spacing: .3vmin; color: var(--ink-soft); display: block; margin-bottom: .6vmin; }
        .tv-lie.deal { animation: flipIn .5s ease both; }
        @keyframes flipIn { from { opacity: 0; transform: rotateX(80deg); } to { opacity: 1; transform: none; } }
        .tv-lie.is-win { outline: .55vmin solid var(--good); outline-offset: .3vmin; box-shadow: 0 0 34px rgba(74,222,128,.4); }
        .tv-lie.dim { opacity: .5; }
        .tv-lie .authors { position: absolute; top: -1.6vmin; right: 1vmin; font-size: 2.4vmin; }
        .tv-lie .tag { font-family: 'Nunito', sans-serif; font-size: 1.2vmin; font-weight: 900; letter-spacing: .2vmin; text-transform: uppercase; color: var(--ink-soft); margin-top: 1vmin; }
        .tv-lie .tag.win { color: #15803d; }

        /* TV lobby handled by common.js tvLobby() */
        .tv-waiting { color: var(--muted); font-weight: 800; font-size: 1.9vmin; }

        /* podium */
        .podium-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2.4vmin; padding-bottom: 1.5vmin; }
        .pod { text-align: center; font-weight: 900; animation: podRise .6s cubic-bezier(.2,.8,.3,1) both; }
        .pod .pav-big { font-size: 4.8vmin; }
        .pod .pname { font-size: 2.3vmin; margin-bottom: .8vmin; }
        .pod .pscore { font-size: 1.9vmin; color: var(--gold); margin-bottom: .8vmin; }
        .pod .block { border-radius: 1.5vmin 1.5vmin 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 1.3vmin; font-size: 3.2vmin; width: 17vmin; }
        .pod.p1 .block { height: 21vmin; position: relative; overflow: hidden; }
        .pod.p1 .block::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 36%, rgba(255,255,255,.55) 50%, transparent 64%);
            transform: translateX(-120%); animation: podShine 2.4s 1s ease-in-out infinite;
        }
        @keyframes podShine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
        .pod.p2 .block { height: 14vmin; }
        .pod.p3 .block { height: 9.5vmin; }
        .pod.mrank-0 .block { background: linear-gradient(180deg, #ffe07a, #96661a); }
        .pod.mrank-1 .block { background: linear-gradient(180deg, #d7d7e0, #8f8fa3); }
        .pod.mrank-2 .block { background: linear-gradient(180deg, #e8a06a, #9c5a33); }
        .awards-row { display: flex; gap: 1.5vmin; justify-content: center; flex-wrap: wrap; padding-bottom: 1.5vmin; }
        .award { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5vmin; padding: 1.3vmin 2vmin; font-weight: 800; font-size: 1.8vmin; text-align: center; }
        .award .aw-t { color: var(--gold); font-weight: 900; }

        #confetti-cv { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

        /* sound toggles */
        #sound-togs { position: fixed; top: 10px; right: 10px; z-index: 80; display: flex; gap: 6px; }
        #sound-togs button {
            width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem;
            background: rgba(50,28,68,.82); box-shadow: inset 0 0 0 1px var(--border2);
            transition: opacity .2s, transform .12s;
        }
        #sound-togs button:active { transform: scale(.88); }
        #sound-togs button.off { opacity: .35; filter: grayscale(1); }
        body.viewer-mode #sound-togs { top: auto; bottom: 12px; right: 12px; }

        /* FX layer — particles + score pops */
        .pt {
            position: fixed; width: 9px; height: 9px; border-radius: 2px;
            z-index: 950; pointer-events: none;
            animation: ptFly .75s cubic-bezier(.15,.65,.4,1) forwards;
        }
        @keyframes ptFly {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(560deg) scale(.3); opacity: 0; }
        }
        .pop {
            position: fixed; z-index: 960; pointer-events: none;
            font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem;
            animation: popUp 1.1s cubic-bezier(.2,.8,.3,1) forwards;
            text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: nowrap;
        }
        .pop.good { color: var(--good); }
        .pop.gold { color: var(--gold); }
        .pop.bad  { color: var(--bad); font-size: 1rem; }
        @keyframes popUp {
            0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
            15%  { transform: translate(-50%, -12px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -78px) scale(1); opacity: 0; }
        }

        /* screen entrances — only on phase changes (#app.fresh) */
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        #app.fresh .card { animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes wallIn { from { opacity: 0; transform: scale(.9) translateY(10px); } to { opacity: 1; transform: none; } }
        #app.fresh .wall-card { animation: wallIn .32s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
        #app.fresh .tv-lie.deal { animation-delay: calc(var(--i, 0) * 70ms); }
        @keyframes vicoPop { 0% { transform: scale(0) rotate(-14deg); } 60% { transform: scale(1.25) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
        #app.fresh .vico { animation: vicoPop .5s cubic-bezier(.2,.8,.3,1) both; display: inline-block; }
        @keyframes vptsPop { 0% { opacity: 0; transform: scale(.4); } 60% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
        #app.fresh .vpts { animation: vptsPop .45s .18s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes notePop { 0% { opacity: 0; transform: scale(.7); } 60% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
        .lie-note, .judge-note { animation: notePop .32s cubic-bezier(.2,.8,.3,1); }
        .win-banner { animation: notePop .45s cubic-bezier(.2,.8,.3,1); }

        /* timer urgency */
        .timebar.low, .tv-timebar.low { background: linear-gradient(90deg, #ff8a5c, #f43f5e); }
        @keyframes pulseNum { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--bad); } }
        #q-timenum.low { animation: pulseNum .9s ease-in-out infinite; display: inline-block; }

        /* podium rise + delayed awards */
        @keyframes podRise { from { transform: translateY(35%); opacity: 0; } to { transform: none; opacity: 1; } }
        .award { animation: cardIn .5s 1.1s both; }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

        /* ══ PLUMP TREK — the board ══════════════════════════════════════════
           The path is a plain wrap-around grid of squares: reading order IS the
           route, which keeps the pawn maths honest and the TV legible from the
           sofa. Squares are patched by #sq-<i>, never re-rendered mid-move. */
        .board { display: grid; grid-template-columns: repeat(var(--cols, 9), var(--sqs, 6.2vmin)); gap: .5vmin; justify-content: center; }
        .board.big { gap: .7vmin; }
        .board.big .sq { width: var(--sqs, 7.6vmin); height: var(--sqs, 7.6vmin); font-size: 1.15vmin; border-radius: 1.4vmin; }
        .board.big .pawn { font-size: min(3vmin, calc(var(--sqs, 7.6vmin) * .42)); }
        .board.sc { grid-template-columns: repeat(3, var(--sqs, 6.2vmin)); width: max-content; margin-left: auto; margin-right: auto; }
        .board.sc { margin-top: 1.2vmin; opacity: .92; }
        .board.sc::before { content: 'short cut'; width: 100%; text-align: center; font-size: 1.1vmin;
            letter-spacing: .2vmin; text-transform: uppercase; color: var(--muted); font-weight: 900; }
        .sq { position: relative; width: var(--sqs, 6.2vmin); height: var(--sqs, 6.2vmin); border-radius: 1.1vmin; display: flex;
            align-items: center; justify-content: center; text-align: center; font-weight: 900;
            font-size: .95vmin; line-height: 1.1; padding: .3vmin; overflow: visible;
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); color: var(--muted); }
        .sq-start   { background: rgba(74,222,128,.22); border-color: rgba(74,222,128,.6); color: #dcfce7; }
        .sq-gimmick { background: rgba(255,146,60,.22); border-color: rgba(255,146,60,.55); color: #ffd8b0; }
        .sq-gimmick2{ background: rgba(255,93,158,.26); border-color: rgba(255,93,158,.6); color: #ffd5e6; }
        .sq-boost   { background: rgba(56,189,248,.20); border-color: rgba(56,189,248,.55); color: #cbeeff; }
        .sq-trap    { background: rgba(239,68,68,.20); border-color: rgba(239,68,68,.55); color: #ffd3d3; }
        .sq-gate    { background: rgba(255,210,63,.20); border-color: rgba(255,210,63,.7); color: #fff0bf; }
        .sq-fork    { background: rgba(167,139,250,.24); border-color: rgba(167,139,250,.7); color: #e6dcff; }
        .sq-finale  { background: linear-gradient(150deg, #4c1d95, #a21caf); border-color: #e879f9; color: #fff; }
        .sq-win     { background: linear-gradient(150deg, #f59e0b, #fde047); border-color: #fff; color: #2b1a00; }
        .sq.occupied { box-shadow: 0 0 1.6vmin rgba(255,255,255,.35); }
        /* ── Player tokens ──────────────────────────────────────────────────────
           Positioned from the square's centre with left/top so `transform` stays free:
           the token itself carries the fan-out, and the inner .tk carries the move
           animation (FLIP). --fan is a real animatable custom property, which is what
           lets one keyframe on the pile open every token in it. */
        @property --fan { syntax: '<number>'; inherits: true; initial-value: 0; }
        .sqp { position: absolute; inset: 0; pointer-events: none; }
        .sqp.stack { animation: pileSway 4.6s ease-in-out infinite; transform-origin: 50% 90%; }
        .tok { position: absolute; left: calc(50% + var(--tx, 0%)); top: calc(50% + var(--ty, 0%));
            width: 1em; height: 1em; margin-left: -.5em; margin-top: -.5em;
            font-size: calc(var(--ts, 1) * 3.2vmin); line-height: 1;
            z-index: calc(4 + var(--k, 0));
            transform: translateX(calc(var(--fan) * var(--fx, 0em))) rotate(var(--rot, 0deg)); }
        /* A riffle: the peek travels UP the pile, one animal at a time leaning out to be
           seen and tucking back. A wide fan would cover the neighbouring squares; this
           stays over its own. Twelve players → the wave takes a couple of seconds to
           climb, and everybody gets their moment. */
        .sqp.stack .tok { animation: tokPeek calc(2.4s + var(--n, 1) * .28s) ease-in-out infinite calc(var(--k, 0) * .13s); }
        .board.big .tok { font-size: calc(var(--ts, 1) * 4.4vmin); }
        .tk { display: block; }
        /* Which way the trekker faces — set by the mover, so they walk forwards — and the
           MOOD posture on top of it: a fed-up trekker leans forward and sags, a delighted
           one stands up. The mood vars live here so `.trk` inherits the ones it needs. */
        .tb { position: relative; display: block; text-align: center;
            transform: scaleX(var(--dir, 1)) rotate(var(--tilt, 0deg)) translateY(var(--slump, 0%));
            transition: transform .5s cubic-bezier(.3,.8,.3,1); }
        /* a coloured disc behind the trekker, so a dozen of them stay tellable apart */
        .tok::before { content: ''; position: absolute; inset: 2%; border-radius: 50%; z-index: -1;
            background: radial-gradient(circle at 50% 34%, var(--pc, #fff), rgba(0,0,0,0) 70%); opacity: .5; }
        .tok.up { z-index: 40; }
        .tok.up { animation-duration: 1.1s; }
        .tok.up .trk { filter: hue-rotate(var(--hue, 0deg)) saturate(var(--sat, 1)) brightness(var(--bri, 1))
            drop-shadow(0 0 .22em var(--pc, #fff)) drop-shadow(0 .06em .05em rgba(0,0,0,.55)); }
        /* Eager on your own turn — and the class sits on the TREKKER, not on the board
           token, so the copy in the rail speeds up by exactly the same amount. Anything
           that changes how a piece moves has to be expressed here, or the two copies of
           the same player drift apart, which is worse than no animation at all. */
        .trk.now { animation-duration: calc(var(--idle, 3s) * var(--mf, 1) * .45); }
        /* A still trekker for lists and buttons — same sheet, the standing-to-camera frame. */
        .minitrk { display: inline-block; vertical-align: -.22em; width: .824em; height: 1em;
            background-image: url(sprites/trekkers.png?v=9x5); background-repeat: no-repeat;
            background-size: 900% 500%;
            background-position-x: calc(var(--f, 6) * 100% / 8);
            background-position-y: calc(var(--row, 0) * 25%);
            filter: hue-rotate(var(--hue, 0deg)) drop-shadow(0 .04em .03em rgba(0,0,0,.5));
            margin-right: .35em; }
        /* in a pile they lean into each other — layered ON TOP of each trekker's own
           idle by putting the lean on .tk, so the idle keeps its personality */
        .sqp.stack .tk { animation: tokLean 2.4s ease-in-out infinite var(--lean, 0s); }
        @keyframes tokLean { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        /* ── the trekker ───────────────────────────────────────────────────────
           A SPRITE, from Kenney's CC0 New Platformer Pack (see sprites/CREDITS.md).
           `sprites/trekkers.png` is 9 poses across × 5 characters down, so a token is
           one 84×102 window onto that sheet: --row picks the character, --f the pose.

              --f:  0 idle · 1 walk_a · 2 walk_b · 3 jump · 4 hit
                    5 duck · 6 front · 7 climb_a · 8 climb_b

           All nine the pack ships, because a frame left in the zip is an expression the
           game can't make: `hit` is a real frown, `front` looks you in the eye, and the two
           `climb` frames — back turned, arms up — are a trekker straining to get past
           something, which is exactly what a gate is.

           Every animation is therefore PREDETERMINED — a keyframe track that steps
           background-position-x between whole frames, never a tween. `step-end` timing
           makes each keyframe HOLD its frame until the next one, which is what turns a
           list of percentages into a flipbook.

           Sized in `em` off the token's font-size, so one set of rules covers a lone
           60px token and a twelfth of a pile. */
        /* The ?v= token is the sheet's GRID, and it is not decoration: a browser holding the
           old PNG against new CSS shows each window across two frames — sliced trekkers,
           no error, no clue what's wrong. If you ever rebuild a sheet with a different
           number of rows or columns, BUMP THE TOKEN. */
        .trk { position: relative; display: block; width: .824em; height: 1em; margin: 0 auto;
            background-image: url(sprites/trekkers.png?v=9x5); background-repeat: no-repeat;
            background-size: 900% 500%;                     /* 9 poses × 5 characters */
            background-position-x: calc(var(--f, 0) * 100% / 8);
            background-position-y: calc(var(--row, 0) * 25%);
            /* the art is a white helmet, dark eyes and ONE saturated body colour, so a
               hue rotation recolours the body and leaves the face alone — which is how
               five characters cover twelve seats */
            /* mood also drains or lifts the colour, which is what makes a rail of twelve
               readable from the sofa: the miserable ones are visibly duller */
            filter: hue-rotate(var(--hue, 0deg)) saturate(var(--sat, 1)) brightness(var(--bri, 1))
                drop-shadow(0 .06em .05em rgba(0,0,0,.55));
            transition: filter .6s ease;
            animation-timing-function: step-end; }

        /* ── idles: six of them, dealt from your name, each on its own clock ────
           A frame index (--f) is not animatable, so these step the sheet directly. The
           percentages are frame × 100%/8: 12.5% is walk_a, 37.5% jump, 62.5% duck, 75% front.

           Where an idle also moves the piece, it runs TWO animations on the same element:
           the frames step (step-end), the transform tweens (ease). One animation can't do
           both — a shared timing function would either slide the sheet through half-frames
           or make the motion snap. */
        .i-shuffle { animation: iShuffle calc(var(--idle, 1.2s) * var(--mf, 1)) steps(3) infinite var(--dl, 0s); }
        @keyframes iShuffle { from { background-position-x: 0; } to { background-position-x: 37.5%; } }
        .i-peek { animation: iPeek calc(var(--idle, 6s) * var(--mf, 1)) step-end infinite var(--dl, 0s); }
        @keyframes iPeek { 0%, 71%, 92% { background-position-x: 0; } 74%, 89% { background-position-x: 75%; } }
        .i-hop { animation: iHopF calc(var(--idle, 3.4s) * var(--mf, 1)) step-end infinite var(--dl, 0s),
                            iHopM calc(var(--idle, 3.4s) * var(--mf, 1)) cubic-bezier(.3,.9,.4,1) infinite var(--dl, 0s); }
        @keyframes iHopF { 0%, 84% { background-position-x: 0; } 66% { background-position-x: 37.5%; } }
        @keyframes iHopM { 0%, 62%, 100% { transform: translateY(0); } 72% { transform: translateY(-22%); } }
        .i-crouch { animation: iCrouch calc(var(--idle, 5.2s) * var(--mf, 1)) step-end infinite var(--dl, 0s); }
        @keyframes iCrouch { 0%, 78%, 94% { background-position-x: 0; } 82%, 91% { background-position-x: 62.5%; } }
        .i-sway { animation: iSwayF calc(var(--idle, 2.8s) * var(--mf, 1)) step-end infinite var(--dl, 0s),
                             iSwayM calc(var(--idle, 2.8s) * var(--mf, 1)) ease-in-out infinite var(--dl, 0s); }
        @keyframes iSwayF { 0%, 74% { background-position-x: 0; } 50% { background-position-x: calc(100% / 8); } }
        @keyframes iSwayM { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
        .i-pace { animation: iPace calc(var(--idle, 4.4s) * var(--mf, 1)) step-end infinite var(--dl, 0s); }
        @keyframes iPace {           /* a few steps on the spot, then stand still a while */
            0%, 12%, 24%, 36% { background-position-x: calc(100% / 8); }
            6%, 18%, 30%      { background-position-x: 25%; }
            42%, 100%         { background-position-x: 0; }
        }
        /* ── walking between squares: the real thing, while the piece travels ───
           Two frames, alternating, for exactly as long as the FLIP move runs. `.tb`'s
           --dir flips them to face the way they're going. */
        .trk.walking { animation: spWalk .28s steps(2) infinite !important; }
        @keyframes spWalk { from { background-position-x: calc(100% / 8); } to { background-position-x: 37.5%; } }
        /* ── straining: the two climb frames, for a trekker stuck at a gate ──────
           A held frame says "stopped"; a two-frame climb loop says "still trying", which
           is what a STOP square actually is — roll big enough or wait. */
        .trk.strain { animation: spClimb .38s step-end infinite !important; }
        @keyframes spClimb { 0% { background-position-x: 87.5%; } 50% { background-position-x: 100%; } }
        /* ── one-shot reactions: a pose held for a beat when something happens ───
           No animation, so the base rule's --f shows through — the JS just sets --f. */
        .trk.rx { animation: none !important; }

        /* ── emote balloons (Kenney Emotes Pack, CC0) ───────────────────────────
           One row of 12 balloons; --e picks which. The tail points down at the head. */
        .emo { position: absolute; left: 62%; top: -.46em; width: .5em; height: .594em;
            background-image: url(sprites/emotes.png?v=12x1); background-repeat: no-repeat;
            background-size: 1200% 100%;
            background-position-x: calc(var(--e, 0) * 100% / 11);
            opacity: 0; transform: scale(.3); transform-origin: 0 100%; z-index: 6;
            filter: drop-shadow(0 .03em .03em rgba(0,0,0,.45)); }
        /* the one you're dealt, on your own long clock */
        .emo.always { animation: emoIdle var(--eDur, 15s) ease-out infinite var(--eDl, 0s); }
        @keyframes emoIdle {
            0%, 87%, 100% { opacity: 0; transform: scale(.3) translateY(.14em); }
            90%, 96%      { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* and one fired by the game — a trap, a boost, a missed turn */
        .emo.pop { animation: emoPop 1.6s cubic-bezier(.2,1.6,.4,1) forwards; }
        @keyframes emoPop {
            0%        { opacity: 0; transform: scale(.3) translateY(.18em); }
            16%, 74%  { opacity: 1; transform: scale(1) translateY(0); }
            100%      { opacity: 0; transform: scale(.85) translateY(-.22em); }
        }
        /* the whole tower lists one way then the other, hinged at its base */
        @keyframes pileSway { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }
        /* …and each trekker leans out of the pile in turn (see .sqp.stack .tok) */
        @keyframes tokPeek { 0%, 72%, 100% { --fan: 0; } 84%, 88% { --fan: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .sqp.stack, .sqp.stack .tok, .sqp.stack .tk, .tb, .trk, .emo { animation: none !important; }
            .tb, .trk { transition: none !important; }
            .emo { opacity: 0; }
        }
        /* the route, made obvious: every square is numbered and points at the next one */
        .sqn { position: absolute; top: .25vmin; left: .45vmin; font-size: .95vmin; font-weight: 900; opacity: .45; }
        /* The route, traced: a chevron sits in the GAP after every square, so the path
           is a continuous chain you can follow with your eye from START to WIN. */
        .sqa { position: absolute; z-index: 3; color: var(--gold); font-weight: 900; line-height: 1;
            font-size: 1.6vmin; text-shadow: 0 0 .6vmin rgba(0,0,0,.7); pointer-events: none; }
        .sqa.r { right: -1.1vmin; top: 50%; transform: translateY(-50%); }
        .sqa.l { left: -1.1vmin; top: 50%; transform: translateY(-50%); }
        .sqa.d { bottom: -1.05vmin; left: 50%; transform: translateX(-50%); }
        .board.big .sqn { font-size: 1.3vmin; }
        .board.big .sqa { font-size: 2.3vmin; }
        .board.big .sqa.r { right: -1.35vmin; }
        .board.big .sqa.l { left: -1.35vmin; }
        .board.big .sqa.d { bottom: -1.3vmin; }
        .pawn { font-size: 2.4vmin; filter: drop-shadow(0 .3vmin .3vmin rgba(0,0,0,.55)); animation: pawnDrop .32s cubic-bezier(.2,.9,.3,1); }
        @keyframes pawnDrop { from { transform: translateY(-1.6vmin) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

        /* the stage: die, drawn card, finale */
        .stage { text-align: center; }
        .stlbl { font-size: 1.5vmin; letter-spacing: .28vmin; text-transform: uppercase; color: var(--muted); font-weight: 900; margin-bottom: 1.2vmin; }
        /* ── The die ── the cube itself is dice.js; this is just its size and skin ── */
        .die { --d3d-box: 16vmin; --d3d-size: 11vmin; --d3d-persp: 60vmin;
            --d3d-bg: linear-gradient(150deg, #fffdf6, #ffd98a); --d3d-ink: #2b1a00; }
        .bigmsg { margin-top: 1.4vmin; font-weight: 900; font-size: 2vmin; color: var(--text); }
        .gcard, .fcard, .bcard { border-radius: 1.6vmin; padding: 14px 16px; text-align: center;
            background: linear-gradient(160deg, #fffaf0, #f3e6cf); color: #2a1c0c; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
        .gcard.big, .fcard.big, .bcard.big { padding: 3vmin 3.4vmin; max-width: 42vmin; margin: 0 auto; }
        .gct, .fct, .bct { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; margin-bottom: 6px; }
        .gcard.big .gct, .fcard.big .fct, .bcard.big .bct { font-size: 4vmin; }
        .gcx, .fcx, .bcx { font-weight: 700; font-size: .95rem; line-height: 1.4; }
        .gcard.big .gcx, .fcard.big .fcx, .bcard.big .bcx { font-size: 2vmin; }
        .gcard.keep { background: linear-gradient(160deg, #e8f9ff, #cbe9ff); }
        .gcard.dare { background: linear-gradient(160deg, #ffe9f3, #ffc9de); }
        .gck { margin-top: 8px; font-size: .66rem; font-weight: 900; letter-spacing: .12em; color: #0b5f86; }
        .fcard, .fcard.big { background: linear-gradient(160deg, #2b1055, #7b2ff7); color: #fff; }
        .bcard, .bcard.big { background: linear-gradient(160deg, #0b3d91, #1e6fd9); color: #fff; }
        .buildpin { margin-top: 1.6vmin; font-size: 1.3vmin; font-weight: 800; color: #cfe4ff; opacity: .9; text-align: center; }
        .frolls, .fcoins, .fvs { margin-top: 1.6vmin; font-weight: 800; font-size: 1.7vmin; color: var(--text); }
        .frolls .frow { display: flex; justify-content: space-between; gap: 2vmin; padding: .3vmin 0; }
        .coin { font-size: 3vmin; margin: 0 .4vmin; }
        .fsc { margin-top: .8vmin; }

        /* phone bits */
        .btn-roll { width: 100%; font-size: 1.5rem; padding: 22px; background: linear-gradient(150deg, #ffd23f, #ff9a3d); color: #2b1a00; border: none; border-radius: 16px; font-weight: 900; }
        .btn-roll:active { transform: scale(.97); }
        .waitbig { font-weight: 900; font-size: 1.15rem; }
        .hand { display: flex; flex-wrap: wrap; gap: 8px; }
        .hcard { flex: 1 1 45%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border2);
            background: var(--panel2); color: var(--text); font-family: inherit; cursor: pointer; }
        .hcard:disabled { opacity: .6; cursor: default; }
        .hct { display: block; font-weight: 900; font-size: .9rem; }
        .hcx { display: block; font-size: .7rem; color: var(--muted); margin-top: 2px; }
        .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .opts.rps { flex-direction: row; }
        .opts .opt { font-size: 1rem; padding: 14px; }
        .opts .opt.num { flex: 1 1 18%; }
        .opts.rps .opt { flex: 1; font-size: 2rem; display: flex; flex-direction: column; gap: 2px; }
        .opts.rps .opt span { font-size: .7rem; font-weight: 800; }
        .rail { display: flex; flex-direction: column; gap: 6px; }
        .rrow { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .85rem; padding: 6px 8px; border-radius: 10px; background: var(--panel2); }
        .rrow.now { border: 1px solid var(--gold); }
        .rrow.away { opacity: .45; }
        .rrow .rnm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rrow .rpos, .rail-row .rpos { color: var(--gold); font-weight: 900; }
        /* a kept-card count. Was "🃏1", where the joker emoji shrank to an unreadable
           card face and the bare number read as a card's VALUE. Words are unambiguous. */
        .awaycard { border-color: rgba(255,210,63,.4); }
        /* `.hint` is used all over the phone screens but was never given a rule — it was
           inheriting whatever the card gave it. Define it once, here. */
        .hint { color: var(--muted); font-size: .74rem; line-height: 1.5; }
        .hint.dim { opacity: .75; font-size: .68rem; margin-top: 6px; }

function qrSVG(url) {

        qr.addData(url); qr.make();
        const n = qr.getModuleCount(), m = 2, size = n + m * 2;
        let rects = '';
        for (let r = 0; r < n; r++)
            for (let c = 0; c < n; c++)

        return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">` +

    if (tr.kick[i]) tone(135, 0.24, { type: 'sine', vol: 0.42, when: rel, slide: 40, dest: musicGain });
    if (tr.hat[i]) {
        const hv = (i % 4 === 0 ? 0.1 : 0.06) * (0.8 + Math.random() * 0.4);
        noiseHit(i % 8 === 4 ? 0.09 : 0.05, { vol: hv, when: rel, hp: 8500, dest: musicGain });
    }
    const bassArr = tr.bassBars ? tr.bassBars[bar % tr.bassBars.length] : tr.bass;
    const b = bassArr[i];
    if (b != null) tone(mf(b + k), stepDur * 1.6, { type: w.bass || 'triangle', vol: 0.3, when: rel, dest: musicGain, lp: 850, attack: 0.006 });
    const pad = tr.pads[bar % tr.pads.length];
    const ch = i < 16 ? pad[0] : pad[16];
    if (tr.stab && tr.stab[i] && ch && full)
        ch.forEach(m => tone(mf(m + 12 + k), stepDur * 1.1, { type: w.stab || 'sine', vol: tr.stabVol || 0.035, when: rel, lp: 2400, dest: musicGain, attack: 0.005 }));
    let l = tr.leads[bar % tr.leads.length][i];
    if (l != null && (musicIntensity >= 1 || musicUrgent)) {
        if (musicUrgent) l += 12;
        tone(mf(l + k), stepDur * 1.5, { type: w.lead || 'triangle', vol: 0.12 * (0.9 + Math.random() * 0.2), when: rel, dest: leadBus, lp: tr.leadLp || 3000, attack: 0.006 });
    }
    if (tr.arp && i % tr.arp === 0 && ch && full)
        tone(mf(ch[(i / tr.arp) % ch.length] + 24 + k), stepDur * tr.arp * 0.9, { type: w.arpW || 'sine', vol: 0.04, when: rel, lp: 5000, dest: musicGain, attack: 0.004 });
    if (musicUrgent && i % 4 === 0) noiseHit(0.035, { vol: 0.1, when: rel + stepDur * 2, hp: 11000, dest: musicGain });
}

function musicScheduler() {
    const tr = TRACKS[musicTrack];
    const stepDur = 60 / tr.bpm / 4;
    while (musicNext < AC.currentTime + 0.18) {
        playMusicStep(musicStep, musicNext, musicBar);
        musicNext += stepDur;
        musicStep++;
        if (musicStep === 32) { musicStep = 0; musicBar++; }
    }
}

function setMusic(track) {
    if (musicTrack === track) return;
    const wasPlaying = !!(AC && musicTimer);
    musicTrack = track;
    musicStep = 0; musicBar = 0;
    musicIntensity = (track === 'game' || track === 'finale') ? 1 : 2;
    if (track === 'lobby' || track === 'over') musicKeyShift = 0;
    if (!TRACKS[track]) { musicTrack = 'lobby'; track = 'lobby'; }
    if (musicDelay) musicDelay.delayTime.value = 60 / TRACKS[track].bpm * 0.5;
    if (track !== 'game' && track !== 'finale') musicUrgent = false;
    if (wasPlaying) {
        const s = 60 / TRACKS[track].bpm / 4;
        for (let f = 0; f < 4; f++) noiseHit(0.06, { vol: 0.1 + f * 0.035, when: f * s, hp: 2800 + f * 900, dest: musicGain });

}

    if (total && done / total >= 0.5) musicIntensity = Math.max(musicIntensity, 2);
}

function toggleMusic() {

// ── The board ──────────────────────────────────────────────────────────────────
// Nodes with explicit links, so the fork's two routes can differ in length and rejoin
// cleanly: board[i] = { t, label, next:[j] } — a fork has two `next` entries and the
// player is asked which way BEFORE they roll.
const BOARD_LENS = { short: 30, normal: 44, epic: 64 };
const SPACE_LABEL = {
    start: 'START', plain: '', gimmick: 'GIMMICK', gimmick2: 'GIMMICK ×2',
    boost: '', trap: '', gate: 'STOP', fork: 'PICK A PATH', finale: 'FINALE', win: 'WIN!',
};
const BOOSTS = [
    { label: 'Leg it!', n: 3 }, { label: 'Bounce pad!', n: 4 }, { label: 'Downhill!', n: 2 },
    { label: 'Big stride!', n: 5 }, { label: 'Found a shortcut!', n: 3 },
];
const TRAPS = [
    { label: 'Tripped over', n: -2 }, { label: 'Wrong turn', n: -3 }, { label: 'Nap time', n: -2, skip: 1 },
    { label: 'Sat down for a bit', n: -4 }, { label: 'Dropped everything', n: -3 },
    { label: 'Chased by a goose', n: -5 },
];

// Deterministic shuffling so ?seed= makes a game reproducible (the e2e leans on this).
let _rngState = 0;
function seedRng(n) { _rngState = (n >>> 0) || 1; }
function rnd() {                                   // xorshift32, plenty for a board game
    if (!_rngState) return Math.random();
    let x = _rngState;
    x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0;
    _rngState = x;
    return x / 4294967296;
}
function rndInt(n) { return Math.floor(rnd() * n); }
function rshuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rndInt(i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; }

function makeBoard(length) {
    const n = BOARD_LENS[length] || BOARD_LENS.short;
    const b = [];
    const push = (t, extra) => { b.push({ t, label: SPACE_LABEL[t] || '', ...(extra || {}) }); return b.length - 1; };
    push('start');
    // main run: mostly Gimmicks, sprinkled with boosts, traps, a couple of gates
    const gateAt = [Math.floor(n * 0.35), Math.floor(n * 0.75)];
    const forkAt = Math.floor(n * 0.55);
    for (let i = 1; i < n - 2; i++) {
        if (gateAt.includes(i)) { push('gate', { need: 4 }); continue; }
        if (i === forkAt) { push('fork'); continue; }
        const r = rnd();
        if (r < 0.40) push('gimmick');
        else if (r < 0.50) push('gimmick2');
        else if (r < 0.63) { const x = BOOSTS[rndInt(BOOSTS.length)]; push('boost', { label: x.label, n: x.n }); }
        else if (r < 0.78) { const x = TRAPS[rndInt(TRAPS.length)]; push('trap', { label: x.label, n: x.n, skip: x.skip || 0 }); }
        else push('plain');
    }
    const finaleIx = push('finale');
    const winIx = push('win');
    b.forEach((s, i) => { s.next = [Math.min(i + 1, winIx)]; });
    b[winIx].next = [winIx];

    // The fork: a short cut that skips 5 spaces but is all gates and double Gimmicks.
    const f = b[forkAt];
    const scStart = b.length;
    push('gate', { need: 5, sc: 1 });
    push('gimmick2', { sc: 1 });
    push('gimmick2', { sc: 1 });
    const rejoin = Math.min(forkAt + 6, finaleIx);
    for (let i = scStart; i < b.length; i++) b[i].next = [i + 1 <= b.length - 1 ? i + 1 : rejoin];
    b[b.length - 1].next = [rejoin];
    f.next = [forkAt + 1, scStart];                       // [the long way, the short cut]
    f.routes = ['The long way round', 'The short cut (rough)'];
    return b;
}

// NETWORK
// ═══════════════════════════════════════════
function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }
function broadcastViewers(msg) { Object.values(viewerConns).forEach(c => send(c, msg)); }
function broadcastPlayers(fn) {
    H.players.forEach(p => {
        if (p.id === myId) return;
        const c = guestConns[p.id];
        if (c) send(c, typeof fn === 'function' ? fn(p) : fn);
    });
}
// Who is actually here. This asks the HEARTBEAT (common.js isPresent), not the connection
// map — `guestConns` still lists a phone whose browser was closed, because conn.on('close')
// does not fire for that (measured: zero close events in 75 seconds).
//
// That mattered far more than it looks. Nearly every game advances a round with
// `connectedPlayers().every(p => p.answered)`, so one closed tab meant the room waited for
// an answer that was never coming — for ever, in the games with no timer. It is also what
// picks the 👑 captain, so a dead phone could hold the crown and freeze the room.
// The shared one (common.js presentPlayers) decides; this just supplies this game's state.
// It used to be a byte-identical copy in all 18 games — see the audit in unit/presence.test.js.
function connectedPlayers() {
    if (typeof presentPlayers === 'function') {
        return presentPlayers(H.players, guestConns, myId, isHost && !isTvHost);
    }
    return H.players.filter(p => (p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]));
}

// ── 👑 captain (TV-host rooms) ──────────────────────────────────────────────
// The captain is the first *CONNECTED* player, not simply H.players[0]: a captain
// whose phone drops mid-game must not stall the room. Their slot survives the drop
// (zombie takeover by name), so when they rejoin they're first again and the crown
// comes straight back.
function capPlayer() { return isTvHost ? (connectedPlayers()[0] || H.players[0] || null) : null; }
function capName() { return isTvHost ? (capPlayer()?.name || null) : null; }
// The crown moved — re-sync the phones losing/gaining it, plus the TV. Deliberately
// not a full broadcast: everyone else may be mid-interaction on their own screen.
function capSync(prevId) {
    if (!isTvHost || H.phase === 'lobby') return;      // lobby re-broadcasts anyway
    const nowId = capPlayer()?.id || null;
    if (nowId === prevId) return;
    [prevId, nowId].forEach(id => {
        const p = id && H.players.find(x => x.id === id);
        const c = p && guestConns[p.id];
        if (c) send(c, phaseSnapshotFor(p));
    });
    broadcastViewers(viewerSnapshot());
    tvHostSync();
}
// You pick your trekker; the host is the one who says you get it. Two people tapping the
// gold duck at the same moment is the normal case, not the edge case — whoever's join
// lands first keeps it and the second gets the first free piece instead. Their phone then
// shows what they actually got, so nobody is left thinking they're the duck.
function hostAddPlayer(id, name, seat) {
    if (H.players.find(p => p.id === id) || H.players.length >= MAX_PLAYERS) return;
    const taken = new Set(H.players.map(p => p.seat));
    const want = Number(seat);
    const free = TREK_CAST.map((_, i) => i).filter(i => !taken.has(i));
    // If you can't have what you asked for, the replacement is random — but random from the
    // twelve that are furthest apart, so the fifth person to join doesn't end up as a pale
    // lilac human standing next to a pale lilac monster. Random-looking, not actually
    // indifferent. (If all twelve are gone, anything free will do.)
    const pool = free.filter(i => i < AUTO_SEATS);
    const spare = pool.length ? pool : free;
    const got = Number.isInteger(want) && want >= 0 && want < TREK_CAST.length && !taken.has(want)
        ? want
        : spare[Math.floor(Math.random() * spare.length)];
    // Seat, not name: keying a colour off the name (or its length) collides the moment a
    // family turns up as Mum/Dad/Ben, and then everyone is the same shade on the board.
    H.players.push({ id, name, seat: got, col: PAWN_COLS[got], pos: 0, hand: [], skip: 0,
                     mods: [], route: 0, done: false, gates: {} });
}

// A player IS their peer id, and a refresh mints a new one. Re-pointing their row in
// H.players is not enough: the id is ALSO the key in a dozen other places, and every one of
// them would carry on referring to a peer that no longer exists.
//
// The way this shows up in a real game is nasty and silent. Neil refreshed on his own turn,
// rejoined, and his phone no longer offered him the Roll button — because `me.myTurn` is
// `H.turn === p.id` and H.turn still held the dead id. The host was waiting for a roll from
// nobody, the other player was waiting for Neil, and the room could not move. Not an error
// anywhere.
//
// So: when a returning device takes over a seat, rewrite EVERY reference at once. If you add
// a new place that stores a player id, add it here too — a test walks this function's source
// and fails if it finds an id-keyed field it doesn't mention.
function hostRekeyPlayer(player, newId) {
    const old = player.id;
    if (!old || old === newId) return;
    player.id = newId;
    // the shared shapes — H.turn is the one that stuck the room
    if (typeof rekeyPlayerId === 'function') {
        rekeyPlayerId(H, old, newId, {
            scalars: ['turn'],
            arrays: ['turnOrder', 'order', 'finishOrder'],
            whoObjs: ['card', 'choice', 'finale'],
            idObjs: ['moved'],
        });
    }

    const st = H.finaleState;
    if (st) {
        ['a', 'b', 'who', 'last'].forEach(k => { if (st[k] === old) st[k] = newId; });
        // the mini-games key their answers by player id as well
        ['picks', 'votes'].forEach(k => {
            if (!st[k]) return;
            if (old in st[k]) { st[k][newId] = st[k][old]; delete st[k][old]; }
            // a vote CAST FOR the returning player has to follow them too
            Object.keys(st[k]).forEach(v => { if (st[k][v] === old) st[k][v] = newId; });
        });
        if (Array.isArray(st.rolls)) st.rolls.forEach(r => { if (r.id === old) r.id = newId; });
        if (Array.isArray(st.flips)) st.flips.forEach(f => { if (f.id === old) f.id = newId; });
    }
}
