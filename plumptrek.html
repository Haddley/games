const PFX = 'PLUMPTK-';
// Twelve, because the tokens stack well enough for a dozen to share one square, and
// because there are twelve trekkers on the sheet. A long board with twelve is slow going —
// that's what the captain's board-length setting is for.
const MAX_PLAYERS = 12, MIN_PLAYERS = 2;

// Host-authoritative state. `board` is nodes with explicit links; a player is a pawn
// with a position, a hand of kept cards, and any pending roll modifiers.
let H = {
    phase: 'lobby',            // lobby|build|turn|moving|card|choose|finale|podium
    players: [],               // [{id,name,seat,col,pos,hand:[],skip,mods:[],route,done,gates}]
    settings: { length: 'short', build: true, seed: 0 },
    board: [], drawPile: [], discard: [], pending: [],
    turnOrder: [], turnIdx: -1, turn: null, roll: null, moved: null,
    card: null, choice: null, msg: '', round: 0, reverse: false, extraTurn: false,
    build: null, finale: null, finaleState: null, raceMode: null,
    order: [], finishOrder: [], lastPodium: null,
};
let _phaseTimeout = null, _choiceTimeout = null;
const DARE_MS = 45000, CHOICE_MS = 30000, IDLE_ROLL_MS = 70000;   // nothing waits forever
const DIE_WAIT = 1550;      // the pawn sets off once the die has settled (longest throw + a beat)

// ── Messages ───────────────────────────────────────────────────────────────────
// One state message to rule them all (the bingo/herdmind pattern): everybody looks at
// the same board, so the only per-player difference is your own hand and whether the
// game is waiting on you.
function settingsSummary(s) {
    const len = s.length === 'epic' ? '🏔 Epic' : s.length === 'normal' ? '🚶 Normal' : '⚡ Short';
    return `${len} board${s.build ? ' · 🧱 Build card' : ''}`;
}
function lobbyMsg() {
    return {
        type: 'lobby', roomCode,
        players: H.players.map(p => ({ id: p.id, name: p.name, col: p.col, seat: p.seat })),
        taken: H.players.map(p => p.seat),
        settings: { ...H.settings },
        tvHost: isTvHost, captain: capName(),
    };
}
function broadcastLobby() {
    broadcastPlayers(lobbyMsg());
    broadcastViewers({ ...lobbyMsg(), type: 'viewer_lobby' });
    hostSyncSelf(lobbyMsg());
}
function capt() { return { tvHost: isTvHost, captain: capName() }; }

function boardWire() {
    return H.board.map(s => ({ t: s.t, label: s.label, n: s.n || 0, need: s.need || 0, sc: s.sc || 0 }));
}
function playersWire() {
    return H.players.map(p => ({
        id: p.id, name: p.name, col: p.col, pos: p.pos, cards: (p.hand || []).length,
        skip: p.skip || 0, done: !!p.done, away: !!p.away,
        here: !!(guestConns[p.id] || p.id === myId) && !p.away,
        place: placeOf(p),
    }));
}
function standings() {
    const order = (H.finishOrder || H.order || []);
    return H.players.slice().sort((a, b) => {
        const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
        if (ai >= 0 && bi >= 0) return ai - bi;
        if (ai >= 0) return -1; if (bi >= 0) return 1;
        return b.pos - a.pos;
    }).map(p => ({ name: p.name, col: p.col, pos: p.pos, cards: (p.hand || []).length, done: !!p.done }));
}
function publicState() {
    return {
        phase: H.phase, round: H.round, board: boardWire(), players: playersWire(),
        turn: H.turn, roll: H.roll, moved: H.moved, msg: H.msg || '',
        card: H.card ? { t: H.card.t, x: H.card.x, who: H.card.who, dare: !!(H.card.o && H.card.o.dare), hold: !!(H.card.o && H.card.o.hold) } : null,
        choice: H.choice ? { kind: H.choice.kind, who: H.choice.who, opts: H.choice.opts } : null,
        build: H.build ? { t: H.build.t, x: H.build.x } : null,
        finale: H.finale ? { t: H.finale.t, x: H.finale.x, who: H.finale.who } : null,
        fstate: H.finaleState || null, raceMode: H.raceMode || null,
        winner: H.phase === 'podium' ? (standings()[0] || null) : null,
        // what the captain may do about anyone who has gone: the counts, so the phone can
        // offer the right buttons and the TV can explain itself
        absent: absentPlayers().map(p => p.name),
        canDrop: absentPlayers().length > 0 && wouldRemain() >= MIN_PLAYERS,
        canLobby: connectedPlayers().length >= MIN_PLAYERS,
        minPlayers: MIN_PLAYERS,
        ...capt(),
    };
}
function stateFor(p) {
    const st = publicState();
    return {
        type: 'state', ...st,
        me: p ? { id: p.id, hand: p.hand || [], myTurn: H.turn === p.id && ['turn'].includes(H.phase),
                  mine: H.card && H.card.who === p.id, choosing: !!(H.choice && H.choice.who === p.id),
                  pos: p.pos, place: placeOf(p), done: !!p.done } : null,
        standings: H.phase === 'podium' ? standings() : null,
    };
}
function viewerStateMsg() { return { type: 'viewer_state', ...publicState(), standings: H.phase === 'podium' ? standings() : null }; }
function broadcastAll() {
    broadcastPlayers(p => stateFor(p));
    broadcastViewers(viewerStateMsg());
    hostSyncSelf(isTvHost ? null : stateFor(selfPlayer()));
}
function phaseSnapshotFor(p) { return H.phase === 'lobby' ? lobbyMsg() : stateFor(p); }
function viewerSnapshot() { return H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : viewerStateMsg(); }

function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });
    conn.on('data', msg => {
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer';
            viewerConns[conn.peer] = conn;
            send(conn, viewerSnapshot());
            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        const player = H.players.find(p => p.id === conn.peer);
        // ANY message is proof of life — heartbeat, roll, vote, anything.
        if (typeof notePresence === 'function') notePresence(player);
        // Anything at all from this phone is proof it's alive, so it rejoins the rotation.
        if (player && player.away) { player.away = false; broadcastAll(); }
        switch (msg.type) {
            case 'join': {
                // Different code on the two ends looks like a game bug. Say so instead — this is
                // the FIRST thing the join case does, so it runs on every join, not just some.
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Player').slice(0, 16);
                // Same device (cid) always reclaims its seat; a matching NAME only reclaims a seat
                // nobody has been heard from lately. Shared, so all games agree — see common.js.
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);
                if (zombie) hostRekeyPlayer(zombie, conn.peer);
                else hostAddPlayer(conn.peer, name, msg.seat);
                const p2 = H.players.find(p => p.id === conn.peer);
                if (p2) p2.away = false;                      // they're back in the rotation
                if (p2 && msg.cid) p2.cid = msg.cid;          // this device now owns the slot
                if (!p2) { send(conn, lobbyMsg()); break; }
                if (H.phase === 'lobby') broadcastLobby();
                else {
                    // They're back before the pack gave up on them, and it is STILL their
                    // turn. Two things have to happen or the room waits forever:
                    //   • the 12s "they've gone" fallback armed by conn.on('close') is now
                    //     wrong — it was going to skip them — so drop it;
                    //   • it also *replaced* the ordinary idle-roll timer, so without
                    //     re-arming, a player who reconnects and then puts their phone down
                    //     has no safety net at all for this turn.
                    if (H.turn === conn.peer && ['turn', 'choose'].includes(H.phase)) {
                        clearHostTimers();
                        if (H.phase === 'choose') armChoiceTimeout();
                        else _phaseTimeout = setTimeout(() => {
                            if (H.phase === 'turn' && H.turn === p2.id) hostRoll(p2);
                        }, IDLE_ROLL_MS);
                    }
                    send(conn, phaseSnapshotFor(p2));
                    broadcastViewers(viewerSnapshot());
                    if (isTvHost) tvHostSync();
                }
                break;
            }
            case 'roll':   if (player) hostRoll(player); break;
            case 'done':   if (player) hostDone(player); break;
            case 'choose': if (player) hostChoose(player, msg.value); break;
            case 'play':   if (player) hostPlayCard(player, msg.idx); break;
            case 'seat':
                hostSetSeat(conn.peer, msg.seat);
                break;
            case 'ctl': {
                if (!isTvHost || !player || player.id !== capPlayer()?.id) break;
                hostCtl(msg.action, msg);
                break;
            }
        }
    });
    conn.on('close', () => {
        const prevCap = capPlayer()?.id || null;
        setTimeout(() => capSync(prevCap), 0);
        delete guestConns[conn.peer];
        delete viewerConns[conn.peer];
        if (H.phase === 'lobby') {
            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        } else if (H.turn === conn.peer && ['turn', 'choose'].includes(H.phase)) {
            // the pack doesn't wait forever on an absent phone
            clearHostTimers();
            _phaseTimeout = setTimeout(() => { if (H.turn === conn.peer) beginTurn(); }, 12000);
        }
    });
    conn.on('error', e => console.warn('conn err', e));
}

function applySettings(o) {
    if (['short', 'normal', 'epic'].includes(o.length)) H.settings.length = o.length;
    if (typeof o.build === 'boolean') H.settings.build = o.build;
}
function hostCtl(action, msg) {
    if (action === 'start' && H.phase === 'lobby') hostStartGame();
    else if (action === 'again' && H.phase === 'podium') hostNewGame();
    else if (action === 'set' && H.phase === 'lobby') { applySettings(msg); broadcastLobby(); }
    else if (action === 'drop') hostDropAbsent();
    else if (action === 'tolobby' && H.phase !== 'lobby') hostBackToLobby();
}
function guestCtl(action, extra) {
    if (isHost && !isTvHost) { hostCtl(action, extra || {}); return; }
    if (hostConn) send(hostConn, { type: 'ctl', action, ...(extra || {}) });
}
function hostSet(patch) {
    applySettings(patch);
    broadcastLobby();
    if (ui === 'lobby_h') render();
}

// ── Create / join ──
function makeRoom(onOpen) {
    forgetRoom();                    // hosting now — this tab is nobody's guest
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message;
            isHost = false; isTvHost = false;
            document.body.classList.remove('viewer-mode');
            ui = 'home'; render();
        },
    });
}
function hostGame(name) {
    myName = name.trim().slice(0, 16) || 'Host';
    mySeat = fSeat;
    saveName(myName);
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { hostAddPlayer(myId, myName, mySeat); ui = 'lobby_h'; render(); });
}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); tvHostSync(); render(); });
}
function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Player';
    mySeat = fSeat;
    saveName(myName);
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'player'); send(hostConn, { type: 'join', cid: clientId(), build: typeof BUILD !== 'undefined' ? BUILD : null, name: myName, seat: mySeat }); if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} }); });
            hostConn.on('data', msg => applyMsg(msg));
        },
        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game — tap Join to get back in.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });
}
function joinAsViewer(code) {
    isViewer = true;
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });
            hostConn.on('data', msg => applyViewerMsg(msg));
        },
        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function tvHostSync() { if (isTvHost) applyViewerMsg(viewerSnapshot()); }
function hostSyncSelf(msg) {
    if (isTvHost) { tvHostSync(); return; }
    if (isHost && msg) applyMsg(msg);
}
// ═══════════════════════════════════════════
// HOST GAME FLOW
// ═══════════════════════════════════════════
function clearHostTimers() { clearTimeout(_phaseTimeout); clearTimeout(_choiceTimeout); }
function selfPlayer() { return H.players.find(p => p.id === myId); }

// ── ordering helpers (a race, so "place" is how far along you are) ──
function alive() { return H.players.filter(p => !p.done); }
function byLead() { return H.players.slice().sort((a, b) => (b.done ? 1e6 : b.pos) - (a.done ? 1e6 : a.pos)); }
function leader() { return byLead()[0] || null; }
function lastPlace() { const l = byLead(); return l[l.length - 1] || null; }
function turnPlayer() { return H.players.find(p => p.id === H.turnOrder[H.turnIdx]) || null; }
function placeOf(p) { return byLead().findIndex(x => x.id === p.id) + 1; }

function hostStartGame() {
    if (connectedPlayers().length < MIN_PLAYERS) { uiErr = 'Need at least ' + MIN_PLAYERS + ' players.'; if (ui === 'lobby_h') render(); return; }
    seedRng(H.settings.seed || (Date.now() & 0xffffffff));
    H.board = makeBoard(H.settings.length);
    H.drawPile = buildGimmickPile();
    H.discard = [];
    H.finale = null; H.finaleState = null; H.order = []; H.round = 0; H.reverse = false;
    H.players.forEach(p => { p.pos = 0; p.hand = []; p.skip = 0; p.mods = []; p.route = 0; p.done = false; p.gates = {}; });
    H.build = H.settings.build ? BUILDS[rndInt(BUILDS.length)] : null;
    if (H.build && H.build.b === 'chaos') H.chaos = true;
    H.players.forEach(p => { p.away = false; });
    H.turnOrder = H.players.map(p => p.id);
    H.turnIdx = -1;
    sStart();
    if (H.build) {
        H.phase = 'build';
        broadcastAll();
        _phaseTimeout = setTimeout(() => { if (H.phase === 'build') beginTurn(); }, 4200);
    } else beginTurn();
}

// The Gimmick pile: commons shuffled, with the rare whammies salted in ~1 in 12.
function buildGimmickPile() {
    const common = GIMMICKS.filter(c => c.w !== 0);
    const rare = GIMMICKS.filter(c => c.w === 0);
    const pile = rshuffle(common);
    const every = Math.max(6, Math.floor(pile.length / Math.max(1, rare.length)));
    rshuffle(rare).forEach((c, i) => pile.splice(Math.min(pile.length, (i + 1) * every - rndInt(3)), 0, c));
    return pile;
}
function drawGimmick() {
    if (!H.drawPile.length) { H.drawPile = rshuffle(H.discard.length ? H.discard : GIMMICKS.filter(c => c.w !== 0)); H.discard = []; }
    return H.drawPile.pop();
}

// ── the turn engine (skips absent and skipped players, like oddsheep's) ──
function beginTurn() {
    clearHostTimers();
    if (H.players.every(p => p.done)) { showPodium(); return; }
    for (let guard = 0; guard < H.players.length * 4 + 4; guard++) {
        H.turnIdx = H.reverse
            ? (H.turnIdx - 1 + H.turnOrder.length) % H.turnOrder.length
            : (H.turnIdx + 1) % H.turnOrder.length;
        if (H.turnIdx === 0 && !H.reverse) endOfRound();
        const p = turnPlayer();
        if (!p || p.done) continue;
        // Away, by either test. `guestConns` is the optimistic one and it LIES: a phone
        // whose tab is closed or whose battery dies never triggers conn.on('close') — the
        // data channel just goes quiet — so the host still lists them as connected. `p.away`
        // is the pessimistic one, set when we actually waited IDLE_ROLL_MS for them and
        // nothing came back. Either way their pawn waits.
        if ((!guestConns[p.id] && p.id !== myId) || p.away) continue;
        if (p.skip > 0) { p.skip -= 1; H.msg = p.name + ' misses a turn'; continue; }
        H.turn = p.id; H.roll = null; H.moved = null; H.card = null; H.choice = null;
        // standing on a fork? choose the route before rolling, as the original demands
        H.phase = (H.board[p.pos] && H.board[p.pos].t === 'fork') ? 'choose' : 'turn';
        if (H.phase === 'choose') H.choice = { kind: 'route', who: p.id, opts: H.board[p.pos].routes };
        broadcastAll();
        if (H.phase === 'choose') armChoiceTimeout();
        else _phaseTimeout = setTimeout(() => {
            if (H.phase !== 'turn' || H.turn !== p.id) return;
            // We gave them IDLE_ROLL_MS and heard nothing. Roll for them so the game moves —
            // and mark them away, so the room doesn't sit through that same wait EVERY lap.
            // A phone that comes back clears the flag with its next message (see markHere).
            p.away = true;
            hostRoll(p);
        }, IDLE_ROLL_MS);
        return;
    }
    showPodium();
}
function endOfRound() {
    H.round += 1;
    if (H.build && H.build.b === 'unstable' && alive().length > 1) {   // first and last swap
        const l = byLead().filter(p => !p.done);
        if (l.length > 1) { const a = l[0], b = l[l.length - 1], t = a.pos; a.pos = b.pos; b.pos = t; H.msg = 'UNSTABLE: ' + a.name + ' and ' + b.name + ' swapped places'; }
    }
}

// ── rolling ──
function dieMax() { return (H.build && H.build.b === 'd20') ? 20 : 6; }
function hostRoll(player) {
    if (H.phase !== 'turn' || !player || player.id !== H.turn) return;
    clearHostTimers();
    let n = 1 + rndInt(dieMax());
    if (H.build && H.build.b === 'family' && lastPlace() && lastPlace().id === player.id) n = Math.max(n, 1 + rndInt(dieMax()));
    if (H.build && H.build.b === 'plusone') n += 1;
    if (H.build && H.build.b === 'handicap' && leader() && leader().id === player.id) n = Math.ceil(n / 2);
    let mult = 1;
    player.mods = (player.mods || []).filter(m => {
        if (m.turns <= 0) return false;
        n += (m.add || 0); if (m.mult) mult *= m.mult;
        m.turns -= 1;
        return m.turns > 0;
    });
    n = Math.max(0, n * mult);
    H.roll = n;
    H.phase = 'moving';
    broadcastAll();
    _phaseTimeout = setTimeout(() => walk(player, n), DIE_WAIT);   // let the die land first
}

// Walk node by node so gates can stop you part-way, like the STOP signs on the board.
function walk(player, steps) {
    let pos = player.pos, stoppedBy = null;
    for (let s = 0; s < steps; s++) {
        const node = H.board[pos];
        const nx = node.next[node.t === 'fork' ? (player.route || 0) : 0];
        if (nx == null || nx === pos) break;
        pos = nx;
        const landed = H.board[pos];
        if (landed.t === 'gate' && s < steps - 1) {                    // a gate stops you mid-run
            const key = 'g' + pos;
            player.gates[key] = (player.gates[key] || 0) + 1;
            if (H.roll < (landed.need || 4) && player.gates[key] < 3) { stoppedBy = landed; break; }
        }
        if (landed.t === 'win') break;
    }
    player.pos = pos;
    H.moved = { id: player.id, to: pos, stopped: !!stoppedBy };
    H.phase = 'moving';
    broadcastAll();
    _phaseTimeout = setTimeout(() => resolveSpace(player), 900);
}

function resolveSpace(player) {
    const node = H.board[player.pos];
    if (!node) { endTurn(player); return; }
    switch (node.t) {
        case 'win':     finishPlayer(player); return;
        case 'finale':  drawFinale(player); return;
        case 'gimmick': queueCards(player, (H.build && H.build.b === 'chaos') ? 2 : 1); return;
        case 'gimmick2':queueCards(player, (H.build && H.build.b === 'chaos') ? 4 : 2); return;
        case 'boost':   H.msg = node.label; hop(player, node.n); return;
        case 'trap':    H.msg = node.label; if (node.skip) player.skip += node.skip; hop(player, node.n); return;
        default:
            if (H.build && H.build.b === 'entropy') { queueCards(player, 1); return; }
            endTurn(player); return;
    }
}
// A boost/trap nudge: move, show it, then finish the turn (no chain-resolving — that way
// two boosts in a row can't send a pawn into a loop).
function hop(player, n) {
    const to = clampWalk(player, n);
    player.pos = to;
    H.moved = { id: player.id, to, nudge: true };
    broadcastAll();
    _phaseTimeout = setTimeout(() => {
        if (H.board[player.pos] && H.board[player.pos].t === 'win') { finishPlayer(player); return; }
        if (H.board[player.pos] && H.board[player.pos].t === 'finale' && !H.finale) { drawFinale(player); return; }
        endTurn(player);
    }, 800);
}
function clampWalk(player, n) {
    let pos = player.pos;
    const dir = n < 0 ? -1 : 1;
    for (let i = 0; i < Math.abs(n); i++) {
        if (dir > 0) { const node = H.board[pos]; const nx = node.next[node.t === 'fork' ? (player.route || 0) : 0]; if (nx == null || nx === pos) break; pos = nx; }
        else { const prev = H.board.findIndex(s => (s.next || []).includes(pos)); if (prev < 0) { pos = 0; break; } pos = prev; }
    }
    return pos;
}

// ── cards ──
function queueCards(player, n) {
    H.pending = [];
    for (let i = 0; i < n; i++) H.pending.push(drawGimmick());
    showNextCard(player);
}
function showNextCard(player) {
    if (!H.pending || !H.pending.length) { endTurn(player); return; }
    const card = H.pending.shift();
    H.card = { ...card, who: player.id };
    H.phase = 'card';
    sPlay();
    broadcastAll();
    if (card.o && card.o.dare) {                             // wait for their Done…
        _phaseTimeout = setTimeout(() => {                   // …but not forever
            if (H.phase === 'card' && H.card && H.card.who === player.id) { H.msg = 'Moving on'; afterCard(player); }
        }, DARE_MS);
        return;
    }
    if (card.o && card.o.hold) {                             // straight into their hand
        player.hand.push({ t: card.t, x: card.x, hold: card.o.hold });

                { duration: ms, easing: 'cubic-bezier(.34,.9,.3,1)' });
        } catch (_) {}
        // …and they WALK it: the sprite's two walk frames cycle for exactly as long as
        // the piece is travelling, facing the way it's going. A slide is a slide; a walk
        // cycle over the same slide is a trekker crossing the board.
        const trk = el.querySelector('.trk'), tb = el.querySelector('.tb');
        if (!trk) return;
        if (tb && Math.abs(dx) > 6) tb.style.setProperty('--dir', dx > 0 ? -1 : 1);
        trk.classList.add('walking');
        trk._walkUntil = Date.now() + ms;
        clearTimeout(trk._walkT);
        trk._walkT = setTimeout(() => {
            trk.classList.remove('walking');
            if (tb) tb.style.removeProperty('--dir');
        }, ms);
    });
}

// ── reactions ────────────────────────────────────────────────────────────────
// A pose held for a beat, and a balloon over the head. Both are frames off the sheets,
// so nothing here is improvised: `pose` is a column of trekkers.png, `emote` a column of
// emotes.png. Safe to call for a player who isn't on screen — it just does nothing.
// ── the sheet indexes ────────────────────────────────────────────────────────
// These four constants are the whole vocabulary of frames the game can ask for. They live
// HERE, above the first `const` that reads them, and must stay above it: a module-level
// `const` initialised from a name declared further down the file throws a TDZ
// ReferenceError at load, and in a single-file game that means a blank page, no QR, no
// room. (It happened. The smoke e2e is what caught it.)
// `climb` isn't a frame number: it's a two-frame LOOP (see .trk.strain), because a trekker
// held up at a gate is still trying, not stopped.
const POSE = { jump: 3, hit: 4, duck: 5, front: 6, climb: 'climb' };
// The 12 balloons on `sprites/emotes.png`, in sheet order.
const EMO = { happy: 0, angry: 1, sad: 2, laugh: 3, alert: 4, question: 5,
              sleep: 6, star: 7, heart: 8, idea: 9, drop: 10, music: 11 };
// The ones cheerful enough to fire unprompted; the rest are earned by the game.
const IDLE_EMOTES = [EMO.happy, EMO.laugh, EMO.music, EMO.star, EMO.heart, EMO.idea, EMO.question];
// Reactions land on EVERY copy of that player on screen — the piece on the board and the
// portrait in the rail — because they're the same person in two places and it looks wrong
// if only one of them flinches.
function pawnReact(id, emote, pose, ms) {
    if (REDUCED || typeof document === 'undefined' || !id) return;
    const sel = '[data-p="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]';
    document.querySelectorAll(sel).forEach(el => reactOne(el, emote, pose, ms));
}
function reactOne(el, emote, pose, ms) {
    const hold = ms || 1300;
    const trk = el.querySelector('.trk');
    if (trk && pose != null) {
        // A reaction pose is a HELD frame, so it stops the walk cycle dead. When the very
        // thing being reacted to is a big move — "boosted nine squares!" — that meant the
        // piece teleported in a frozen jump pose instead of running there. So the pose waits
        // for the journey to finish and lands as they arrive, which is also when it reads.
        const wait = Math.max(0, (trk._walkUntil || 0) - Date.now());
        const strike = () => {
            // a string pose is a looping animation class; a number is a single held frame
            if (typeof pose === 'string') {
                trk.classList.add(pose === 'climb' ? 'strain' : pose);
            } else {
                trk.style.setProperty('--f', pose);
                trk.classList.add('rx');
            }
            clearTimeout(trk._rxT);
            trk._rxT = setTimeout(() => {
                trk.classList.remove('rx', 'strain');
                trk.style.removeProperty('--f');
            }, hold);
        };
        clearTimeout(trk._poseT);
        if (wait > 20) trk._poseT = setTimeout(strike, wait);
        else strike();
    }
    const emo = el.querySelector('.emo');
    if (emo && emote != null) {
        emo.style.setProperty('--e', emote);
        emo.classList.remove('always', 'pop');
        void emo.offsetWidth;                       // reflow, or re-adding won't restart it
        emo.classList.add('pop');
        clearTimeout(emo._emoT);
        emo._emoT = setTimeout(() => { emo.classList.remove('pop'); emo.classList.add('always'); }, 1700);
    }
}

// ── mood: how is this trekker FEELING? ───────────────────────────────────────
// A reaction on its own has no memory: get trapped three turns running and you'd flinch
// identically each time, which reads as a machine rather than a player. So each trekker
// carries a MOOD — a small running score from −3 (thoroughly fed up) to +3 (having a
// wonderful time) — and it changes two things:
//
//   1. HOW THEY WAIT. A glum trekker slumps, slows down, loses a little colour and sighs
//      the odd sad balloon. An elated one stands tall, bounces faster and beams.
//   2. HOW THEY REACT. The same event reads differently depending on the mood it lands on.
//      A trap when you were already miserable is a sulk; the same trap when you were flying
//      is startled indignation. A boost when you're glum is relief, not a victory dance.
//
// Mood FADES: each time the turn comes back round to you, it steps one closer to neutral.
// So a bad break sours you for two or three of your own turns and then you get over it,
// which is roughly how it goes at the table.
//
// It lives entirely on the client, keyed by player id. Nothing about mood goes on the wire
// — every screen derives it from the same snapshots, so every screen agrees.
const MOOD = {};                       // id → number, −3…+3
const MOOD_CAP = 3;
// what each event does to how you feel
const MOOD_DELTA = { home: 3, boost: 2, lead: 1, card: 1, gate: -1, slip: -1, skip: -2, back: -2 };

function moodOf(id) { return MOOD[id] || 0; }
function moodBucket(m) { return m <= -2 ? 'glum' : m >= 2 ? 'elated' : m <= -1 ? 'down' : m >= 1 ? 'chuffed' : 'ok'; }
function bumpMood(id, kind) {
    const d = MOOD_DELTA[kind] || 0;
    if (!d) return;
    MOOD[id] = Math.max(-MOOD_CAP, Math.min(MOOD_CAP, moodOf(id) + d));
}
function fadeMood(id) {
    const m = moodOf(id);
    if (m) MOOD[id] = m > 0 ? m - 1 : m + 1;
}
function resetMoods() { Object.keys(MOOD).forEach(k => { delete MOOD[k]; }); }

// How a mood shows while nothing is happening. Slower and slumped when fed up, quicker and
// taller when delighted; the colour shift is what makes a rail of twelve readable at a
// glance from the sofa.
const MOOD_LOOK = {
    glum:    { mf: 1.8, tilt: 7,  slump: 6,  sat: 0.55, bri: 0.82, every: 9,  emotes: [2, 10, 6] },      // sad, drop, sleep
    down:    { mf: 1.35, tilt: 4, slump: 3,  sat: 0.78, bri: 0.92, every: 13, emotes: [2, 5] },          // sad, question
    ok:      { mf: 1,    tilt: 0, slump: 0,  sat: 1,    bri: 1,    every: 16, emotes: null },            // whatever they were dealt
    chuffed: { mf: 0.82, tilt: -2, slump: -2, sat: 1.08, bri: 1.05, every: 11, emotes: [0, 11] },        // happy, music
    elated:  { mf: 0.62, tilt: -4, slump: -4, sat: 1.18, bri: 1.1,  every: 7,  emotes: [3, 7, 8] },      // laugh, star, heart
};

// The same event, felt from a different place. [emote, pose, holdMs]
const REACTIONS = {
    back:  { glum: [EMO.sad, POSE.duck, 1800],   ok: [EMO.angry, POSE.hit, 1400],  elated: [EMO.alert, POSE.hit, 1300] },
    skip:  { glum: [EMO.drop, POSE.duck, 1900],  ok: [EMO.sleep, POSE.duck, 1500], elated: [EMO.question, POSE.duck, 1300] },
    gate:  { glum: [EMO.sad, POSE.climb, 1700],  ok: [EMO.question, POSE.climb, 1400], elated: [EMO.alert, POSE.climb, 1200] },
    slip:  { glum: [EMO.drop, POSE.duck, 1500],  ok: [EMO.sad, null, 0],           elated: [EMO.question, null, 0] },
    boost: { glum: [EMO.heart, POSE.jump, 1600], ok: [EMO.laugh, POSE.jump, 1400], elated: [EMO.star, POSE.jump, 1500] },
    home:  { glum: [EMO.heart, POSE.jump, 1800], ok: [EMO.star, POSE.jump, 1600],  elated: [EMO.star, POSE.jump, 1600] },
    lead:  { glum: [EMO.idea, null, 0],          ok: [EMO.happy, null, 0],         elated: [EMO.music, null, 0] },
    card:  { glum: [EMO.question, null, 0],      ok: [EMO.idea, null, 0],          elated: [EMO.idea, null, 0] },
    told:  { glum: [EMO.drop, null, 0],          ok: [EMO.alert, null, 0],         elated: [EMO.alert, null, 0] },
    dare:  { glum: [EMO.drop, null, 0],          ok: [EMO.drop, null, 0],          elated: [EMO.laugh, null, 0] },
};
// down/chuffed sit between the three written above, so they borrow the nearer one
function reactionFor(kind, mood) {
    const r = REACTIONS[kind];
    if (!r) return null;
    const b = moodBucket(mood);
    return r[b] || (b === 'down' ? r.glum : b === 'chuffed' ? r.elated : r.ok) || r.ok;
}

// What just happened to each player? Nobody tells us — we work it out by comparing the
// snapshot that arrived with the one before it. That keeps the wire format untouched and
// means the phones and the TV react to the same events without the host sending anything
// extra.
//
// Two passes, and the ORDER matters: moods are updated BEFORE the render (so the trekkers
// are drawn already feeling it) and the reactions are played AFTER (so they land on the new
// tokens). Hence `moodPass` then `render()` then `playReactions`.
function moodPass(before, after) {
    if (!before || !after) return [];
    const was = {};
    (before.players || []).forEach(p => { was[p.id] = p; });
    const events = [];
    // The mood recorded with the event is the one the event LANDED ON, not the one it leaves
    // behind. Otherwise a single trap sours you to glum and then reads as a glum trekker's
    // sulk — so nobody ever gets the first-time reaction, and "still fed up" loses its
    // meaning because everybody is always already fed up.
    const hit = (id, kind) => { events.push([id, kind, moodOf(id)]); bumpMood(id, kind); };

    // a new turn coming round to you is when your mood fades a step
    if (after.turn && after.turn !== before.turn) fadeMood(after.turn);

    (after.players || []).forEach(p => {
        const b = was[p.id];
        if (!b) return;
        if (p.done && !b.done) return hit(p.id, 'home');
        if (p.pos < b.pos) return hit(p.id, 'back');                       // sent backwards
        if ((p.skip || 0) > (b.skip || 0)) return hit(p.id, 'skip');
        // a jump longer than a die could manage is a boost, not a walk
        if (p.pos - b.pos > 6) return hit(p.id, 'boost');
        if ((p.cards || 0) > (b.cards || 0)) return hit(p.id, 'card');
        if (p.place === 1 && b.place !== 1) return hit(p.id, 'lead');
        // slipping down the field stings even when nothing was done to you
        if (p.place > b.place && p.place >= (after.players || []).length) return hit(p.id, 'slip');
        // stuck at a gate: it was your turn, you rolled, and you went nowhere
        if (p.id === before.turn && p.pos === b.pos && after.roll != null && after.roll !== before.roll) {
            return hit(p.id, 'gate');
        }
    });
    // whoever has to answer for a card
    const c = after.card, cb = before.card;
    if (c && c.who && (!cb || cb.who !== c.who || cb.t !== c.t)) {
        events.push([c.who, c.dare ? 'dare' : 'told', moodOf(c.who)]);
    }
    return events;
}
function playReactions(events) {
    if (REDUCED || !events || !events.length) return;
    events.forEach(([id, kind, mood]) => {
        const r = reactionFor(kind, mood != null ? mood : moodOf(id));
        if (r) pawnReact(id, r[0], r[1], r[2]);
    });
}

function applyViewerMsg(msg) {
    if (!msg) return;
    const prevPhase = vD && vD.phase;
    const before = vD;
    const wherePawnsWere = capturePawns();
    // moods first, so the trekkers are DRAWN already feeling it; the reactions play after
    // the render, so they land on the new tokens
    const events = moodPass(before, msg);
    if (msg.type === 'viewer_lobby') resetMoods();
    vD = msg;
    isViewer = isViewer || !isTvHost;
    ui = 'viewer';
    setMusic(msg.type === 'viewer_lobby' ? 'lobby' : msg.phase === 'podium' ? 'over' : msg.phase === 'finale' ? 'finale' : 'game');
    render();
    flipPawns(wherePawnsWere);
    playReactions(events);
    if (msg.phase === 'moving' && msg.roll != null && !msg.moved) spinDie(msg.roll);
    else if (msg.roll != null) snapDie(msg.roll);
    if (msg.phase === 'card' && prevPhase !== 'card') sPlay();
    if (msg.phase === 'finale' && prevPhase !== 'finale') sFlip();
    if (msg.phase === 'podium' && prevPhase !== 'podium') { sWin(); startConfetti(3200); }
}

// ═══════════════════════════════════════════
// SHARED BITS
// ═══════════════════════════════════════════
// ── player tokens ────────────────────────────────────────────────────────────
// Tokens sit ON a square and spill over it, like real pieces, and they have to stay
// readable from the sofa when a whole party lands on the same one. So the arrangement
// depends on HOW MANY are sharing:
//   1        centre, biggest, gentle bob
//   2–4      a fixed cluster, each leaning toward the group (a jostle), out of phase
//   5–12+    a slow orbit; every token gets its turn at the front, and each
//            counter-rotates so the animal stays upright
// The layout returns percentages of the square, so it scales with the board.
// ── the cast ─────────────────────────────────────────────────────────────────
// `sprites/trekkers.png` holds five characters (see sprites/CREDITS.md). Twelve seats
// come from five characters × a CSS hue rotation, because the art is a white helmet,
// dark eyes and one saturated body colour — rotate the hue and the body recolours while
// the face stays put.
//
//   [ sheet row, hue rotation in degrees, the colour that comes out ]
//
// Row: 0 human · 1 alien · 2 cyclops · 3 monster · 4 duck. The colours are not guesses:
// each was read off the hue-rotated sprite (the same feColorMatrix the browser applies),
// so a player's disc, rail chip and piece are all genuinely the same colour. The ORDER
// puts far-apart hues next to each other, so the first four to join never look alike.
const TREK_CAST = [
    [4,   0, '#faba2d'],   // duck     41°
    [0, 180, '#aecde5'],   // human   206°
    [0,   0, '#e2c3ab'],   // human    26°
    [1,   0, '#5dd4aa'],   // alien   159°
    [2,   0, '#ff8aae'],   // cyclops 342°
    [4,  60, '#5fe641'],   // duck    109°
    [1, 120, '#d9a5ff'],   // alien   275°
    [3, 180, '#b7c87f'],   // monster  74°
    [3,   0, '#c7b6ff'],   // monster 254°
    [1, 300, '#96ca62'],   // alien    90°
    [4, 240, '#ff95ff'],   // duck    300°
    [3,  60, '#faabd8'],   // monster 326°
    [0, 120, '#a2d4c0'],   // human   156°
    [1, 180, '#ff9bc5'],   // alien   335°
    [2, 180, '#4cc19d'],   // cyclops 162°
    [4, 300, '#ff91aa'],   // duck    346°
    [3, 240, '#83d3a6'],   // monster 146°
    [0, 300, '#eebcd0'],   // human   336°
    [4, 120, '#22ead1'],   // duck    172°
    [3, 120, '#f2b498'],   // monster  19°
    [1,  60, '#7fc1ff'],   // alien   209°
    [2,  60, '#da9d5c'],   // cyclops  31°
    [4, 180, '#81c1ff'],   // duck    210°
    [1, 240, '#f1ae70'],   // alien    29°
    [2, 240, '#71aeef'],   // cyclops 211°
    [0,  60, '#bccfa3'],   // human    86°
    [2, 300, '#cb92f7'],   // cyclops 274°
    [2, 120, '#80b954'],   // cyclops  94°
    [0, 240, '#d4c1ed'],   // human   266°
    [3, 300, '#8bcae6'],   // monster 198°
];
// The first twelve are what the host hands out when you didn't pick, or when the piece you
// wanted was gone. They were chosen to be as far apart on the colour wheel as thirty
// options allow (closest pair 15°, no more than three of any one character), so a room
// that never touches the picker still ends up with a legible board. The other eighteen
// exist so that PICKING one means something.
const AUTO_SEATS = 12;
const PAWN_COLS = TREK_CAST.map(c => c[2]);
// The host assigns the colour at join (p.col), so the seat — not the name — decides who
// you are. Falling back to a hash of the name keeps old snapshots and the simulation
// looking right.
function castOf(pl) {
    const i = pl.col ? PAWN_COLS.indexOf(pl.col) : -1;
    return TREK_CAST[i >= 0 ? i : nameSeed(pl) % TREK_CAST.length];
}
function pawnColor(pl) { return castOf(pl)[2]; }

// Tokens STACK, the way real pieces do when a party lands on one square: each sits a
// little higher than the one below with a touch of jitter. Twelve fit that way — what does
// not fit is twelve tokens side by side. A pile then does three things a scatter cannot:
//   • it LEANS and sways as one, more at the top than the bottom (a teetering tower)
//   • it FANS open every few seconds, so even the buried ones get their moment
//   • each trekker idles on its own beat, and the one whose turn it is sits on top
//
// Two numbers make the difference between a pile you can read and a pile of legs:
//
// THE STEP is a head's worth. A trekker is a big round helmet on a small body, so a step
// of ~45% of the sprite's height leaves every face in the tower showing. Any less and each
// piece plants its feet over the face below it, which is exactly what a first attempt did.
// The scale shrinks with the crowd, so the step shrinks with it — hence one formula, not a
// table of magic numbers.
//
// THE COLUMNS keep that honest step from building a skyscraper: above four players the
// pile splits into two side-by-side towers, so twelve people are two stacks of six —
// about one and a bit squares tall instead of two and a half.
function tokenScale(n) { return n <= 2 ? 1.08 : n <= 4 ? 0.94 : n <= 8 ? 0.8 : 0.7; }
function tokenCols(n) { return n <= 4 ? 1 : 2; }
// A token is 4.4vmin tall on the TV against a ~8.4vmin square, so 45% of the sprite is
// ~23.5% of the square. Kept as a percentage because `top` resolves it against the square.
function tokenStep(n) { return +(23.5 * tokenScale(n)).toFixed(1); }

// ── the trekkers ─────────────────────────────────────────────────────────────
// Emoji can't act: 🐰 is one fixed glyph, so it can never take a step or flinch. The
// pieces are therefore SPRITES, and every animation is a fixed frame sequence off one
// sheet — a flipbook, not a tween (see the CSS above for the frame map).
//
// Each player is dealt, from their name, an IDLE and an EMOTE, so the same person always
// behaves the same way and no two neighbours in a pile are doing the same thing:
//   idles:   shuffle · peek · hop · crouch · sway · pace
//   emotes:  a balloon that pops over their head every 12–20s, on their own clock
// The animal they picked rides along as a badge, so the board still matches the rail.
const IDLES = ['i-shuffle', 'i-peek', 'i-hop', 'i-crouch', 'i-sway', 'i-pace'];
function nameSeed(pl) {
    const s = (pl.name || '') + (pl.col || '');
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
    return h;
}
function idleOf(pl) { return IDLES[nameSeed(pl) % IDLES.length]; }
// Each player's rhythm comes from their NAME, not from where they happen to be standing.
// That means the trekker in the rail is doing exactly what the trekker on the board is
// doing, at the same moment — the same person, in two places.
function beatOf(pl) { return ((nameSeed(pl) % 130) / 100).toFixed(2) + 's'; }
// The balloon is a SIBLING of the flipped `.tb`, not a child: inside it, facing left
// would mirror the balloon and point its tail the wrong way.
function creatureHTML(pl, now) {
    const seed = nameSeed(pl);
    const look = MOOD_LOOK[moodBucket(moodOf(pl.id))] || MOOD_LOOK.ok;
    // Mood decides WHICH balloon they sigh and HOW OFTEN; their name decides which of the
    // cheerful ones is theirs when they've nothing in particular to feel.
    const set = look.emotes || IDLE_EMOTES;
    const emo = set[(seed >> 3) % set.length];
    const eDur = (look.every + ((seed >> 5) % 40) / 10).toFixed(1);   // ±4s, so no chorus
    return `<span class="tb" style="--mf:${look.mf};--tilt:${look.tilt}deg;--slump:${look.slump}%;` +
        `--sat:${look.sat};--bri:${look.bri}">${trekkerHTML(pl, now)}</span>` +
        `<span class="emo always" style="--e:${emo};--eDur:${eDur}s;--eDl:${beatOf(pl)}"></span>`;
}
// No emoji badge on the piece. The sprite IS the avatar now, and a 🐼 tucked against its
// leg just read as a second, smaller creature — in a twelve-high pile the badges turned the
// tower into soup. The emoji they picked still labels them everywhere it's useful: the
// lobby, the rail, and every "who do you want to sabotage" prompt.
function trekkerHTML(pl, now) {
    const seed = nameSeed(pl);
    const [row, hue] = castOf(pl);
    const mood = moodBucket(moodOf(pl.id));
    // everyone's clock is their own, so a pile never marches in step
    const idle = (1.1 + (seed % 46) / 10).toFixed(1);           // 1.1–5.6s
    // The mood's --mf (set on the wrapper, inherited here) MULTIPLIES that clock rather than
    // replacing it: a fed-up trekker moves at 1.8× their own tempo, so they still move like
    // themselves — just heavily.
    return `<span class="trk ${idleOf(pl)} md-${mood}${now ? ' now' : ''}"` +
        ` style="--row:${row};--hue:${hue}deg;--idle:${idle}s;--dl:${beatOf(pl)}"></span>`;
}

// A trekker standing still, for the places that used to show an emoji: the lobby list, the
// "who do you want to sabotage" buttons, a finale roll-off. No idle animation — these sit in
// lists and text, where a dozen things bobbing is noise rather than life.
function miniTrekHTML(pl) {
    const [row, hue] = castOf(pl || {});
    return `<span class="minitrk" style="--row:${row};--hue:${hue}deg;--f:6"></span>`;
}

function pawnStackHTML(on, turnId) {
    // whoever is mid-turn goes on top of the pile
    const order = on.slice().sort((a, b) => (a.id === turnId ? 1 : 0) - (b.id === turnId ? 1 : 0));
    const n = order.length;
    const step = tokenStep(n), scale = tokenScale(n), cols = tokenCols(n);
    const per = Math.ceil(n / cols);                               // how tall each tower is
    const toks = order.map((pl, i) => {
        const mine = pl.id === turnId;
        const col = Math.floor(i / per), row = i % per;             // fill one tower, then the next
        const jitter = (row % 2 ? 1 : -1) * (n > 1 ? (n > 6 ? 3 : 5) : 0);   // pieces never land square
        const spread = cols > 1 ? (col === 0 ? -19 : 19) : 0;       // two towers, shoulder to shoulder
        // The pile lists a little — but a tall one has to stand up straighter, or six
        // pieces each leaning a degree further walk the top of the tower off its square.
        const lean = (row - (per - 1) / 2) * (per > 4 ? 1.2 : per > 2 ? 1.6 : 3);
        const fan = (i % 2 ? 0.82 : -0.82);                        // leans out left, then right
        // Lower pieces are drawn IN FRONT, which is what makes a stack legible: each face
        // covers the feet of the trekker standing above it, rather than the other way round.
        return `<span class="tok${mine ? ' up' : ''}" data-p="${esc(pl.id)}" title="${esc(pl.name)}"
            style="--k:${n - row};--tx:${spread + jitter}%;--ty:${(-row * step).toFixed(1)}%;--fx:${fan}em;--rot:${lean.toFixed(1)}deg;
                   --ts:${(scale * (mine ? 1.14 : 1)).toFixed(2)};--lean:${(i * 0.17).toFixed(2)}s;--pc:${pawnColor(pl)}"
            >
            <span class="tk">${creatureHTML(pl, mine)}</span></span>`;
    }).join('');
    return `<span class="sqp${n > 1 ? ' stack' : ''}" style="--n:${n};z-index:${4 + n}">${toks}</span>`;
}

// The board strip: main path, then the short cut as its own row underneath.
const BOARD_RUN = 9;           // squares per horizontal run — short runs double back
                               // sooner, which keeps the whole track readable at a glance
// Where does square k sit, and which way does the trail leave it? The path snakes, but
// each turn gets its OWN square dropped vertically below the last one — so the rows are
// spaced apart and you can see the route bend rather than having to guess it.
//   band = one horizontal run (BOARD_RUN squares) + one vertical connector below its end
function placeSquare(k) {
    const band = Math.floor(k / (BOARD_RUN + 1));
    const at = k % (BOARD_RUN + 1);
    const rtl = band % 2 === 1;                                  // odd bands run right→left
    if (at < BOARD_RUN) {
        return { row: band * 2 + 1, col: rtl ? BOARD_RUN - at : at + 1,
                 dir: at === BOARD_RUN - 1 ? 'd' : (rtl ? 'l' : 'r') };
    }
    return { row: band * 2 + 2, col: rtl ? 1 : BOARD_RUN, dir: 'd' };   // the connector
}
function boardHTML(d, big) {
    const b = d.board || [], ps = d.players || [];
    const main = [], sc = [];
    b.forEach((s, i) => (s.sc ? sc : main).push({ s, i }));
    const last = main.length - 1;
    const cell = ({ s, i }, k, snake) => {
        const on = ps.filter(p => p.pos === i && !p.done);
        const at = snake ? placeSquare(k) : { row: 1, col: k + 1, dir: k === sc.length - 1 ? '' : 'r' };
        const dir = k === last && snake ? '' : at.dir;
        const lab = s.t === 'boost' || s.t === 'trap' ? `${s.n > 0 ? '+' : ''}${s.n}` : (s.label || '');
        const glyph = dir === 'l' ? '❮' : '❯';
        return `<div class="sq sq-${s.t}${on.length ? ' occupied' : ''}" id="sq-${i}"
            style="grid-column:${at.col};grid-row:${at.row}">
            <span class="sqn">${k + 1}</span>
            <span class="sql">${esc(lab)}</span>
            ${dir ? `<span class="sqa ${dir}"${dir === 'd' ? ' style="transform:translateX(-50%) rotate(90deg)"' : ''}>${glyph}</span>` : ''}
            ${on.length ? pawnStackHTML(on, d.turn) : ''}
        </div>`;
    };
    // Fit the whole track on screen however long it is: the square size shrinks with the
    // number of grid rows rather than letting an epic board run off the bottom.
    const rows = main.length ? placeSquare(last).row : 1;
    const size = `--cols:${BOARD_RUN};` + (big ? `--sqs: min(8.4vmin, ${(72 / Math.max(3, rows)).toFixed(2)}vmin)` : '');
    return `<div class="board${big ? ' big' : ''}" style="${size}">${main.map((c, k) => cell(c, k, true)).join('')}</div>
        ${sc.length ? `<div class="board sc"${big ? ` style="${size}"` : ''}>${sc.map((c, k) => cell(c, k, false)).join('')}</div>` : ''}`;
}
function cardHTML(c, mine) {
    if (!c) return '';
    return `<div class="gcard${mine ? ' mine' : ''}${c.hold ? ' keep' : ''}${c.dare ? ' dare' : ''}">
        <div class="gct">${esc(c.t)}</div><div class="gcx">${esc(c.x)}</div>
        ${c.hold ? '<div class="gck">KEEP THIS</div>' : ''}
    </div>`;
}
function handHTML(hand, playable) {
    if (!hand || !hand.length) return '';
    return `<div class="hand">${hand.map((c, i) =>
        `<button class="hcard" ${playable ? `onclick="doPlayCard(${i})"` : 'disabled'}>
            <span class="hct">${esc(c.t)}</span><span class="hcx">${esc(c.x)}</span>
        </button>`).join('')}</div>`;
}
function whoName(d, id) { const p = (d.players || []).find(x => x.id === id); return p ? p.name : 'Someone'; }

function renderPlay() {

    if (d.phase === 'build') {
        body = `<div class="card"><div class="slbl">🧱 This game's Build card</div>
            <div class="bcard"><div class="bct">${esc(d.build ? d.build.t : '')}</div><div class="bcx">${esc(d.build ? d.build.x : '')}</div></div></div>`;
    } else if (d.phase === 'card') {
        const c = d.card;
        body = `<div class="card">
            ${me.mine ? '' : `<div class="slbl">${esc(whoName(d, c && c.who))} drew</div>`}
            ${cardHTML(c, me.mine)}

        </div>`;
    } else if (d.phase === 'choose' && me.choosing) {
        const ch = d.choice || {};
        const title = ch.kind === 'route' ? 'Pick your path' : ch.kind === 'sabotage' ? 'Who loses a turn?'
            : ch.kind === 'gift' ? 'Who gets the boost?' : ch.kind === 'pity' ? 'Choose the winner'
            : ch.kind === 'guess' ? 'Guess their number' : 'Choose';
        // Route labels are prose, so they can never go inside the onclick — a quote in
        // the text would close the attribute and leave a button that does nothing (it
        // did, and it stalled the game at the fork). Send the INDEX; show the words.
        const opts = (ch.opts || []).map((o, i) => {
            if (typeof o === 'object')                       // a player
                return `<button class="btn btn-g btn-full opt" onclick="doChoose('${esc(o.id)}')">${miniTrekHTML(o)}${esc(o.name)}</button>`;
            if (ch.kind === 'route')                         // a path
                return `<button class="btn btn-g btn-full opt" onclick="doChoose(${i})">${i ? '🌿 ' : '🛣 '}${esc(String(o))}</button>`;

            extra = `<div class="opts rps">
                <button class="btn btn-g opt" onclick="doChoose('rock')">✊<span>Rock</span></button>

            extra = `<div class="opts">
                <button class="btn btn-g btn-full opt" onclick="doChoose('${esc(st.a)}')">${esc(whoName(d, st.a))}</button>

        }

    } else if (me.myTurn) {

// Shown only when somebody has actually gone, and only to whoever can act on it. A dropped

function absentPanelHTML(d) {

// Thirty pieces, tap one. Thirty rather than twelve for one reason: a room only ever holds
// twelve, so with thirty on offer a deliberate pick usually just works and the "sorry,
// taken" path becomes rare.
//
// `taken` is the honest bit. On the home screen we're outside the room and cannot know what
// anyone else has, so nothing is disabled and the pick is a WISH — the host settles it (see
// hostAddPlayer). In the lobby we do know, so taken pieces are shown crossed out and are
// not tappable, and the piece you actually hold is the selected one. Same picker, told more.
function avatarPickerHTML(opts) {
    const o = opts || {};
    const taken = new Set(o.taken || []);
    const mine = o.mine != null ? o.mine : fSeat;
    const label = o.taken ? 'Your piece — tap to swap' : 'Pick your piece';
    return `<div class="fg"><label>${label}</label><div class="avrow">${
        TREK_CAST.map((c, i) => {
            const gone = taken.has(i) && i !== mine;
            return `<div class="av trekpick${i === mine ? ' sel' : ''}${gone ? ' gone' : ''}"
                title="${gone ? 'Taken' : 'Trekker ' + (i + 1)}"

let _lastUi = '', _lastVType = '';
function render() {
    const app = $id('app');
    if (isTvHost || isViewer) ui = 'viewer';
    const vt = ui === 'viewer' ? ((vD?.type || '') + ':' + (vD?.round ?? '')) : '';
    const fresh = ui !== _lastUi || vt !== _lastVType;
    _lastUi = ui; _lastVType = vt;
    let html = '';
    switch (ui) {
        case 'home':       html = renderHome(); break;
        case 'creating':   html = renderSpinner('Setting up the game…'); break;
        case 'connecting': html = renderSpinner('Joining the game…'); break;
        case 'lobby_h':    html = renderLobbyH(); break;
        case 'lobby_g':    html = renderLobbyG(); break;
        case 'play':       html = renderPlay(); break;
        case 'podium':     html = renderPodium(); break;
        case 'viewer':     html = renderViewer(); break;
        default:           html = renderHome();
    }
    // guarded: a stale common.js (no setHTML) must never blank the game
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    app.classList.toggle('fresh', fresh);
}

            🐇 Host on this phone
        </button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin-top:8px">
            3–12 players — put a TV up with the room code
        </div>
    </div>`;
    const tvCard = `
    <div class="card">
        <div class="slbl">TV / Big Screen</div>
        <button class="btn btn-p btn-full" onclick="hostOnTV()">📺 Host the party on this screen</button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin:6px 0 10px">
            Shows a big QR code — the first phone to join becomes 👑 Captain
        </div>
        <hr>
        <div class="fg">
            <label>…or show an existing game</label>
            <input type="text" maxlength="4" placeholder="4-letter code" value="${esc(fVCode)}"
                oninput="fVCode=this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')joinAsViewer(fVCode)">
        </div>
        <button class="btn btn-g btn-full"
            onclick="if(fVCode.trim()){joinAsViewer(fVCode)}else{uiErr='Enter a room code.';render()}">
            📺 Open TV screen
        </button>
    </div>`;
    return `
    ${hdrHTML('roll · chaos · trophy')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    ${youCard}${fromQR ? joinCard + hostCard : hostCard + joinCard}${tvCard}
    <div class="credit">💡 Inspired by <b>Chungus Odyssey 2</b> — an original game, not affiliated with it.<br>
        Trekker sprites by <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0 1.0, public domain).</div>`;
}

function renderLobbyH() {
    const pList = H.players.map((p, i) =>
        `<div class="player-row">
            <div class="pav">${miniTrekHTML(p)}</div>
            <div style="flex:1">${esc(p.name)}${i === 0 ? ' <span style="color:var(--muted)">(you — host)</span>' : ''}</div>
            <div class="dot"></div>
        </div>`).join('');
    return `
    ${hdrHTML('Host Lobby')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    <div class="card highlight">
        <div class="slbl">Scan to join — or share the code</div>
        <div class="qr-wrap">${qrSVG(joinURL())}</div>
        <div class="room-code">${esc(roomCode)}</div>
        <div class="share-row">
            <button class="btn btn-g btn-sm"
                onclick="navigator.clipboard&&navigator.clipboard.writeText(joinURL()).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='📋 Copy link',1500)})">📋 Copy link</button>
            <button class="btn btn-g btn-sm"
                onclick="navigator.share&&navigator.share({title:'Join Plump Trek',text:'Room code: ${esc(roomCode)}',url:joinURL()})">📤 Share</button>
        </div>
        <div style="font-size:.68rem;color:var(--muted);text-align:center">Put the TV screen up with code <b style="color:var(--gold)">${esc(roomCode)}</b></div>
    </div>
    <div class="card">
        <div class="slbl">Players (${H.players.length}/${MAX_PLAYERS})</div>
        ${pList}
    </div>
    <div class="card">${avatarPickerHTML({ taken: H.players.map(p => p.seat),
                                           mine: (H.players.find(p => p.id === myId) || {}).seat })}</div>
    <div class="card">
        <div class="slbl">Settings</div>
        ${settingsSegsHTML(H.settings, patch => `hostSet(${patch})`)}
    </div>
    <button class="btn btn-k btn-full" style="font-size:1.08rem;padding:16px" onclick="hostStartGame()">🎲 Start the trek</button>`;
}

function renderLobbyG() {
    const cap = isCaptain();
    const pList = (D.players || []).map(p =>
        `<div class="player-row">
            <div class="pav">${miniTrekHTML(p)}</div>
            <div style="flex:1">${esc(p.name)}${p.name === myName ? ' <span style="color:var(--muted)">(you)</span>' : ''}${D.tvHost && p.name === D.captain ? ' 👑' : ''}</div>
            <div class="dot"></div>
        </div>`).join('');
    const s = D.settings || {};
    return `
    ${hdrHTML(cap ? '👑 You are the Captain' : 'Lobby')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    <div class="card">
        <div class="slbl">Room ${esc(D.roomCode || '')} — Players (${(D.players || []).length}/${MAX_PLAYERS})</div>
        ${pList}
    </div>
    <div class="card">${avatarPickerHTML({ taken: D.taken || [], mine: mySeatNow(D) })}</div>
    ${cap ? `
    <div class="card highlight">
        <div class="slbl">👑 Captain's Settings</div>
        ${settingsSegsHTML(s, patch => `guestCtl('set',${patch})`)}
    </div>
    <button class="btn btn-k btn-full" style="font-size:1.08rem;padding:16px" onclick="guestCtl('start')">🎲 Start the trek</button>`
    : `
    <div class="card">
        <div class="slbl">Settings</div>
        <div style="font-weight:800;font-size:.85rem">${esc(settingsSummary(s))}</div>
        <div style="color:var(--muted);font-size:.74rem;font-weight:700;margin-top:8px">
            Waiting for ${D.tvHost ? `👑 ${esc(D.captain || 'the captain')}` : 'the host'} to start…
        </div>
    </div>`}`;
}

function tvShell(inner, meta) {
    return `<div class="tv">
        <div class="tv-top">
            <div class="tv-logo">🐇 PLUMP TREK</div>
            <div class="tv-meta">${esc(meta || ('Room ' + (vD.roomCode || roomCode || '')))}</div>
        </div>
        ${inner}
    </div>`;
}

// ═══════════════════════════════════════════
// SELF-PLAYING DEMO (?mode=tvsimulation | playersimulation)
// ═══════════════════════════════════════════
let simTimer = null, simMode = 'tv';
const SIM_NAMES = ['Ace', 'Bux', 'Cass', 'Duke', 'Edie', 'Fox', 'Gwen', 'Hank'];

function startSimulation(nPlayers, mode) {
    simMode = mode || 'tv';
    isHost = true; isTvHost = simMode === 'tv';
    roomCode = 'DEMO';
    myId = 'sim-host';
    if (isTvHost) document.body.classList.add('viewer-mode');
    H.players = [];
    for (let i = 0; i < Math.max(2, Math.min(nPlayers || 4, MAX_PLAYERS)); i++) {
        hostAddPlayer('sim-' + i, SIM_NAMES[i % SIM_NAMES.length], i);
        guestConns['sim-' + i] = { peer: 'sim-' + i, send() {} };   // stub: bots count as present
    }
    H.settings.length = 'short';
    hostStartGame();
    if (!isTvHost) { myId = 'sim-0'; applyMsg(stateFor(H.players[0])); }
    simTimer = setInterval(simDrive, 900);
}
// The bots only ever do the thing the game is waiting for — which makes this a decent
// smoke test of the whole loop as well as an attract mode.
function simDrive() {
    if (!H.players.length) return;
    if (H.phase === 'podium') { clearInterval(simTimer); simTimer = setTimeout(() => { hostNewGame(); hostStartGame(); simTimer = setInterval(simDrive, 900); }, 5000); return; }
    const p = turnPlayer();
    if (H.phase === 'turn' && p) { hostRoll(p); return; }
    if (H.phase === 'card' && H.card && H.card.dare !== false) {
        const who = H.players.find(x => x.id === H.card.who);
        if (who && H.card.o && H.card.o.dare) hostDone(who);
        return;
    }
    if (H.phase === 'choose' && H.choice) {
        const who = H.players.find(x => x.id === H.choice.who);
        const opts = H.choice.opts || [];
        const pick = opts.length ? (typeof opts[0] === 'object' ? opts[Math.floor(Math.random() * opts.length)].id : opts[Math.floor(Math.random() * opts.length)]) : 0;
        if (who) hostChoose(who, H.choice.kind === 'route' ? Math.round(Math.random()) : pick);
        return;
    }
    if (H.phase === 'finale' && H.finaleState) {
        const st = H.finaleState;
        if (st.kind === 'rps') { const throwIt = ['rock', 'paper', 'scissors'];
            [st.a, st.b].forEach(id => { const q = H.players.find(x => x.id === id); if (q && !st.picks[id]) finaleRps(q, throwIt[Math.floor(Math.random() * 3)]); }); return; }
        if (st.kind === 'vote') { const v = H.players.find(x => x.id !== st.a && x.id !== st.b && !st.votes[x.id]);
            if (v) finaleVote(v, Math.random() < 0.5 ? st.a : st.b); return; }
    }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    $id('tog-music').classList.toggle('off', !musicOn);
    $id('tog-sfx').classList.toggle('off', !sfxOn);
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    if (fSeat === null) fSeat = Math.floor(Math.random() * AUTO_SEATS);   // one is picked for you
    // A refresh mid-game shouldn't cost you your seat: if this tab was already in a
    // room, walk straight back in (the host restores the slot by device id/name).
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
