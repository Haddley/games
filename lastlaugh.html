<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Last Laugh — funniest card wins</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a0f24' width='100' height='100' rx='20'/><text x='50' y='70' font-size='54' text-anchor='middle'>😂</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="common.js?v=20260817-0cff424"></script><script src="fx.js?v=20260817-0cff424"></script><script src="audio.js?v=20260817-0cff424"></script>
    <script src="p2p.js?v=20260817-0cff424"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0f24; --panel: rgba(50,28,68,0.75); --panel2: rgba(66,38,92,0.85);
            --border: rgba(255,210,63,0.28); --border2: rgba(180,130,220,0.30);
            --text: #f5ecff; --muted: #b199cf;
            --gold: #ffd23f; --pink: #ff5d9e; --good: #4ade80; --bad: #f87171;
            --paper: #fbf3e6; --ink: #2a1a3a; --ink-soft: #6a5680;
        }
        body.day {
            --bg: #f4ecf7; --panel: rgba(255,255,255,0.93); --panel2: #ffffff;
            --border: rgba(70,40,90,0.16); --border2: rgba(70,40,90,0.16);
            --text: #241033; --muted: #6b5580;
            --gold: #c78a08; --pink: #e8467d; --good: #2f9e5b; --bad: #d64545;
            --paper: #fffcf6; --ink: #2a1436; --ink-soft: #6b5580;
        }
        body.day::before { opacity: .5; }
        body.day input[type=text] { background: rgba(70,40,90,.05); }
        body.day .av,
        body.day .pav { background: rgba(70,40,90,.05); }
        body.day .btn-g { background: rgba(70,40,90,.06); }
        body.day .timebar-wrap,
        body.day .tv-timebar-wrap { background: rgba(70,40,90,.12); }
        body.day #sound-togs button { background: rgba(255,255,255,.85); }
        body.day .card { box-shadow: 0 10px 26px rgba(70,40,90,.14); }
        body.day .err { color: #b91c1c; }
        body.day .win-banner { color: #15803d; }
        body.day .chip.gd { color: #15803d; }
        body.day .rail-row .rdelta { color: #15803d; text-shadow: none; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
            padding: 26px 16px 48px; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255,93,158,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 8% 100%, rgba(255,210,63,0.11) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 92% 100%, rgba(150,90,230,0.13) 0%, transparent 65%);
        }
        body.viewer-mode { padding: 0; overflow: hidden; display: block; height: 100dvh; width: 100vw; }

        /* drifting comedy-club ambience — masks, cards & laughter behind everything */
        #laf-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        #laf-bg span {
            position: absolute; bottom: -12vh; left: var(--x); font-size: var(--s, 2rem); opacity: 0;
            filter: drop-shadow(0 3px 9px rgba(0,0,0,.35));
            animation: lafFloat var(--d, 27s) linear var(--dl, 0s) infinite;
        }
        @keyframes lafFloat {
            0%   { transform: translateY(0) rotate(-12deg); opacity: 0; }
            12%  { opacity: .075; }
            88%  { opacity: .075; }
            100% { transform: translateY(-124vh) rotate(14deg); opacity: 0; }
        }

        h1.logo {
            font-family: 'Fraunces', serif; font-weight: 900; letter-spacing: 1px;
            font-size: clamp(1.7rem, 7vw, 2.6rem); text-align: center; color: var(--gold);
            text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 34px rgba(255,210,63,.35);
        }
        h1.logo .hh { color: var(--pink); }
        .sub { color: var(--muted); font-size: .7rem; letter-spacing: 2.5px; text-transform: uppercase; margin: 7px 0 22px; text-align: center; }

        #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 13px; }
        body.viewer-mode #app { max-width: none; height: 100dvh; display: block; }

        .card {
            background: var(--panel); border: 1px solid var(--border2); border-radius: 17px;
            padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,.5);
        }
        .card.highlight { border-color: var(--gold); box-shadow: 0 0 26px rgba(255,210,63,.16), 0 12px 34px rgba(0,0,0,.5); }
        .slbl { font-size: .66rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }

        .fg { margin-bottom: 12px; }
        .fg label { display: block; font-size: .66rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
        input[type=text] {
            width: 100%; padding: 12px 14px; font-family: inherit; font-size: 1rem; font-weight: 700;
            border: 2px solid var(--border2); border-radius: 12px; background: rgba(26,15,36,.7); color: var(--text);
            outline: none;
        }
        input[type=text]:focus { border-color: var(--pink); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; font-weight: 900; font-size: .93rem; letter-spacing: .5px;
            padding: 13px 18px; border: none; border-radius: 13px; cursor: pointer;
            transition: filter .12s, opacity .12s; user-select: none; -webkit-user-select: none;
            color: var(--text);
        }
        .btn:active { filter: brightness(1.15); }
        .btn-p { background: linear-gradient(180deg, #ffe07a, #f5b623); color: #3a2600; box-shadow: 0 5px 0 #96661a, 0 10px 22px rgba(255,210,63,.3); }
        .btn-k { background: linear-gradient(180deg, #ff7bb2, #ef3e82); color: #fff; box-shadow: 0 5px 0 #8f1f53, 0 10px 22px rgba(255,93,158,.35); }
        .btn-g { background: rgba(180,130,220,.14); box-shadow: inset 0 0 0 2px var(--border2); }
        .btn-full { width: 100%; }
        .btn-sm { padding: 8px 13px; font-size: .76rem; border-radius: 11px; }
        .btn:disabled { opacity: .4; cursor: default; }

        .err {
            background: rgba(248,113,113,.13); border: 1px solid rgba(248,113,113,.5); color: #fda4af;
            padding: 11px 14px; border-radius: 12px; font-size: .8rem; font-weight: 700; text-align: center;
        }
        hr { border: none; border-top: 1px dashed var(--border2); margin: 13px 0; }

        .connecting { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 46px 0; color: var(--muted); font-weight: 700; }
        .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(255,210,63,.15); border-top-color: var(--gold); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avrow { display: flex; flex-wrap: wrap; gap: 7px; }
        .av {
            width: 42px; height: 42px; border-radius: 12px; font-size: 1.35rem; display: flex; align-items: center; justify-content: center;
            background: rgba(26,15,36,.7); border: 2px solid var(--border2); cursor: pointer;
        }
        .av.sel { border-color: var(--pink); background: rgba(255,93,158,.18); box-shadow: 0 4px 12px rgba(255,93,158,.35); }

        .player-row { display: flex; align-items: center; gap: 11px; padding: 8px 4px; border-bottom: 1px dashed var(--border2); font-weight: 800; font-size: .92rem; }
        .player-row:last-child { border-bottom: none; }
        .pav { width: 38px; height: 38px; border-radius: 11px; background: rgba(26,15,36,.7); border: 2px solid var(--border2); font-size: 1.25rem; display: flex; align-items: center; justify-content: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); margin-left: auto; }
        .qr-wrap { width: min(210px, 58vw); margin: 6px auto 10px; border-radius: 13px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
        .qr-wrap svg { display: block; width: 100%; height: auto; }
        .room-code { font-family: 'Fraunces', serif; font-weight: 900; font-size: 2.3rem; letter-spacing: 12px; text-align: center; color: var(--gold); padding-left: 12px; }
        .share-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
        .seg-row { display: flex; flex-wrap: wrap; gap: 7px; }

        /* prompt + countdown */
        .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .timebar-wrap { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
        .timebar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .2s linear; }
        .q-prompt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.28rem; line-height: 1.45; }
        .q-prompt .blank { color: var(--pink); border-bottom: 3px dotted var(--pink); }
        .q-prompt .hl { color: var(--pink); }

        /* judge / role notes */
        .lie-note { text-align: center; font-weight: 900; color: var(--gold); padding: 6px 0; }
        .win-banner {
            background: rgba(74,222,128,.13); border: 1px solid rgba(74,222,128,.5); color: #86efac;
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }
        .judge-note {
            background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold);
            border-radius: 13px; padding: 12px; font-weight: 900; text-align: center;
        }

        /* card wall (phone) — hand + judge wall */
        .wall { display: flex; flex-direction: column; gap: 9px; }
        .wall-card {
            border: none; border-radius: 13px; padding: 13px 14px; text-align: left; cursor: pointer;
            background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: .92rem; line-height: 1.35;
            box-shadow: 0 4px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.35);
            display: flex; gap: 10px; align-items: center;
            transition: opacity .2s, outline .1s, transform .1s;
        }
        .wall-card .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .72rem; color: var(--ink-soft); letter-spacing: 1px; }
        .wall-card.mine { opacity: .55; cursor: default; }
        .wall-card.mine::after { content: 'your card 😂'; margin-left: auto; font-family: 'Nunito', sans-serif; font-size: .66rem; font-weight: 900; color: var(--pink); white-space: nowrap; }
        .wall-card.pick-sel { outline: 4px solid var(--pink); outline-offset: 2px; transform: translateX(4px); }
        .wall-card.picked { outline: 4px solid var(--pink); outline-offset: 2px; }
        .wall-card.won { outline: 4px solid var(--good); outline-offset: 2px; }
        .wall-card.faded { opacity: .4; }
        .wall-card .ord { margin-left: auto; background: var(--pink); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .78rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

        /* reveal (phone) */
        .verdict { text-align: center; padding: 8px 0 4px; }
        .verdict .vico { font-size: 3rem; }
        .verdict .vt { font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem; margin-top: 4px; }
        .verdict .vpts { font-size: 2rem; font-weight: 900; color: var(--gold); margin-top: 2px; }
        .verdict .vcard { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.02rem; color: var(--text); background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 12px; background: rgba(255,210,63,.13); border: 1px solid var(--border); color: var(--gold); font-weight: 900; font-size: .76rem; margin: 3px; }
        .chip.pk { background: rgba(255,93,158,.13); border-color: rgba(255,93,158,.45); color: var(--pink); }
        .chip.gd { background: rgba(74,222,128,.13); border-color: rgba(74,222,128,.45); color: #86efac; }
        .standings .sc { margin-left: auto; font-weight: 900; }
        .standings .delta { color: var(--good); font-size: .75rem; font-weight: 900; margin-left: 7px; }

        /* ═════════ TV ═════════ */
        .tv { height: 100dvh; display: flex; flex-direction: column; padding: 2.8vmin 3.4vmin; gap: 2vmin; }
        .tv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; }
        .tv-logo { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.3vmin; color: var(--gold); text-shadow: 0 0 24px rgba(255,210,63,.4); }
        .tv-meta { font-size: 1.8vmin; font-weight: 900; letter-spacing: .35vmin; text-transform: uppercase; color: var(--muted); }
        .tv-main { flex: 1; display: flex; gap: 2.4vmin; min-height: 0; }
        .tv-stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 1.6vmin; }
        .tv-rail { width: 29vmin; min-width: 230px; display: flex; flex-direction: column; gap: 1.3vmin; overflow: hidden; }
        .rail-title { font-size: 1.6vmin; font-weight: 900; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); }
        .rail-row {
            display: flex; align-items: center; gap: 1.1vmin; background: var(--panel);
            border: 1px solid var(--border2); border-radius: 1.5vmin; padding: 1.1vmin 1.4vmin;
            font-weight: 800; font-size: 1.95vmin; position: relative;
        }
        .rail-row.judge { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,63,.2); }
        .rail-row .rav { font-size: 2.5vmin; }
        .rail-row .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rail-row .rsc { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
        .rail-row .rdelta { position: absolute; right: 1vmin; top: -1.2vmin; font-size: 1.6vmin; font-weight: 900; color: #86efac; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
        .rail-row.done::after { content: '✓'; color: var(--good); font-weight: 900; font-size: 1.9vmin; }
        .rail-row.judge::after { content: '👑'; font-size: 1.9vmin; }

        .tv-qcard {
            background: var(--panel); border: 1px solid var(--border); border-radius: 2.2vmin;
            padding: 3.2vmin 4vmin; box-shadow: 0 16px 50px rgba(0,0,0,.5);
        }
        .tv-qcard .kicker { font-size: 1.6vmin; font-weight: 900; letter-spacing: .4vmin; text-transform: uppercase; color: var(--pink); margin-bottom: 1.2vmin; }
        .tv-qcard .q { font-family: 'Fraunces', serif; font-weight: 900; font-size: 3.6vmin; line-height: 1.4; }
        .tv-qcard .q .blank { color: var(--pink); border-bottom: .5vmin dotted var(--pink); }
        .tv-qcard .q .hl { color: var(--pink); }
        .tv-counter { text-align: center; font-size: 2.2vmin; font-weight: 900; color: var(--gold); }
        .tv-timebar-wrap { flex: 0 0 auto; height: 1.5vmin; border-radius: .8vmin; background: rgba(255,255,255,.08); overflow: hidden; }
        .tv-timebar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--pink)); border-radius: .8vmin; transition: width .2s linear; }

        .tv-wall { flex: 1; display: grid; gap: 1.5vmin; grid-template-columns: repeat(auto-fit, minmax(26vmin, 1fr)); align-content: center; overflow: auto; }
        .tv-lie {
            background: var(--paper); color: var(--ink); border-radius: 1.5vmin; padding: 1.8vmin 2vmin;
            font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 2vmin; line-height: 1.35;
            box-shadow: 0 8px 22px rgba(0,0,0,.4); position: relative; min-height: 8vmin;
            display: flex; flex-direction: column; justify-content: center;
        }
        .tv-lie .let { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.3vmin; letter-spacing: .3vmin; color: var(--ink-soft); display: block; margin-bottom: .6vmin; }
        .tv-lie.deal { animation: flipIn .5s ease both; }
        @keyframes flipIn { from { opacity: 0; transform: rotateX(80deg); } to { opacity: 1; transform: none; } }
        .tv-lie.is-win { outline: .55vmin solid var(--good); outline-offset: .3vmin; box-shadow: 0 0 34px rgba(74,222,128,.4); }
        .tv-lie.dim { opacity: .5; }
        .tv-lie .authors { position: absolute; top: -1.6vmin; right: 1vmin; font-size: 2.4vmin; }
        .tv-lie .tag { font-family: 'Nunito', sans-serif; font-size: 1.2vmin; font-weight: 900; letter-spacing: .2vmin; text-transform: uppercase; color: var(--ink-soft); margin-top: 1vmin; }
        .tv-lie .tag.win { color: #15803d; }

        /* TV lobby handled by common.js tvLobby() */
        .tv-waiting { color: var(--muted); font-weight: 800; font-size: 1.9vmin; }

        /* podium */
        .podium-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2.4vmin; padding-bottom: 1.5vmin; }
        .pod { text-align: center; font-weight: 900; animation: podRise .6s cubic-bezier(.2,.8,.3,1) both; }
        .pod .pav-big { font-size: 4.8vmin; }
        .pod .pname { font-size: 2.3vmin; margin-bottom: .8vmin; }
        .pod .pscore { font-size: 1.9vmin; color: var(--gold); margin-bottom: .8vmin; }
        .pod .block { border-radius: 1.5vmin 1.5vmin 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 1.3vmin; font-size: 3.2vmin; width: 17vmin; }
        .pod.p1 .block { height: 21vmin; position: relative; overflow: hidden; }
        .pod.p1 .block::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 36%, rgba(255,255,255,.55) 50%, transparent 64%);
            transform: translateX(-120%); animation: podShine 2.4s 1s ease-in-out infinite;
        }
        @keyframes podShine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
        .pod.p2 .block { height: 14vmin; }
        .pod.p3 .block { height: 9.5vmin; }
        .pod.mrank-0 .block { background: linear-gradient(180deg, #ffe07a, #96661a); }
        .pod.mrank-1 .block { background: linear-gradient(180deg, #d7d7e0, #8f8fa3); }
        .pod.mrank-2 .block { background: linear-gradient(180deg, #e8a06a, #9c5a33); }
        .awards-row { display: flex; gap: 1.5vmin; justify-content: center; flex-wrap: wrap; padding-bottom: 1.5vmin; }
        .award { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5vmin; padding: 1.3vmin 2vmin; font-weight: 800; font-size: 1.8vmin; text-align: center; }
        .award .aw-t { color: var(--gold); font-weight: 900; }

        #confetti-cv { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

        /* sound toggles */
        #sound-togs { position: fixed; top: 10px; right: 10px; z-index: 80; display: flex; gap: 6px; }
        #sound-togs button {
            width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem;
            background: rgba(50,28,68,.82); box-shadow: inset 0 0 0 1px var(--border2);
            transition: opacity .2s, transform .12s;
        }
        #sound-togs button:active { transform: scale(.88); }
        #sound-togs button.off { opacity: .35; filter: grayscale(1); }
        body.viewer-mode #sound-togs { top: auto; bottom: 12px; right: 12px; }

        /* FX layer — particles + score pops */
        .pt {
            position: fixed; width: 9px; height: 9px; border-radius: 2px;
            z-index: 950; pointer-events: none;
            animation: ptFly .75s cubic-bezier(.15,.65,.4,1) forwards;
        }
        @keyframes ptFly {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(560deg) scale(.3); opacity: 0; }
        }
        .pop {
            position: fixed; z-index: 960; pointer-events: none;
            font-family: 'Fraunces', serif; font-weight: 900; font-size: 1.5rem;
            animation: popUp 1.1s cubic-bezier(.2,.8,.3,1) forwards;
            text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: nowrap;
        }
        .pop.good { color: var(--good); }
        .pop.gold { color: var(--gold); }
        .pop.bad  { color: var(--bad); font-size: 1rem; }
        @keyframes popUp {
            0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
            15%  { transform: translate(-50%, -12px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -78px) scale(1); opacity: 0; }
        }

        /* screen entrances — only on phase changes (#app.fresh) */
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        #app.fresh .card { animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes wallIn { from { opacity: 0; transform: scale(.9) translateY(10px); } to { opacity: 1; transform: none; } }
        #app.fresh .wall-card { animation: wallIn .32s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 45ms); }

// Substitute played noun-phrase card(s) into a blank template, in order; fix the
// opening capital and ensure a trailing full stop.
function fillBlank(template, cards) {
    let i = 0;
    let out = String(template).replace(/_{2,}/g, () => cards[i] != null ? cards[i++] : (i++, '____'));
    out = out.replace(/^(\s*)([a-z])/, (m, sp, ch) => sp + ch.toUpperCase());
    out = out.trim();
    if (!/[.!?]$/.test(out)) out += '.';
    return out;
}
// The text that appears ON a played card in the reveal/judge wall.
function cardDisplay(prompt, texts) {
    if (prompt && prompt.t === 'blank') return fillBlank(prompt.text, texts);
    return texts[0] || '';
}
// How many cards a non-judge must play for a prompt.
function promptN(p) { return p && p.t === 'blank' ? (p.n || 1) : 1; }
// HTML for the prompt itself (phone + used inside TV .q).
function promptHTML(p) {
    if (!p) return '';

    return esc(p.text).replace(/_{2,}/g, '<span class="blank">______</span>');

function ac() {
    if (!AC) {
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);

        const fb = AC.createGain(); fb.gain.value = 0.2;

        leadBus.connect(musicDelay); musicDelay.connect(dlp); dlp.connect(fb); fb.connect(musicDelay);

        const len = AC.sampleRate * 1.2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();

}

function noiseHit(dur, { vol = 0.3, when = 0, hp = 6000, dest = null } = {}) {
    if (!AC) return;

    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || sfxGain);

            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        } else if (H.phase === 'submit') maybeEndSubmit();
        else if (H.phase === 'judge') { if (H.judge && conn.peer === H.judge.id) autoPick(); }
    });
    conn.on('error', e => console.warn('conn err', e));
}

function applySettings(o) {
    if (o.deckId && getDecks().some(d => d.id === o.deckId)) H.settings.deckId = o.deckId;
    if (['both', 'adj', 'blank'].includes(o.style)) H.settings.style = o.style;
    if ([3, 5, 7].includes(o.targetScore)) H.settings.targetScore = o.targetScore;
}
function hostCtl(action, msg) {
    if (action === 'start' && H.phase === 'lobby') hostStartGame();
    else if (action === 'next' && H.phase === 'reveal') afterReveal();
    else if (action === 'again' && H.phase === 'podium') hostNewGame();
    else if (action === 'set' && H.phase === 'lobby') { applySettings(msg); broadcastLobby(); }
}
function guestCtl(action, extra) {

    if (hostConn) send(hostConn, { type: 'ctl', action, ...(extra || {}) });
}
function hostSet(patch) {

    broadcastLobby();
    if (ui === 'lobby_h') render();
}

// ── Create / join ──

// Re-asked whenever somebody arrives or leaves (common.js watchPresence). These are the same
// "has everyone had their turn yet?" checks the message handlers call — the point is that a
// player LEAVING can make one true, and nothing else would ever ask again.
function hostPresenceRecheck() {
    if (!isHost) return;
    if (typeof maybeEndSubmit === 'function') maybeEndSubmit();
}

function makeRoom(onOpen) {
    forgetRoom();                    // hosting now — this tab is nobody's guest
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; if (typeof watchPresence === 'function') watchPresence(hostPresenceRecheck); onOpen(); },
        onConnection: conn => setupGuestConn(conn),

}
function hostGame(name) {

}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); tvHostSync(); render(); });
}
function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Player';
    myAvatar = fAvatar || AVATARS[Math.floor(Math.random() * AVATARS.length)];
    saveName(myName);
    localStorage.setItem('laf-avatar', myAvatar);
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'player'); send(hostConn, { type: 'join', cid: clientId(), build: typeof BUILD !== 'undefined' ? BUILD : null, name: myName, avatar: myAvatar }); if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} }); });
            hostConn.on('data', msg => applyMsg(msg));
        },
        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game — tap Join to get back in.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });

function joinAsViewer(code) {

    uiErr = ''; ui = 'connecting'; render();
    let connected = false;

        hostFullId: PFX + code.trim().toUpperCase(),

        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function tvHostSync() { if (isTvHost) applyViewerMsg(viewerSnapshot()); }
function hostSyncSelf(msg) {

// ═══════════════════════════════════════════
// HOST GAME FLOW
// ═══════════════════════════════════════════
function clearHostTimers() { clearTimeout(_phaseTimeout); }
function selfPlayer() { return H.players.find(p => p.id === myId); }

function buildPrompts() {
    const style = H.settings.style;
    let pool = H.deck.prompts.filter(p => style === 'both' || p.t === style);
    if (!pool.length) pool = H.deck.prompts;   // never empty
    H.prompts = shuffle(pool);
    H.pIndex = -1;
}

function hostStartGame() {
    if (connectedPlayers().length < MIN_PLAYERS) { uiErr = 'Need at least ' + MIN_PLAYERS + ' players.'; if (ui === 'lobby_h') render(); return; }
    clearHostTimers();
    H.deck = getDecks().find(d => d.id === H.settings.deckId) || getDecks()[0];
    H.drawPile = shuffle(H.deck.responses);
    buildPrompts();
    H.round = 0;
    H.judgeIndex = Math.floor(Math.random() * H.players.length);
    H.players.forEach(p => { p.score = 0; p.wins = 0; p.lastDelta = 0; p.hand = []; p._played = null; dealTo(p); });
    nextRound();
}

function nextRound() {
    clearHostTimers();
    H.round += 1;
    H.pIndex += 1;
    if (H.pIndex >= H.prompts.length) buildPrompts(), H.pIndex = 0;
    H.cur = H.prompts[H.pIndex];
    H.judge = H.players[H.judgeIndex % H.players.length];
    H.cards = []; H.picked = null;
    H.players.forEach(p => { p._played = null; p.lastDelta = 0; dealTo(p); });
    H.phase = 'submit';
    broadcastPlayers(p => submitMsgFor(p));
    broadcastViewers(viewerSubmitMsg());
    hostSyncSelf(isTvHost ? null : submitMsgFor(selfPlayer()));
    _phaseTimeout = setTimeout(forceEndSubmit, SUBMIT_SECS * 1000 + 800);
}

function hostPlay(player, round, cards, conn) {
    if (H.phase !== 'submit' || round !== H.round || !nonJudge(player) || player._played) return;
    const need = promptN(H.cur);
    if (!Array.isArray(cards) || cards.length !== need) return;
    // validate each card is in the player's hand (handle duplicates by removing instances)
    const work = player.hand.slice();
    const chosen = [];
    for (const t of cards) {
        const idx = work.indexOf(t);
        if (idx < 0) return;   // not a real card — reject the whole play
        work.splice(idx, 1);
        chosen.push(t);
    }
    player.hand = work;
    player._played = chosen;
    dealTo(player);
    if (conn) send(conn, { type: 'play_ack', hand: player.hand });
    else if (player.id === myId) applyMsg({ type: 'play_ack', hand: player.hand });
    broadcastViewers(viewerSubmitMsg());
    if (isTvHost) tvHostSync();
    maybeEndSubmit();
}

function maybeEndSubmit() {
    if (H.phase !== 'submit') return;
    const act = activeNonJudges();
    if (act.length && act.every(p => p._played)) {
        clearHostTimers();
        _phaseTimeout = setTimeout(startJudge, 700);
    }
}
function forceEndSubmit() {
    if (H.phase !== 'submit') return;
    // auto-play a random card for any non-judge who didn't submit
    activeNonJudges().forEach(p => {
        if (p._played) return;
        const need = promptN(H.cur);
        const picks = shuffle(p.hand).slice(0, need);
        if (picks.length === need) hostPlay(p, H.round, picks, guestConns[p.id] || null);
    });
    if (H.phase === 'submit') startJudge();
}

function startJudge() {
    if (H.phase !== 'submit') return;
    clearHostTimers();
    const plays = activeNonJudges().filter(p => p._played);
    const cards = plays.map(p => ({ authorId: p.id, texts: p._played, display: cardDisplay(H.cur, p._played) }));
    H.cards = shuffle(cards).map((c, i) => ({ ...c, key: i }));
    H.picked = null;
    H.phase = 'judge';
    broadcastPlayers(p => judgeMsgFor(p));
    broadcastViewers(viewerJudgeMsg());
    hostSyncSelf(isTvHost ? null : judgeMsgFor(selfPlayer()));
    _phaseTimeout = setTimeout(autoPick, JUDGE_SECS * 1000 + 800);
}

function autoPick() {
    if (H.phase !== 'judge' || !H.cards.length || H.picked != null) return;
    const c = H.cards[Math.floor(Math.random() * H.cards.length)];
    finishPick(c.key);
}

function hostPick(player, round, key, conn) {
    if (H.phase !== 'judge' || round !== H.round || !H.judge || player.id !== H.judge.id || H.picked != null) return;
    if (!H.cards.find(c => c.key === key)) return;
    finishPick(key);
}

function finishPick(key) {
    clearHostTimers();
    H.picked = key;
    const card = H.cards.find(c => c.key === key);
    const byId = id => H.players.find(p => p.id === id);
    const author = byId(card.authorId);
    if (author) { author.score += 1; author.wins += 1; author.lastDelta = 1; }
    H.phase = 'reveal';
    const isLast = !!(author && author.score >= H.settings.targetScore);

    const fullCards = () => H.cards.map(c => ({
        key: c.key, display: c.display, won: c.key === key,
        author: { name: byId(c.authorId)?.name, avatar: byId(c.authorId)?.avatar },
    }));

    H.lastRevealFor = (p) => ({
        type: 'reveal', round: H.round, prompt: H.cur, cards: fullCards(),
        winnerKey: key, winner: author ? { name: author.name, avatar: author.avatar } : null,
        winCard: card.display, judge: judgeInfo(),
        my: p ? { won: card.authorId === p.id, delta: card.authorId === p.id ? 1 : 0, isJudge: !!(H.judge && p.id === H.judge.id) } : null,
        standings: standings(), isLast, target: H.settings.targetScore, ...capt(),
    });
    H.lastReveal = { ...H.lastRevealFor(null), type: 'viewer_reveal', players: railPlayers() };

    broadcastPlayers(p => H.lastRevealFor(p));
    broadcastViewers(H.lastReveal);
    hostSyncSelf(isTvHost ? null : H.lastRevealFor(selfPlayer()));
}

function afterReveal() {
    const winnerReached = H.players.some(p => p.score >= H.settings.targetScore);
    if (winnerReached) { showPodium(); return; }
    H.judgeIndex = (H.judgeIndex + 1) % H.players.length;   // rotate the judge
    nextRound();
}

function showPodium() {
    clearHostTimers();
    H.phase = 'podium';
    const st = standings();
    const awards = [];
    const top = st[0];
    if (top) awards.push({ emoji: '😂', title: 'The Last Laugh', name: top.name, detail: top.wins + (top.wins === 1 ? ' laugh' : ' laughs') });
    const msg = { type: 'podium', standings: st, awards, ...capt() };
    H.lastPodium = { ...msg, type: 'viewer_podium' };
    broadcastPlayers(msg);
    broadcastViewers(H.lastPodium);
    hostSyncSelf(msg);
}

function hostNewGame() {
    clearHostTimers();
    H.phase = 'lobby';
    H.prompts = []; H.pIndex = -1; H.cur = null; H.cards = []; H.picked = null; H.round = 0; H.judge = null;
    H.players.forEach(p => { p.score = 0; p.wins = 0; p.lastDelta = 0; p._played = null; });
    H.players = H.players.filter(p => p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]);
    broadcastLobby();
    if (isHost && !isTvHost) { ui = 'lobby_h'; render(); }
}

// ═══════════════════════════════════════════
// CLIENT (phone) MESSAGE HANDLING
// ═══════════════════════════════════════════
function stopClientTimers() { clearInterval(_clientTick); _clientTick = null; musicUrgent = false; }

let _lastTickSec = -1;
function startCountdown(seconds) {
    qEndsAt = Date.now() + seconds * 1000;
    stopClientTimers();
    _lastTickSec = -1;
    _clientTick = setInterval(() => {
        const left = Math.max(0, qEndsAt - Date.now());
        const bar = $id('q-timebar'), num = $id('q-timenum');
        if (bar) bar.style.width = (left / (seconds * 1000) * 100) + '%';
        if (num) num.textContent = Math.ceil(left / 1000);
        const low = left <= 8000 && left > 0;
        if (bar) bar.classList.toggle('low', low);
        if (num) num.classList.toggle('low', low);
        musicUrgent = low;
        if (low) { const sec = Math.ceil(left / 1000); if (sec !== _lastTickSec) { _lastTickSec = sec; sTick(); } }
        if (left <= 0) stopClientTimers();
    }, 200);
}

function applyMsg(msg) {
    switch (msg.type) {
        // the host is on a newer build than this page — offer the one-tap fix
        case 'version': if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return;
        case 'lobby': {
            const prevN = D && D.type === 'lobby' ? (D.players || []).length : -1;
            D = msg;
            stopClientTimers();
            setMusic('lobby');
            if (prevN >= 0 && (msg.players || []).length > prevN) sJoin();
            ui = (isHost && !isTvHost) ? 'lobby_h' : 'lobby_g';
            render();
            break;
        }
        case 'submit_phase': {
            // A rejoin (page refresh, or a brief drop caught by joinPeer's auto-rejoin) gets
            // sent the SAME phase again via phaseSnapshotFor — round tells a genuinely new
            // round apart from a resync of the one already in progress. Without this check,
            // every resync wiped whatever the player had already picked and restarted their
            // countdown from full, even mid-round.
            const fresh = !D || D.type !== 'submit_phase' || D.round !== msg.round;
            D = msg;
            ui = 'submit';
            setMusic('scheme');
            if (fresh) {
                mySel = []; playLocked = false; myPick = null; pickLocked = false;
                if (msg.round === 1) sStart(); else sPhase();
                render();
                startCountdown(msg.seconds);
            } else render();
            break;
        }
        case 'play_ack':
            playLocked = true;
            if (msg.hand) D.hand = msg.hand;
            musicIntensity = 2;
            sPlay();
            if (ui === 'submit') render();
            break;
        case 'judge_phase': {
            const fresh = !D || D.type !== 'judge_phase' || D.round !== msg.round;
            D = msg;
            ui = 'judge';
            setMusic('vote');
            if (fresh) {
                myPick = null; pickLocked = false;
                sFlip();
                render();
                startCountdown(msg.seconds);
            } else render();
            break;
        }
        case 'reveal':
            D = msg;
            stopClientTimers();
            ui = 'reveal';
            setMusic('reveal');
            musicKeyShift = msg.isLast ? 2 : 0;
            render();
            if (msg.my && msg.my.won) {
                sLaugh();
                setTimeout(() => {
                    burstAt('.verdict .vico', ['#ffd23f', '#4ade80', '#ff5d9e']);
                    const v = document.querySelector('.verdict');
                    if (v) { const r = v.getBoundingClientRect(); popText(r.left + r.width / 2, r.top + 12, '😂 +1', 'gold'); }
                }, 120);
                try { navigator.vibrate && navigator.vibrate([70, 40, 70]); } catch (e) {}
            } else {
                sFlip();
            }
            break;
        case 'podium':
            D = msg;
            stopClientTimers();
            ui = 'podium';
            setMusic('over');
            render();
            sWin(); startConfetti(3600);
            break;
    }
}

// ── phone actions ──
function toggleCard(idx) {
    if (playLocked || ui !== 'submit' || D.isJudge) return;
    const n = D.n || 1;
    const pos = mySel.indexOf(idx);
    if (pos >= 0) mySel.splice(pos, 1);
    else if (n === 1) mySel = [idx];
    else if (mySel.length < n) mySel.push(idx);
    else { mySel.shift(); mySel.push(idx); }
    render();
}
function submitPlay() {
    const n = D.n || 1;
    if (playLocked || ui !== 'submit' || mySel.length !== n) return;
    const cards = mySel.map(i => D.hand[i]);
    if (isHost && !isTvHost) { const me = selfPlayer(); if (me) hostPlay(me, D.round, cards, null); }
    else send(hostConn, { type: 'play', round: D.round, cards });
}
function pickCard(key) {
    if (pickLocked || ui !== 'judge' || !D.isJudge) return;
    pickLocked = true; myPick = key;
    sPick();
    render();
    if (isHost && !isTvHost) { const me = selfPlayer(); if (me) hostPick(me, D.round, key, null); }
    else send(hostConn, { type: 'pick', round: D.round, key });
}

// VIEWER (TV) MESSAGE HANDLING
// ═══════════════════════════════════════════
let _vTick = null, _lastVTickSec = -1;
function stopViewerTimers() { clearInterval(_vTick); _vTick = null; musicUrgent = false; }
function startViewerCountdown(seconds) {
    const endsAt = Date.now() + seconds * 1000;
    clearInterval(_vTick);
    _lastVTickSec = -1;
    _vTick = setInterval(() => {
        const left = Math.max(0, endsAt - Date.now());
        const bar = $id('v-timebar');
        if (bar) bar.style.width = (left / (seconds * 1000) * 100) + '%';
        const low = left <= 8000 && left > 0;
        if (bar) bar.classList.toggle('low', low);
        musicUrgent = low;
        if (low) { const sec = Math.ceil(left / 1000); if (sec !== _lastVTickSec) { _lastVTickSec = sec; sTick(); } }
        if (left <= 0) clearInterval(_vTick);
    }, 200);
}

function applyViewerMsg(msg) {
    document.body.classList.add('viewer-mode');
    ui = 'viewer';
    const prev = vD;
    vD = msg;
    switch (msg.type) {
        case 'viewer_lobby':
            stopViewerTimers();
            setMusic('lobby');
            if (prev && prev.type === 'viewer_lobby' && (msg.players || []).length > (prev.players || []).length) sJoin();
            render();
            break;
        case 'viewer_submit': {
            const fresh = !prev || prev.type !== 'viewer_submit' || prev.round !== msg.round;
            if (fresh) {
                stopViewerTimers();
                setMusic('scheme');
                if (msg.round === 1) sStart(); else sPhase();
                render();
                startViewerCountdown(msg.seconds);
            } else patchViewerCounts(msg, 'submit');
            bumpIntensity(msg.submitted, msg.playerCount);
            break;
        }
        case 'viewer_judge': {
            const fresh = !prev || prev.type !== 'viewer_judge' || prev.round !== msg.round;
            if (fresh) { stopViewerTimers(); setMusic('vote'); render(); startViewerCountdown(msg.seconds); sFlip(); }
            else render();
            break;
        }
        case 'viewer_reveal':
            stopViewerTimers();
            setMusic('reveal');
            musicKeyShift = msg.isLast ? 2 : 0;
            render();
            sLaugh();
            startConfetti(2200);
            break;
        case 'viewer_podium':
            stopViewerTimers();
            setMusic('over');
            render();
            sWin();
            startConfetti(5200);
            break;
    }
}
function patchViewerCounts(msg, kind) {
    const el = $id('v-counter');
    if (el) el.textContent = `😂 ${msg.submitted} of ${msg.playerCount} cards in`;
    const rail = $id('v-rail');
    if (rail) rail.innerHTML = railRowsHTML(msg.players, true);
}

let _lastUi = '', _lastVType = '';
function render() {
    const app = $id('app');
    if (isTvHost || isViewer) ui = 'viewer';
    const vt = ui === 'viewer' ? ((vD?.type || '') + ':' + (vD?.round ?? '')) : '';
    const fresh = ui !== _lastUi || vt !== _lastVType;
    _lastUi = ui; _lastVType = vt;
    let html = '';
    switch (ui) {
        case 'home':       html = renderHome(); break;
        case 'creating':   html = renderSpinner('Setting up the game…'); break;
        case 'connecting': html = renderSpinner('Joining the game…'); break;
        case 'lobby_h':    html = renderLobbyH(); break;
        case 'lobby_g':    html = renderLobbyG(); break;
        case 'submit':     html = renderSubmit(); break;
        case 'judge':      html = renderJudge(); break;
        case 'reveal':     html = renderReveal(); break;
        case 'podium':     html = renderPodium(); break;
        case 'viewer':     html = renderViewer(); break;
        default:           html = renderHome();
    }
    // guarded: a stale common.js (no setHTML) must never blank the game
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    app.classList.toggle('fresh', fresh);
}
function renderSpinner(msg) {
    return `${hdrHTML()}<div class="connecting"><div class="spin"></div><div>${esc(msg)}</div></div>`;
}

function renderHome() {
    const fromQR = !!fCode;
    const youCard = `
    <div class="card">
        <div class="slbl">Who are you?</div>
        <div class="fg">
            <label>Your Name</label>
            <input type="text" maxlength="16" placeholder="Enter name" value="${esc(fName)}"
                ${fromQR ? 'autofocus' : ''} data-save-name oninput="fName=this.value">
        </div>
        ${avatarPickerHTML()}
    </div>`;
    const joinCard = `
    <div class="card${fromQR ? ' highlight' : ''}">
        <div class="slbl">Join a Game</div>
        <div class="fg">
            <label>Room Code</label>
            <input type="text" maxlength="4" placeholder="4-letter code" value="${esc(fCode)}"
                oninput="fCode=this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')document.getElementById('btn-join').click()">
        </div>
        <button id="btn-join" class="btn ${fromQR ? 'btn-k' : 'btn-g'} btn-full"
            onclick="if(fName.trim()&&fCode.trim()){joinGame(fCode,fName)}else{uiErr='Enter your name and the room code.';render()}">
            📱 Join with your phone
        </button>
    </div>`;
    const hostCard = `
    <div class="card">
        <div class="slbl">Start a Game</div>
        <button class="btn btn-g btn-full"
            onclick="if(fName.trim()){hostGame(fName)}else{uiErr='Enter your name first.';render()}">
            😂 Host & play on this phone
        </button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin-top:8px">
            3–12 players — no TV? This phone hosts the round and joins in as a player.
        </div>
    </div>`;
    const tvCard = `
    <div class="card">
        <div class="slbl">TV / Big Screen</div>
        <button class="btn btn-p btn-full" style="padding:16px" onclick="hostOnTV()">📺 Host the party on this TV</button>
        <div style="font-size:.68rem;color:var(--muted);text-align:center;margin:6px 0 10px">
            Shows a big QR code — the first phone to join becomes 👑 Captain
        </div>
        <hr>
        <div class="fg">
            <label>…or show an existing game</label>
            <input type="text" maxlength="4" placeholder="4-letter code" value="${esc(fVCode)}"
                oninput="fVCode=this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')joinAsViewer(fVCode)">
        </div>
        <button class="btn btn-g btn-full"
            onclick="if(fVCode.trim()){joinAsViewer(fVCode)}else{uiErr='Enter a room code.';render()}">
            📺 Open TV screen
        </button>
    </div>`;
    return `
    ${hdrHTML('play a card · make the judge laugh')}
    ${uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''}
    ${tvCard}${youCard}${joinCard}${hostCard}`;
}

function renderLobbyG() {

function renderSubmit() {
    const p = D.prompt || {};
    const judge = D.judge || {};
    if (D.isJudge) {
        return `
        ${metaBarHTML(`Round ${D.round} — you're the Judge`, D.seconds)}
        <div class="card"><div class="q-prompt">${promptHTML(p)}</div></div>
        <div class="card">
            <div class="judge-note">👑 You're the Judge this round</div>
            <div style="text-align:center;color:var(--muted);font-size:.8rem;font-weight:700;margin-top:10px">
                Everyone else is playing a card. You'll pick the funniest.
            </div>
        </div>`;
    }
    const n = D.n || 1;
    const hand = (D.hand || []).map((t, i) => {
        const pos = mySel.indexOf(i);
        const cls = ['wall-card']; if (pos >= 0) cls.push('pick-sel');
        const badge = pos >= 0 && n > 1 ? `<span class="ord">${pos + 1}</span>` : '';
        return `<button class="${cls.join(' ')}" style="--i:${i}" ${playLocked ? 'disabled' : ''} onclick="toggleCard(${i})">
            <span>${esc(t)}</span>${badge}
        </button>`;
    }).join('');
    const hint = playLocked
        ? `<div class="lie-note">😂 Card${n > 1 ? 's' : ''} played! Watch the TV…</div>`
        : `<button class="btn btn-k btn-full" ${mySel.length === n ? '' : 'disabled'} onclick="submitPlay()">
            😂 Play ${n > 1 ? mySel.length + ' / ' + n + ' cards' : 'this card'}</button>`;
    return `
    ${metaBarHTML(`Round ${D.round} — 👑 ${esc(judge.name || 'Judge')} is judging`, D.seconds)}
    <div class="card"><div class="q-prompt">${promptHTML(p)}</div>
        ${n > 1 ? `<div style="color:var(--pink);font-size:.72rem;font-weight:900;margin-top:8px;text-transform:uppercase;letter-spacing:1px">Pick ${n} cards, in order</div>` : ''}
    </div>
    <div class="card">
        <div class="slbl">Your hand — tap to play</div>
        <div class="wall">${hand}</div>
        <div style="margin-top:12px">${hint}</div>
    </div>`;
}

function renderJudge() {
    const p = D.prompt || {};
    const judge = D.judge || {};
    const cards = (D.cards || []).map((c, i) => {
        const cls = ['wall-card'];
        if (c.key === D.myKey) cls.push('mine');
        if (D.isJudge && pickLocked) { if (c.key === myPick) cls.push('picked'); else cls.push('faded'); }
        const clickable = D.isJudge && !pickLocked && c.key !== D.myKey;
        return `<button class="${cls.join(' ')}" style="--i:${i}" ${clickable ? '' : 'disabled'}
            onclick="pickCard(${c.key})">
            <span class="let">${LETTERS[i]}</span><span>${esc(c.display)}</span>
        </button>`;
    }).join('');
    const note = D.isJudge
        ? (pickLocked ? `<div class="lie-note">😂 Picked! Revealing…</div>` : `<div class="judge-note">👑 You're the Judge — tap the funniest card</div>`)
        : `<div class="lie-note">👑 ${esc(judge.name || 'The judge')} is choosing the funniest…</div>`;
    return `
    ${metaBarHTML(`Round ${D.round} — the reveal`, D.seconds)}
    <div class="card"><div class="q-prompt">${promptHTML(p)}</div></div>
    ${note}
    <div class="wall">${cards}</div>`;
}

function renderReveal() {
    const my = D.my || {};
    const w = D.winner || {};
    const ico = my.won ? '😂' : (my.isJudge ? '👑' : '🃏');
    const vt = my.won ? 'Your card won the laugh!' : (my.isJudge ? `You picked ${esc(w.name || '')}` : `${esc(w.name || 'Someone')} won the round`);
    const cards = (D.cards || []).map((c, i) => {
        const cls = ['wall-card']; if (c.won) cls.push('won'); else cls.push('faded');
        return `<div class="${cls.join(' ')}" style="cursor:default;--i:${i}">
            <div style="flex:1"><div>${esc(c.display)}</div>
            <span class="let">${c.won ? '😂 WINNER · ' : ''}${esc(c.author.avatar || '')} ${esc(c.author.name || '')}</span></div>
        </div>`;
    }).join('');
    const driveBtn = canDrive()
        ? `<button class="btn btn-k btn-full" style="font-size:1.02rem;padding:15px" onclick="guestCtl('next')">${D.isLast ? '🏆 See the podium' : '➡️ Next round'}</button>`
        : `<div style="text-align:center;color:var(--muted);font-size:.74rem;font-weight:800">${D.tvHost ? `👑 ${esc(D.captain || '')} taps next` : 'The host taps next'}…</div>`;
    return `
    <div class="card verdict">
        <div class="vico">${ico}</div>
        <div class="vt">${vt}</div>
        <div class="vcard">${esc(w.avatar || '')} “${esc(D.winCard || '')}”</div>
        ${my.won ? `<div class="vpts">+1</div>` : ''}
    </div>
    <div class="wall">${cards}</div>
    ${standingsHTML(D.standings || [])}
    ${driveBtn}`;
}

function renderPodium() {
    const st = D.standings || [];
    const awards = (D.awards || []).map(a =>
        `<span class="chip">${a.emoji} ${esc(a.title)}: ${esc(a.name)} (${esc(a.detail)})</span>`).join('');
    const driveBtn = canDrive()
        ? `<button class="btn btn-p btn-full" style="font-size:1.02rem;padding:15px" onclick="guestCtl('again')">🔁 Play again</button>` : '';
    return `
    ${hdrHTML('Game over!')}
    <div class="card verdict highlight">
        <div class="vico">🏆</div>
        <div class="vt">${esc(st[0]?.name || '')} wins!</div>
        <div style="margin-top:8px">${awards}</div>
    </div>
    ${standingsHTML(st)}
    ${driveBtn}`;
}

        case 'viewer_judge':  return renderViewerJudge();
        case 'viewer_reveal': return renderViewerReveal();
        case 'viewer_podium': return renderViewerPodium();

function renderViewerPodium() {
    const st = vD.standings || [];
    const medals = ['🥇', '🥈', '🥉'];
    const ranks = rankByScore(st, 'score');
    const wm = st.map((p, i) => ({ ...p, medal: medals[ranks[i]] || '', mr: ranks[i] }));
    const podOrder = [wm[1], wm[0], wm[2]].filter(Boolean);
    const cls = st.length >= 3 ? ['p2', 'p1', 'p3'] : (st.length === 2 ? ['p2', 'p1'] : ['p1']);
    const pods = podOrder.map((p, i) => `
        <div class="pod ${cls[i]} mrank-${Math.min(p.mr, 2)}" style="animation-delay:${i * 0.18}s">
            <div class="pav-big">${esc(p.avatar)}</div>
            <div class="pname">${esc(p.name)}</div>
            <div class="pscore">${p.score} 😂</div>
            <div class="block">${p.medal}</div>
        </div>`).join('');
    const rest = st.slice(3).map((p, i) =>
        `<div class="rail-row"><span>${i + 4}.</span><span class="rav">${esc(p.avatar)}</span><span class="rname">${esc(p.name)}</span><span class="rsc">${p.score}</span></div>`).join('');
    const awards = (vD.awards || []).map(a =>
        `<div class="award">${a.emoji} <span class="aw-t">${esc(a.title)}</span><br>${esc(a.name)} — ${esc(a.detail)}</div>`).join('');
    const hint = vD.tvHost ? `👑 ${esc(vD.captain || 'Captain')}: “Play again” is on your phone` : 'Host: “Play again” is on your phone';
    return tvShell(`
    <div class="tv-main" style="flex-direction:column">
        <div class="podium-wrap">${pods}</div>
        <div class="awards-row">${awards}</div>
        ${rest ? `<div style="display:flex;gap:1.4vmin;justify-content:center;flex-wrap:wrap">${rest}</div>` : ''}
        <div class="tv-waiting" style="text-align:center;padding-bottom:1.5vmin">${hint}</div>
    </div>`, '🏆 Final scores');
}

// ═══════════════════════════════════════════
// SIMULATION MODES — ?mode=tvsimulation | playersimulation  (&players=N)
// Self-driving demos with no PeerJS. Bots count as "connected" via stub guestConns.
// ═══════════════════════════════════════════
let simTimer = null, simMode = 'tv';
const SIM_NAMES = ['Ace', 'Bux', 'Cass', 'Duke', 'Edie', 'Fox', 'Gwen', 'Hank'];

function startSimulation(nPlayers, mode) {
    simMode = mode === 'player' ? 'player' : 'tv';
    roomCode = 'DEMO';
    H.settings.targetScore = 3;   // short game so the demo loops
    H.players = []; guestConns = {}; viewerConns = {};
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));
    if (simMode === 'tv') {
        isHost = true; isTvHost = true; myId = '__sim_host__';
        document.body.classList.add('viewer-mode');
    } else {
        isHost = true; isTvHost = false; myName = 'You'; myId = '__you__';
        myAvatar = AVATARS[0];
        hostAddPlayer(myId, myName, myAvatar);
    }
    for (let i = H.players.length; i < n; i++) {
        const id = '__bot_' + i;
        hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], AVATARS[(i + 1) % AVATARS.length]);
        guestConns[id] = { peer: id, send() {} };
    }
    broadcastLobby();
    simTimer = setTimeout(() => { if (H.phase === 'lobby') { hostStartGame(); simDrive(); } }, 2400);
}
function simDrive() {
    switch (H.phase) {
        case 'submit':
            simSubmitStep();
            simTimer = setTimeout(simDrive, 650 + Math.random() * 300);
            break;
        case 'judge':
            simTimer = setTimeout(() => { if (H.phase === 'judge') autoPick(); simDrive(); }, 1600);
            break;
        case 'reveal':
            simTimer = setTimeout(() => { if (H.phase === 'reveal') afterReveal(); simDrive(); }, 3600);
            break;
        case 'podium':
            simTimer = setTimeout(simRestart, 6800);
            break;
        default:
            simTimer = setTimeout(simDrive, 900);
    }
}
function simSubmitStep() {
    if (H.phase !== 'submit') return;
    const pending = activeNonJudges().filter(p => !p._played);
    if (!pending.length) return;
    const p = pending[Math.floor(Math.random() * pending.length)];
    const need = promptN(H.cur);
    const picks = shuffle(p.hand).slice(0, need);
    if (picks.length !== need) return;
    if (simMode === 'player' && p.id === myId) {
        mySel = picks.map(t => D.hand.indexOf(t)).filter(i => i >= 0);
        if (mySel.length === need) submitPlay();
        if (!p._played) hostPlay(p, H.round, picks, null);
    } else {
        hostPlay(p, H.round, picks, null);
    }
}
function simRestart() {
    hostNewGame();
    simTimer = setTimeout(() => { if (H.phase === 'lobby') { hostStartGame(); simDrive(); } }, 2600);
}

(function boot() {
    const params = new URLSearchParams(location.search);
    $id('tog-music').classList.toggle('off', !musicOn);
    $id('tog-sfx').classList.toggle('off', !sfxOn);
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    if (!fAvatar) fAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
    // A refresh mid-game shouldn't cost you your seat: if this tab was already in a
    // room, walk straight back in (the host restores the slot by device id/name).
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
</body>
</html>
