<body>
    <div id="app"></div>
    <div id="sound-togs">
        <button id="tog-music" title="Music on/off" onclick="toggleMusic()">🎵</button>
        <button id="tog-sfx" title="Sound effects on/off" onclick="toggleSfx()">🔊</button>
        <button id="tog-voice" title="Speak milestones aloud" onclick="toggleVoice()">🗣️</button>

<script>
'use strict';
typeof mountScene === 'function' && mountScene('pond');   // themed ambient scene along the bottom of the TV

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const PFX = 'GOFISH-';
const MIN_PLAYERS = 2, MAX_PLAYERS = 6;
const HAND_SIZE = n => n <= 3 ? 7 : 5;   // Bicycle: 7 each for 2-3 players, 5 each for 4+

// ═══════════════════════════════════════════
// CARD MODEL (pure — no host/guest distinction, single JS scope)
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// BOOK LOGIC (pure) — the instant all four of a rank sit in one hand, it lays down.
// Runs after every hand-changing event: a successful ask, a Go Fish draw, or the deal.
// ═══════════════════════════════════════════
function layBooks(player) {
    const laid = [];
    for (let r = 1; r <= 13; r++) {
        if (player.hand.filter(c => c.rank === r).length === 4) {
            player.hand = player.hand.filter(c => c.rank !== r);
            player.books.push(r);
            laid.push(r);
        }
    }
    return laid;
}

// ═══════════════════════════════════════════
// HOST STATE
// ═══════════════════════════════════════════
// Unlike Blackjack, Go Fish has no ongoing "house" role once the deal is done — the host CAN
// also hold a hand, same as Kings Corner. `H.players` is never spliced or reordered once a
// game is under way, so `H.turnIdx` staying valid needs no rekeying, same reasoning as both
// existing card games.
let H = {
    phase: 'lobby',              // 'lobby' | 'playing' | 'match_over'
    players: [],                 // [{ id, cid, name, hand:[Card], books:[rank,...], spectating }]
    turnIdx: 0,
    matchStartIdx: 0,             // rotates who deals first across successive "Play again"s
    stock: [],
    booksClaimed: 0,
    helpMode: true,                // captain-set table preference — fuller commentary for new
                                    // players, spoken and shown; a table setting, not a
                                    // per-match rule, so it deliberately survives "Play again"
    milestones: [], milestoneSeq: 0,
};


// ═══════════════════════════════════════════
// HOST LOGIC
// ═══════════════════════════════════════════
function hostAddPlayer(id, name, cid) {
    if (H.players.find(p => p.id === id)) return;
    const spectating = H.phase !== 'lobby';
    if (!spectating && H.players.length >= MAX_PLAYERS) return;
    H.players.push({ id, cid, name, hand: [], books: [], spectating });
}

function checkMatchOver() {
    if (H.booksClaimed >= 13) { H.phase = 'match_over'; broadcast(); return true; }
    return false;
}

function hostStartGame(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'lobby') return;
    if (H.players.length < MIN_PLAYERS) return;
    H.players.forEach(p => { p.spectating = false; p.hand = []; p.books = []; });
    const n = H.players.length;
    H.stock = shuffled(makeDeck());
    for (let r = 0; r < HAND_SIZE(n); r++) for (const p of H.players) p.hand.push(H.stock.pop());
    H.players.forEach(p => layBooks(p));   // a book dealt straight off the top is rare, but real
    H.booksClaimed = H.players.reduce((s, p) => s + p.books.length, 0);
    H.turnIdx = H.matchStartIdx % n;
    H.matchStartIdx = (H.matchStartIdx + 1) % n;
    H.milestones = []; H.milestoneSeq = 0;
    H.phase = 'playing';
    if (!checkMatchOver()) broadcast();
}
function hostPlayAgain(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'match_over') return;
    H.phase = 'lobby';
    H.players.forEach(p => { p.spectating = false; p.hand = []; p.books = []; });
    H.stock = []; H.booksClaimed = 0;
    H.milestones = []; H.milestoneSeq = 0;
    broadcastLobby();
}
function hostCtl(fromId, action, value) {
    if (capPlayer()?.id !== fromId) return;
    if (action === 'helpMode') { H.helpMode = !!value; if (H.phase === 'lobby') broadcastLobby(); else broadcast(); }
    else if (action === 'start') hostStartGame(fromId);
    else if (action === 'again') hostPlayAgain(fromId);
}

// If `p` is about to hold (or keep) the turn but their hand is empty, this is the rules'
// own forced move, not a real choice: auto-draw them one card (their only legal ask becomes
// that card's own rank) if the stock has one, otherwise report they truly cannot act so the
// caller can move the turn along instead. Shared by advanceTurn (handing the turn to a NEW
// player) and hostAsk's two "go again" paths (the SAME player keeps the turn after a hit or
// a matched fish) — a book completed by that same play can empty the hand either way, and
// both cases need identical treatment or a player can be left holding their own turn with an
// empty hand and no legal rank to ask for, which softlocks the room (found in testing).
function refillIfEmpty(p) {
    if (p.hand.length > 0) return true;
    if (H.stock.length > 0) { p.hand.push(H.stock.pop()); return true; }
    return false;
}

// Walks forward from fromIdx to the next player who can actually take a turn: skips
// spectators outright, and (via refillIfEmpty) skips entirely anyone left with an empty hand
// AND an empty stock ("out of the game"). Guaranteed to land on somebody or end the match —
// by card conservation, everyone empty-handed with an empty stock means all 52 cards are
// already in books, i.e. the match is already over.
function advanceTurn(fromIdx) {
    const n = H.players.length;
    let idx = fromIdx;
    for (let k = 0; k < n; k++) {
        idx = (idx + 1) % n;
        const p = H.players[idx];
        if (p.spectating) continue;
        if (refillIfEmpty(p)) { H.turnIdx = idx; broadcast(); return; }
        // empty hand, empty stock — out of the game; keep walking
    }
    checkMatchOver() || broadcast();
}

// Resolves a WHOLE ask in one call — there is no separate player-facing "draw" message,
// because in Go Fish drawing on a miss isn't a choice, just what the rules say happens next.
function hostAsk(fromId, targetId, rank) {
    if (H.phase !== 'playing') return;
    const asker = H.players[H.turnIdx];
    if (!asker || asker.id !== fromId) return;
    rank = Number(rank);
    if (!asker.hand.some(c => c.rank === rank)) return;   // illegal — must hold at least one
    const target = H.players.find(p => p.id === targetId && !p.spectating && p.id !== asker.id);
    if (!target) return;

    const hits = target.hand.filter(c => c.rank === rank);
    if (hits.length) {
        target.hand = target.hand.filter(c => c.rank !== rank);
        asker.hand.push(...hits);
        addMilestone(
            H.helpMode
                ? `${asker.name} asked ${target.name} for ${RANK_PLURAL[rank]} and got ${hits.length}! ${asker.name} goes again.`
                : `${asker.name} asked ${target.name} for ${RANK_PLURAL[rank]} and got ${hits.length}!`,
            H.helpMode
                ? `${asker.name} asked ${target.name} for ${RANK_PLURAL[rank]} and got ${hits.length}. A hit means ${asker.name} goes again.`
                : `${asker.name} asked ${target.name} for ${RANK_PLURAL[rank]} and got ${hits.length}.`
        );
        layBooks(asker).forEach(r => {
            H.booksClaimed++;
            addMilestone(H.helpMode
                ? `${asker.name} laid down a book of ${RANK_PLURAL[r]} — all four in one hand!`
                : `${asker.name} laid down a book of ${RANK_PLURAL[r]}!`);
        });
        if (checkMatchOver()) return;
        // A book completed just now can empty the hand that's still mid-turn — same forced
        // refill the rules require anywhere else, or this "go again" turn has nothing left
        // to legally ask with (found in testing: the room softlocked here).
        if (refillIfEmpty(asker)) broadcast();
        else advanceTurn(H.turnIdx);
        return;
    }

    // A miss — "Go Fish" is what the RESPONDER says, not the asker. It means: nothing to
    // hand over, so the asker draws the top card of the stock instead.
    addMilestone(H.helpMode
        ? `${target.name} says "Go Fish!" — ${asker.name} draws a card from the stock.`
        : `${target.name} says "Go Fish!"`);
    if (H.stock.length === 0) { advanceTurn(H.turnIdx); return; }
    const drawn = H.stock.pop();
    asker.hand.push(drawn);
    layBooks(asker).forEach(r => {
        H.booksClaimed++;
        addMilestone(H.helpMode
            ? `${asker.name} laid down a book of ${RANK_PLURAL[r]} — all four in one hand!`
            : `${asker.name} laid down a book of ${RANK_PLURAL[r]}!`);
    });
    if (checkMatchOver()) return;
    if (drawn.rank === rank) {
        addMilestone(H.helpMode
            ? `${asker.name} fished up exactly what they asked for — and goes again!`
            : `${asker.name} fished up exactly what they asked for!`);
        if (refillIfEmpty(asker)) broadcast();
        else advanceTurn(H.turnIdx);
    } else {
        advanceTurn(H.turnIdx);
    }
}

// ═══════════════════════════════════════════
// MESSAGES / DISPLAY
// ═══════════════════════════════════════════
function lobbyMsg() {
    return {
        type: 'lobby',
        players: H.players.filter(p => !p.spectating).map(p => ({ name: p.name })),
        roomCode, tvHost: isTvHost, captain: capPlayer()?.name || null,
        helpMode: H.helpMode,
    };
}
// Another player's actual cards never enter this object at all — only their count — which is
// what makes the hidden information real rather than just hidden by rendering.
function buildDisplay(playerId) {
    const me = H.players.find(p => p.id === playerId);
    const turnP = H.phase === 'playing' ? H.players[H.turnIdx] : null;
    const sorted = H.players.slice().sort((a, b) => b.books.length - a.books.length);
    return {
        type: 'state', phase: H.phase, roomCode, isCaptain: capPlayer()?.id === playerId,
        myHand: me ? me.hand : [],
        isMyTurn: !!turnP && turnP.id === playerId,
        turnPlayerName: turnP ? turnP.name : '',
        players: H.players.map((p, i) => ({
            id: p.id, name: p.name, handCount: p.hand.length, books: p.books.slice(),
            spectating: !!p.spectating, isTurn: i === H.turnIdx,
        })),
        stockCount: H.stock.length,
        helpMode: H.helpMode,
        milestones: H.milestones.slice(-8),
        matchWinnerName: H.phase === 'match_over' ? (sorted[0] ? sorted[0].name : '') : '',
    };
}
function buildViewerDisplay() {
    const { myHand, isMyTurn, ...rest } = buildDisplay(null);
    return { ...rest, type: 'viewer_state' };
}
function phaseUi(phase) {
    if (phase === 'playing') return 'playing';
    if (phase === 'match_over') return 'match_over';
    return 'lobby_h';
}

function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }

function broadcastLobby() {
    const msg = lobbyMsg();
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, msg); });
    Object.values(viewerConns).forEach(c => send(c, { ...msg, type: 'viewer_lobby' }));
    if (isTvHost) { vD = { ...msg, type: 'viewer_lobby' }; ui = 'viewer'; render(); }
    else if (isHost) { D = msg; ui = 'lobby_h'; render(); }
}
function broadcast() {
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, buildDisplay(p.id)); });
    Object.values(viewerConns).forEach(c => send(c, buildViewerDisplay()));
    if (isTvHost) {
        const nd = buildViewerDisplay();
        const entering = nd.phase === 'match_over' && vD?.phase !== 'match_over';
        vD = nd; ui = 'viewer'; render();
        toastMilestones(nd.milestones);
        if (entering) setTimeout(gfConfetti, 200);
    } else if (isHost) {
        const d = buildDisplay(myId);
        if (!d.isMyTurn) { selRank = null; }
        D = d; ui = phaseUi(H.phase); render();
        toastMilestones(d.milestones);
    }
}

// ═══════════════════════════════════════════
// CONNECTION / PRESENCE
// ═══════════════════════════════════════════
let peer = null, myId = '', myName = '', isHost = false, isTvHost = false, isViewer = false, roomCode = '';
let hostConn = null, guestConns = {}, viewerConns = {};
let ui = 'home', uiErr = '';
let fName = (typeof savedName === 'function' ? savedName() : ''), fCode = '', fVCode = '';
let D = null, vD = null;
let selRank = null;
let _lastKey = '';

function connectedPlayers() {
    if (typeof presentPlayers === 'function') {
        return presentPlayers(H.players, guestConns, myId, isHost && !isTvHost);
    }
    return H.players.filter(p => (p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]));
}

function makeRoom(onOpen) {
    forgetRoom();
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message; isHost = false; isTvHost = false;
            document.body.classList.remove('viewer-mode'); ui = 'home'; render();
        },
    });
}
function hostGame(name) {
    myName = name.trim().slice(0, 16) || 'Host';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { hostAddPlayer(myId, myName, clientId()); ui = 'lobby_h'; render(); });
}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); vD = { ...lobbyMsg(), type: 'viewer_lobby' }; ui = 'viewer'; render(); });
}
function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Player';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;
            hostConn.on('open', () => {
                connected = true; rememberRoom(code.trim().toUpperCase(), 'player');
                send(hostConn, { type: 'join', cid: clientId(), build: typeof BUILD !== 'undefined' ? BUILD : null, name: myName });
                if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} });
            });
            hostConn.on('data', msg => applyMsg(msg));
        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table — tap Join to get back in.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });
}
function joinAsViewer(code) {
    isViewer = true;
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });
            hostConn.on('data', msg => applyViewerMsg(msg));
        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });
    conn.on('data', msg => {
        {
            const alive = H.players.find(p => p.id === conn.peer);
            if (alive && typeof notePresence === 'function') notePresence(alive);
        }
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer'; viewerConns[conn.peer] = conn; send(conn, H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : buildViewerDisplay());
            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        switch (msg.type) {
            case 'join': {
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Player').slice(0, 16);
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);
                if (zombie) { zombie.id = conn.peer; }
                else hostAddPlayer(conn.peer, name, msg.cid);
                const me2 = H.players.find(p => p.id === conn.peer);
                if (!me2 && H.phase === 'lobby') { send(conn, { type: 'full' }); break; }
                if (me2 && msg.cid) me2.cid = msg.cid;
                if (me2 && typeof notePresence === 'function') notePresence(me2);
                if (H.phase === 'lobby') broadcastLobby(); else broadcast();
                break;
            }
            case 'ctl': if (capPlayer()?.id === conn.peer) hostCtl(conn.peer, msg.action, msg.value); break;
            case 'ask': hostAsk(conn.peer, msg.targetId, msg.rank); break;
            case 'hb': break;
        }
    });
    conn.on('close', () => {
        const prevCap = capPlayer()?.id || null;
        setTimeout(() => capSync(prevCap), 0);
        delete guestConns[conn.peer]; delete viewerConns[conn.peer];
        // H.players is never spliced once a game is under way (turnIdx is an index into it) —
        // only safe to remove someone while still in the lobby.
        if (H.phase === 'lobby') {
            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        }
    });
    conn.on('error', e => console.warn('conn err', e));
}

// ═══════════════════════════════════════════
// CLIENT ACTIONS
// ═══════════════════════════════════════════
let actionWatchdog = null;
function armActionWatchdog() {
    clearActionWatchdog();
    actionWatchdog = setTimeout(() => {
        actionWatchdog = null;
        showToast("That didn't seem to reach the table — check your connection and try again.");
    }, 4000);
}
function clearActionWatchdog() { if (actionWatchdog) { clearTimeout(actionWatchdog); actionWatchdog = null; } }

function guestCtl(action, value) {
    if (isHost && !isTvHost) { hostCtl(myId, action, value); return; }
    if (hostConn) { send(hostConn, { type: 'ctl', action, value }); armActionWatchdog(); }
}
function actAsk(targetId, rank) {
    if (isHost && !isTvHost) { hostAsk(myId, targetId, rank); return; }
    if (hostConn) { send(hostConn, { type: 'ask', targetId, rank }); armActionWatchdog(); }
}

// ── rank/opponent picker (client-side only) ──
function gfPickRank(rank) {
    if (!D || !D.isMyTurn) return;
    const have = (D.myHand || []).some(c => c.rank === rank);
    if (!have) return;
    selRank = (selRank === rank) ? null : rank;
    render();
}
function gfPickOpp(targetId) {
    if (!D || !D.isMyTurn || selRank == null) return;
    sAsk();
    const rank = selRank;
    selRank = null;
    actAsk(targetId, rank);
}

// ── toasts (milestones) ──
function showToast(text) {
    let host = document.getElementById('gf-toasts');
    if (!host) { host = document.createElement('div'); host.id = 'gf-toasts'; document.body.appendChild(host); }
    const el = document.createElement('div');
    el.className = 'gf-toast';
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3000);
}
let lastMilestoneSeq = -1, seenFirstMilestones = false;
function toastMilestones(list) {
    if (!list) return;
    if (!seenFirstMilestones) {
        lastMilestoneSeq = list.length ? Math.max(...list.map(m => m.seq)) : -1;
        seenFirstMilestones = true;
        return;
    }
    const fresh = list.filter(m => m.seq > lastMilestoneSeq);
    fresh.forEach(m => {
        showToast(m.text);
        if (/laid down a book/.test(m.text)) sBook();
        else if (/Go Fish/.test(m.text)) sFish();
        else if (/got \d/.test(m.text)) sHit();
    });
    if (fresh.length) speak(fresh.map(m => m.speech).join(' '));
    if (list.length) lastMilestoneSeq = Math.max(lastMilestoneSeq, ...list.map(m => m.seq));
}

// ═══════════════════════════════════════════
// CLIENT APPLY
// ═══════════════════════════════════════════
function applyMsg(msg) {
    if (!msg) return;
    clearActionWatchdog();
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    if (msg.type === 'full') { forgetRoom(); uiErr = `This table is full (${MAX_PLAYERS}/${MAX_PLAYERS}).`; ui = 'home'; D = null; if (hostConn) { try { hostConn.close(); } catch (_) {} } render(); return; }
    if (msg.type === 'lobby') { D = msg; ui = (isHost && !isTvHost) ? 'lobby_h' : 'lobby_g'; render(); return; }
    if (msg.type === 'state') {
        if (!msg.isMyTurn) { selRank = null; }
        D = msg;
        ui = phaseUi(msg.phase) === 'lobby_h' ? 'lobby_g' : phaseUi(msg.phase);
        toastMilestones(msg.milestones);
        render();
    }
}
function applyViewerMsg(msg) {
    if (!msg) return;
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    const entering = msg.type === 'viewer_state' && msg.phase === 'match_over' && vD?.phase !== 'match_over';
    vD = msg; ui = 'viewer';
    if (msg.type === 'viewer_state') toastMilestones(msg.milestones);
    render();
    if (entering) setTimeout(gfConfetti, 200);
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
    const app = document.getElementById('app');
    if (isTvHost || isViewer) ui = 'viewer';
    if (typeof syncVoiceBtn === 'function') syncVoiceBtn();
    let html = '';
    switch (ui) {
        case 'home': html = renderHome(); break;
        case 'creating': html = renderSpinner('Shuffling the deck…'); break;
        case 'connecting': html = renderSpinner('Joining the table…'); break;
        case 'lobby_h': html = renderLobbyH(); break;
        case 'lobby_g': html = renderLobbyG(); break;
        case 'playing': html = renderPlaying(); break;
        case 'match_over': html = renderMatchOver(); break;
        case 'viewer': html = renderViewer(); break;
        default: html = renderHome();
    }
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    const key = ui + ':' + (ui === 'viewer' ? (vD?.type || '') : '');
    app.classList.toggle('fresh', key !== _lastKey);
    _lastKey = key;
}

function hdrHTML(sub) {
    return `<div class="hdr"><h1 class="logo">🎣 Go Fish</h1></div><div class="sub">${esc(sub || 'collect all four of a rank to lay down a book')}</div>`;
}
function renderSpinner(msg) { return `${hdrHTML()}<div class="connecting"><div class="spin"></div><div>${esc(msg)}</div></div>`; }
function errHTML() { return uiErr ? `<div class="err">${esc(uiErr)}</div>` : ''; }

function qrSVG(url) {
    try {
        const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        const n = qr.getModuleCount(), m = 2, size = n + m * 2; let rects = '';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) rects += `<rect x="${c + m}" y="${r + m}" width="1.05" height="1.05"/>`;
        return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#eaf6fa"/><g fill="#0a2434">${rects}</g></svg>`;
    } catch (e) { return ''; }
}
function joinURL() { return location.origin + location.pathname + '?room=' + roomCode; }

// ── card rendering (shared by phone and TV) ──
function faceUpHTML(c, cls) { return `<div class="${cls || 'gf-card'} ${suitColor(c.suit)}">${cardHTML(c)}</div>`; }
function backsHTML(n, cls) {

function booksHTML(books) {

function renderPlaying() {
    if (!D) return renderSpinner('…');
    const myHand = (D.myHand || []).slice().sort((a, b) => a.rank - b.rank || a.suit.localeCompare(b.suit));
    const myRanks = new Set(myHand.map(c => c.rank));
    const rankRow = Array.from({ length: 13 }, (_, i) => i + 1).map(r => {
        const have = myRanks.has(r);
        return `<button class="gf-rankbtn${selRank === r ? ' sel' : ''}" ${have && D.isMyTurn ? '' : 'disabled'} onclick="gfPickRank(${r})">${rankShort(r)}</button>`;
    }).join('');
    const oppHtml = (D.players || []).filter(p => p.id !== myId).map(p => {
        const cls = ['gf-opp'];
        if (p.isTurn) cls.push('turn');

        </button>`;
    }).join('');
    const handHtml = myHand.map(c => faceUpHTML(c)).join('') || '<div class="hint">Your hand is empty!</div>';
    const turnHint = D.isMyTurn
        ? (D.helpMode
            ? `<div class="hint">Tap a rank you hold, then who to ask. You can only ask for a rank you already have — that's the rule.</div>`
            : `<div class="hint">Tap a rank you hold, then who to ask</div>`)
        : '';
    const askForHint = D.helpMode
        ? `<div class="hint" style="margin-top:-4px;margin-bottom:8px">Only your own ranks are tappable — the rest are greyed out</div>`
        : '';
    return `
    <div class="card" style="text-align:center">
        <div class="slbl">${D.isMyTurn ? 'Your turn' : esc(D.turnPlayerName) + "'s turn"} · stock ${D.stockCount}</div>
        ${turnHint}
    </div>
    <div class="card"><div class="slbl">Your hand</div><div class="gf-hand-row">${handHtml}</div>${booksHTML((D.players.find(p => p.id === myId) || {}).books)}</div>
    ${D.isMyTurn ? `<div class="card"><div class="slbl">Ask for…</div>${askForHint}<div class="gf-rankrow">${rankRow}</div></div>` : ''}
    <div class="card"><div class="slbl">${D.isMyTurn ? 'Ask whom?' : 'At the table'}</div><div class="gf-opps">${oppHtml}</div></div>`;
}

function renderMatchOver() {
    if (!D) return renderSpinner('…');
    const sorted = (D.players || []).map(p => ({ ...p, score: p.books.length })).sort((a, b) => b.score - a.score);
    const ranks = typeof rankByScore === 'function' ? rankByScore(sorted, 'score') : sorted.map((_, i) => i);
    const rows = sorted.map((p, i) => `<div class="rank-item"><span class="rank-num">${ranks[i] + 1}</span><span>${esc(p.name)}</span><span style="margin-left:auto">${p.score} 📗</span></div>`).join('');
    return `${hdrHTML()}
    <div class="trophy"><div class="icon">🏆</div><div class="w-name">${esc(D.matchWinnerName)}</div><div class="w-sub">most books</div></div>
    <div class="rankings">${rows}</div>
    ${D.isCaptain ? `<button class="btn btn-p btn-full" onclick="guestCtl('again')">🔄 Play again</button>` : `<div class="hint">Waiting for the captain…</div>`}`;
}

function renderViewer() {
    if (!vD) return renderSpinner('…');
    if (vD.type === 'viewer_lobby') {
        return typeof tvLobby === 'function' ? tvLobby({
            title: 'GO FISH', roomCode: vD.roomCode, isTvHost: vD.tvHost, captainName: vD.captain,
            settings: `2–6 anglers · ${MIN_PLAYERS}+ to start`,
            players: (vD.players || []).map(p => ({ name: p.name })),
        }) : '';
    }
    const rail = (vD.players || []).map(p => `<div class="v-gf-player${p.isTurn ? ' turn' : ''}${p.spectating ? ' spec' : ''}">
        <div class="nm">${esc(p.name)}</div>
        <div class="ct">${p.spectating ? '👀 watching' : p.handCount + ' cards'}</div>
        ${booksHTML(p.books)}
    </div>`).join('');
    let overlay = '';
    if (vD.phase === 'match_over') {
        overlay = `<div class="v-overlay"><div class="v-gameover-trophy">🏆</div><div class="v-gameover-winner">${esc(vD.matchWinnerName)}</div><div class="v-gameover-sub">most books</div></div>`;
    }
    return `<div class="v-screen">
        <div class="v-header"><div class="v-title">GO FISH</div><div class="v-header-code">Room ${esc(vD.roomCode)}</div></div>
        <div class="v-stock"><div class="lbl">Stock</div><div style="font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900">${vD.stockCount} left</div></div>
        <div class="v-gf-players">${rail}</div>
        ${overlay}
    </div>`;
}

function gfConfetti() {
    if (REDUCED) return;
    for (let i = 0; i < 36; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.textContent = ['🎣', '🐟', '🐠', '📗', '🏆'][Math.floor(Math.random() * 5)];
            el.style.cssText = `position:fixed;top:-6vmin;left:${Math.random() * 96}%;font-size:${2 + Math.random() * 2.5}vmin;z-index:940;pointer-events:none;transition:transform 3.2s linear,opacity 3.2s;`;
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.transform = `translateY(112vh) rotate(${(Math.random() - .5) * 720}deg)`; el.style.opacity = '0.2'; });
            setTimeout(() => el.remove(), 3400);
        }, i * 60);
    }
}

// ═══════════════════════════════════════════
// AUDIO (ambient.js: pad + tone() + duck())
// ═══════════════════════════════════════════
let musicOn = true, sfxOn = true, voicePref = null;
try { musicOn = localStorage.getItem('gf-music') !== '0'; sfxOn = localStorage.getItem('gf-sfx') !== '0'; voicePref = localStorage.getItem('gf-voice'); } catch (_) {}
// A gentle, watery drift.
const AMBIENT_CHORDS = [[196, 247, 294], [220, 262, 330], [175, 220, 262], [196, 233, 294]];
function sAsk() { if (!sfxOn || !ac()) return; tone(360, 0.08, 'triangle', AC.currentTime, 0.22); }
function sHit() { if (!sfxOn || !ac()) return; tone(520, 0.1, 'square', AC.currentTime, 0.24); }
function sFish() { if (!sfxOn || !ac()) return; tone(180, 0.14, 'sawtooth', AC.currentTime, 0.18); }
function sBook() { if (!sfxOn || !ac()) return; duck(1.0); const t = AC.currentTime; [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', t + i * 0.06, 0.26)); }
function sWinMatch() { if (!sfxOn || !ac()) return; duck(1.6); const t = AC.currentTime; [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', t + i * 0.09, 0.28)); }
function toggleMusic() { musicOn = !musicOn; try { localStorage.setItem('gf-music', musicOn ? '1' : '0'); } catch (_) {} const b = document.getElementById('tog-music'); if (b) b.classList.toggle('off', !musicOn); if (musicOn) startPad(); else stopPad(); }
function toggleSfx() { sfxOn = !sfxOn; try { localStorage.setItem('gf-sfx', sfxOn ? '1' : '0'); } catch (_) {} const b = document.getElementById('tog-sfx'); if (b) b.classList.toggle('off', !sfxOn); }
function toggleVoice() {
    voicePref = voiceOn() ? '0' : '1';
    try { localStorage.setItem('gf-voice', voicePref); } catch (_) {}
    syncVoiceBtn();
    if (!voiceOn() && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
}
function voiceOn() { return voicePref === null ? !!(isViewer || isTvHost) : voicePref !== '0'; }
function primeSpeech() {
    if (typeof speechSynthesis === 'undefined') return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', () => { ac(); if (AC && AC.state === 'suspended') AC.resume(); if (musicOn) startPad(); primeSpeech(); }, { once: true });

// ── Theme (day/night) ──
typeof applySavedTheme === 'function' && applySavedTheme();

// ═══════════════════════════════════════════
// SIMULATION — ?mode=tvsimulation | ?mode=playersimulation  (&players=N)
// ═══════════════════════════════════════════
const SIM_NAMES = ['Ace', 'Bea', 'Cy', 'Dot', 'Eli', 'Fay'];
let simTimer = null, simMode = 'tv';
function startSimulation(nPlayers, mode) {
    simMode = mode === 'player' ? 'player' : 'tv';
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));
    roomCode = 'DEMO';
    H = { phase: 'lobby', players: [], turnIdx: 0, matchStartIdx: 0, stock: [], booksClaimed: 0, milestones: [], milestoneSeq: 0 };
    guestConns = {}; viewerConns = {};
    isHost = true;
    if (simMode === 'tv') {
        isTvHost = true; myId = '__sim_host__'; myName = '';
        document.body.classList.add('viewer-mode');
        for (let i = 0; i < n; i++) {
            const id = '__bot_' + i;
            guestConns[id] = { send() {}, _sim: true };
            hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id);
        }
    } else {
        isTvHost = false; myName = 'You'; myId = '__you__';
        hostAddPlayer(myId, myName, myId);
        for (let i = 1; i < n; i++) {
            const id = '__bot_' + i;
            guestConns[id] = { send() {}, _sim: true };
            hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id);
        }
        ui = 'lobby_h';
    }
    broadcastLobby();
    simTimer = setTimeout(simBegin, 2200);
}
function simBegin() {
    hostStartGame(capPlayer()?.id);
    simTimer = setTimeout(simStep, 1200);
}
function simRestart() { startSimulation(H.players.length, simMode); }
function simStep() {
    simTimer = null;
    if (H.phase === 'match_over') { simTimer = setTimeout(simRestart, 6000); return; }
    if (H.phase === 'playing') { simBotTurn(); simTimer = setTimeout(simStep, 700 + Math.random() * 500); return; }
    simTimer = setTimeout(simStep, 800);
}
function simBotTurn() {
    const p = H.players[H.turnIdx];
    if (!p || !p.hand.length) return;
    const ranks = [...new Set(p.hand.map(c => c.rank))];
    const rank = ranks[Math.floor(Math.random() * ranks.length)];
    const others = H.players.filter(x => x.id !== p.id && !x.spectating);
    if (!others.length) return;
    const target = others[Math.floor(Math.random() * others.length)];
    hostAsk(p.id, target.id, rank);
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    if (!musicOn) { const b = document.getElementById('tog-music'); if (b) b.classList.add('off'); }
    if (!sfxOn) { const b = document.getElementById('tog-sfx'); if (b) b.classList.add('off'); }
    syncVoiceBtn();
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    const viewParam = params.get('view');
    if (viewParam) { joinAsViewer(viewParam); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
