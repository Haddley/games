<script>
'use strict';
typeof mountScene === 'function' && mountScene('bluff');   // themed ambient scene along the bottom of the TV

// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const PFX = 'IDOUBT-';
const MIN_PLAYERS = 2, MAX_PLAYERS = 8;
const CHALLENGE_WINDOW_MS = 6000;   // long enough to read a claim and react, short enough to keep tension

// ═══════════════════════════════════════════
// CARD MODEL (pure — no host/guest distinction, single JS scope)
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// HOST STATE
// ═══════════════════════════════════════════
// No house role here either (same reasoning as Go Fish) — the host CAN also hold a hand.
// The pile is real, host-only truth: `H.pile` accumulates actual Card objects across every
// UNCHALLENGED turn (never serialized to a client — only its length is). `H.lastPlay` holds
// just the MOST RECENT play's real cards, for challenge truth-checking; a client only ever
// sees `{ playerName, count, claimedRank }` for it. Same "withheld on the host" principle as
// Blackjack's hole card and Go Fish's opponent hands.
let H = {
    phase: 'lobby',              // 'lobby' | 'playing' | 'match_over'
    players: [],                 // [{ id, cid, name, hand:[Card], spectating }]
    turnIdx: 0,
    matchStartIdx: 0,             // rotates who goes first across successive "Play again"s
    sequenceMode: false,          // captain lobby toggle; false = free rank (default)
    seqRankIdx: 0,                 // which rank is required this cycle, meaningful only when sequenceMode
    pile: [],                      // accumulated REAL cards since the last pickup — host-only
    lastPlay: null,                 // { playerId, claimedRank, cards } — the pending, still-challengeable play
    challengeDeadline: null,        // epoch ms
    winnerId: null,
    milestones: [], milestoneSeq: 0,
};


// ═══════════════════════════════════════════
// HOST LOGIC
// ═══════════════════════════════════════════
function hostAddPlayer(id, name, cid) {
    if (H.players.find(p => p.id === id)) return;
    const spectating = H.phase !== 'lobby';
    if (!spectating && H.players.length >= MAX_PLAYERS) return;
    H.players.push({ id, cid, name, hand: [], spectating });
}

// null outside sequence mode; otherwise the rank whose turn it is, cycling continuously
// (Aces, Twos, Threes... Kings, back to Aces) — one step per completed turn, regardless of
// player count, exactly Bicycle/pagat's "the first player discards Aces, the second Twos..."
function requiredRank() { return H.sequenceMode ? (H.seqRankIdx % 13) + 1 : null; }

function nextIdx(idx) {
    const n = H.players.length; if (!n) return idx;
    let i = idx;
    for (let k = 0; k < n; k++) { i = (i + 1) % n; if (!H.players[i].spectating) return i; }
    return idx;
}
function advanceTurn() {
    H.turnIdx = nextIdx(H.turnIdx);
    if (H.sequenceMode) H.seqRankIdx = (H.seqRankIdx + 1) % 13;
    broadcast();
}

function hostStartGame(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'lobby') return;
    if (H.players.length < MIN_PLAYERS) return;
    H.players.forEach(p => { p.spectating = false; p.hand = []; });
    const deck = shuffled(makeDeck());
    let i = 0;
    while (deck.length) { H.players[i % H.players.length].hand.push(deck.pop()); i++; }
    H.turnIdx = H.matchStartIdx % H.players.length;
    H.matchStartIdx = (H.matchStartIdx + 1) % H.players.length;
    H.seqRankIdx = 0;
    H.pile = []; H.lastPlay = null; H.challengeDeadline = null; H.winnerId = null;
    H.milestones = []; H.milestoneSeq = 0;
    H.phase = 'playing';
    broadcast();
}
function hostPlayAgain(fromId) {
    if (capPlayer()?.id !== fromId) return;
    if (H.phase !== 'match_over') return;
    H.phase = 'lobby';
    H.players.forEach(p => { p.spectating = false; p.hand = []; });
    H.pile = []; H.lastPlay = null; H.challengeDeadline = null; H.winnerId = null;
    H.milestones = []; H.milestoneSeq = 0;
    broadcastLobby();
}
function hostCtl(fromId, action, value) {
    if (capPlayer()?.id !== fromId) return;
    if (action === 'sequenceMode' && H.phase === 'lobby') { H.sequenceMode = !!value; broadcastLobby(); }
    else if (action === 'start') hostStartGame(fromId);
    else if (action === 'again') hostPlayAgain(fromId);
}

let playTimer = null;
function clearPlayTimer() { if (playTimer) { clearTimeout(playTimer); playTimer = null; } }

// Validates fully BEFORE mutating anything, so a malformed message never leaves the hand in
// a half-changed state — never trust the phone's card ids, same discipline Going, Going,
// GONE! applies to a raise amount.
function hostPlay(fromId, cardIds, claimedRank) {
    if (H.phase !== 'playing' || H.lastPlay) return;
    const p = H.players[H.turnIdx];
    if (!p || p.id !== fromId) return;
    if (!Array.isArray(cardIds) || !cardIds.length) return;
    const ids = [...new Set(cardIds)];
    if (ids.length !== cardIds.length) return;
    const rank = Number(claimedRank);
    if (!Number.isInteger(rank) || rank < 1 || rank > 13) return;
    if (H.sequenceMode && rank !== requiredRank()) return;
    if (!ids.every(id => p.hand.some(c => c.id === id))) return;

    const cards = ids.map(id => p.hand.find(c => c.id === id));
    p.hand = p.hand.filter(c => !ids.includes(c.id));
    H.pile.push(...cards);
    H.lastPlay = { playerId: fromId, claimedRank: rank, cards };
    addMilestone(`${p.name} plays ${cards.length} card${cards.length > 1 ? 's' : ''}, claiming ${RANK_PLURAL[rank]}`);
    H.challengeDeadline = Date.now() + CHALLENGE_WINDOW_MS;
    broadcast();
    clearPlayTimer();
    playTimer = setTimeout(() => resolvePlay(null), CHALLENGE_WINDOW_MS);
}

function hostChallenge(fromId) {
    if (H.phase !== 'playing' || !H.lastPlay) return;
    if (fromId === H.lastPlay.playerId) return;   // can't challenge yourself
    const challenger = H.players.find(p => p.id === fromId);
    if (!challenger || challenger.spectating) return;
    resolvePlay(fromId);   // first challenge received wins — the honest way to referee "who
                            // called it first" over a network with real latency
}

// Runs from whichever happens first: the challenge-window timeout firing (challengerId=null)
// or the first `challenge` message the host receives. A second trigger arriving after
// H.lastPlay is already cleared is simply a no-op — see the guard below.
function resolvePlay(challengerId) {
    if (!H.lastPlay) return;
    clearPlayTimer();
    const play = H.lastPlay;
    const player = H.players.find(p => p.id === play.playerId);
    H.lastPlay = null;
    H.challengeDeadline = null;

    if (challengerId) {
        const challenger = H.players.find(p => p.id === challengerId);
        const honest = play.cards.every(c => c.rank === play.claimedRank);
        const loser = honest ? challenger : player;
        const pileSize = H.pile.length;
        loser.hand.push(...H.pile);
        H.pile = [];
        addMilestone(honest
            ? `${challenger.name} doubted ${player.name} — but it was true! ${challenger.name} picks up ${pileSize} cards.`
            : `${challenger.name} doubted ${player.name} — caught bluffing! ${player.name} picks up ${pileSize} cards.`);
    }
    // unchallenged: the played cards simply stay in H.pile (already pushed there in hostPlay)

    if (player.hand.length === 0) {
        H.phase = 'match_over';
        H.winnerId = player.id;
        addMilestone(`${player.name} wins!`);
        broadcast();
        return;
    }
    advanceTurn();
}

// ═══════════════════════════════════════════
// MESSAGES / DISPLAY
// ═══════════════════════════════════════════
function lobbyMsg() {
    return {
        type: 'lobby',
        players: H.players.filter(p => !p.spectating).map(p => ({ name: p.name })),
        roomCode, tvHost: isTvHost, captain: capPlayer()?.name || null,
        sequenceMode: H.sequenceMode,
    };
}
// Another player's actual cards, and the pile's actual contents, never enter this object —
// only counts — which is what makes the hidden information real, not just hidden by
// rendering.
function buildDisplay(playerId) {
    const me = H.players.find(p => p.id === playerId);
    const turnP = H.phase === 'playing' ? H.players[H.turnIdx] : null;
    const winner = H.winnerId ? H.players.find(p => p.id === H.winnerId) : null;
    return {
        type: 'state', phase: H.phase, roomCode, isCaptain: capPlayer()?.id === playerId,
        myHand: me ? me.hand : [],
        isMyTurn: !!turnP && turnP.id === playerId,
        turnPlayerName: turnP ? turnP.name : '',
        sequenceMode: H.sequenceMode,
        requiredRank: requiredRank(),
        pileCount: H.pile.length,
        pendingPlay: H.lastPlay ? {
            playerName: H.players.find(p => p.id === H.lastPlay.playerId)?.name || '',
            count: H.lastPlay.cards.length,
            claimedRank: H.lastPlay.claimedRank,
            deadline: H.challengeDeadline,
        } : null,
        canChallenge: !!H.lastPlay && H.lastPlay.playerId !== playerId,
        players: H.players.map((p, i) => ({
            id: p.id, name: p.name, handCount: p.hand.length, spectating: !!p.spectating, isTurn: i === H.turnIdx,
        })),
        milestones: H.milestones.slice(-8),
        winnerName: winner ? winner.name : '',
    };
}
function buildViewerDisplay() {
    const { myHand, isMyTurn, canChallenge, ...rest } = buildDisplay(null);
    return { ...rest, type: 'viewer_state' };
}
function phaseUi(phase) {
    if (phase === 'playing') return 'playing';
    if (phase === 'match_over') return 'match_over';
    return 'lobby';
}

function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }

function broadcastLobby() {
    const msg = lobbyMsg();
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, msg); });
    Object.values(viewerConns).forEach(c => send(c, { ...msg, type: 'viewer_lobby' }));
    if (isTvHost) { vD = { ...msg, type: 'viewer_lobby' }; ui = 'viewer'; render(); }
    else if (isHost) { D = msg; ui = 'lobby'; render(); }
}
function broadcast() {
    H.players.forEach(p => { if (p.id === myId) return; const c = guestConns[p.id]; if (c) send(c, buildDisplay(p.id)); });
    Object.values(viewerConns).forEach(c => send(c, buildViewerDisplay()));
    if (isTvHost) {
        const nd = buildViewerDisplay();
        const entering = nd.phase === 'match_over' && vD?.phase !== 'match_over';
        vD = nd; ui = 'viewer'; render();
        toastMilestones(nd.milestones);
        syncCountdown(nd.pendingPlay);
        if (entering) setTimeout(idConfetti, 200);
    } else if (isHost) {
        const d = buildDisplay(myId);
        if (!d.isMyTurn || d.pendingPlay) selCardIds.clear();
        D = d; ui = phaseUi(H.phase); render();
        toastMilestones(d.milestones);
        syncCountdown(d.pendingPlay);
    }
}

// ═══════════════════════════════════════════
// CONNECTION / PRESENCE
// ═══════════════════════════════════════════
let peer = null, myId = '', myName = '', isHost = false, isTvHost = false, isViewer = false, roomCode = '';
let hostConn = null, guestConns = {}, viewerConns = {};
let ui = 'home', uiErr = '';
let fName = (typeof savedName === 'function' ? savedName() : ''), fCode = '', fVCode = '';
let D = null, vD = null;
let selCardIds = new Set(), selRank = null;
let _lastKey = '';

function connectedPlayers() {
    if (typeof presentPlayers === 'function') {
        return presentPlayers(H.players, guestConns, myId, isHost && !isTvHost);
    }
    return H.players.filter(p => (p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]));
}

function makeRoom(onOpen) {
    forgetRoom();
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message; isHost = false; isTvHost = false;
            document.body.classList.remove('viewer-mode'); ui = 'home'; render();
        },
    });
}
function hostGame(name) {
    myName = name.trim().slice(0, 16) || 'Host';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { hostAddPlayer(myId, myName, clientId()); ui = 'lobby'; render(); });
}
function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => { isTvHost = true; document.body.classList.add('viewer-mode'); vD = { ...lobbyMsg(), type: 'viewer_lobby' }; ui = 'viewer'; render(); });
}
function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Player';
    try { saveName(myName); } catch (_) {}
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;
            hostConn.on('open', () => {
                connected = true; rememberRoom(code.trim().toUpperCase(), 'player');
                send(hostConn, { type: 'join', cid: clientId(), build: typeof BUILD !== 'undefined' ? BUILD : null, name: myName });
                if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} });
            });
            hostConn.on('data', msg => applyMsg(msg));
        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table — tap Join to get back in.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });
}
function joinAsViewer(code) {
    isViewer = true;
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });
            hostConn.on('data', msg => applyViewerMsg(msg));
        },
        onLost: () => { connected = false; },
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the table.' : 'Could not reach table "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}
function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });
    conn.on('data', msg => {
        {
            const alive = H.players.find(p => p.id === conn.peer);
            if (alive && typeof notePresence === 'function') notePresence(alive);
        }
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer'; viewerConns[conn.peer] = conn; send(conn, H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : buildViewerDisplay());
            return;
        }
        if (conn._role === null) { conn._role = 'player'; guestConns[conn.peer] = conn; }
        switch (msg.type) {
            case 'join': {
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Player').slice(0, 16);
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);
                if (zombie) { zombie.id = conn.peer; }
                else hostAddPlayer(conn.peer, name, msg.cid);
                const me2 = H.players.find(p => p.id === conn.peer);
                if (!me2 && H.phase === 'lobby') { send(conn, { type: 'full' }); break; }
                if (me2 && msg.cid) me2.cid = msg.cid;
                if (me2 && typeof notePresence === 'function') notePresence(me2);
                if (H.phase === 'lobby') broadcastLobby(); else broadcast();
                break;
            }
            case 'ctl': if (capPlayer()?.id === conn.peer) hostCtl(conn.peer, msg.action, msg.value); break;
            case 'play': hostPlay(conn.peer, msg.cardIds, msg.claimedRank); break;
            case 'challenge': hostChallenge(conn.peer); break;
            case 'hb': break;
        }
    });
    conn.on('close', () => {
        const prevCap = capPlayer()?.id || null;
        setTimeout(() => capSync(prevCap), 0);
        delete guestConns[conn.peer]; delete viewerConns[conn.peer];
        // H.players is never spliced once a game is under way (turnIdx is an index into it) —
        // only safe to remove someone while still in the lobby.
        if (H.phase === 'lobby') {
            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        }
    });
    conn.on('error', e => console.warn('conn err', e));
}

// ═══════════════════════════════════════════
// CLIENT ACTIONS
// ═══════════════════════════════════════════
let actionWatchdog = null;
function armActionWatchdog() {
    clearActionWatchdog();
    actionWatchdog = setTimeout(() => {
        actionWatchdog = null;
        showToast("That didn't seem to reach the table — check your connection and try again.");
    }, 4000);
}
function clearActionWatchdog() { if (actionWatchdog) { clearTimeout(actionWatchdog); actionWatchdog = null; } }

function guestCtl(action, value) {
    if (isHost && !isTvHost) { hostCtl(myId, action, value); return; }
    if (hostConn) { send(hostConn, { type: 'ctl', action, value }); armActionWatchdog(); }
}
function actPlay(cardIds, claimedRank) {
    if (isHost && !isTvHost) { hostPlay(myId, cardIds, claimedRank); return; }
    if (hostConn) { send(hostConn, { type: 'play', cardIds, claimedRank }); armActionWatchdog(); }
}
function actChallenge() {
    sChallenge();
    if (isHost && !isTvHost) { hostChallenge(myId); return; }
    if (hostConn) { send(hostConn, { type: 'challenge' }); armActionWatchdog(); }
}

// ── hand/rank selection (client-side only) ──
function idToggleCard(cardId) {
    if (!D || !D.isMyTurn || D.pendingPlay) return;
    if (selCardIds.has(cardId)) selCardIds.delete(cardId); else selCardIds.add(cardId);
    render();
}
function idPickRank(rank) {
    if (!D || !D.isMyTurn || D.pendingPlay || D.sequenceMode) return;
    selRank = rank;
    render();
}
function idSubmitPlay() {
    if (!D || !D.isMyTurn || D.pendingPlay || !selCardIds.size) return;
    const rank = D.sequenceMode ? D.requiredRank : selRank;
    if (rank == null) return;
    const ids = [...selCardIds];
    selCardIds.clear(); selRank = null;
    actPlay(ids, rank);
}

// ── the challenge countdown: a small ticking DOM patch, not a full re-render loop ──
let countdownTimer = null;
function clearCountdownTimer() { if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; } }
function syncCountdown(pendingPlay) {
    clearCountdownTimer();
    if (!pendingPlay) return;
    countdownTimer = setInterval(() => {
        const el = document.getElementById('id-countdown');
        if (!el) { clearCountdownTimer(); return; }
        const secs = Math.max(0, Math.ceil((pendingPlay.deadline - Date.now()) / 1000));
        el.textContent = secs + 's';
        if (secs <= 0) clearCountdownTimer();
    }, 200);
}

// ── toasts (milestones) ──
function showToast(text) {
    let host = document.getElementById('id-toasts');
    if (!host) { host = document.createElement('div'); host.id = 'id-toasts'; document.body.appendChild(host); }
    const el = document.createElement('div');
    el.className = 'id-toast';
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3000);
}
let lastMilestoneSeq = -1, seenFirstMilestones = false;
function toastMilestones(list) {
    if (!list) return;
    if (!seenFirstMilestones) {
        lastMilestoneSeq = list.length ? Math.max(...list.map(m => m.seq)) : -1;
        seenFirstMilestones = true;
        return;
    }
    const fresh = list.filter(m => m.seq > lastMilestoneSeq);
    fresh.forEach(m => {
        showToast(m.text);
        if (/caught bluffing/.test(m.text)) sBust();
        else if (/but it was true/.test(m.text)) sReject();
        else if (/wins!/.test(m.text)) sWin();
    });
    if (fresh.length) speak(fresh.map(m => m.speech).join(' '));
    if (list.length) lastMilestoneSeq = Math.max(lastMilestoneSeq, ...list.map(m => m.seq));
}

// ═══════════════════════════════════════════
// CLIENT APPLY
// ═══════════════════════════════════════════
function applyMsg(msg) {
    if (!msg) return;
    clearActionWatchdog();
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    if (msg.type === 'full') { forgetRoom(); uiErr = `This table is full (${MAX_PLAYERS}/${MAX_PLAYERS}).`; ui = 'home'; D = null; if (hostConn) { try { hostConn.close(); } catch (_) {} } render(); return; }
    if (msg.type === 'lobby') { D = msg; ui = 'lobby'; render(); return; }
    if (msg.type === 'state') {
        if (!msg.isMyTurn || msg.pendingPlay) selCardIds.clear();
        D = msg;
        ui = phaseUi(msg.phase);
        toastMilestones(msg.milestones);
        render();
        syncCountdown(msg.pendingPlay);
    }
}
function applyViewerMsg(msg) {
    if (!msg) return;
    if (msg.type === 'version') { if (typeof showStaleBuild === 'function') showStaleBuild(msg.host); return; }
    const entering = msg.type === 'viewer_state' && msg.phase === 'match_over' && vD?.phase !== 'match_over';
    vD = msg; ui = 'viewer';
    if (msg.type === 'viewer_state') { toastMilestones(msg.milestones); syncCountdown(msg.pendingPlay); }
    render();
    if (entering) setTimeout(idConfetti, 200);
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
    const app = document.getElementById('app');
    if (isTvHost || isViewer) ui = 'viewer';
    if (typeof syncVoiceBtn === 'function') syncVoiceBtn();
    let html = '';
    switch (ui) {
        case 'home': html = renderHome(); break;
        case 'creating': html = renderSpinner('Shuffling the deck…'); break;
        case 'connecting': html = renderSpinner('Joining the table…'); break;
        case 'lobby': html = renderLobby(); break;
        case 'playing': html = renderPlaying(); break;
        case 'match_over': html = renderMatchOver(); break;
        case 'viewer': html = renderViewer(); break;
        default: html = renderHome();
    }
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    const key = ui + ':' + (ui === 'viewer' ? (vD?.type || '') : '');
    app.classList.toggle('fresh', key !== _lastKey);
    _lastKey = key;
}

function hdrHTML(sub) {

function qrSVG(url) {
    try {
        const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
        const n = qr.getModuleCount(), m = 2, size = n + m * 2; let rects = '';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) rects += `<rect x="${c + m}" y="${r + m}" width="1.05" height="1.05"/>`;
        return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#f2eaf9"/><g fill="#1a1220">${rects}</g></svg>`;
    } catch (e) { return ''; }
}

            : `<div class="slbl">Claim…</div><div class="id-rankrow">${rankRow}</div>`;
        const canSubmit = selCardIds.size > 0 && (D.sequenceMode || selRank != null);
        playControls = `<div class="card">
            ${claimLabel}
            <button class="btn btn-p btn-full" style="margin-top:10px" ${canSubmit ? '' : 'disabled'} onclick="idSubmitPlay()">🃏 Play ${selCardIds.size || ''} card${selCardIds.size === 1 ? '' : 's'}</button>
        </div>`;
    }

    return `
    <div class="card" style="text-align:center">
        <div class="slbl">${D.isMyTurn ? 'Your turn' : esc(D.turnPlayerName) + "'s turn"}</div>
        ${pileHTML(D.pileCount)}
    </div>
    ${pendingHtml}
    <div class="card"><div class="slbl">Your hand — tap to select</div><div class="id-hand-row">${handHtml}</div></div>
    ${playControls}
    <div class="card"><div class="slbl">At the table</div>${seats}</div>`;
}

function renderMatchOver() {
    if (!D) return renderSpinner('…');
    const sorted = (D.players || []).map(p => ({ ...p, score: -p.handCount })).sort((a, b) => b.score - a.score);
    const ranks = typeof rankByScore === 'function' ? rankByScore(sorted, 'score') : sorted.map((_, i) => i);
    const rows = sorted.map((p, i) => `<div class="rank-item"><span class="rank-num">${ranks[i] + 1}</span><span>${esc(p.name)}</span><span style="margin-left:auto">${p.handCount} left</span></div>`).join('');
    return `${hdrHTML()}
    <div class="trophy"><div class="icon">🏆</div><div class="w-name">${esc(D.winnerName)}</div><div class="w-sub">out first, and survived</div></div>
    <div class="rankings">${rows}</div>
    ${D.isCaptain ? `<button class="btn btn-p btn-full" onclick="guestCtl('again')">🔄 Play again</button>` : `<div class="hint">Waiting for the captain…</div>`}`;
}

function renderViewer() {
    if (!vD) return renderSpinner('…');
    if (vD.type === 'viewer_lobby') {
        return typeof tvLobby === 'function' ? tvLobby({
            title: 'I DOUBT IT', roomCode: vD.roomCode, isTvHost: vD.tvHost, captainName: vD.captain,
            settings: vD.sequenceMode ? 'Ascending sequence rule' : 'Free rank — claim anything',
            players: (vD.players || []).map(p => ({ name: p.name })),
        }) : '';
    }
    const rail = (vD.players || []).map(p => `<div class="v-id-player${p.isTurn ? ' turn' : ''}${p.spectating ? ' spec' : ''}">
        <div class="nm">${esc(p.name)}</div>
        <div class="ct">${p.spectating ? '👀 watching' : p.handCount + ' cards'}</div>
    </div>`).join('');
    let pendingHtml = '';
    if (vD.pendingPlay) {
        const pp = vD.pendingPlay;
        pendingHtml = `<div class="v-pending">
            <div class="claim">${esc(pp.playerName)} plays ${pp.count}, claims ${RANK_PLURAL[pp.claimedRank]}</div>
            <div class="id-countdown" id="id-countdown">${Math.max(0, Math.ceil((pp.deadline - Date.now()) / 1000))}s</div>
        </div>`;
    }
    let overlay = '';
    if (vD.phase === 'match_over') {
        overlay = `<div class="v-overlay"><div class="v-gameover-trophy">🏆</div><div class="v-gameover-winner">${esc(vD.winnerName)}</div><div class="v-gameover-sub">out first, and survived</div></div>`;
    }
    return `<div class="v-screen">
        <div class="v-header"><div class="v-title">I DOUBT IT</div><div class="v-header-code">Room ${esc(vD.roomCode)}</div></div>
        <div class="v-pile"><div class="lbl">Pile</div><div style="font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900">${vD.pileCount} cards</div></div>
        ${pendingHtml}
        <div class="v-id-players">${rail}</div>
        ${overlay}
    </div>`;
}

function idConfetti() {
    if (REDUCED) return;
    for (let i = 0; i < 36; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.textContent = ['🃏', '🎭', '😏', '🏆', '✨'][Math.floor(Math.random() * 5)];
            el.style.cssText = `position:fixed;top:-6vmin;left:${Math.random() * 96}%;font-size:${2 + Math.random() * 2.5}vmin;z-index:940;pointer-events:none;transition:transform 3.2s linear,opacity 3.2s;`;
            document.body.appendChild(el);
            requestAnimationFrame(() => { el.style.transform = `translateY(112vh) rotate(${(Math.random() - .5) * 720}deg)`; el.style.opacity = '0.2'; });
            setTimeout(() => el.remove(), 3400);
        }, i * 60);
    }
}

// ═══════════════════════════════════════════
// AUDIO (ambient.js: pad + tone() + duck())
// ═══════════════════════════════════════════
let musicOn = true, sfxOn = true, voicePref = null;
try { musicOn = localStorage.getItem('id-music') !== '0'; sfxOn = localStorage.getItem('id-sfx') !== '0'; voicePref = localStorage.getItem('id-voice'); } catch (_) {}
// A smoky, suspicious drift.
const AMBIENT_CHORDS = [[196, 233, 294], [175, 208, 262], [196, 247, 294], [220, 262, 311]];
function sChallenge() { if (!sfxOn || !ac()) return; tone(360, 0.08, 'sawtooth', AC.currentTime, 0.22); }
function sBust() { if (!sfxOn || !ac()) return; duck(0.8); tone(160, 0.16, 'sawtooth', AC.currentTime, 0.24); }
function sReject() { if (!sfxOn || !ac()) return; tone(300, 0.12, 'triangle', AC.currentTime, 0.2); }
function sWin() { if (!sfxOn || !ac()) return; duck(1.4); const t = AC.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.26, 'triangle', t + i * 0.08, 0.28)); }
function toggleMusic() { musicOn = !musicOn; try { localStorage.setItem('id-music', musicOn ? '1' : '0'); } catch (_) {} const b = document.getElementById('tog-music'); if (b) b.classList.toggle('off', !musicOn); if (musicOn) startPad(); else stopPad(); }
function toggleSfx() { sfxOn = !sfxOn; try { localStorage.setItem('id-sfx', sfxOn ? '1' : '0'); } catch (_) {} const b = document.getElementById('tog-sfx'); if (b) b.classList.toggle('off', !sfxOn); }
function toggleVoice() {
    voicePref = voiceOn() ? '0' : '1';
    try { localStorage.setItem('id-voice', voicePref); } catch (_) {}
    syncVoiceBtn();
    if (!voiceOn() && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
}
function voiceOn() { return voicePref === null ? !!(isViewer || isTvHost) : voicePref !== '0'; }
function primeSpeech() {
    if (typeof speechSynthesis === 'undefined') return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', () => { ac(); if (AC && AC.state === 'suspended') AC.resume(); if (musicOn) startPad(); primeSpeech(); }, { once: true });

// ── Theme (day/night) ──
typeof applySavedTheme === 'function' && applySavedTheme();

// ═══════════════════════════════════════════
// SIMULATION — ?mode=tvsimulation | ?mode=playersimulation  (&players=N)
// ═══════════════════════════════════════════
const SIM_NAMES = ['Ace', 'Bea', 'Cy', 'Dot', 'Eli', 'Fay', 'Gus', 'Ivy'];
let simTimer = null, simMode = 'tv';
function startSimulation(nPlayers, mode) {
    simMode = mode === 'player' ? 'player' : 'tv';
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));
    roomCode = 'DEMO';
    H = { phase: 'lobby', players: [], turnIdx: 0, matchStartIdx: 0, sequenceMode: false, seqRankIdx: 0,
          pile: [], lastPlay: null, challengeDeadline: null, winnerId: null, milestones: [], milestoneSeq: 0 };
    guestConns = {}; viewerConns = {};
    isHost = true;
    if (simMode === 'tv') {
        isTvHost = true; myId = '__sim_host__'; myName = '';
        document.body.classList.add('viewer-mode');
        for (let i = 0; i < n; i++) {
            const id = '__bot_' + i;
            guestConns[id] = { send() {}, _sim: true };
            hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id);
        }
    } else {
        isTvHost = false; myName = 'You'; myId = '__you__';
        hostAddPlayer(myId, myName, myId);
        for (let i = 1; i < n; i++) {
            const id = '__bot_' + i;
            guestConns[id] = { send() {}, _sim: true };
            hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length], id);
        }
        ui = 'lobby';
    }
    broadcastLobby();
    simTimer = setTimeout(simBegin, 2200);
}
function simBegin() {
    hostStartGame(capPlayer()?.id);
    simTimer = setTimeout(simStep, 1200);
}
function simRestart() { startSimulation(H.players.length, simMode); }
function simStep() {
    simTimer = null;
    if (H.phase === 'match_over') { simTimer = setTimeout(simRestart, 6000); return; }
    if (H.phase === 'playing' && !H.lastPlay) { simBotTurn(); simTimer = setTimeout(simStep, CHALLENGE_WINDOW_MS + 600); return; }
    simTimer = setTimeout(simStep, 800);
}
function simBotTurn() {
    const p = H.players[H.turnIdx];
    if (!p || !p.hand.length) return;
    const n = 1 + Math.floor(Math.random() * Math.min(3, p.hand.length));
    const cardIds = p.hand.slice(0, n).map(c => c.id);
    const rank = H.sequenceMode ? requiredRank() : (1 + Math.floor(Math.random() * 13));
    hostPlay(p.id, cardIds, rank);
    const playedFor = p.id;
    H.players.filter(x => x.id !== p.id && !x.spectating).forEach(o => {
        if (Math.random() < 0.25) {
            setTimeout(() => { if (H.lastPlay && H.lastPlay.playerId === playedFor) hostChallenge(o.id); }, 800 + Math.random() * Math.max(200, CHALLENGE_WINDOW_MS - 1200));
        }
    });
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
(function boot() {
    const params = new URLSearchParams(location.search);
    if (!musicOn) { const b = document.getElementById('tog-music'); if (b) b.classList.add('off'); }
    if (!sfxOn) { const b = document.getElementById('tog-sfx'); if (b) b.classList.add('off'); }
    syncVoiceBtn();
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv'); return; }
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player'); return; }
    const viewParam = params.get('view');
    if (viewParam) { joinAsViewer(viewParam); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
