<!DOCTYPE html>
<html lang="en">
<head>

    <title>Going, Going, GONE! — Auction House</title>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .gav { display: inline-block; width: 1em; height: 1em; vertical-align: -.18em; overflow: visible; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #150a1e; --panel: rgba(45,26,64,0.72); --panel2: rgba(60,36,86,0.85);
            --border: rgba(232,183,90,0.3); --border2: rgba(160,130,190,0.28);
            --text: #f6eefb; --muted: #a893bd;
            --gold: #e8b75a; --gold2: #f5d38a; --up: #4ade80; --down: #f87171; --plum: #b478e0;
        }
        body.day {
            --bg: #f3ecdf; --panel: rgba(255,255,255,0.93); --panel2: #ffffff;
            --border: rgba(70,50,20,0.16); --border2: rgba(70,50,20,0.16);
            --text: #241a10; --muted: #6b5c45;
            --gold: #cf8f12; --gold2: #f5d38a; --up: #2f9e5b; --down: #d64545; --plum: #b478e0;
        }
        body.day::before { opacity: .55; }
        body.day input[type=text] { background: rgba(70,50,20,.05); }
        body.day .btn-g { background: rgba(70,50,20,.06); }
        body.day .shelf .sh-item { background: rgba(70,50,20,.05); }
        body.day .gavel-wrap,
        body.day .tv-gavel-wrap { background: rgba(70,50,20,.12); }
        body.day .tv-lobby .qr-side { background: #ffffff; }
        body.day #sound-togs button { background: rgba(255,255,255,.85); }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
            padding: 26px 16px 48px; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(ellipse 55% 42% at 50% 0%, rgba(232,183,90,0.16) 0%, transparent 62%),
                radial-gradient(ellipse 45% 38% at 10% 100%, rgba(180,120,224,0.12) 0%, transparent 65%),
                radial-gradient(ellipse 45% 38% at 92% 100%, rgba(232,183,90,0.08) 0%, transparent 65%);
        }
        body.viewer-mode { padding: 0; overflow: hidden; display: block; height: 100dvh; width: 100vw; }

        h1.logo {
            font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: .5px;
            font-size: clamp(1.45rem, 6.2vw, 2.2rem); text-align: center; color: var(--gold);
            text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 30px rgba(232,183,90,.4);
        }
        .sub { color: var(--muted); font-size: .68rem; letter-spacing: 2.5px; text-transform: uppercase; margin: 7px 0 22px; text-align: center; font-weight: 800; }

        #app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 13px; }
        body.viewer-mode #app { max-width: none; height: 100dvh; display: block; }

        .card {
            background: var(--panel); border: 1px solid var(--border2); border-radius: 16px;
            padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 12px 34px rgba(0,0,0,.5);
        }
        .card.highlight { border-color: var(--gold); box-shadow: 0 0 26px rgba(232,183,90,.16), 0 12px 34px rgba(0,0,0,.5); }
        .slbl { font-size: .64rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 11px; }

        .fg { margin-bottom: 12px; }
        .fg label { display: block; font-size: .64rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
        input[type=text] {
            width: 100%; padding: 12px 14px; font-family: inherit; font-size: 1rem; font-weight: 700;
            border: 2px solid var(--border2); border-radius: 11px; background: rgba(21,10,30,.7); color: var(--text);
            outline: none;
        }
        input[type=text]:focus { border-color: var(--gold); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; font-weight: 900; font-size: .92rem; letter-spacing: .4px;
            padding: 13px 18px; border: none; border-radius: 13px; cursor: pointer;
            transition: filter .12s, opacity .12s, box-shadow .12s; user-select: none; -webkit-user-select: none;
            color: var(--text);
        }
        .btn { transition: filter .12s, opacity .12s, box-shadow .12s, transform .1s; }
        .btn:active { filter: brightness(1.15); transform: scale(.97); }
        .btn-p { background: linear-gradient(180deg, var(--gold2), #c99334); color: #2a1a05; box-shadow: 0 5px 0 #8a6220, 0 10px 22px rgba(232,183,90,.3); }
        .btn-p:active { box-shadow: 0 2px 0 #8a6220; }
        .btn-g { background: rgba(160,130,190,.14); box-shadow: inset 0 0 0 2px var(--border2); }
        .btn-full { width: 100%; }
        .btn-sm { padding: 8px 13px; font-size: .74rem; border-radius: 10px; }
        .btn:disabled { opacity: .38; cursor: default; }

        .err {
            background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.5); color: #fda4af;
            padding: 11px 14px; border-radius: 12px; font-size: .8rem; font-weight: 700; text-align: center;
        }
        hr { border: none; border-top: 1px dashed var(--border2); margin: 13px 0; }

        .connecting { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 46px 0; color: var(--muted); font-weight: 700; }
        .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(232,183,90,.15); border-top-color: var(--gold); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-row { display: flex; align-items: center; gap: 11px; padding: 8px 4px; border-bottom: 1px dashed var(--border2); font-weight: 800; font-size: .92rem; }
        .player-row:last-child { border-bottom: none; }
        .pdot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 8px var(--up); margin-left: auto; }
        .qr-wrap { width: min(210px, 58vw); margin: 6px auto 10px; border-radius: 13px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
        .qr-wrap svg { display: block; width: 100%; height: auto; }
        .room-code { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 2.3rem; letter-spacing: 11px; text-align: center; color: var(--gold); padding-left: 11px; text-shadow: 0 0 18px rgba(232,183,90,.4); }
        .share-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0 6px; }
        .seg-row { display: flex; flex-wrap: wrap; gap: 7px; }

        /* ── phone: lot & bidding ── */
        .lot-card { text-align: center; padding: 22px 16px; }
        .lot-card .lemoji { font-size: 3.4rem; }
        .lot-card .lname { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.4rem; margin-top: 8px; }
        .lot-card .ldesc { color: var(--muted); font-weight: 700; font-size: .85rem; margin-top: 6px; font-style: italic; }
        .lot-kicker { font-size: .62rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
        .lot-card .lphoto { width: 100%; max-width: 200px; height: 148px; object-fit: contain; border-radius: 12px; background: rgba(255,255,255,.07); padding: 7px; }
        .lsrc { font-size: .56rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-top: 9px; opacity: .7; }
        .price-big { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 3rem; color: var(--gold); text-shadow: 0 0 22px rgba(232,183,90,.35); font-variant-numeric: tabular-nums; }
        .lead-banner {
            border-radius: 13px; padding: 11px; font-weight: 900; text-align: center;
            background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.45); color: #a7f3c9;
        }
        .lead-banner.other { background: rgba(160,130,190,.12); border-color: var(--border2); color: var(--muted); }
        .bid-btns { display: flex; gap: 9px; flex-wrap: wrap; }
        .bid-btns .btn { flex: 1; font-size: 1.05rem; padding: 14px 8px; line-height: 1.15; }
        /* the price the button makes, because that is the number the auctioneer calls out */
        .bid-btns .btn small { display: block; font-size: .68rem; font-weight: 800; opacity: .72; margin-top: 2px; }
        /* the opening ask: one button, the auctioneer's own number */
        .bid-btns .btn-open { flex: 1 0 100%; font-size: 1.12rem; padding: 18px 8px; }
        .bid-btns .open-note { flex: 1 0 100%; text-align: center; color: var(--muted); font-weight: 800; font-size: .7rem; }
        /* he has split the increment — the smaller ask is the one to notice */
        .bid-btns .btn.soft { background: linear-gradient(180deg, #f6eefb, #c9a8e6); color: #2a1a05; box-shadow: 0 5px 0 #7a4fa0, 0 10px 22px rgba(180,120,224,.35); animation: softIn .35s cubic-bezier(.2,1.5,.35,1); }
        @keyframes softIn { 0% { transform: scale(.82); } 60% { transform: scale(1.06); } 100% { transform: none; } }
        /* an ask is a question, not a price — it reads a touch cooler, and lurches when it drops */
        .price-big.asking, .tv-price.asking { color: var(--plum); text-shadow: 0 0 22px rgba(180,120,224,.32); }
        .price-big.drop, .tv-price.drop, .tv-ask.drop { animation: askDrop .5s cubic-bezier(.3,1.5,.4,1); }
        @keyframes askDrop {
            0% { transform: translateY(-22%) scale(1.14); opacity: .35; }
            60% { transform: translateY(4%) scale(.97); opacity: 1; }
            100% { transform: none; }
        }
        .gavel-wrap { height: 10px; border-radius: 6px; background: rgba(255,255,255,.09); overflow: hidden; }
        .gavel-bar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), var(--down)); transition: width .1s linear; }
        .coins-chip { display: inline-block; padding: 4px 12px; border-radius: 11px; background: rgba(232,183,90,.12); border: 1px solid var(--border); color: var(--gold); font-weight: 900; font-size: .8rem; }

        /* THE PADDLE. Blade + handle, drawn in the bidder's own colour, and the auctioneer sells
           to the number on it. Everything scales off --pad-h, so the same markup is a 22px chip in
           a lobby row and a 26vmin trophy on the SOLD card. */
        .paddle {
            --pad-h: 26px;
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: calc(var(--pad-h) * .82); height: var(--pad-h);
            /* every modifier is pad-* on purpose: a bare `.tv` here collided with the game's own
               full-screen .tv wrapper and stretched the rail paddle to 100dvh, which silently
               pushed all but the first bidder off the bottom of the TV. */
            border-radius: calc(var(--pad-h) * .16);
            background: linear-gradient(160deg, var(--pc), color-mix(in srgb, var(--pc) 58%, #1a1024));
            box-shadow: 0 calc(var(--pad-h) * .05) calc(var(--pad-h) * .16) rgba(0,0,0,.45),
                        inset 0 0 0 calc(var(--pad-h) * .035) rgba(255,255,255,.4);
            flex: 0 0 auto; vertical-align: middle; margin-bottom: calc(var(--pad-h) * .22);
        }
        /* the handle */
        .paddle::after {
            content: ''; position: absolute; left: 50%; top: 96%;
            width: calc(var(--pad-h) * .17); height: calc(var(--pad-h) * .3);
            transform: translateX(-50%); border-radius: 0 0 calc(var(--pad-h) * .09) calc(var(--pad-h) * .09);
            background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 62%, #1a1024), #4a3320);
        }
        .paddle .pnum {
            font-family: 'Playfair Display', serif; font-weight: 900; line-height: 1;
            font-size: calc(var(--pad-h) * .46); color: #2a1a05;
            text-shadow: 0 1px 0 rgba(255,255,255,.35);
        }
        .paddle.pad-big { --pad-h: 92px; }
        .paddle.pad-tv { --pad-h: 5vmin; }
        .paddle.pad-huge { --pad-h: 22vmin; }
        /* raised, because you are holding the bid */
        .paddle.pad-up { animation: paddleUp .5s cubic-bezier(.2,1.5,.35,1) both; }
        @keyframes paddleUp {
            0% { transform: translateY(30%) rotate(-6deg); }
            60% { transform: translateY(-12%) rotate(3deg); }
            100% { transform: none; }
        }
        .paddle-row { display: flex; align-items: center; justify-content: center; gap: 12px; }

        /* the auctioneer's summing-up: one line at a time, after the thing it is about has landed */
        .crow { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-top: 10px; }
        .cline {
            font-weight: 800; text-align: center; color: var(--muted); font-size: .82rem;
            font-style: italic; max-width: 34ch;
        }
        body.viewer-mode .crow { gap: 1vmin; margin-top: 1.6vmin; }
        body.viewer-mode .cline { font-size: 2.5vmin; max-width: 62ch; color: #d9cbe8; }
        #app.fresh .cline { animation: paidIn .55s ease both; animation-delay: var(--d, 0s); }
        .paddle-lbl { font-weight: 900; font-size: .74rem; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
        .shelf { display: flex; flex-wrap: wrap; gap: 6px; }
        .shelf .sh-item {
            background: rgba(21,10,30,.6); border: 1px solid var(--border2); border-radius: 10px;
            padding: 6px 10px; font-size: .72rem; font-weight: 800;
        }
        .shelf .sh-item .val { font-weight: 900; }
        .shelf .sh-item .val.plus { color: var(--up); }
        .shelf .sh-item .val.minus { color: var(--down); }

        .sold-card { text-align: center; padding: 26px 16px; }
        .sold-card .gavel { font-size: 3.6rem; display: inline-block; animation: bang .7s ease; }
        @keyframes bang { 0% { transform: rotate(-38deg) translateY(-14px); } 55% { transform: rotate(8deg); } 75% { transform: rotate(-6deg); } 100% { transform: rotate(0); } }
        .sold-card .st { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.6rem; margin-top: 6px; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 11px; background: rgba(232,183,90,.12); border: 1px solid var(--border); color: var(--gold); font-weight: 900; font-size: .74rem; margin: 3px; }
        .standings .sc { margin-left: auto; font-weight: 900; font-variant-numeric: tabular-nums; }

        /* ═════════ TV ═════════ */
        .tv { height: 100dvh; display: flex; flex-direction: column; padding: 2.6vmin 3.2vmin 16vmin; gap: 1.8vmin; }
        .tv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; }
        .tv-logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 3.1vmin; color: var(--gold); text-shadow: 0 0 24px rgba(232,183,90,.4); }
        .tv-meta { font-size: 1.8vmin; font-weight: 900; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); }
        .tv-main { flex: 1; display: flex; gap: 2.4vmin; min-height: 0; }
        .tv-stage { flex: 1.7; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 1.6vmin; }
        .tv-rail { flex: 1; display: flex; flex-direction: column; gap: 1.2vmin; min-width: 0; overflow: hidden; }
        .rail-title { font-size: 1.5vmin; font-weight: 900; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); }
        .rail-row {
            display: flex; align-items: center; gap: 1.2vmin; background: var(--panel);
            border: 1px solid var(--border2); border-radius: 1.5vmin; padding: 1.2vmin 1.5vmin;
            font-weight: 800; font-size: 2vmin;
        }
        .rail-row .rname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rail-row .rcoins { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
        .rail-row .rwait { font-weight: 800; font-size: 1.9vmin; color: var(--muted); white-space: nowrap; }
        /* how flush somebody LOOKS, which is all the room gets while the bidding is live */
        .rail-row .rpurse { font-weight: 900; font-size: 1.9vmin; letter-spacing: .1vmin; white-space: nowrap; }
        .rail-row .rpurse.flush { color: #ffd777; }
        .rail-row .rpurse.comfortable { color: #a7f3c9; }
        .rail-row .rpurse.short { color: #f6c177; }
        .rail-row .rpurse.skint { color: var(--down); opacity: .85; }
        .rail-row .rlots { color: var(--muted); font-size: 1.5vmin; }
        .rail-row.leader { border-color: var(--gold); box-shadow: 0 0 18px rgba(232,183,90,.22); }

        .tv-lot {
            flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 2.2vmin;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin;
            text-align: center; padding: 3vmin; position: relative; overflow: hidden;
        }
        .tv-lot::before {
            content: ''; position: absolute; inset: -30%; pointer-events: none;
            background: radial-gradient(ellipse 45% 38% at 50% 18%, rgba(232,183,90,.14) 0%, transparent 60%);
        }
        .tv-lot .lemoji { font-size: 12vmin; filter: drop-shadow(0 1vmin 2.4vmin rgba(0,0,0,.5)); }
        .tv-lot .lname { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 5vmin; }
        .tv-lot .ldesc { color: var(--muted); font-weight: 700; font-size: 2.6vmin; font-style: italic; max-width: 64vmin; }
        .tv-lot .lkick { font-size: 2vmin; font-weight: 900; letter-spacing: .45vmin; text-transform: uppercase; color: var(--gold); }
        .tv-lot .lphoto { width: 42vmin; height: 30vmin; object-fit: contain; border-radius: 1.6vmin; background: rgba(255,255,255,.07); padding: 1vmin; }
        .tv-lot .lsrc { font-size: 1.6vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; color: var(--muted); margin-top: 1.2vmin; opacity: .7; }
        /* The lot INTRO unveils in auction order: the lot number announces, the item is
           UNVEILED at .8s (the sLotIntro sting is timed to it — LOT_UNVEIL_MS), the name
           stamps at 1.6s, the patter follows, then the provenance. Intro only — the compact
           card on the bidding screen shows everything at once, because bidding has started. */
        #app.fresh .tv-lot.intro .lkick { animation: paidIn .4s ease both; }
        #app.fresh .tv-lot.intro .lemoji, #app.fresh .tv-lot.intro .lphoto { animation: unveilIn .6s cubic-bezier(.2, 1.2, .3, 1) .8s both; }
        #app.fresh .tv-lot.intro .lname { animation: stampIn .45s cubic-bezier(.2, 1.6, .35, 1) 1.6s both; }
        #app.fresh .tv-lot.intro .ldesc { animation: paidIn .5s ease 2.4s both; }
        #app.fresh .tv-lot.intro .lsrc, #app.fresh .tv-lot.intro .tv-waiting { animation: paidIn .5s ease 3.1s both; }
        @keyframes unveilIn { from { opacity: 0; transform: scale(.6) translateY(2vmin); } to { opacity: 1; transform: none; } }
        .tv-price { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 7vmin; color: var(--gold); text-shadow: 0 0 30px rgba(232,183,90,.4); font-variant-numeric: tabular-nums; line-height: 1; }
        .tv-leader { font-size: 2.3vmin; font-weight: 900; }
        /* What he is asking for NEXT, on screen the whole time bidding is running — it is the one
           number every phone in the room is deciding about, so the telly says it out loud. */
        .tv-ask { font-size: 2.6vmin; font-weight: 900; color: var(--plum); min-height: 1.2em; }
        .tv-ask b { font-family: 'Playfair Display', serif; font-size: 3.4vmin; color: var(--gold); }
        .tv-gavel-row { display: flex; align-items: center; gap: 2vmin; }
        .tv-gavel-row .going { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 2.6vmin; color: var(--down); min-width: 22vmin; text-align: right; }
        .tv-gavel-wrap { flex: 1; height: 1.6vmin; border-radius: .9vmin; background: rgba(255,255,255,.09); overflow: hidden; }
        .tv-gavel-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--down)); border-radius: .9vmin; transition: width .1s linear; }

        .tv-sold {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.6vmin; text-align: center;
        }
        /* The sold screen plays in auction order: the gavel BANGS, then the auctioneer's call
           ("SOLD to Karen for 200!") STAMPS at .7s — the burst is timed to it (SOLD_STAMP_MS)
           — then the wry aside lands. Gated on #app.fresh so a mid-pause re-render (a join)
           shows it settled instead of replaying the bang. A passed lot gets no bang: the
           feather drifts down, which is the correct amount of ceremony for zero bids. */
        .tv-sold .gavel { font-size: 16vmin; }
        .tv-sold .who { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 7vmin; color: var(--gold); }
        .tv-sold .sub2 { font-size: 3vmin; font-weight: 800; color: var(--muted); }
        #app.fresh .tv-sold .gavel { animation: bang .8s ease; }
        #app.fresh .tv-sold.passed .gavel { animation: featherIn 1.6s cubic-bezier(.3, .6, .4, 1) both; }
        #app.fresh .tv-sold .who { animation: stampIn .45s cubic-bezier(.2, 1.6, .35, 1) .7s both; }
        #app.fresh .tv-sold .sub2 { animation: paidIn .5s ease 1.7s both; }
        @keyframes featherIn {
            0% { opacity: 0; transform: translateY(-9vmin) rotate(-24deg); }
            55% { transform: translateY(-2.5vmin) rotate(14deg); }
            100% { opacity: 1; transform: none; }
        }

        /* valuation */
        .tv-val { flex: 1; display: flex; flex-direction: column; gap: 1.6vmin; min-height: 0; }
        .val-card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 2.2vmin;
            padding: 3vmin 3.6vmin; display: flex; align-items: center; gap: 2.6vmin;
            animation: valIn .7s cubic-bezier(.2, .9, .3, 1.15) both;
        }
        @keyframes valIn { from { opacity: 0; transform: translateY(4vmin) scale(.96); } to { opacity: 1; transform: none; } }
        .val-card .vemoji { font-size: 7.5vmin; }
        .val-card .lphoto { border-radius: 1.1vmin; background: rgba(255,255,255,.07); padding: .5vmin; object-fit: contain; }
        .val-card .vname { font-weight: 900; font-size: 4.2vmin; font-family: 'Playfair Display', serif; }
        .val-card .vpaid { color: var(--muted); font-weight: 800; font-size: 2.9vmin; }
        .val-card .vsrc { color: var(--muted); font-weight: 800; font-size: 1.6vmin; letter-spacing: .25vmin; text-transform: uppercase; opacity: .6; margin-top: .3vmin; }
        .val-card .vworth { margin-left: auto; text-align: right; font-weight: 900; font-size: 4.6vmin; font-variant-numeric: tabular-nums; }
        .val-card .vworth .profit { font-size: 3.4vmin; display: block; }
        /* The live card reveals in FOUR beats, in auction order: the lot slides in, the winning
           bid lands ("Karen paid 200"), the true value answers it, then the profit STAMPS. The
           stamp delay must match STAMP_MS in the script — the stinger, pop and burst are all
           timed to hit on it. Older cards re-render with animation:none, so only the newest
           reveal ever plays the sequence. */
        .val-card.live .vpaid, .val-card.live .vsrc { animation: paidIn .5s ease .9s both; }
        .val-card.live .vworth { animation: worthIn .5s ease 1.9s both; }
        .val-card.live .vworth .profit { animation: stampIn .45s cubic-bezier(.2, 1.6, .35, 1) 2.8s both; }
        @keyframes paidIn { from { opacity: 0; transform: translateX(-2vmin); } to { opacity: 1; transform: none; } }
        @keyframes worthIn { from { opacity: 0; transform: translateX(3vmin); } to { opacity: 1; transform: none; } }
        @keyframes stampIn { from { opacity: 0; transform: scale(2.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
        /* the drama scales with the money: a $4,000 mistake should not look like a $12 one */
        .val-card.mag-big .vworth .profit { font-size: 5vmin; }
        .val-card.mag-huge .vworth .profit { font-size: 7vmin; }
        .val-card.mag-big { border-color: rgba(232,183,90,.5); }
        .val-card.mag-huge { border-color: var(--gold); box-shadow: 0 0 5vmin rgba(232,183,90,.3); }
        .val-card.live.mag-huge { animation: valIn .7s cubic-bezier(.2, .9, .3, 1.15) both, hugeGlow 1.1s ease 2.8s 2; }
        @keyframes hugeGlow { 50% { box-shadow: 0 0 9vmin rgba(232,183,90,.6); transform: scale(1.02); } }
        .val-card.mag-huge .vworth .profit.plus { text-shadow: 0 0 2.5vmin rgba(74,222,128,.65); }
        .val-card.mag-huge .vworth .profit.minus { text-shadow: 0 0 2.5vmin rgba(248,113,113,.65); }
        .val-card .vworth .profit.plus { color: var(--up); }
        .val-card .vworth .profit.minus { color: var(--down); }
        /* centred, not bottom-anchored: one or two big cards mid-screen read as a stage moment,
           not a ticker huddled at the foot of an empty TV */
        .val-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1.6vmin; justify-content: center; }

        /* TV lobby */
        .tv-lobby { flex: 1; display: flex; gap: 4vmin; align-items: center; min-height: 0; }
        .tv-lobby .qr-side { background: #241333; border: 1px solid var(--border); border-radius: 2.2vmin; padding: 3.2vmin; text-align: center; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
        .tv-lobby .qr-side .qr-wrap { width: 32vmin; margin: 1.4vmin auto; }
        .tv-lobby .qr-side .room-code { font-size: 4.6vmin; letter-spacing: 1.9vmin; padding-left: 1.9vmin; }
        .tv-lobby .join-hint { font-size: 1.7vmin; font-weight: 800; color: var(--muted); }
        .tv-players { flex: 1; display: flex; flex-direction: column; gap: 1.5vmin; min-width: 0; }
        .tv-player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(20vmin, 1fr)); gap: 1.5vmin; }
        .tv-pcard {
            background: var(--panel); border: 1px solid var(--border2); border-radius: 1.7vmin;
            padding: 1.7vmin; text-align: center; font-weight: 900; font-size: 2vmin;
        }
        .tv-pcard .pdot { width: 2.2vmin; height: 2.2vmin; margin: 0 auto 1vmin; }
        @keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
        .tv-waiting { color: var(--muted); font-weight: 800; font-size: 1.9vmin; }

        /* podium — the finale gets the valuation treatment: BIG, and revealed in podium order
           (bronze → silver → gold, delays set inline per medal rank), with the fanfare and
           confetti timed to the gold pod landing (PODIUM_GOLD_MS in the script). */
        /* THE BANKED BOARD — between rounds. Rows land poorest-first (--d per row, matching
           BANK_STEP_MS) so the leader's new bankroll is the last number to appear, and each net
           worth stamps in after its own row. Deliberately not a podium: no medals, no confetti. */
        .bank-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.1vmin; padding: 0 5vmin; }
        .bank-title { text-align: center; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 6vmin; color: var(--gold); text-shadow: 0 0 3vmin rgba(232,183,90,.35); }
        .bank-sub { text-align: center; font-weight: 800; font-size: 2.2vmin; color: var(--muted); margin-bottom: 1.4vmin; }
        .bank-row {
            display: flex; align-items: center; gap: 1.8vmin; font-weight: 900;
            background: var(--panel); border: 1px solid var(--border); border-radius: 1.6vmin; padding: 1.3vmin 2.4vmin;
        }
        .bank-row .bplace { color: var(--muted); font-size: 2.6vmin; width: 3vmin; }
        .bank-row .bname { flex: 1; font-size: 3.4vmin; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bank-row .bmath { color: var(--muted); font-size: 2.2vmin; font-variant-numeric: tabular-nums; }
        .bank-row .bnet { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 4.4vmin; font-variant-numeric: tabular-nums; min-width: 9vmin; text-align: right; }
        .bank-row.top { border-color: var(--gold); box-shadow: 0 0 4vmin rgba(232,183,90,.25); }
        .bank-row.top .bnet { font-size: 5.4vmin; }
        #app.fresh .bank-row { animation: valIn .5s cubic-bezier(.2,1.1,.3,1) both; animation-delay: var(--d, 0s); }
        #app.fresh .bank-row .bnet { animation: stampIn .4s cubic-bezier(.2,1.6,.35,1) both; animation-delay: calc(var(--d, 0s) + .3s); }
        #app.fresh .bank-title { animation: popIn .6s cubic-bezier(.2,1.2,.3,1) both; }
        #app.fresh .bank-sub { animation: paidIn .5s ease .5s both; }

        .podium-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3vmin; padding-bottom: 1vmin; }
        .pod { text-align: center; font-weight: 900; }
        .pod .pname { font-size: 3.4vmin; margin-bottom: .8vmin; }
        .pod .pscore { font-size: 3vmin; color: var(--gold); margin-bottom: .8vmin; font-family: 'Playfair Display', serif; }
        .pod .block { border-radius: 1.5vmin 1.5vmin 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 1.3vmin; font-size: 5vmin; width: 22vmin; }
        .pod.p1 .block { height: 26vmin; }
        .pod.p2 .block { height: 17vmin; }
        .pod.p3 .block { height: 11vmin; }
        .pod.mrank-0 .pname { font-size: 4.2vmin; }
        .pod.mrank-0 .pscore { font-size: 3.8vmin; }
        .pod.mrank-0 .block { background: linear-gradient(180deg, var(--gold2), #8a6220); box-shadow: 0 0 6vmin rgba(232,183,90,.4); }
        .pod.mrank-1 .block { background: linear-gradient(180deg, #d7d7e0, #8f8fa3); }
        .pod.mrank-2 .block { background: linear-gradient(180deg, #e8a06a, #9c5a33); }
        .awards-row { display: flex; gap: 1.5vmin; justify-content: center; flex-wrap: wrap; padding-bottom: 2vmin; }
        .award { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5vmin; padding: 1.3vmin 2vmin; font-weight: 800; font-size: 2.2vmin; text-align: center; }
        .award .aw-t { color: var(--gold); font-weight: 900; }

        #confetti-cv { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

        /* sound toggles */
        #sound-togs { position: fixed; top: 10px; right: 10px; z-index: 80; display: flex; gap: 6px; }
        #sound-togs button {
            width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem;
            background: rgba(45,26,64,.78); box-shadow: inset 0 0 0 1px var(--border);
            transition: opacity .2s, transform .12s;
        }
        #sound-togs button:active { transform: scale(.88); }
        #sound-togs button.off { opacity: .35; filter: grayscale(1); }
        body.viewer-mode #sound-togs { top: auto; bottom: 10px; right: 10px; opacity: .75; }

        /* FX layer — particles + floating text */
        .pt {
            position: fixed; width: 9px; height: 9px; border-radius: 2px;
            z-index: 950; pointer-events: none;
            animation: ptFly .75s cubic-bezier(.15,.65,.4,1) forwards;
        }
        @keyframes ptFly {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(560deg) scale(.3); opacity: 0; }
        }
        .pop {
            position: fixed; z-index: 960; pointer-events: none;
            font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.5rem;
            animation: popUp 1.1s cubic-bezier(.2,.8,.3,1) forwards;
            text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: nowrap;
        }
        .pop.good { color: var(--up); }
        .pop.gold { color: var(--gold); }
        .pop.bad  { color: var(--down); font-size: 1.15rem; }
        @keyframes popUp {
            0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
            15%  { transform: translate(-50%, -12px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -78px) scale(1); opacity: 0; }
        }

        /* screen entrances — only on phase changes (#app.fresh), never on same-screen re-renders */
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        #app.fresh .card { animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
        #app.fresh .player-row { animation: rowIn .3s ease-out both; animation-delay: calc(var(--i, 0) * 40ms); }
        @keyframes tvIn { from { opacity: 0; transform: translateY(2.4vmin); } to { opacity: 1; transform: none; } }
        #app.fresh .tv-lot, #app.fresh .qr-side, #app.fresh .tv-sold, #app.fresh .tv-val { animation: tvIn .4s cubic-bezier(.2,.8,.3,1) both; }
        #app.fresh .tv-pcard { animation: popIn .35s ease both; animation-delay: calc(var(--i, 0) * 50ms); }
        #app.fresh .pod { animation: popIn .6s cubic-bezier(.2, 1.2, .3, 1) both; }
        #app.fresh .award { animation: valIn .5s ease both; animation-delay: calc(.9s + var(--i, 0) * .15s); }
        /* on the TV the awards wait for the gold pod to land (phones keep the quick reveal) */
        body.viewer-mode #app.fresh .award { animation-delay: calc(4.2s + var(--i, 0) * .25s); }

        /* bidding feedback */
        @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
        .price-big.bump, .tv-price.bump { animation: bump .28s ease; }
        @keyframes shakeX {
            10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); }
        }
        #lead-banner.shake { animation: shakeX .45s both; }
        .gavel-bar.low, .tv-gavel-bar.low { background: linear-gradient(90deg, var(--down), #dc2626); }
        @keyframes goingPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: .72; } }
        #going-lbl.low, #v-going.low { animation: goingPulse .55s ease-in-out infinite; }

        /* ── ambient auction-house backdrop: drifting gavels, price-tags & coins ── */
        #ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        #ambient .amb {
            position: absolute; top: var(--y, 50%); left: var(--x, 50%);
            font-size: var(--sz, 3rem); line-height: 1; opacity: 0; will-change: transform;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,.4));
            animation: ambDrift var(--d, 30s) ease-in-out var(--dl, 0s) infinite;
        }
        #ambient .amb.coin {
            width: var(--sz, 2.4rem); height: var(--sz, 2.4rem); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: calc(var(--sz, 2.4rem) * .5);
            font-family: 'Playfair Display', serif; font-weight: 900; color: #5a3d10;
            background: radial-gradient(circle at 36% 30%, var(--gold2) 0%, var(--gold) 55%, #9c7420 100%);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), inset 0 -4px 8px rgba(0,0,0,.25);
        }
        @keyframes ambDrift {
            0%   { opacity: 0; transform: translate3d(0, 12px, 0) rotate(var(--r0, -8deg)) scale(.9); }
            14%  { opacity: var(--o, .16); }
            50%  { transform: translate3d(var(--dx, 20px), -18px, 0) rotate(var(--r1, 10deg)) scale(1.04); }
            86%  { opacity: var(--o, .16); }
            100% { opacity: 0; transform: translate3d(0, 12px, 0) rotate(var(--r0, -8deg)) scale(.9); }
        }
        body.viewer-mode #ambient .amb { font-size: var(--tsz, var(--sz, 4vmin)); }

        /* ── THE AUCTIONEER ────────────────────────────────────────────────────────────────
           Drawn in CSS, because the only third-party art in this repo is Kenney's CC0 sprites
           and adding more means the whole provenance dance in llmwiki/sprites-and-licensing.md.
           He lives OUTSIDE #app: that element's innerHTML is replaced on every render, and a
           talking head rebuilt mid-sentence would drop its mouth animation and its `talking`
           class every time a bid landed. TV only — a row of ten phones each with their own
           auctioneer is not a joke that lands.
           Everything is a fraction of --ah, so his size is one number. The TV shell reserves a
           band at the bottom for him (see .tv padding) rather than letting him sit on top of a
           panel, which looked like a bug rather than a character. */
        #auctioneer { --ah: 18vmin; position: fixed; left: 3vmin; bottom: 0; width: calc(var(--ah) * .86); height: var(--ah); z-index: 11; pointer-events: none; display: none; }
        body.viewer-mode #auctioneer { display: block; }
        #auctioneer .au { position: absolute; inset: 0; transform-origin: bottom center; animation: auBob 3.6s ease-in-out infinite; }
        @keyframes auBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(calc(var(--ah) * -.018)) rotate(-.8deg); } }

        /* rostrum */
        /* HIS SPEECH BUBBLE. Wide as the screen allows, about as tall as he is, and filled on
           EVERY line whether or not the device can actually speak — which is the point: on a
           Fire TV, where Web Speech does not exist at all, this is how he still says it. */
        #auctioneer-bubble {
            position: fixed; z-index: 11; pointer-events: none;
            left: calc(3vmin + var(--ah, 18vmin) * .86 + 3vmin);
            right: 4vmin; bottom: 2.5vmin; min-height: calc(var(--ah, 18vmin) * .74);
            padding: 2vmin 3vmin; border-radius: 2.6vmin;
            background: linear-gradient(180deg, #fdf7ff, #e6dcf2); color: #241a38;
            border: .35vmin solid var(--gold); box-shadow: 0 1vmin 3vmin rgba(0,0,0,.55);
            font-weight: 800; font-size: 3vmin; line-height: 1.3;
            align-items: center; justify-content: center; text-align: center;
            opacity: 0; transition: opacity .18s ease;
            display: none;      /* …and NOT on a phone: this is the television's auctioneer */
        }
        body.viewer-mode #auctioneer-bubble { display: flex; }
        body.viewer-mode #auctioneer-bubble.on { opacity: 1; }
        /* the tail, pointing back at the man */
        #auctioneer-bubble::after {
            content: ''; position: absolute; left: -2.2vmin; bottom: 3.5vmin;
            border: 1.2vmin solid transparent; border-right-color: var(--gold);
        }
        #auctioneer-bubble::before {
            content: ''; position: absolute; left: -1.5vmin; bottom: 3.5vmin; z-index: 1;
            border: 1.2vmin solid transparent; border-right-color: #fdf7ff;
        }
        /* a long line simply sets itself smaller rather than overflowing */
        #auctioneer-bubble.long { font-size: 2.4vmin; }
        #auctioneer-bubble.vlong { font-size: 2vmin; }

        #voice-hint {
            position: fixed; left: 50%; bottom: 2.4vmin; transform: translateX(-50%); z-index: 12;
            padding: 1vmin 2.4vmin; border-radius: 2vmin; font-weight: 900; font-size: 2vmin;
            background: rgba(40,28,60,.92); border: 1px solid var(--gold); color: var(--gold2);
            box-shadow: 0 0 3vmin rgba(0,0,0,.6); animation: hintPulse 2.4s ease-in-out infinite;
            pointer-events: none; display: none;
        }
        body.viewer-mode #voice-hint { display: block; }
        @keyframes hintPulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }

        #auctioneer .desk { position: absolute; left: -12%; bottom: 0; width: 124%; height: 30%; border-radius: calc(var(--ah) * .045) calc(var(--ah) * .045) 0 0; background: linear-gradient(180deg, #6b4415, #3a2409); box-shadow: inset 0 calc(var(--ah) * .022) 0 rgba(255,255,255,.2), 0 0 calc(var(--ah) * .2) rgba(0,0,0,.5); z-index: 4; }
        #auctioneer .desk::after { content: ''; position: absolute; left: 14%; top: 26%; width: 72%; height: 16%; border-radius: calc(var(--ah) * .02); background: rgba(232,183,90,.22); }
        /* body */
        #auctioneer .torso { position: absolute; left: 17%; bottom: 22%; width: 66%; height: 36%; border-radius: calc(var(--ah) * .14) calc(var(--ah) * .14) calc(var(--ah) * .03) calc(var(--ah) * .03); background: linear-gradient(170deg, #382a4e, #1d1730); box-shadow: inset 0 0 0 calc(var(--ah) * .012) rgba(232,183,90,.4); z-index: 2; }
        #auctioneer .tie { position: absolute; left: 50%; top: 12%; width: 13%; height: 60%; transform: translateX(-50%); background: linear-gradient(180deg, var(--gold), #9c7420); clip-path: polygon(50% 0, 100% 20%, 66% 100%, 34% 100%, 0 20%); }
        /* head */
        #auctioneer .head { position: absolute; left: 25%; bottom: 52%; width: 50%; height: 36%; border-radius: 46% 46% 42% 42%; background: radial-gradient(120% 120% at 38% 30%, #f6d9b8, #cfa075); z-index: 3; }
        #auctioneer .hair { position: absolute; left: -6%; top: -10%; width: 112%; height: 46%; border-radius: 50% 50% 34% 34%; background: linear-gradient(180deg, #4a3524, #2a1c10); }
        #auctioneer .eye { position: absolute; top: 46%; width: 13%; height: 13%; border-radius: 50%; background: #241a12; animation: auBlink 5.4s infinite; }
        #auctioneer .eye.l { left: 22%; } #auctioneer .eye.r { right: 22%; }
        @keyframes auBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
        /* the mouth is the whole point: it moves only while he is ACTUALLY speaking */
        /* No keyframe loop here on purpose. A fixed flap is a metronome: it looks identical
           whether he is saying "sold" or reading out a hundred and fifty-three thousand. The
           height and width are set from JS, one step per syllable of the words actually being
           spoken — see startMouth(). (The first version DID have a CSS loop plus an inline
           height per word, which is worse than either: a running animation overrides inline
           styles, so the per-word variation was computed and then thrown away.) */
        #auctioneer .mouth { position: absolute; left: 50%; top: 66%; width: 26%; height: 6%; transform: translateX(-50%); border-radius: 12% 12% 46% 46%; background: #6b2b2b; transition: height .05s linear, width .05s linear; }
        #auctioneer.talking .au { animation: auBob 1.2s ease-in-out infinite; }
        /* arm + gavel, which swing only when the hammer actually falls */
        #auctioneer .arm { position: absolute; right: 4%; bottom: 40%; width: 12%; height: 26%; border-radius: calc(var(--ah) * .06); background: linear-gradient(180deg, #382a4e, #221a38); transform-origin: 50% 8%; transform: rotate(-14deg); z-index: 5; }
        #auctioneer .gav { position: absolute; left: -70%; bottom: -14%; width: 240%; height: 34%; border-radius: calc(var(--ah) * .02); background: linear-gradient(180deg, #f4b63e, #9c6d18); box-shadow: 0 calc(var(--ah) * .008) 0 rgba(0,0,0,.35); }
        #auctioneer .gav::after { content: ''; position: absolute; left: 38%; top: 96%; width: 24%; height: 150%; border-radius: 0 0 40% 40%; background: linear-gradient(180deg, #b97e26, #7a5314); }
        #auctioneer.bang .arm { animation: auBang .55s cubic-bezier(.3, 1.4, .4, 1); }
        @keyframes auBang { 0% { transform: rotate(-72deg); } 45% { transform: rotate(6deg); } 70% { transform: rotate(-24deg); } 100% { transform: rotate(-14deg); } }

'use strict';

// ═══════════════════════════════════════════
// CONSTANTS & CONTENT
// ═══════════════════════════════════════════
const PFX = 'GAVEL-';
const MAX_PLAYERS = 10, MIN_PLAYERS = 2;
// $7,000 is the simulator's answer, not a guess: at 3 lots per player it gives games decided by
// ~10% of the winner's score with almost nobody shut out. Raising it makes games CLOSER but
// leaves more players with nothing — scarcity is what spreads the lots around. See
// goinggoneplan-realitems.md for the sweep.
const START_COINS = 7000;
// Raises have to scale with the lot. Real prices run $1 to a five-figure lot in a late round, so a
// fixed +10/+50/+100 would need seventy taps to reach a serious bid. Each rung is about a tenth, a
// half and a whole of the current order of magnitude, so any lot is reachable in a handful of taps
// at any size.
const RAISE_LADDER = [
    { under: 100, raises: [10, 50, 100] },
    { under: 1000, raises: [50, 250, 500] },
    { under: 5000, raises: [250, 1000, 2500] },
    { under: 25000, raises: [1000, 5000, 10000] },
    { under: 100000, raises: [5000, 25000, 50000] },
    { under: Infinity, raises: [25000, 100000, 250000] },
];
const raisesFor = price => RAISE_LADDER.find(r => price < r.under).raises;

// ── SPLITTING THE INCREMENT ─────────────────────────────────────────────────
// Once the bidding is running, an auctioneer who cannot get another full jump does not simply
// drop the hammer — he asks for less. "I'm bid five thousand, will you give me five-five? Five-
// two? Five-one?" So as the gavel countdown runs out the ask softens, in steps, down to a floor
// of about 2% of the current price (never under a pound, so a cheap lot really does reach "just
// one more").
//
// HIS ASK NEVER CLIMBS BACK UP. He came down to twenty-five because the room would not give him
// a hundred; a bid at twenty-five does not change that, so asking a hundred again — and then
// laddering all the way back down, on every single bid — is theatre with nothing behind it. He
// remembers what the room will actually pay and carries on from there. sim/goinggone-bidding.js
// measures the difference over thousands of lots: leaving the ask where the room left it takes
// SEVEN SECONDS off an average lot and lands within a few percent of the same price, for about
// half a tap more. (The same sim kills the other obvious idea — seeding a NEW lot from the last
// few lots' appetite — outright: it nearly doubles the taps, because a lot that opens on a soft
// rung climbs in dribs. Each lot starts him back at a full jump; within the lot he only descends.)
const SOFT_SHARE = [1, 0.5, 0.25];         // the share of the first rung he will take at each step
const RAISE_FLOOR = 0.02;                 // past the last step: this share of the price, min 1
// EACH STEP GETS ITS OWN WINDOW. Deriving the step from how much of one gavel had elapsed meant
// the whole descent happened inside five seconds and the cheapest ask existed for under one of
// them — a reflex test rather than a decision. He now comes down a step and WAITS, exactly as he
// does when fishing for an opening bid, and the step is explicit state rather than something each
// device works out from its own clock (which is also how the clock-skew grace went away).


// ── HE ASKS FOR A ROUND NUMBER ──────────────────────────────────────────────
// An auctioneer thinks in the PRICE, not the step, and the price he calls is one a person would
// actually say: "three thousand one hundred", never "three thousand and twenty-two". So his asks
// are built as a ladder of ROUND PRICES — the next multiple of each successively smaller unit —
// and the increment is merely whatever gets you there.
//
// Built as a descending, de-duplicated set rather than by shrinking the step, because shrinking
// the step does not behave: at £21,000 a half and a quarter step both round to £21,500, so he
// "comes down" three times to the same number; and at £67,000 the smaller unit lands HIGHER
// (68,000) than the bigger one did (67,500).
const NICE = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
const tidyUnit = inc => NICE.filter(u => u <= Math.max(1, inc)).pop() || 1;

// Every price he might call for this lot, biggest first. Each rung is a NOTIONAL step (the full
// jump, a half, a quarter, the floor) rounded UP to a unit that suits its size — step first, then
// tidy. Taking the next multiple of the step instead collapses the opening ask whenever the price
// sits just under a round number: at 2,963 the next multiple of 250 is 3,000, a jump of 37.
// A rung that lands level with the one above is nudged down a unit, because coming down to the
// same number twice reads as a stuck screen.
function askLadderFor(price) {
    const full = raisesFor(price)[0];
    // Sized from where the ask will LAND, not from where the bidding currently is: at 99 the
    // asks run past 100, and choosing the unit from 99 let a £102 through — which is not a
    // number anybody calls.
    const mag = price + full;
    const floorUnit = mag >= 1000 ? 25 : mag >= 100 ? 5 : 1;
    const incs = [full, full / 2, full / 4, Math.max(1, Math.round(price * RAISE_FLOOR))];
    const out = [];
    for (const inc of incs) {
        const u = Math.max(floorUnit, tidyUnit(Math.max(1, Math.min(full, inc))));
        let ask = Math.ceil((price + Math.max(1, inc)) / u) * u;
        while (out.length && ask >= out[out.length - 1]) ask -= u;
        if (ask > price) out.push(ask); else break;
    }
    return out;
}

// The raise he is asking for at step `idx` — the price at that rung, less what is bid.
// Strictly decreasing by construction, so he can never ask MORE as he grows more desperate.
function softMinRaise(price, idx) {
    const ladder = askLadderFor(price);
    if (!ladder.length) return 1;
    return ladder[Math.max(0, Math.min(ladder.length - 1, idx | 0))] - price;
}
// Has he run out of round numbers between here and the next one? Then the close is what comes
// next, and this is the only beat at which "going once" is an honest thing to say.
function lastRung(price, idx) { return (idx | 0) >= askLadderFor(price).length - 1; }

const SOFT_STEPS = SOFT_SHARE.length;     // …after which the hammer really does fall

// ── THE AUCTIONEER'S ASK ────────────────────────────────────────────────────
// Bidding does not open at nothing. The auctioneer calls for an opening bid — and he is not an
// honest man. The ask starts somewhere either side of what the thing is really worth, so it is a
// CLUE with a lie built into it. If nobody bites he FISHES: "nobody? then who'll give me…" and
// comes down, and down, until the next drop would go under the reserve, at which point the lot is
// PASSED IN and nobody gets it. (Both are real auction practice — fishing down for an opening bid
// is standard, and "passed in" is the trade's own term for failing to make the reserve.)
// Holding out for the next drop is therefore a game of nerve: wait, and somebody else takes it,
// or it leaves the room entirely.
const RESERVE_FRAC = 0.25;              // the pass-in floor, as a share of true value
// The opening ask is drawn from one of three MOODS, chosen fresh per lot and never revealed —
// not a single band with noise on it. A single band is a formula in disguise: simulated against
// the real 983-lot catalogue, a repeat player who just learns "true value ≈ ask ÷ 1.3" lands
// within 25% of the truth 58% of the time. Splitting the ask into a mood that always undersells,
// one that always oversells, and the old honest band cuts that to 25% while an ask still means
// *something* — see sim output referenced in llmwiki. ASK_LO/ASK_HI are the outer bounds, used
// only for sanity checks elsewhere.
const ASK_MOODS = [
    { lo: 0.45, hi: 0.85 },   // undersells — a gift, every time
    { lo: 0.85, hi: 1.9 },    // roughly honest — the whole of the old band
    { lo: 1.9, hi: 3.2 },     // oversells — a swindle, every time
];
const ASK_LO = 0.45, ASK_HI = 3.2;
const DROP_HI = 0.75, DROP_LO = 0.55;   // each "nobody? then who'll give me…" step
const ASK_STEPS = 5;                    // most he will ever come down before passing it in
const reserveFor = value => Math.round(value * RESERVE_FRAC);
// Auctioneers ask for $48,000, never $47,318.
function roundAsk(v) {
    if (v < 20) return Math.max(1, Math.round(v));
    const mag = Math.pow(10, Math.floor(Math.log10(v)) - 1);
    return Math.round(v / mag) * mag;
}
// The whole descending ladder for one lot, drawn up front: [opening ask, …, last ask]. Random per
// lot, so the same item never plays the same way twice — and which mood is in play is never sent
// to a device, so there is nothing to read off the wire either.
function askLadder(value) {
    const floor = value * RESERVE_FRAC;
    const mood = ASK_MOODS[Math.floor(Math.random() * ASK_MOODS.length)];
    let a = value * (mood.lo + Math.random() * (mood.hi - mood.lo));
    const out = [];
    while (out.length < ASK_STEPS && a >= floor) {
        const r = roundAsk(a);
        if (r >= floor && (!out.length || r < out[out.length - 1])) out.push(r);
        a *= DROP_LO + Math.random() * (DROP_HI - DROP_LO);

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function $id(id) { return document.getElementById(id); }

// Real prices run to five figures, so every number on screen needs separators — "4200" and
// "$4,200" are the same figure but only one of them is readable from a sofa.
const num = n => Number(n || 0).toLocaleString('en-US');

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// "Jul 2026". Shown while bidding on purpose: these are real prices that move, so a figure that
// looks wrong needs a visible explanation rather than looking like a bug. Bidding is when the
// argument happens, so that is where the date has to be.
function priceDate(iso) {
    const [y, m] = String(iso || '').split('-');
    return (MONTHS[+m - 1] || '') + ' ' + (y || '');
}
// The lot's picture, falling back to its emoji. These images are hotlinked from retailer CDNs:
// some block cross-origin referrers and all of them rot eventually, so a failed load must degrade
// to the emoji card rather than leaving a broken frame on the telly.
// ── TOFU ────────────────────────────────────────────────────────────────────
// Incomplete emoji fonts (Fire OS's Silk on a Fire TV, older smart-TV browsers) draw a glyph they
// do not have as an empty rectangle. The detector lives in common.js, because every game paints
// emoji and they all meet the same televisions — these are the guarded wrappers, so a browser
// holding a STALE common.js without it still shows the emoji rather than throwing.
// NB: do not redeclare common.js's names here. A game's inline script and common.js share ONE
// global lexical scope, so a duplicate top-level const is a SyntaxError that blanks the game.
const ggGlyph = (...opts) => (typeof emojiPick === 'function' ? emojiPick(...opts) : opts[0]);
const ggMissing = ch => (typeof emojiOK === 'function' ? !emojiOK(ch) : false);

// Every emoji in the CHROME that is newer than about 2018, with an older stand-in. The lots have
// their own emoji too — hundreds of them — handled in lotArtHTML.
const ICON = {
    coin: ggGlyph('🪙', '💰'),        // 2019
    feather: ggGlyph('🪶', '🕊️', '💤'), // 2020 — the passed-in card
    mug: ggGlyph('🫠', '😵', '😳'),    // 2021 — Mug of the Match
    skint: ggGlyph('🫥', '😶', '·'),   // 2021 — the emptiest purse
    monocle: ggGlyph('🧐', '🔍'),      // 2018 — the valuer
    frame: ggGlyph('🖼️', '🏷️'),        // the shelf
};

function lotArtHTML(l, imgStyle, emojiStyle) {
    const face = ggMissing(l.emoji) ? '📦' : l.emoji;   // a box beats a broken box
    const emoji = extra => `<div class="lemoji" style="${emojiStyle || ''}${extra}">${face}</div>`;
    if (!l.img) return emoji('');
    return `<img class="lphoto" style="${imgStyle || ''}" src="${esc(l.img)}" alt="" referrerpolicy="no-referrer"
        onerror="this.style.display='none';this.nextElementSibling.style.display='';">` + emoji(';display:none');
}

function qrSVG(url) { return qrModulesSVG(url, '#fdf6ec', '#241333'); }

// ── Confetti ──
const CONFETTI_COLS = ['#e8b75a', '#b478e0', '#4ade80', '#22d3ee', '#f472b6', '#f6eefb'];

// ═══════════════════════════════════════════
// AUDIO — procedural auction-house engine
// (E-minor urgency: galloping bass, lowpassed
//  sawtooth brass, gavel percussion. Gesture-
//  started; music ~0.33 vol, SFX on top.)
// ═══════════════════════════════════════════
let AC = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuf = null;
let leadBus = null, musicDelay = null;
let musicOn = localStorage.getItem('gavel-music') !== '0';
let sfxOn = localStorage.getItem('gavel-sfx') !== '0';

function ac() {
    if (!AC) {
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        masterGain = AC.createGain(); masterGain.gain.value = 1; masterGain.connect(AC.destination);
        musicGain = AC.createGain(); musicGain.gain.value = musicOn ? 0.33 : 0; musicGain.connect(masterGain);
        sfxGain = AC.createGain(); sfxGain.gain.value = sfxOn ? 0.55 : 0; sfxGain.connect(masterGain);
        // Lead bus with a short dry slapback — big saleroom, hard walls
        leadBus = AC.createGain(); leadBus.gain.value = 1; leadBus.connect(musicGain);
        musicDelay = AC.createDelay(1.2); musicDelay.delayTime.value = 0.24;
        const fb = AC.createGain(); fb.gain.value = 0.16;
        const dlp = AC.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2000;
        const wet = AC.createGain(); wet.gain.value = 0.14;
        leadBus.connect(musicDelay); musicDelay.connect(dlp); dlp.connect(fb); fb.connect(musicDelay);
        dlp.connect(wet); wet.connect(musicGain);
        const len = AC.sampleRate * 1.2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
}

function noiseHit(dur, { vol = 0.3, when = 0, hp = 6000, dest = null } = {}) {
    if (!AC) return;
    const t = AC.currentTime + when;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || sfxGain);
    src.start(t); src.stop(t + dur + 0.05);
}

const mf = m => 440 * Math.pow(2, (m - 69) / 12); // midi → freq

// ── SFX (saleroom: coin clinks, brass stings, one very real gavel) ──
function sJoin() {
    if (!sfxOn || !AC) return;
    tone(mf(76), 0.07, { type: 'triangle', vol: 0.22 });
    tone(mf(83), 0.13, { type: 'triangle', vol: 0.22, when: 0.06 });
}
// "Lot N!" — two lowpassed sawtooth brass stabs + a herald note
function sLotIntro() {
    if (!sfxOn || !AC) return;
    duckMusic(0.8);
    [52, 55, 59].forEach(m => tone(mf(m + 12), 0.14, { type: 'sawtooth', vol: 0.07, lp: 1700, attack: 0.006 }));
    [52, 55, 59].forEach(m => tone(mf(m + 12), 0.22, { type: 'sawtooth', vol: 0.08, lp: 1700, when: 0.17, attack: 0.006 }));
    tone(mf(76), 0.18, { type: 'square', vol: 0.15, lp: 3500, when: 0.35 });
}
// Coin clink — pitch climbs with the bid amount
function sBid(price) {
    if (!sfxOn || !AC) return;
    const m = 76 + Math.min(19, Math.floor((price || 0) / 60));
    tone(mf(m), 0.05, { type: 'square', vol: 0.16, lp: 6500 });
    tone(mf(m + 12), 0.09, { type: 'triangle', vol: 0.2, when: 0.035 });
    noiseHit(0.025, { vol: 0.07, hp: 9000 });
}
// You've been outbid — two-note alert dive
function sOutbid() {
    if (!sfxOn || !AC) return;
    tone(mf(70), 0.08, { type: 'square', vol: 0.2, lp: 3200 });
    tone(mf(64), 0.18, { type: 'square', vol: 0.18, when: 0.08, slide: mf(58), lp: 2600 });
}
// "Going once… going twice…" — tense brass stings
function sGoing(n) {
    if (!sfxOn || !AC) return;
    if (n === 1) {
        tone(mf(59), 0.3, { type: 'sawtooth', vol: 0.12, lp: 1300 });
        tone(mf(47), 0.3, { type: 'sawtooth', vol: 0.09, lp: 900 });
    } else {
        [0, 0.13].forEach(w => {
            tone(mf(62), 0.16, { type: 'sawtooth', vol: 0.12, lp: 1500, when: w });
            tone(mf(50), 0.16, { type: 'sawtooth', vol: 0.09, lp: 1000, when: w });
        });
    }
}
// THE GAVEL — deep thump, wood body, crack, little bounce
function sGavel() {
    auctBang();                                       // the arm comes down with the sound
    if (!sfxOn || !AC) return;
    duckMusic(1.0);
    tone(110, 0.3, { type: 'sine', vol: 0.65, slide: 36 });
    tone(210, 0.08, { type: 'square', vol: 0.22, lp: 800, slide: 110 });
    noiseHit(0.12, { vol: 0.4, hp: 1400 });
    noiseHit(0.05, { vol: 0.22, hp: 6000 });
    tone(95, 0.18, { type: 'sine', vol: 0.28, slide: 40, when: 0.14 });
}
// Winner's coin flourish, riding out of the gavel bang
function sWonLot() {
    if (!sfxOn || !AC) return;
    [0, 4, 7, 12].forEach((s, i) => tone(mf(76 + s), 0.09, { type: 'triangle', vol: 0.24, when: 0.35 + i * 0.055 }));
}
// The auctioneer comes down a rung — a descending pair, a little deflating
function sDrop() {
    if (!sfxOn || !AC) return;
    tone(mf(69), 0.1, { type: 'triangle', vol: 0.16, lp: 3000 });
    tone(mf(64), 0.18, { type: 'triangle', vol: 0.16, lp: 2600, when: 0.09 });
    noiseHit(0.04, { vol: 0.1, hp: 5000, when: 0.09 });
}
// The round banks — a till drawer and a rising handful of coins
function sBank() {
    if (!sfxOn || !AC) return;
    duckMusic(1.1);
    noiseHit(0.06, { vol: 0.26, hp: 2600 });
    tone(mf(60), 0.12, { type: 'square', vol: 0.16, lp: 3200 });
    [72, 76, 79, 84].forEach((m, i) => tone(mf(m), 0.13, { type: 'triangle', vol: 0.22, when: 0.14 + i * 0.075 }));
    noiseHit(0.35, { vol: 0.12, when: 0.44, hp: 7000 });
}
// Passed lot — a feather falls
function sPassed() {
    if (!sfxOn || !AC) return;
    tone(mf(52), 0.35, { type: 'sawtooth', vol: 0.08, lp: 1000, slide: mf(45) });
    tone(mf(40), 0.4, { type: 'sine', vol: 0.14, when: 0.08, slide: mf(35) });
}
// Budget blown — womp womp
function sBroke() {
    if (!sfxOn || !AC) return;
    tone(mf(50), 0.28, { type: 'sawtooth', vol: 0.1, lp: 1100, slide: mf(48) });
    tone(mf(46), 0.42, { type: 'sawtooth', vol: 0.11, lp: 1000, when: 0.26, slide: mf(42) });
}
// Valuation cha-ching — arpeggio grows with the profit
function sProfit(p) {
    if (!sfxOn || !AC) return;
    duckMusic(0.7);
    const steps = p >= 300 ? [0, 4, 7, 12, 16, 19, 24] : p >= 120 ? [0, 4, 7, 12, 16] : [0, 4, 7, 12];
    steps.forEach((s, i) => tone(mf(76 + s), 0.09, { type: 'square', vol: 0.19, lp: 5200, when: i * 0.055 }));
    if (p >= 300) noiseHit(0.3, { vol: 0.13, when: 0.42, hp: 8000 });
}
// Valuation loss — sad trombone, extra-low tag for a real bath
function sLoss(l) {
    if (!sfxOn || !AC) return;
    duckMusic(0.9);
    [63, 61, 59, 55].forEach((m, i) => tone(mf(m), 0.24, { type: 'sawtooth', vol: 0.09, lp: 1200, when: i * 0.2, slide: mf(m - 1) }));
    if (l <= -200) tone(mf(40), 0.5, { type: 'sine', vol: 0.18, when: 0.82, slide: mf(35) });
}
// Final hammer — then the lobby gallop motif takes the bow, closing trill + crash
function sWin() {
    if (!sfxOn || !AC) return;
    duckMusic(1.6);

// ═══════════════════════════════════════════
// Ten phones all chanting over each other would be bedlam: the auctioneer belongs to the room, so
// he only ever speaks from the big screen (viewer/TV-host). The lines are SPOKEN, not recorded —
// hundreds of clips of "who'll give me forty-eight thousand?" cannot be pre-recorded when the
// numbers come out of a live auction, and files would need hosting, licensing and bandwidth this
// repo deliberately does not have. Web Speech reads whatever number the room has just reached.
//
// The vocabulary is real. Bid-calling is a chant of TWO numbers — what is bid, and what he wants
// next — stitched together with the trade's own "filler words" ("dollar bid", "now", "who'll give
// me", "do I hear", "I'm bid"). Fishing DOWN for an opening bid is standard practice, and a lot
// that never makes its reserve is "passed in". Lines are assembled from banks rather than stored
// whole, so a few dozen fragments give many hundreds of distinct calls.
// ANY device that can speak is allowed to — the 🗣️ toggle decides, and it is on every screen,
// including a television that came in through "…or show an existing auction" (that path sets
// isViewer, so it always could). The toggle merely DEFAULTS off on a phone: five phones and a
// television all calling the same lot in slightly different voices a beat apart is bedlam, and
// the auctioneer belongs to the room. Turn it on wherever you like; the choice sticks.
