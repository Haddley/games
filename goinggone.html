    const me = st.find(p => p.name === myName);
    return `
    ${hdrHTML(`Round ${D.round} of ${D.rounds} — banked`)}
    <div class="card sold-card highlight">
        <div class="gavel">🏦</div>
        <div class="st">${num(me ? me.net : D.myCoins)}</div>
        <div style="color:var(--muted);font-weight:700;font-size:.78rem;margin-top:6px">
            your shelf sold back at its true value — that's your bankroll for round ${D.round + 1}
        </div>
    </div>
    <div class="card standings"><div class="slbl">Bankrolls</div>${st.map((p, i) => `
        <div class="player-row" style="--i:${i}">
            <span style="width:22px;text-align:center;color:var(--muted)">${i + 1}</span>
            <span class="pdot" style="background:${p.color};color:${p.color}"></span>
            <div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}${p.name === myName ? ' <span style="color:var(--gold)">(you)</span>' : ''}</div>
            <div class="sc">${num(p.net)} <span style="color:var(--muted);font-size:.7rem">(${ICON.coin}${num(p.coins)} + ${ICON.frame}${num(p.shelf)})</span></div>
        </div>`).join('')}
    </div>
    ${commentaryHTML(D, 0.2)}
    <div style="text-align:center;color:var(--muted);font-weight:800;font-size:.78rem">
        Round ${D.round + 1} coming up — and the lots get grander…
    </div>`;
}

function renderPodium() {
    const st = D.standings || [];
    const winner = st[0];
    const awards = (D.awards || []).map(a =>
        `<span class="chip">${a.emoji} ${esc(a.title)}: ${esc(a.name)} (${esc(a.detail)})</span>`).join('');
    const driveBtn = canDrive()
        ? `<button class="btn btn-p btn-full" style="font-size:1.02rem;padding:15px" onclick="guestCtl('again')">🔁 Play again</button>` : '';
    const medals = ['🥇', '🥈', '🥉'];
    return `
    ${hdrHTML('Auction closed!')}
    <div class="card sold-card highlight">
        <div class="gavel">🏆</div>
        <div class="st">${esc((winner?.name || '').toUpperCase())} WINS!</div>
        <div style="color:var(--muted);font-weight:700;font-size:.78rem;margin-top:4px">net worth ${winner ? winner.net : 0} — coins + shelf value</div>
        <div style="margin-top:10px">${awards}</div>
    </div>
    ${commentaryHTML(D, 0.2)}
    <div class="card standings"><div class="slbl">Net worth</div>${(() => { const ranks = rankByScore(st, 'net'); return st.map((p, i) => `
        <div class="player-row" style="--i:${i}">
            <span style="width:22px;text-align:center">${medals[ranks[i]] || (ranks[i] + 1)}</span>
            <span class="pdot" style="background:${p.color};color:${p.color}"></span>
            <div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}${p.name === myName ? ' <span style="color:var(--gold)">(you)</span>' : ''}</div>
            <div class="sc">${num(p.net)} <span style="color:var(--muted);font-size:.7rem">(${ICON.coin}${num(p.coins)} + ${ICON.frame}${num(p.shelf)})</span></div>
        </div>`).join(''); })()}
    </div>
    ${driveBtn}`;
}

// ═══════════════════════════════════════════
// RENDER — TV screens
// ═══════════════════════════════════════════
function tvShell(inner, meta) {
    return `<div class="tv">
        <div class="tv-top">
            <div class="tv-logo">${GAVEL} GOING, GOING, GONE!</div>
            <div class="tv-meta">${esc(meta || ('Room ' + (vD.roomCode || roomCode || '')))}</div>
        </div>
        ${inner}
    </div>`;
}

function renderViewer() {
    if (!vD) return renderSpinner('Waiting for the auction…');
    if (vD.type === 'viewer_lobby') return renderViewerLobby();
    if (vD.phase === 'lot_intro') return renderViewerLotIntro();
    if (vD.phase === 'bidding') return renderViewerBidding();
    if (vD.phase === 'sold') return renderViewerSold();
    if (vD.phase === 'valuation') return renderViewerValuation();
    if (vD.phase === 'banked') return renderViewerBanked();
    if (vD.phase === 'podium') return renderViewerPodium();
    return renderSpinner('Waiting for the auction…');
}

function renderViewerLobby() {
    const players = vD.players || [];
    const s = vD.settings || {};
    return tvLobby({
        title: 'GOING, GOING, GONE!', accent: '#e8b75a',
        roomCode: vD.roomCode, isTvHost: vD.tvHost, captainName: vD.captain,
        settings: `${s.lotCount} lots${(s.rounds || 1) > 1 ? ` × ${s.rounds} rounds` : ''} · ${ICON.coin} ${START_COINS.toLocaleString()} coins each`,
        players: players.map(p => ({ name: p.name, color: p.color, captain: p.name === vD.captain })),
    });
}

function tvLotCardHTML(msg, compact) {
    const l = msg.lot;
    return `
    <div class="tv-lot${compact ? '' : ' intro'}" ${compact ? 'style="flex:0 0 auto;padding:2vmin 3vmin"' : ''}>
        <div class="lkick">${lotMeta(msg)}${l.mystery ? ' · ❓ mystery lot' : ''}</div>
        ${lotArtHTML(l, compact ? 'width:22vmin;height:16vmin' : '', compact ? 'font-size:5.5vmin' : '')}
        <div class="lname" ${compact ? 'style="font-size:3vmin"' : ''}>${l.mystery ? 'Mystery Lot' : esc(l.name)}</div>
        <div class="ldesc">${l.mystery ? 'No name, no description. Bid on what you can see.' : '“' + esc(l.desc) + '”'}</div>
        <div class="lsrc">${esc(l.src)} · ${priceDate(l.on)}</div>
        ${compact ? '' : '<div class="tv-waiting" style="margin-top:1.4vmin">bidding opens in a moment…</div>'}
    </div>`;
}

function renderViewerLotIntro() {
    return tvShell(`
    <div class="tv-main">
        <div class="tv-stage">${tvLotCardHTML(vD)}</div>
        <div class="tv-rail"><div class="rail-title">Bidders</div><div id="v-rail" style="display:flex;flex-direction:column;gap:1.2vmin">${railRowsHTML(vD)}</div></div>
    </div>`, lotMeta(vD));
}

function renderViewerBidding() {
    return tvShell(`
    <div class="tv-main">
        <div class="tv-stage">
            ${tvLotCardHTML(vD, true)}
            <div class="tv-lot" style="flex:1;gap:1.6vmin">
                <div class="lkick" id="v-kick">${vD.bid.price === 0 ? 'The auctioneer asks' : 'Current price'}</div>
                <div class="tv-price${vD.bid.price === 0 ? ' asking' : ''}" id="v-price">${num(vD.bid.price === 0 ? vD.bid.ask : vD.bid.price)}</div>
                <div class="tv-leader" id="v-leader">${vD.bid.leader
                    ? `<span style="color:${vD.bid.leaderColor}">${esc(vD.bid.leader)}</span> holds the bid`
                    : esc(askPatter(vD))}</div>
                <div class="tv-ask" id="v-ask">${askLineHTML(vD)}</div>
                <div class="tv-gavel-row" style="width:80%">
                    <div class="tv-gavel-wrap"><div class="tv-gavel-bar" id="v-gavel-bar" style="width:100%"></div></div>
                    <div class="going" id="v-going"></div>
                </div>
            </div>
        </div>
        <div class="tv-rail"><div class="rail-title">Bidders</div><div id="v-rail" style="display:flex;flex-direction:column;gap:1.2vmin">${railRowsHTML(vD)}</div></div>
    </div>`, lotMeta(vD));
}

function renderViewerSold() {
    const s = vD.soldInfo || {};
    // A mystery lot has no name to show — it keeps its secret until the valuation.
    const title = s.lot ? (s.lot.mystery ? '📦 the mystery lot' : s.lot.emoji + ' ' + s.lot.name) : '';
    const inner = s.passed
        ? `<div class="gavel">${ICON.feather}</div>
           <div class="who">PASSED IN</div>
           <div class="sub2">${esc(title)} never made its reserve — and it was worth
               <b style="color:var(--gold)">${num(s.value)}</b>.</div>`
        : `<div class="gavel">${GAVEL}</div>
           <div class="who">SOLD to <span style="color:${s.color}">${esc(s.winner)}</span> for ${num(s.price)}!</div>
           <div class="paddle-row" style="margin:1vmin 0">${paddleHTML(s, 'pad-huge')}
             <div class="sub2">bidder number ${s.paddle}</div></div>
           <div class="sub2">${esc(title)} — and we'll find out what it was really worth.</div>`;
    return tvShell(`<div class="tv-sold${s.passed ? ' passed' : ''}">${inner}</div>`, lotMeta(vD));
}

// THE TOTALS STAY SHUT UNTIL EVERY LOT HAS BEEN VALUED.
// A running net worth beside the reveals gives the ending away: watch the numbers tick and you
// know who has won two lots before the last card has turned over, so the final reveal — the one
// the whole round has been building to — lands on a room that already knows. While the valuer is
// working the rail shows only how many of each bidder's lots are still to come, in seating order
// so even the ORDER gives nothing away. The moment the last card is done, the totals snap in, and
// the banked board (or the podium) then stages them properly.
function valuationDone(msg) {
    const n = (msg.reveals || []).length;
    return n > 0 && msg.revealIndex >= n;
}
function netWorthRows(msg) {
    const revealed = {}, toCome = {};
    (msg.reveals || []).forEach((r, i) => {
        if (i <= msg.revealIndex) revealed[r.player] = (revealed[r.player] || 0) + r.value;
        else toCome[r.player] = (toCome[r.player] || 0) + 1;
    });
    const rows = (msg.players || []).map(p => ({
        ...p, net: p.coins + (revealed[p.name] || 0), left: toCome[p.name] || 0,
    }));
    if (!valuationDone(msg)) {
        return rows.map(p => `
        <div class="rail-row">
            <span class="pdot" style="background:${p.color};color:${p.color}"></span>
            <span class="rname">${esc(p.name)}</span>
            <span class="rwait">${p.left ? p.left + ' to value' : '✓ all in'}</span>
        </div>`).join('');
    }
    return rows.sort((a, b) => b.net - a.net).map(p => `
        <div class="rail-row">
            <span class="pdot" style="background:${p.color};color:${p.color}"></span>
            <span class="rname">${esc(p.name)}</span>
            <span class="rcoins">${num(p.net)}</span>
        </div>`).join('');
}

function renderViewerValuation() {
    // Only three at a time — each card is BIG, because this is watched from a sofa and the
    // reveal is the moment the whole game pays off. The live card plays the staged reveal
    // (see the .val-card.live CSS); the older two dim and hold still.
    const shown = (vD.reveals || []).slice(0, Math.max(0, vD.revealIndex + 1)).slice(-3);
    const cards = shown.map((r, i) => {
        const live = i === shown.length - 1;
        // Scale the drama to the size of the money. A $4,000 mistake should not look like a $12 one.
        const mag = Math.abs(r.profit) >= 2000 ? 'mag-huge' : Math.abs(r.profit) >= 500 ? 'mag-big' : '';
        return `
    <div class="val-card ${live ? 'live ' + mag : ''}" ${live ? '' : 'style="animation:none;opacity:.5"'}>
        ${lotArtHTML(r, 'width:15vmin;height:12vmin;flex:0 0 auto', 'font-size:7.5vmin')}
        <div style="min-width:0">
            <div class="vname">${r.wasMystery ? '❓ ' : ''}${esc(r.lotName)}</div>
            <div class="vpaid"><span style="color:${r.color}">${esc(r.player)}</span> paid ${num(r.paid)}</div>
            <div class="vsrc">${esc(r.src || '')} · ${priceDate(r.on)}</div>
        </div>
        <div class="vworth">worth ${num(r.value)}
            <span class="profit ${r.profit >= 0 ? 'plus' : 'minus'}">${r.profit >= 0 ? '+' : ''}${num(r.profit)}</span>
        </div>
    </div>`;
    }).join('');
    return tvShell(`
    <div class="tv-main">
        <div class="tv-stage">
            <div class="tv-val">
                <div class="rail-title">${ICON.monocle} The Valuation — what was it all actually worth?</div>
                <div class="val-list">${cards || '<div class="tv-waiting">Fetching the valuer\'s monocle…</div>'}</div>
            </div>
        </div>
        <div class="tv-rail"><div class="rail-title">${valuationDone(vD) ? 'Net worth' : 'Still to be valued'}</div>${netWorthRows(vD)}</div>
    </div>`, 'The Valuation');
}

// Between rounds: every shelf sold back at its true value, and the whole net worth becomes the
// next round's bankroll. Rows land POOREST FIRST so the leader's number is the last thing on
// screen — the same reason the podium reveals gold last.
function renderViewerBanked() {
    const st = (vD.standings || []).slice();
    // Leader at the TOP, like any leaderboard — it is only the TIMING that runs poorest-first, so
    // the last number to appear is the one at the head of the board. (Same trick as the podium,
    // where bronze lands first but stands on the right.)
    const rows = st.map((p, i) => {
        const place = i + 1;
        const delay = 1 + (st.length - 1 - i) * (BANK_STEP_MS / 1000);
        return `
        <div class="bank-row${place === 1 ? ' top' : ''}" style="--d:${delay.toFixed(2)}s">
            <span class="bplace">${place}</span>
            <span class="pdot" style="background:${p.color};color:${p.color}"></span>
            <span class="bname">${esc(p.name)}</span>
            <span class="bmath">${ICON.coin} ${num(p.coins)} + ${ICON.frame} ${num(p.shelf)}</span>
            <span class="bnet">${num(p.net)}</span>
        </div>`;
    }).join('');
    return tvShell(`
    <div class="tv-main" style="flex-direction:column">
        <div class="bank-wrap">
            <div class="bank-title">🏦 ROUND ${vD.round} BANKED</div>
            <div class="bank-sub">every shelf sold back at its true value — that is your bankroll for round ${vD.round + 1}</div>
            ${rows}
            ${commentaryHTML(vD, 1 + st.length * (BANK_STEP_MS / 1000))}
            <div class="tv-waiting" style="text-align:center">Round ${vD.round + 1} of ${vD.rounds} — and the lots get grander…</div>
        </div>
    </div>`, `Round ${vD.round} of ${vD.rounds} banked`);
}

function renderViewerPodium() {
    const st = vD.standings || [];
    const medals = ['🥇', '🥈', '🥉'];
    const ranks = rankByScore(st, 'net');   // ties share a place → joint medals
    const wm = st.map((p, i) => ({ ...p, medal: medals[ranks[i]] || '', mr: ranks[i] }));
    const podOrder = [wm[1], wm[0], wm[2]].filter(Boolean);
    const cls = st.length >= 3 ? ['p2', 'p1', 'p3'] : (st.length === 2 ? ['p2', 'p1'] : ['p1']);
    // Reveal in podium order — bronze, silver, then gold last — not visual (left-to-right)
    // order. Joint places land together, which is its own kind of drama. The gold delay is
    // PODIUM_GOLD_MS; the fanfare and confetti in applyViewerMsg are timed to it.
    const RANK_DELAY = [PODIUM_GOLD_MS / 1000, 1.6, 0.4];
    const pods = podOrder.map((p, i) => `
        <div class="pod ${cls[i]} mrank-${Math.min(p.mr, 2)}" style="animation-delay:${RANK_DELAY[Math.min(p.mr, 2)]}s">
            <div class="pname"><span class="pdot" style="background:${p.color};color:${p.color};display:inline-block;vertical-align:middle;margin-right:.6vmin"></span>${esc(p.name)}</div>
            <div class="pscore">${num(p.net)} net</div>
            <div class="block">${p.medal}</div>
        </div>`).join('');
    const awards = (vD.awards || []).map((a, i) =>
        `<div class="award" style="--i:${i}">${a.emoji} <span class="aw-t">${esc(a.title)}</span><br>${esc(a.name)} — ${esc(a.detail)}</div>`).join('');
    const hint = vD.tvHost ? `👑 ${esc(vD.captain || 'Captain')}: “Play again” is on your phone` : 'Host: “Play again” is on your phone';
    return tvShell(`
    <div class="tv-main" style="flex-direction:column">
        <div class="podium-wrap">${pods}</div>
        ${commentaryHTML(vD, PODIUM_GOLD_MS / 1000 + 1.2)}
        <div class="awards-row">${awards}</div>
        <div class="tv-waiting" style="text-align:center;padding-bottom:1.5vmin">${hint}</div>
    </div>`, '🏆 Auction closed');
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// SIMULATION MODES — ?mode=tvsimulation | playersimulation
//   &players=N   how many bidders (2–10, default 4)
//   &rounds=N    how many banked rounds (1–3, default 2)
//   &lots=N      lots per player per round (2–4, default 2)
// Self-driving demos with no PeerJS and no real people. Bots are counted as
// "connected" via stub guestConns so the normal host auction flow drives itself.
//   • tvsimulation     — watch the big-screen AUCTION HOUSE play itself
//   • playersimulation — watch a phone BIDDER ("You") play itself
// (?mode=simulation stays as an alias for tvsimulation.)
// ═══════════════════════════════════════════
let simTimer = null, simMode = 'tv', simActive = false, simLotKey = '', simBidsLeft = 0;
const SIM_NAMES = ['Ace', 'Bux', 'Cash', 'Duke', 'Edie', 'Fox', 'Gwen', 'Hawk'];

// `opts` comes straight off the query string, so an attract screen can be pointed at exactly the
// game somebody wants to watch: ?mode=tvsimulation&players=3&rounds=3&lots=4
function startSimulation(nPlayers, mode, opts) {
    const o = opts || {};
    simMode = mode === 'player' ? 'player' : 'tv';
    simActive = true;
    roomCode = 'DEMO';
    // Short auctions by default so the demo loop turns over, but still more than one round —
    // the banking between them is half of what the attract mode is showing off.
    H.settings.lotsPer = [2, 3, 4].includes(o.lotsPer) ? o.lotsPer : 2;
    H.settings.rounds = [1, 2, 3].includes(o.rounds) ? o.rounds : 2;
    H.players = []; guestConns = {}; viewerConns = {};
    const n = Math.max(MIN_PLAYERS, Math.min(nPlayers || 4, MAX_PLAYERS));
    if (simMode === 'tv') {
        isHost = true; isTvHost = true; myId = '__sim_host__';
        document.body.classList.add('viewer-mode');
    } else {
        isHost = true; isTvHost = false; myName = 'You'; myId = '__you__';
        hostAddPlayer(myId, myName);                  // you are bidder #1 (the host)
    }
    for (let i = H.players.length; i < n; i++) {
        const id = '__bot_' + i;
        hostAddPlayer(id, SIM_NAMES[i % SIM_NAMES.length]);
        guestConns[id] = { peer: id, send() {} };     // stub so bots count as present
    }
    broadcastLobby();                                 // show the lobby first
    simTimer = setTimeout(() => { hostStartAuction(); simLoop(); }, 2400);
}

// The host auction timers (lot_intro → bidding → sold → … → valuation → podium)
// run on their own; the loop just injects a few bot bids per lot and restarts.
function simLoop() {
    if (!simActive) return;
    // long enough for the staged podium (gold at 3s, awards from ~4.2s) to play out
    if (H.phase === 'podium') { simTimer = setTimeout(simRestart, 9500); return; }
    if (H.phase === 'bidding') simBidStep();
    simTimer = setTimeout(simLoop, 650 + Math.random() * 450);
}

function simBidStep() {
    if (!H.bid) return;
    const key = 'L' + H.lotIndex;
    if (key !== simLotKey) { simLotKey = key; simBidsLeft = 2 + Math.floor(Math.random() * 4); }
    if (simBidsLeft <= 0 || Math.random() < 0.28) return;   // let the gavel fall
    // Nobody has opened yet: a bot takes the ask now and then, and otherwise holds its nerve — so
    // the demo shows the auctioneer fishing down, and occasionally passing a lot in.
    if (H.bid.price === 0) {
        const ask = currentAsk();
        if (Math.random() < 0.32 + 0.22 * H.bid.drops) {
            const able = H.players.filter(p => p.coins >= ask);
            if (able.length) hostBid(able[Math.floor(Math.random() * able.length)], ask);
        }
        return;
    }
    // One option, same as a real phone: take the auctioneer's ask or let it go.
    const price = H.bid.price;
    const raise = softMinRaise(price, H.bid.soft || 0);
    const cands = H.players.filter(p => p.id !== H.bid.leaderId && p.coins >= price + raise);
    if (!cands.length) { simBidsLeft = 0; return; }
    const bidder = cands[Math.floor(Math.random() * cands.length)];
    if (simMode === 'player' && bidder.id === myId) {
        // drive You through the real phone bid button so the lead/outbid FX fire
        if (D && D.phase === 'bidding' && D.bid && !D.bid.youLead && D.myCoins >= D.bid.price + raise) sendBid(raise);
    } else {
        hostBid(bidder, raise);
    }
    simBidsLeft--;
}

function simRestart() {
    if (!simActive) return;
    hostNewGame();
    simTimer = setTimeout(() => { hostStartAuction(); simLoop(); }, 2400);
}

(function boot() {
    const params = new URLSearchParams(location.search);
    if (!musicOn) $id('tog-music').classList.add('off');
    if (!sfxOn) $id('tog-sfx').classList.add('off');
    syncVoiceBtn();
    mountAuctioneer();
    // Voices load asynchronously in most browsers — ask once now, and again when they arrive.
    // A browser with NO speech API at all never reaches say(), so it would never report itself —
    // which is the Silk browser on a Fire TV, where the music and stingers play perfectly well
    // and only the auctioneer is missing.
    if (typeof speechSynthesis === 'undefined') { if (voiceOn()) setTimeout(() => voiceHint('novoices'), 2500); }
    else try {
        pickVoice();
        speechSynthesis.addEventListener('voiceschanged', () => { pickVoice(); voiceHint(voicesAvailable() ? false : 'novoices'); }, { once: true });
        // voices can take a moment to arrive; if they never do, there is nothing to wait for
        setTimeout(() => { if (!voicesAvailable() && voiceOn()) voiceHint('novoices'); }, 4000);
    } catch (e) {}
    const mode = (params.get('mode') || '').toLowerCase();
    const simPlayers = parseInt(params.get('players'), 10) || 4;
    const simOpts = {
        rounds: parseInt(params.get('rounds'), 10) || 0,
        lotsPer: parseInt(params.get('lots'), 10) || 0,
    };
    if (mode === 'playersimulation') { startSimulation(simPlayers, 'player', simOpts); return; }
    if (mode === 'tvsimulation' || mode === 'simulation') { startSimulation(simPlayers, 'tv', simOpts); return; }
    const room = (params.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room) fCode = room;
    // A refresh mid-game shouldn't cost you your seat: if this tab was already in a
    // room, walk straight back in (the host restores the slot by device id/name).
    const back = typeof savedRoom === 'function' ? savedRoom() : null;
    if (back && (!room || room === back.code)) {
        if (back.role === 'viewer') { joinAsViewer(back.code); return; }
        joinGame(back.code, (typeof savedName === 'function' && savedName()) || 'Player');
        return;
    }
    render();
})();
</script>
