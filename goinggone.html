// once more in the browser's own default voice, and after that it says so in the console rather
// than leaving somebody to wonder.
let _speechWarned = false, _speechWatch = null, _lastSpeechError = null, _speechPrimed = false;

// iOS Safari hands out permission to speak ONCE, and only from inside a gesture. A silent
// utterance spent on the first tap buys that permission for every line that arrives later over
// the network — which is all of them. Harmless everywhere else.
function primeSpeech() {
    if (_speechPrimed || typeof speechSynthesis === 'undefined') return;
    _speechPrimed = true;
    try {
        const u = new SpeechSynthesisUtterance('auction');
        u.volume = 0;                     // it must be a real utterance, but nobody need hear it
        speechSynthesis.speak(u);
    } catch (e) {}
}

// HOW FAST HE TALKS, in one place. A real chant is quick, and the first build leaned all the way
// into that: 1.4–1.5× on the bid calls, which on a synthetic voice is not "auctioneer", it is
// unintelligible — and every number in this game is a number somebody has to act on. This is the
// dial for the whole performance; the per-line rates below it are only relative character
// (the chant still runs quicker than the hammer). speechMs() divides by it, so the beats that
// wait for him to finish talking follow it automatically.
const SAY_RATE = 0.85;

function speakNow(text, opts, withVoice) {
    try {
        const u = new SpeechSynthesisUtterance(text);
        const v = withVoice ? pickVoice() : null;
        if (v) u.voice = v;
        u.rate = (opts.rate || 1.2) * SAY_RATE;       // bid-calling is quick, but it is not a blur
        u.pitch = opts.pitch === undefined ? 0.9 : opts.pitch;
        u.volume = opts.vol === undefined ? 1 : opts.vol;
        let started = false;
        // his mouth is tied to THIS utterance, not to a timer
        u.onstart = () => { started = true; clearTimeout(_speechWatch); voiceHint(false); charTalk(true); startMouth(text, u.rate); };
        u.onend = () => { charTalk(false); charBubbleOff(); };
        u.onboundary = charBeat;                      // per-word, where the browser offers it
        u.onerror = e => {
            charTalk(false);
            const why = e && e.error;
            if (why === 'canceled' || why === 'interrupted') return;   // we did that on purpose
            _lastSpeechError = why;
            if (why === 'not-allowed') { voiceHint('blocked'); return; }   // needs a tap first
            if (withVoice) { _voice = null; speakNow(text, opts, false); }   // that voice will not play
            else if (!_speechWarned) { _speechWarned = true; console.warn('[goinggone] the auctioneer cannot speak:', why); }
        };
        clearTimeout(_speechWatch);
        _speechWatch = setTimeout(() => {
            if (started || speechSynthesis.speaking) return;
            // nothing started and nothing errored: no voices at all is the usual reason
            voiceHint(voicesAvailable() ? 'failed' : 'novoices');
            if (withVoice) { _voice = null; speakNow(text, opts, false); }
            else if (!_speechWarned) {
                _speechWarned = true;
                console.warn('[goinggone] the auctioneer was handed a line but never started it — ' +
                    'the page may not have been interacted with yet (tap the screen once).');
            }
        }, 700);
        speechSynthesis.resume();                     // Chrome parks the queue on its own sometimes
        speechSynthesis.speak(u);
    } catch (e) {}
}

function say(text, opts = {}) {
    if (!text) return;
    // The writing comes first and unconditionally. Whether the device can speak is a separate
    // question, and on the one that cannot this is the whole performance.
    charBubble(text);
    if (!canSpeak()) { mimeLine(text); return; }
    try {
        duckMusic(opts.duck || 1.4);
        const busy = speechSynthesis.speaking || speechSynthesis.pending;
        if (!busy) { speakNow(text, opts, true); return; }
        shutUp();
        setTimeout(() => speakNow(text, opts, true), 80);   // never in the same tick as the cancel
    } catch (e) {}
}

// Auctioneers say numbers, not digits: "twelve hundred", "forty-eight thousand". Left to itself a
// speech engine may spell a long figure out digit by digit, which kills the rhythm dead.
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
    'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function words(n) {
    n = Math.round(n);
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + words(n % 100) : '');
    // ANYTHING over a thousand is spoken in thousands: 3,100 is "three thousand one hundred",
    // never "thirty-one hundred". The counting-in-hundreds idiom was tried here and is wrong twice
    // over — it is American rather than the voice this room has, and it disagrees with the figure
    // sitting on the screen next to it, which is the part that actually grates.
    // "three thousand AND twenty-two" — the and belongs before a bare tens-and-units tail, and is
    // wrong once there are hundreds in it ("three thousand one hundred and twenty-two").
    if (n < 1e6) {
        const rest = n % 1000;
        const tail = rest ? (rest < 100 ? ' and ' : ' ') + words(rest) : '';
        return words(Math.floor(n / 1000)) + ' thousand' + tail;
    }
    return words(Math.floor(n / 1e6)) + ' million' + (n % 1e6 >= 1000 ? ' ' + words(Math.floor((n % 1e6) / 1000)) + ' thousand' : '');
}
const pick = a => a[Math.floor(Math.random() * a.length)];

// Roughly how long a line takes to speak, used by the HOST to decide how long to hold a screen
// open. Erring long is the safe direction: a screen held a beat too long is a pause, a screen
// that moves on mid-sentence cuts the auctioneer off, which is what happened to the round-end
// commentary — the board's fixed nine seconds could not cover four spoken lines and the next
// lot's announcement cancelled the rest.
const speechMs = text => Math.round((text || '').length * 68 / SAY_RATE);

// He says at most this many of his summing-up lines OUT LOUD, and the screen carries the rest.
// Spoken numbers are dear — "forty-five thousand nine hundred" is three seconds — so two lines
// push the banked board past eighteen seconds, and the board has to be held open for as long as
// he is talking or he gets cut off mid-sentence. Worse, a television with no voice at all would
// then sit on a silent screen for those eighteen seconds. One line aloud, four on the screen.
// The podium is not on a clock, so it gets two.
const SPOKEN_COMMENTARY = 1;

// ── the banks ──────────────────────────────────────────────────────────────
// "{}" is the number under discussion. Combined, these give many hundreds of distinct calls.
const P_OPEN = [
    "Who'll start me at {}?", "I'll take {} to start.", "Can I get {}?",
    "{} to start it, who'll give me {}?", "Let's open at {}. {}, anyone?",
    "Start me at {}, {} dollar bid.", "What am I bid? {} to start.",
    "Right then — {}. Who wants it at {}?", "I'm asking {}. {} dollar bid — do I hear {}?",
];
const P_DROP_LEAD = [
    "Nobody?", "No takers?", "Not one of you?", "Come on now.", "Don't be shy.",
    "You're breaking my heart.", "All right, all right.", "Have it your way.",
    "Somebody must want this.", "Last chance at this money.", "You'll regret this.",
    "Fine. Fine!", "Is this thing on?", "I'm being generous here.",
];
const P_DROP_BODY = [
    "Then who'll give me {}?", "How about {}?", "I'll take {}.", "{} then. {}?",
    "Say {}. Who'll give me {}?", "{}. That's a gift at {}.", "Down to {}, {} dollar bid.",
    "{}, and that's robbery.", "Make it {}. Anyone at {}?", "{}? {}? Who'll bid {}?",
];
const P_BID = [
    "I'm bid {}, now {}, now {}, who'll give me {}?",
    "{} dollar bid, now {}, {}, who'll give me {}?",
    "I have {}. Looking for {}. {}, who'll bid {}?",
    "{} I'm bid — and looking for {}. Do I hear {}?",
    "Thank you! {} dollar bid, now {}, now {}.",
    "{} I'm bid. {} anywhere? {}, {}?",
];
// Fair warning, while he is still working the room for one more bid. NOT "going once" — that
// belongs to the close and would spend the phrase before the moment it means something.
const P_GOING = [
    "Fair warning now!", "All done? All through?", "Are we all done at {}?",
    "Last call at {}.", "Fair warning — I'm selling at {}.", "Anybody else at {}?",
];
// He never stops talking. A window with nothing in it is a dead room, so partway through each
// unanswered ask he fires the chant again rather than sitting out the beat in silence — which is
// exactly what a real auctioneer does ("Will you go six? Will you give six? Will you buy 'em at six?").
const P_CHANT = [
    "Who'll give me {}?", "{}? Anywhere?", "Anybody at {}?", "{} — who'll bid it?",
    "Who'll say {}?", "{}. {}. Do I hear {}?", "Let's have {}!",
];
// The close. Two beats, each announced, each still taking bids — this is the part everyone
// knows, so it gets said plainly and never crowded with a fresh ask.
const P_ONCE = [
    "Going ONCE…", "I'm going once…", "Once…", "That's going once at {}…",
];
const P_TWICE = [
    "Going TWICE…", "Twice… last chance…", "Going twice — last chance at {}…",
    "Twice! Don't lose it now…",
];
// …and when he has already come down off the full jump, he says so. This is the real thing:
// an auctioneer who cannot get another whole increment splits it rather than dropping the hammer.
// {} is what is bid, {n} is the PRICE the reduced ask would make, {r} is the increment itself.
// An auctioneer calls the price, never the increment — with 140 bid and a 25 ask he says "I'll
// take one hundred and sixty-five", not "I'll take twenty-five". The increment only ever appears
// as "just X more", which is the one place it is the natural thing to say.
const P_SPLIT = [
    "I'll take {n}. Just {r} more, anybody?",
    "Won't you give me {n}? {n} and it's yours.",
    "I'm bid {}. I'll take {n} — only {r} more.",
    "I'll come down. {n}? Anybody at {n}?",
    "Don't lose it for {r}. {n}!",
    "{n}. Who'll give me {n}?",
];
// The rostrum sells to the NUMBER, not the name — "{who}" is always "bidder number forty-two".
const P_SOLD = [
    "SOLD! To {who}, for {}!", "GONE! {who} takes it at {}!",
    "Hammer's down — {} to {who}!", "SOLD at {} — well bought, {who}!",
    "{who}, {} — and it's yours!", "That's SOLD, {who}, at {}!",
    "All done. {} to {who}!", "Yours at {}, {}. Thank you, {who}!",
];
// Acknowledging the paddle holding the bid — "bid'em at, bidder now" is straight off a rostrum.
const P_ACK = [
    "Bidder number {p}.", "In at {p}.", "Number {p} has it.", "With {p}.",
    "Bid'em at, bidder {p}.", "Standing with number {p}.",
];
const P_PASSED = [
    "Passed in. It never made its reserve.", "No sale. That one goes back in the van.",
    "Passed in — and you've all just let it go.", "Not a bid. Shameful.",
    "It's passed in. Your loss, I promise you.", "No takers, no sale. Wheel it away.",
];
const P_LOT = [
    "Lot {n}.", "Lot number {n}.", "Next up, lot {n}.", "And now, lot {n}.",
    "Lot {n}, ladies and gentlemen.", "Moving on. Lot {n}.",
];
const P_MYSTERY = [
    "And I'm not telling you what it is.", "No name, no description. Use your eyes.",
    "You get what you see and nothing more.", "Mystery lot. Good luck.",
];

const fill = (tpl, n) => tpl.replace(/\{\}/g, () => words(n));

// The line printed under the price on the TV — same patter, read rather than heard, for anyone
// with the voice off (or a browser that has no speech at all).
function askPatter(msg) {
    if (!msg.bid) return '';
    if (msg.bid.price === 0) {
        return msg.bid.drops
            ? `Nobody? Then who'll give me ${num(msg.bid.ask)}?`
            : `Who'll start me at ${num(msg.bid.ask)}?`;
    }
    return 'Opening bid, anyone?';
}

function sayLot(msg) {
    if (!msg.lot) return;
    const head = pick(P_LOT).replace('{n}', words(msg.lotNum));
    say(msg.lot.mystery ? `${head} ${pick(P_MYSTERY)}` : `${head} ${msg.lot.name}.`, { rate: 1.02 });
}
function sayAsk(msg, first) {
    if (!msg.bid || msg.bid.price !== 0) return;
    const ask = msg.bid.ask;
    say(first ? fill(pick(P_OPEN), ask) : `${pick(P_DROP_LEAD)} ${fill(pick(P_DROP_BODY), ask)}`);
}
function sayBid(msg) {
    if (!msg.bid || !msg.bid.price) return;
    // What he wants next is his CURRENT ask, not a fresh full jump — he does not climb back up
    // after a bid, so chanting a number he is not going to hold out for would be a lie the very
    // next beat contradicts.
    const next = msg.bid.price + softMinRaise(msg.bid.price, msg.bid.soft || 0);
    // the two-number chant: what is bid, then what he wants next
    let i = 0;
    let line = pick(P_BID).replace(/\{\}/g, () => words(i++ === 0 ? msg.bid.price : next));
    // …and every so often he acknowledges the paddle that holds it, the way a real one does
    if (msg.bid.leaderPaddle && Math.random() < 0.35) line += ' ' + pick(P_ACK).replace('{p}', words(msg.bid.leaderPaddle));
    say(line, { rate: 1.16 });
}
// FAIR WARNING, and only on his last rung. He has no lower round number left, so this is a
// warning he can keep — and the beat after it really is "going once". It never carries a fresh
// ask: telling a room he is selling and then offering them a discount in the same breath teaches
// them the warning means nothing.
function sayGoing(price) { say(fill(pick(P_GOING), price), { rate: 1.0 }); }
// …and the moment he COMES DOWN a rung, which is a different event and belongs where it happens:
// at the start of the new, cheaper ask, not on top of the fair warning at the end of the old one.
function saySplit(price, minRaise) {
    const line = fill(pick(P_SPLIT), price)
        .replace(/\{n\}/g, words(price + minRaise))     // the price it makes…
        .replace(/\{r\}/g, words(minRaise));            // …and the step itself, sparingly
    say(line, { rate: 1.05 });
}
// The mid-window re-ask — short, quick, and never the same shape as the line that opened it.
function sayChant(amount) { say(fill(pick(P_CHANT), amount), { rate: 1.22 }); }

// One beat of the close: 1 = going once, 2 = going twice.
function sayClose(beat, price) {
    say(fill(pick(beat >= 2 ? P_TWICE : P_ONCE), price), { rate: beat >= 2 ? 0.92 : 0.98, pitch: 1 });
}
function saySold(info) {
    // Never the name: an auctioneer sells to the paddle. (It also saves him mangling "Bux".)
    const who = info.paddle ? 'bidder number ' + words(info.paddle) : 'the gentleman at the back';
    say(info.passed ? pick(P_PASSED)
        : fill(pick(P_SOLD), info.price).replace(/\{who\}/g, who), { rate: 1.0, pitch: 1 });
}
const commentarySpoken = (msg, n) => (msg.commentary || []).slice(0, n || SPOKEN_COMMENTARY)
    .map(l => l.spoken.charAt(0).toUpperCase() + l.spoken.slice(1)).join(' ');
const BANKED_PREAMBLE = round => `That's round ${words(round)} banked.`;
function sayBanked(msg) {
    say(`${BANKED_PREAMBLE(msg.round)} ${commentarySpoken(msg)}`, { rate: 1.05 });
}
function sayWinner(msg) {
    say(`${commentarySpoken(msg, 2)} Thank you, ladies and gentlemen.`, { rate: 1.05, pitch: 1 });
}

// Unlock audio on first interaction (browser autoplay policy)
let _audioUnlocked = false;
document.addEventListener('pointerdown', () => {
    if (_audioUnlocked) return;
    _audioUnlocked = true;
    if (ac()) startMusicLoop();
    // …and the voice, which has its own gate: a page that has never been interacted with may
    // not be allowed to speak at all. The attract mode is exactly that page, so if a television
    // has been sitting on the demo in silence, one tap is what starts the auctioneer.
    try { speechSynthesis.resume(); } catch (e) {}
    primeSpeech();
    if (typeof voiceHint === 'function') voiceHint(false);
}, { capture: true });

// ── Particle bursts + floating text ──

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let peer = null, myId = '', myName = '', isHost = false, isTvHost = false, isViewer = false, roomCode = '';
let hostConn = null, guestConns = {}, viewerConns = {};
let ui = 'home';   // home|creating|connecting|lobby_h|lobby_g|lot|bidding|sold|valuation|podium|viewer
let uiErr = '';
let fName = (typeof savedName === 'function' ? savedName() : '');
let fCode = '', fVCode = '';
let D = null, vD = null;
let _localGavelEnd = 0, _gavelTickClient = null;

// Host authoritative state
let H = {
    phase: 'lobby',              // lobby|lot_intro|bidding|sold|valuation|podium
    players: [],                 // [{id,name,color,coins,lots:[{lotIdx,paid}]}]
    settings: { lotsPer: 3, bigLot: false, rounds: 3 },
    round: 1, rounds: 3, usedLots: null, gameReveals: [],
    mysteryLots: null,           // Set of lotIdx hidden behind their photo this game
    lotOrder: [], lotIndex: -1,
    bid: null,                   // {price, leaderId, endsAt}
    soldInfo: null,              // {lotIdx, winner, color, price} | {passed:true, lotIdx}
    reveals: [], revealIndex: -1,
    standings: null, awards: null, winner: null,
};
let _lotTimer = null, _gavelTick = null, _revealTimer = null;
function clearHostTimers() { clearTimeout(_lotTimer); clearInterval(_gavelTick); clearTimeout(_revealTimer); }

// ═══════════════════════════════════════════
// NETWORK
// ═══════════════════════════════════════════
function send(conn, msg) { try { conn.send(msg); } catch (e) { console.warn('send err', e); } }
function broadcastViewers(msg) { Object.values(viewerConns).forEach(c => send(c, msg)); }
// Who is actually here. This asks the HEARTBEAT (common.js isPresent), not the connection
// map — `guestConns` still lists a phone whose browser was closed, because conn.on('close')
// does not fire for that (measured: zero close events in 75 seconds).
//
// That mattered far more than it looks. Nearly every game advances a round with
// `connectedPlayers().every(p => p.answered)`, so one closed tab meant the room waited for
// an answer that was never coming — for ever, in the games with no timer. It is also what
// picks the 👑 captain, so a dead phone could hold the crown and freeze the room.
// The shared one (common.js presentPlayers) decides; this just supplies this game's state.
// It used to be a byte-identical copy in all 18 games — see the audit in unit/presence.test.js.
function connectedPlayers() {
    if (typeof presentPlayers === 'function') {
        return presentPlayers(H.players, guestConns, myId, isHost && !isTvHost);
    }
    return H.players.filter(p => (p.id === myId ? (isHost && !isTvHost) : !!guestConns[p.id]));
}

// ── 👑 captain (TV-host rooms) ──────────────────────────────────────────────
// The captain is the first *CONNECTED* player, not simply H.players[0]: a captain
// whose phone drops mid-game must not stall the room. Their slot survives the drop
// (zombie takeover by name), so when they rejoin they're first again and the crown
// comes straight back.
function capName() { return isTvHost ? (capPlayer()?.name || null) : null; }
// The crown moved — re-sync the phones losing/gaining it, plus the TV. Deliberately
// not a full broadcast: everyone else may be mid-interaction on their own screen.
function capSync(prevId) {
    if (!isTvHost || H.phase === 'lobby') return;      // lobby re-broadcasts anyway
    const nowId = capPlayer()?.id || null;
    if (nowId === prevId) return;
    [prevId, nowId].forEach(id => {
        const p = id && H.players.find(x => x.id === id);
        const c = p && guestConns[p.id];
        if (c) send(c, stateFor(p));
    });
    broadcastViewers(viewerStateMsg());
    tvHostSync();
}

// Every bidder gets a paddle, and the auctioneer sells to the NUMBER: "sold to bidder number
// forty-two". Two digits always, so it reads as a proper rostrum number rather than "bidder
// seven", and drawn at random from the free ones — being number 88 is worth something.
// A rejoining player keeps theirs, because the seat object survives the reconnect.
function freePaddle() {
    const taken = new Set(H.players.map(p => p.paddle));
    const pool = [];
    for (let n = 10; n <= 99; n++) if (!taken.has(n)) pool.push(n);
    return pool[Math.floor(Math.random() * pool.length)];
}

function hostAddPlayer(id, name) {
    if (H.players.find(p => p.id === id) || H.players.length >= MAX_PLAYERS) return;
    H.players.push({
        id, name, color: PLAYER_COLORS[H.players.length % PLAYER_COLORS.length],
        paddle: freePaddle(), coins: START_COINS, lots: [],
    });
}

function lobbyMsg() {
    return {
        type: 'lobby', roomCode,
        players: H.players.map(p => ({ name: p.name, color: p.color, paddle: p.paddle })),
        settings: { ...H.settings, lotCount: plannedLotCount() },
        tvHost: isTvHost, captain: capName(),
    };
}
function broadcastLobby() {
    H.players.forEach(p => { if (p.id !== myId && guestConns[p.id]) send(guestConns[p.id], lobbyMsg()); });
    broadcastViewers({ ...lobbyMsg(), type: 'viewer_lobby' });
    hostSyncSelf(lobbyMsg());
}

// Takes an INDEX, not a lot, because whether a lot is a mystery is a fact about this game's draw
// rather than about the item.
function lotView(lotIdx) {
    const lot = LOTS[lotIdx];
    if (!lot) return null;
    const mystery = !!(H.mysteryLots && H.mysteryLots.has(lotIdx));
    // A mystery lot shows its PHOTOGRAPH and withholds the words — you bid on what you can see.
    // The withholding has to happen here on the host: phones render whatever arrives, so sending
    // the name and hiding it client-side would leak it to anyone with a console open.
    if (mystery) return { emoji: '📦', name: null, desc: null, img: lot.img || null, src: lot.src, on: lot.on, mystery: true };
    return { emoji: lot.emoji, name: lot.name, desc: lot.desc, img: lot.img || null, src: lot.src, on: lot.on, mystery: false };
}

// ── WHAT THE ROOM CAN SEE OF YOUR PURSE ─────────────────────────────────────
// At a real sale you cannot see anyone's bank balance, and the exact figure is the single piece
// of information that turns this from a guessing game into an arithmetic one: "he has $217, so
// $220 takes it." What you CAN read off somebody across a saleroom is how comfortable they look,
// so that is what the room gets — a band, computed from their share of the average purse.
// Lots won stays public throughout, because a paddle going up is not a secret anywhere.
// The withholding happens HERE, on the host, for the same reason mystery lots do: phones render
// whatever arrives, so hiding it client-side would leave it a console away.
const PURSE_HIDDEN = ['lot_intro', 'bidding', 'sold'];
const PURSE_BANDS = [[1.5, 'flush'], [0.8, 'comfortable'], [0.3, 'short'], [0, 'skint']];
function purseBand(coins, avg) {
    const ratio = avg > 0 ? coins / avg : 1;
    return (PURSE_BANDS.find(([lo]) => ratio >= lo) || PURSE_BANDS[PURSE_BANDS.length - 1])[1];
}

function stateFor(p) {
    const curIdx = H.lotIndex >= 0 ? H.lotOrder[H.lotIndex] : -1;
    // A mystery lot stays hidden on its OWNER's shelf too, right up to the valuation — otherwise
    // whoever won it learns what it was while everyone else is still guessing.
    const shown = H.phase === 'valuation' || H.phase === 'podium';
    const hidden = l => !shown && H.mysteryLots && H.mysteryLots.has(l.lotIdx);
    const leader = H.bid && H.bid.leaderId ? H.players.find(q => q.id === H.bid.leaderId) : null;
    return {
        type: 'state',
        phase: H.phase, roomCode,
        round: H.round || 1, rounds: H.rounds || 1,
        lotNum: H.lotIndex + 1, lotTotal: H.lotOrder.length,
        lot: lotView(curIdx),
        bid: H.bid ? {
            price: H.bid.price,
            // The ask, and how many times he has already come down — never how far he WILL come
            // down. That number stays on the host; not knowing it is the whole game of nerve.
            ask: currentAsk(), drops: H.bid.drops,
            soft: H.bid.soft, span: H.bid.span || GAVEL_MS, closing: H.bid.closing || 0,
            leader: leader ? leader.name : null,
            leaderColor: leader ? leader.color : null,
            leaderPaddle: leader ? leader.paddle : null,
            youLead: !!(p && leader && leader.id === p.id),
            canOpen: !!(p && H.bid.price === 0 && p.coins >= currentAsk()),
            endsIn: Math.max(0, H.bid.endsAt - Date.now()),
        } : null,
        myCoins: p ? p.coins : 0,
        myPaddle: p ? p.paddle : null,
        myLots: p ? p.lots.map(l => ({
            name: hidden(l) ? 'Mystery Lot' : LOTS[l.lotIdx].name,
            emoji: hidden(l) ? '📦' : LOTS[l.lotIdx].emoji,
            paid: l.paid, lotIdx: l.lotIdx,
        })) : [],
        soldInfo: H.soldInfo ? { ...H.soldInfo, lot: lotView(H.soldInfo.lotIdx) } : null,
        reveals: H.phase === 'valuation' || H.phase === 'podium' ? H.reveals : null,
        revealIndex: H.revealIndex,
        standings: H.standings, awards: H.awards, winner: H.winner,
        commentary: H.commentary || null,
        players: (() => {
            // your OWN purse always reaches you, via myCoins above — this is what you learn
            // about everybody else
            const hide = PURSE_HIDDEN.includes(H.phase);
            const avg = H.players.reduce((s, q) => s + q.coins, 0) / Math.max(1, H.players.length);
            return H.players.map(q => ({
                name: q.name, color: q.color, paddle: q.paddle, lotCount: q.lots.length,
                ...(hide ? { purse: purseBand(q.coins, avg) } : { coins: q.coins }),
            }));
        })(),
        tvHost: isTvHost, captain: capName(),
    };
}
function viewerStateMsg() { return { ...stateFor(null), type: 'viewer_state' }; }
function broadcastState() {
    H.players.forEach(p => {
        if (p.id === myId) return;
        const conn = guestConns[p.id];
        if (conn) send(conn, stateFor(p));
    });
    broadcastViewers(viewerStateMsg());
    hostSyncSelf(isTvHost ? null : stateFor(H.players.find(p => p.id === myId)));
}

// ── Host: incoming connections ──
function setupGuestConn(conn) {
    conn.on('open', () => { conn._role = null; });

    conn.on('data', msg => {
        if (conn._role === null && msg.type === 'join_viewer') {
            conn._role = 'viewer';
            viewerConns[conn.peer] = conn;
            send(conn, H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : viewerStateMsg());
            return;
        }
        if (conn._role === null) {
            conn._role = 'player';
            guestConns[conn.peer] = conn;
        }
        const player = H.players.find(p => p.id === conn.peer);
        // ANY message is proof of life — heartbeat, roll, vote, anything.
        if (typeof notePresence === 'function') notePresence(player);
        switch (msg.type) {
            case 'join': {
                // Different code on the two ends looks like a game bug. Say so instead — this is
                // the FIRST thing the join case does, so it runs on every join, not just some.
                if (typeof warnIfStale === 'function') warnIfStale(conn, msg, send);
                const prevCap = capPlayer()?.id || null;
                setTimeout(() => capSync(prevCap), 0);
                const name = String(msg.name || 'Bidder').slice(0, 16);
                // Same device (cid) always reclaims its seat; a matching NAME only reclaims a seat
                // nobody has been heard from lately. Shared, so all games agree — see common.js.
                const zombie = typeof claimSeat === 'function'
                    ? claimSeat(H.players, msg, conn.peer, guestConns, H.phase === 'lobby')
                    : H.players.find(p => msg.cid && p.cid === msg.cid && p.id !== conn.peer);
                if (zombie) zombie.id = conn.peer;
                else hostAddPlayer(conn.peer, name);
                const p2 = H.players.find(p => p.id === conn.peer);
                if (p2 && msg.cid) p2.cid = msg.cid;          // this device now owns the slot
                if (!p2) { send(conn, lobbyMsg()); break; }
                if (H.phase === 'lobby') broadcastLobby();
                else { send(conn, stateFor(p2)); broadcastViewers(viewerStateMsg()); if (isTvHost) tvHostSync(); }
                break;
            }
            case 'bid': if (player) hostBid(player, msg.raise); break;
            case 'ctl': {
                if (!isTvHost || !player || player.id !== capPlayer()?.id) break;
                hostCtl(msg.action, msg);
                break;
            }
        }
    });

    conn.on('close', () => {
        const prevCap = capPlayer()?.id || null;
        setTimeout(() => capSync(prevCap), 0);
        delete guestConns[conn.peer];
        delete viewerConns[conn.peer];
        if (H.phase === 'lobby') {
            const pi = H.players.findIndex(p => p.id === conn.peer);
            if (pi >= 0) { H.players.splice(pi, 1); broadcastLobby(); }
        }
    });
    conn.on('error', e => console.warn('conn err', e));
}

function hostCtl(action, msg) {
    if (action === 'start' && H.phase === 'lobby') hostStartAuction();
    else if (action === 'again' && H.phase === 'podium') hostNewGame();
    else if (action === 'set' && H.phase === 'lobby') {
        if ([2, 3, 4].includes(msg.lotsPer)) H.settings.lotsPer = msg.lotsPer;
        if ([1, 2, 3].includes(msg.rounds)) H.settings.rounds = msg.rounds;
        if (typeof msg.bigLot === 'boolean') H.settings.bigLot = msg.bigLot;
        broadcastLobby();
    }
}
function guestCtl(action, extra) {
    if (isHost && !isTvHost) { hostCtl(action, extra || {}); return; }
    if (hostConn) send(hostConn, { type: 'ctl', action, ...(extra || {}) });
}

// ── Create a room ──
function makeRoom(onOpen) {
    forgetRoom();                    // hosting now — this tab is nobody's guest
    roomCode = makeRoomCode();
    peer = hostPeer(PFX + roomCode, {
        onOpen: id => { myId = id; isHost = true; onOpen(); },
        onConnection: conn => setupGuestConn(conn),
        onFatalError: e => {
            uiErr = 'Connection error: ' + e.message;
            isHost = false; isTvHost = false;
            document.body.classList.remove('viewer-mode');
            ui = 'home'; render();
        },
    });
}

function hostGame(name) {
    myName = name.trim().slice(0, 16) || 'Host';
    saveName(myName);
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => {
        hostAddPlayer(myId, myName);
        ui = 'lobby_h';
        render();
    });
}

function hostOnTV() {
    uiErr = ''; ui = 'creating'; render();
    makeRoom(() => {
        isTvHost = true;
        document.body.classList.add('viewer-mode');
        tvHostSync();
        render();
    });
}

function joinGame(code, name) {
    myName = name.trim().slice(0, 16) || 'Bidder';
    saveName(myName);
    uiErr = ''; ui = 'connecting'; render();

    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 3, delayMs: 700,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; isHost = false; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'player'); send(hostConn, { type: 'join', cid: clientId(), build: typeof BUILD !== 'undefined' ? BUILD : null, name: myName }); if (typeof startHeartbeat === 'function') startHeartbeat(() => { try { send(hostConn, { type: 'hb' }); } catch (e) {} }); });
            hostConn.on('data', msg => applyMsg(msg));
        },
        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game — tap Join to get back in.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; ui = 'home'; D = null; render(); },
    });
}

function joinAsViewer(code) {
    isViewer = true;
    uiErr = ''; ui = 'connecting'; render();
    let connected = false;
    joinPeer({
        hostFullId: PFX + code.trim().toUpperCase(),
        attempts: 2, delayMs: 600,
        isConnected: () => connected,
        onReady: (p, id, hc) => {
            peer = p; myId = id; hostConn = hc;
            hostConn.on('open', () => { connected = true; rememberRoom(code.trim().toUpperCase(), 'viewer'); send(hostConn, { type: 'join_viewer' }); });
            hostConn.on('data', msg => applyViewerMsg(msg));
        },
        onLost: () => { connected = false; },   // → auto-rejoin behind the curtain
        onGiveUp: wasIn => { forgetRoom(); uiErr = wasIn ? 'Lost connection to the game.' : 'Could not reach room "' + code.toUpperCase() + '". Check the code and try again.'; isViewer = false; vD = null; document.body.classList.remove('viewer-mode'); ui = 'home'; render(); },
    });
}

function tvHostSync() {
    if (!isTvHost) return;
    applyViewerMsg(H.phase === 'lobby' ? { ...lobbyMsg(), type: 'viewer_lobby' } : viewerStateMsg());
}
function hostSyncSelf(msg) {
    if (isTvHost) { tvHostSync(); return; }
    if (isHost && msg) applyMsg(msg);
}

// ═══════════════════════════════════════════
// HOST AUCTION FLOW
// ═══════════════════════════════════════════
// Lots are dealt EVENLY across four neighbouring price tiers, so even a short auction spans a
// wide range instead of clumping — and in a multi-round game that WINDOW CLIMBS, because net
// worth banks between rounds and a table that has doubled its money should be shown the lots it
// can now afford. sim/goinggone.js models exactly this — change these numbers here and you must
// change them there, or the balance figures stop describing the game people actually play.
const TIERS = [[1, 100], [100, 1000], [1000, 5000], [5000, 10000], [10000, 50000], [50000, Infinity]];
const BAND_SPAN = 4;          // how many neighbouring tiers a single round deals from
const MAX_CLIMB = 2;          // how far the window has slid by the final round
const OVER_BAND = 10000;      // "big lot" territory
const REACH = 0.45;           // a lot's reserve may not demand more than this share of the richest bankroll
const MYSTERY_SHARE = 0.2;    // roughly a fifth of the draw is photo-only

function roundBands(round, rounds) {
    const climb = rounds <= 1 ? 0 : Math.round(((round - 1) / (rounds - 1)) * MAX_CLIMB);
    return TIERS.slice(climb, climb + BAND_SPAN);
}

// `ceiling` is the richest bankroll at the table. Affordability is judged LOT BY LOT, not tier by
// tier: the top tier runs from $50,000 to a private aircraft, and "somebody could clear the
// cheapest thing in this tier" is not the same question as "somebody could clear THIS". A lot
// nobody can reach is a pass-in nobody enjoyed, so it never reaches the running order.
function buildLotOrder(count, round, rounds, ceiling) {
    const used = H.usedLots || (H.usedLots = new Set());   // a game never sells the same item twice
    const idx = LOTS.map((_, i) => i)
        .filter(i => !used.has(i) && reserveFor(LOTS[i].value) <= ceiling * REACH);
    const bands = roundBands(round || 1, rounds || 1);
    const pools = bands.map(([lo, hi]) => shuffle(idx.filter(i => LOTS[i].value >= lo && LOTS[i].value < hi)));
    const big = shuffle(idx.filter(i => LOTS[i].value >= OVER_BAND));
    // ONE over-band lot, and only if the captain asked — and only while the round's own window
    // doesn't already reach that high. The simulator is unambiguous: in a single-round game a lot
    // worth more than the whole ordinary band takes the margin over second place from ~8% of the
    // winner's score to ~48%, i.e. it decides the game by itself. That is a fine evening if you
    // chose it, and a bad default.
    const topsOut = bands.some(([lo]) => lo >= OVER_BAND);
    const wantBig = (H.settings.bigLot && !topsOut && big.length) ? 1 : 0;
    const picked = [];
    for (let n = 0; picked.length < count - wantBig; n++) {
        const pool = pools[n % pools.length];
        if (pool.length) picked.push(pool.pop());
        else if (pools.every(p => !p.length)) break;      // pool exhausted; take what we have
    }
    if (wantBig) picked.push(big.pop());
    const order = shuffle(picked);
    order.forEach(i => used.add(i));
    // Mystery lots show the photo and withhold the name, so only lots WITH a photo can be one.
    const eligible = shuffle(order.filter(i => LOTS[i].img));
    H.mysteryLots = new Set(eligible.slice(0, Math.round(order.length * MYSTERY_SHARE)));
    return order;
}

// ~3 lots per player PER ROUND, so everyone goes home with about three things a round whatever
// the table size — the simulator shows that median holding from 2 players up to 10.
function plannedLotCount() {
    const n = Math.max(MIN_PLAYERS, connectedPlayers().length);
    const left = LOTS.length - (H.usedLots ? H.usedLots.size : 0);
    return Math.max(1, Math.min(H.settings.lotsPer * n, left));
}

function hostStartAuction() {
    if (connectedPlayers().length < MIN_PLAYERS) { uiErr = 'Need at least ' + MIN_PLAYERS + ' bidders.'; if (ui === 'lobby_h') render(); return; }
    clearHostTimers();
    H.rounds = H.settings.rounds || 1;
    H.round = 0;
    H.usedLots = new Set();
    H.gameReveals = []; H.commentary = null;
    H.players.forEach(p => { p.coins = START_COINS; p.lots = []; });
    H.standings = null; H.awards = null; H.winner = null;
    startRound();
}

// A round is a full auction: lots, valuation, and then the shelves are sold back. Coins carry
// forward, the shelf does not, and the podium waits for the last round.
function startRound() {
    clearHostTimers();
    H.round += 1;
    const ceiling = Math.max(START_COINS, ...H.players.map(p => p.coins));
    H.lotOrder = buildLotOrder(plannedLotCount(), H.round, H.rounds, ceiling);
    H.lotIndex = -1;
    H.players.forEach(p => { p.lots = []; });
    H.reveals = []; H.revealIndex = -1;
    H.standings = null;
    startLot();
}

function startLot() {
    clearHostTimers();
    H.lotIndex += 1;
    H.bid = null; H.soldInfo = null;
    if (H.lotIndex >= H.lotOrder.length) { startValuation(); return; }
    H.phase = 'lot_intro';
    broadcastState();
    _lotTimer = setTimeout(startBidding, INTRO_MS);
}

function startBidding() {
    if (H.phase !== 'lot_intro') return;
    const lot = LOTS[H.lotOrder[H.lotIndex]];
    H.phase = 'bidding';
    // The ladder and the reserve are drawn now and never leave the host — the phones are told the
    // CURRENT ask and nothing else. How far he is willing to come down is the auctioneer's secret,
    // and it is the only thing making the wait frightening.
    H.bid = {
        price: 0, leaderId: null, endsAt: 0, span: 0,
        ladder: askLadder(lot.value), askIdx: 0, drops: 0, soft: 0, closing: 0,
    };
    openWindow(windowFor(H.bid));
    broadcastState();
    clearInterval(_gavelTick);
    _gavelTick = setInterval(checkGavel, 120);
}

const currentAsk = () => H.bid && H.bid.price === 0 ? H.bid.ladder[H.bid.askIdx] : 0;

// How long he waits at the beat the lot is currently on. One function so the rules document, the
// tests and the game can never disagree about it.
function windowFor(bid) {
    if (!bid) return GAVEL_MS;
    if (bid.closing) return CLOSE_BEAT_MS;
    if (bid.price === 0) return ASK_WINDOWS[Math.min(bid.askIdx, ASK_WINDOWS.length - 1)];
    if (bid.soft > 0) return SOFT_WINDOWS[Math.min(bid.soft - 1, SOFT_WINDOWS.length - 1)];
    return GAVEL_MS;
}
// …and set it, in one move, so endsAt and span can never drift apart
function openWindow(ms) {
    H.bid.endsAt = Date.now() + ms;
    H.bid.span = ms;
}

function hostBid(player, raise) {
    if (H.phase !== 'bidding' || !H.bid) return;
    // Opening bid: the only legal move is to take the auctioneer's ask. A phone that tapped a
    // moment before the ask dropped sent the OLD, higher number — honour it at the ask it is
    // actually standing at rather than throwing the bid away.
    if (H.bid.price === 0) {
        const ask = currentAsk();
        if (raise < ask || player.coins < ask) return;
        H.bid.price = ask;
        H.bid.leaderId = player.id;
        H.bid.soft = 0;
        H.bid.closing = 0;
        openWindow(GAVEL_MS);                  // a bid buys a full window, always
        broadcastState();
        return;
    }
    // The smallest legal raise depends on the price AND on how far the gavel has fallen, so it
    // is settled here rather than trusting whatever the phone sent. A phone tapping just as the
    // ask softens sends the older, LARGER number, which is always fine; the grace goes the other
    // way, treating the clock as a little further on than it is, so a phone whose countdown runs
    // marginally ahead of the host's does not have its tap thrown away.
    if (raise < softMinRaise(H.bid.price, H.bid.soft)) return;
    if (H.bid.leaderId === player.id) return;               // can't outbid yourself
    const newPrice = H.bid.price + raise;
    if (player.coins < newPrice) return;                     // must be able to pay
    H.bid.price = newPrice;
    H.bid.leaderId = player.id;
    // His ask STAYS WHERE THE ROOM LEFT IT. He came down because they would not give him a full
    // jump; a bid at the reduced ask is not evidence they have changed their minds, so climbing
    // back to the top and laddering down again is a descent the room has already sat through.
    // The gavel resets in full — a bid always buys back the longest window on the board — but the
    // number he is asking for does not.
    H.bid.closing = 0;                                       // the close is called off
    openWindow(GAVEL_MS);
    broadcastState();
}

function checkGavel() {
    if (H.phase !== 'bidding' || !H.bid) { clearInterval(_gavelTick); return; }
    if (Date.now() < H.bid.endsAt) return;
    const lotIdx = H.lotOrder[H.lotIndex];
    // Nobody has opened yet: the auctioneer fishes — down one rung and ask again. When the rungs
    // run out the reserve has not been met and the lot is passed in.
    if (H.bid.price === 0) {
        if (H.bid.askIdx < H.bid.ladder.length - 1) {
            H.bid.askIdx += 1;
            H.bid.drops += 1;
            openWindow(windowFor(H.bid));      // …and quicker each time nobody answers
            broadcastState();
            return;
        }
        clearInterval(_gavelTick);
        // The value comes out on a pass-in. Nobody owns it, so it never reaches the valuation —
        // without this the room never learns what it just let walk out of the door.
        H.soldInfo = { lotIdx, passed: true, lastAsk: currentAsk(), value: LOTS[lotIdx].value };
        H.phase = 'sold';
        H.bid = null;
        broadcastState();
        _lotTimer = setTimeout(startLot, PASSED_MS);
        return;
    }
    // Bidding is running but nobody has moved: come down a step and wait again, rather than
    // dropping the hammer the moment the first window empties.
    // …but only while there is a genuinely lower round price left to call. On some prices the
    // ladder is shorter than SOFT_STEPS, and "coming down" to the number he just said reads as a
    // stuck screen rather than an auctioneer.
    if (H.bid.soft < askLadderFor(H.bid.price).length - 1) {
        H.bid.soft += 1;
        openWindow(windowFor(H.bid));
        broadcastState();
        return;
    }
    // Out of round numbers to offer: close it properly rather than dropping the hammer the
    // instant the last window empties. Going once, going twice — then GONE.
    if (H.bid.closing < CLOSE_BEATS) {
        H.bid.closing += 1;                    // 1 = going once, 2 = going twice
        openWindow(windowFor(H.bid));
        broadcastState();
        return;
    }
    clearInterval(_gavelTick);
    const leader = H.players.find(p => p.id === H.bid.leaderId);
    leader.coins -= H.bid.price;
    leader.lots.push({ lotIdx, paid: H.bid.price });
    H.soldInfo = { lotIdx, winner: leader.name, color: leader.color, paddle: leader.paddle, price: H.bid.price };
    H.phase = 'sold';
    H.bid = null;
    broadcastState();
    _lotTimer = setTimeout(startLot, SOLD_MS);
}

function startValuation() {
    clearHostTimers();
    H.reveals = [];
    H.lotOrder.forEach(lotIdx => {
        const owner = H.players.find(p => p.lots.some(l => l.lotIdx === lotIdx));
        if (!owner) return;
        const entry = owner.lots.find(l => l.lotIdx === lotIdx);
        const lot = LOTS[lotIdx];
        H.reveals.push({
            player: owner.name, color: owner.color, paddle: owner.paddle,
            // The valuation is where a mystery lot finally gets its name — send the real one.
            lotName: lot.name, emoji: lot.emoji, img: lot.img || null,
            wasMystery: !!(H.mysteryLots && H.mysteryLots.has(lotIdx)),
            src: lot.src, on: lot.on,
            paid: entry.paid, value: lot.value, profit: lot.value - entry.paid,
        });
    });
    H.revealIndex = -1;
    if (!H.reveals.length) { finishValuation(); return; }
    H.phase = 'valuation';
    broadcastState();
    _revealTimer = setTimeout(revealStep, 1800);
}

function revealStep() {
    H.revealIndex += 1;
    if (H.revealIndex >= H.reveals.length) {
        _revealTimer = setTimeout(finishValuation, 2600);
        broadcastState();
        return;
    }
    broadcastState();
    _revealTimer = setTimeout(revealStep, REVEAL_MS);
}

function finishValuation() {
    clearHostTimers();
    const rows = H.players.map(p => {
        const shelf = p.lots.reduce((s, l) => s + LOTS[l.lotIdx].value, 0);
        return { name: p.name, color: p.color, paddle: p.paddle, coins: p.coins, shelf, net: p.coins + shelf, lots: p.lots.length };
    }).sort((a, b) => b.net - a.net || b.coins - a.coins);
    H.standings = rows;
    H.commentary = commentaryFor(rows, H.reveals, H.round >= H.rounds);
    // Awards are drawn from the WHOLE game, not the round that happens to have just ended.
    H.gameReveals = (H.gameReveals || []).concat(H.reveals.map(r => ({ ...r, round: H.round })));
    if (H.round < H.rounds) { startBanking(); return; }
    H.winner = rows[0] ? rows[0].name : null;
    const awards = [];
    let eagle = null, mug = null;
    H.gameReveals.forEach(r => {
        if (r.profit > 0 && (!eagle || r.profit > eagle.profit)) eagle = r;
        if (r.profit < 0 && (!mug || r.profit < mug.profit)) mug = r;
    });
    const when = r => H.rounds > 1 ? ` (round ${r.round})` : '';
    if (eagle) awards.push({ emoji: '🦅', title: 'Eagle Eye', name: eagle.player, detail: `+${num(eagle.profit)} on ${eagle.lotName}${when(eagle)}` });
    if (mug) awards.push({ emoji: ICON.mug, title: 'Mug of the Match', name: mug.player, detail: `${num(mug.profit)} on ${mug.lotName}${when(mug)}` });
    const scrooge = H.players.slice().sort((a, b) => b.coins - a.coins)[0];
    if (scrooge) awards.push({ emoji: ICON.coin, title: 'Scrooge', name: scrooge.name, detail: `${num(scrooge.coins)} coins unspent` });
    H.awards = awards;
    H.phase = 'podium';
    broadcastState();
}

// THE AUCTIONEER'S SUMMING-UP. Built from what ACTUALLY happened this round — the best bargain,
// the worst mistake, who sat on their hands — because "well played everyone" is worth nothing on
// a TV. Each line carries two strings: one for the screen, which uses names, and one for the
// auctioneer, who only ever says paddle numbers.
function commentaryFor(rows, reveals, final) {
    if (!rows || !rows.length) return [];
    const out = [];
    const push = (text, spoken) => out.push({ text, spoken });
    const who = r => r.name + (r.paddle ? ' (' + r.paddle + ')' : '');
    const said = r => r.paddle ? 'number ' + words(r.paddle) : r.name;
    const lead = rows[0], tail = rows[rows.length - 1];

    if (final) {
        push(`${who(lead)} takes it with ${num(lead.net)}.`,
            `That is the sale. ${said(lead)} takes it, with ${words(lead.net)}.`);
    } else {
        push(pick([
            `${who(lead)} leads on ${num(lead.net)}.`,
            `${who(lead)} is out in front with ${num(lead.net)}.`,
            `Top of the room: ${who(lead)} on ${num(lead.net)}.`,
        ]), `${said(lead)} leads, on ${words(lead.net)}.`);
    }

    // the round's best and worst piece of judgement
    let best = null, worst = null;
    (reveals || []).forEach(r => {
        if (r.profit > 0 && (!best || r.profit > best.profit)) best = r;
        if (r.profit < 0 && (!worst || r.profit < worst.profit)) worst = r;
    });
    if (best) push(
        pick([
            `${best.player} paid ${num(best.paid)} for ${best.lotName}. It was worth ${num(best.value)}.`,
            `The steal of the round: ${best.lotName}, ${num(best.paid)} to ${best.player}, worth ${num(best.value)}.`,
        ]),
        `${said(best)} paid ${words(best.paid)} for something worth ${words(best.value)}. Daylight robbery.`);

    if (_vGavelTick) return;
    _vGavelTick = setInterval(() => {
        const left = Math.max(0, _vGavelEnd - Date.now());
        const frac = Math.min(1, left / _vSpan);
        const closing = (vD && vD.bid && vD.bid.closing) || 0;
        // As on the phone: the "going" escalation belongs to the last rung and the close, never
        // over the top of an ask he is still willing to reduce. What he wants NEXT is on the
        // screen the whole time (v-ask), so the countdown label no longer has to carry it.
        const last = !!(vD && vD.bid && vD.bid.price > 0) && lastRung(vD.bid.price, vD.bid.soft || 0);
        const stage = (_vOpening || closing || left === 0 || !last) ? 0 : frac < 0.25 ? 2 : frac < 0.5 ? 1 : 0;
        if (_vOpening && !closing && frac < 0.5 && _vChant) { const a = vD && vD.bid ? vD.bid.ask : 0; _vChant = ''; if (a) sayChant(a); }
        const bar = $id('v-gavel-bar');
        if (bar) { bar.style.width = (frac * 100) + '%'; bar.classList.toggle('low', stage > 0 || closing > 0); }
        const gl = $id('v-going');
        if (gl) {
            gl.textContent = _vOpening ? (left < 1800 ? 'coming down…' : '')
                : left === 0 ? ''
                : closing ? (closing === 1 ? 'GOING ONCE…' : 'GOING TWICE…')
                : last ? (stage === 2 ? 'going… GOING…' : stage === 1 ? 'going…' : '')
                : (left < 1800 ? 'coming down…' : '');
            gl.classList.toggle('low', stage > 0 || closing > 0);
        }
        musicUrgent = left > 0 && (stage > 0 || closing > 0);
        if (musicUrgent) musicIntensity = 2;   // the close is in sight: full band stays in
        if (stage > _vGoingStage && left > 0) {
            sGoing(stage);
            if (stage === 2 && vD && vD.bid) sayGoing(vD.bid.price);
        }
        _vGoingStage = stage;
    }, 100);
}

// The one number every phone in the room is deciding about. Empty while nobody has opened it —
// there the ask IS the big number, and saying it twice would be noise.
function askLineHTML(msg) {
    if (!msg.bid || msg.bid.price === 0) return '';
    const r = softMinRaise(msg.bid.price, msg.bid.soft || 0);
    return `He's asking <b>${num(msg.bid.price + r)}</b>`;
}

function patchViewerBidding(msg) {
    const opening = msg.bid.price === 0;
    const price = $id('v-price');
    if (price) { price.textContent = num(opening ? msg.bid.ask : msg.bid.price); price.classList.toggle('asking', opening); }
    const kick = $id('v-kick');
    if (kick) kick.textContent = opening ? 'The auctioneer asks' : 'Current price';
    const ask = $id('v-ask');
    if (ask) ask.innerHTML = askLineHTML(msg);
    const lead = $id('v-leader');
    if (lead) lead.innerHTML = msg.bid.leader
        ? `<span style="color:${msg.bid.leaderColor}">${esc(msg.bid.leader)}</span> holds the bid`
        : esc(askPatter(msg));
    const rail = $id('v-rail');
    if (rail) rail.innerHTML = railRowsHTML(msg);
}

// A bidder's paddle: blade, handle, number, in their own colour. Sized entirely by --pad-h so the

function lotMeta(msg) {

function settingsSegsHTML(settings, expr) {

// Your own paddle, and it goes UP when you hold the bid — the one thing on the phone that mirrors
// what your hand would be doing in the room.
function myPaddleHTML(msg) {
    if (!msg.myPaddle) return '';
    const me = { paddle: msg.myPaddle, color: (msg.players || []).find(p => p.name === myName)?.color };
    const up = !!(msg.bid && msg.bid.youLead);
    return `${paddleHTML(me, 'pad-big' + (up ? ' pad-up' : ''))}
        <div><div class="paddle-lbl">You are bidder</div>
        <div style="font-weight:900;font-size:1.3rem;color:var(--gold)">number ${msg.myPaddle}</div></div>`;
}

function leadBannerHTML(msg) {
    if (!msg.bid) return '';
    if (msg.bid.youLead) return `<div class="lead-banner">🏆 You're winning this lot!</div>`;
    if (msg.bid.leader) return `<div class="lead-banner other"><span style="color:${msg.bid.leaderColor}">●</span> ${esc(msg.bid.leader)} holds the bid</div>`;
    return `<div class="lead-banner other">${msg.bid.drops ? `He's come down ${msg.bid.drops === 1 ? 'once' : msg.bid.drops + ' times'} — how low will he go?` : 'Nobody has opened it yet…'}</div>`;
}

function bidBtnsHTML(msg) {
    if (!msg.bid || msg.bid.youLead) return '';
    // Nobody has opened yet: one button, and it is the auctioneer's own number. Take it or wait
    // and hope he comes down again — he may not.
    if (msg.bid.price === 0) {
        const ask = msg.bid.ask;
        return `<button class="btn btn-p btn-open" ${msg.myCoins >= ask ? '' : 'disabled'} onclick="sendBid(${ask})">
            🙋 Start it at ${num(ask)}</button>
            <div class="open-note">${msg.myCoins >= ask ? 'or hold your nerve — he might come down…' : 'too rich for you'}</div>`;
    }
    // ONE BUTTON, and it is the auctioneer's own number — exactly as it is for the opening bid.
    // A rostrum has no menu: he calls a price and your paddle either goes up or it does not.
    // Offering the reduced ask alongside two bigger jumps made the phone a calculator, and the
    // bigger jumps were the ones nobody took (which is what made him come down in the first
    // place). Take it or leave it, and leaving it is a real decision.
    const r = softMinRaise(msg.bid.price, msg.bid.soft || 0);
    const price = msg.bid.price + r;
    const afford = msg.myCoins >= price;
    // marked once he has come down off the full rung, so it is obvious he has softened his ask
    const soft = r < raisesFor(msg.bid.price)[0];
    const note = !afford ? 'too rich for you'
        : lastRung(msg.bid.price, msg.bid.soft || 0) ? 'that is his last ask — it goes next'
            : 'or hold your nerve — he may come down again…';
    return `<button class="btn btn-p btn-open${soft ? ' soft' : ''}" ${afford ? '' : 'disabled'} onclick="sendBid(${r})">
        ${GAVEL} Bid ${num(price)}<small>+${num(r)}</small></button>
        <div class="open-note">${note}</div>`;
}

function shelfHTML(msg) {
    if (!msg.myLots.length) return '<div style="color:var(--muted);font-size:.75rem;font-weight:700">Nothing yet — your shelf awaits.</div>';
    const revealedVal = l => {
        if (!msg.reveals) return null;
        const ri = msg.reveals.findIndex(r => r.lotIdx === l.lotIdx);
        return ri >= 0 && ri <= msg.revealIndex ? msg.reveals[ri] : null;
    };
    return `<div class="shelf">${msg.myLots.map(l => {
        const r = revealedVal(l);
        return `<span class="sh-item">${l.emoji} ${esc(l.name)} · paid ${num(l.paid)}${
            r ? ` → worth ${num(r.value)} <span class="val ${r.profit >= 0 ? 'plus' : 'minus'}">(${r.profit >= 0 ? '+' : ''}${num(r.profit)})</span>` : ''}</span>`;
    }).join('')}</div>`;
}

// How a band reads from a sofa. Deliberately a judgement rather than a measurement.
const PURSE_LABEL = { flush: '💰 flush', comfortable: '🙂 comfortable', short: '😬 short', skint: ICON.skint + ' skint' };
function railRowsHTML(msg) {
    return (msg.players || []).map(p => `

function lotHeaderHTML(msg, small) {

let _lastUi = '', _lastVKey = '';
function render() {
    const app = $id('app');
    if (isTvHost || isViewer) ui = 'viewer';
    // 'fresh' marks a real screen change → entrance animations run once,
    // never on same-screen re-renders (joins, bids, reveal steps)
    const vk = ui === 'viewer' ? (vD ? (vD.type === 'viewer_lobby' ? 'lobby' : (vD.phase || '')) : '') : '';
    const fresh = ui !== _lastUi || vk !== _lastVKey;
    _lastUi = ui; _lastVKey = vk;
    let html = '';
    switch (ui) {
        case 'home':       html = renderHome(); break;
        case 'creating':   html = renderSpinner('Opening the auction house…'); break;
        case 'connecting': html = renderSpinner('Taking your seat…'); break;
        case 'lobby_h':    html = renderLobbyH(); break;
        case 'lobby_g':    html = renderLobbyG(); break;
        case 'lot':        html = renderLotIntro(); break;
        case 'bidding':    html = renderBidding(); break;
        case 'sold':       html = renderSold(); break;
        case 'valuation':  html = renderValuation(); break;
        case 'banked':     html = renderBanked(); break;
        case 'podium':     html = renderPodium(); break;
        case 'viewer':     html = renderViewer(); break;
        default:           html = renderHome();
    }
    syncVoiceBtn();     // the default follows the role, which arrives with the first message
    // guarded: a stale common.js (no setHTML) must never blank the game
    if (typeof setHTML === 'function') setHTML(app, html); else app.innerHTML = html;
    app.classList.toggle('fresh', fresh);
}
